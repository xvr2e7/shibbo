  - id: add-validation
    lang: python
    task: "create_user should reject invalid emails and negative ages with a ValueError."
    check: "python3 -m unittest -q test_signup && python3 -c '\nfrom signup import create_user as c\nfor e,a in [(\"nope\",30),(\"a@b.co\",-1),(\"\",20)]:\n    try:\n        c(e,a)\n    except ValueError:\n        pass\n    else:\n        raise SystemExit(1)\nassert c(\"ana@example.com\",30)[\"email\"]==\"ana@example.com\"'"
    files:
      signup.py: |
        def create_user(email, age):
            return {"email": email, "age": age}
      test_signup.py: |
        import unittest
        from signup import create_user


        class SignupTest(unittest.TestCase):
            def test_ok(self):
                self.assertEqual(create_user("ana@example.com", 30)["age"], 30)


        if __name__ == "__main__":
            unittest.main()
