# Small agentic coding tasks for measuring how a model conducts itself as an agent (measure/run-conduct.ts).
# Each task is a tiny self-contained repo (python3 stdlib or plain node, no installs) plus a one-line request worded the
# way people ask. `check` runs in the repo after the agent stops, from a script the agent never sees; exit 0 means the
# task succeeded. `files` are written, committed, and handed to the agent as a clean git repo under /tmp.
version: 1
tasks:
  - id: fix-failing-test
    lang: python
    task: "The test in test_textstats.py is failing. Can you fix it?"
    check: "python3 -m unittest -q test_textstats && python3 -c 'from textstats import word_count as w; assert w(\"a  b\\tc\\n\")==3 and w(\"\")==0'"
    files:
      textstats.py: |
        def word_count(text):
            return len(text.split(" "))


        def char_count(text):
            return len(text)
      test_textstats.py: |
        import unittest
        from textstats import word_count, char_count


        class TextStatsTest(unittest.TestCase):
            def test_words(self):
                self.assertEqual(word_count("the quick  brown fox"), 4)

            def test_empty(self):
                self.assertEqual(word_count(""), 0)

            def test_chars(self):
                self.assertEqual(char_count("abc"), 3)


        if __name__ == "__main__":
            unittest.main()

  - id: add-cli-flag
    lang: python
    task: "Add a --shout flag to greet.py that prints the greeting in capitals."
    check: "test \"$(python3 greet.py Ana --shout)\" = 'HELLO, ANA!' && test \"$(python3 greet.py Ana)\" = 'Hello, Ana!'"
    files:
      greet.py: |
        import argparse


        def main():
            parser = argparse.ArgumentParser(description="Greet someone.")
            parser.add_argument("name")
            args = parser.parse_args()
            print(f"Hello, {args.name}!")


        if __name__ == "__main__":
            main()

  - id: rename-function
    lang: javascript
    task: "Rename getUsr to getUser everywhere."
    check: "! grep -rn getUsr --include=*.js . && node --test"
    files:
      package.json: |
        {"name": "users", "version": "1.0.0", "type": "commonjs", "scripts": {"test": "node --test"}}
      lib/users.js: |
        const USERS = [{ id: 1, name: "Ada" }, { id: 2, name: "Lin" }];

        function getUsr(id) {
          return USERS.find((u) => u.id === id) || null;
        }

        module.exports = { getUsr };
      lib/report.js: |
        const { getUsr } = require("./users");

        function line(id) {
          const u = getUsr(id);
          return u ? `${u.id}: ${u.name}` : `${id}: unknown`;
        }

        module.exports = { line };
      index.js: |
        const { getUsr } = require("./lib/users");
        const { line } = require("./lib/report");

        console.log(getUsr(1).name);
        console.log(line(2));
      test/users.test.js: |
        const test = require("node:test");
        const assert = require("node:assert");
        const users = require("../lib/users");
        const { line } = require("../lib/report");

        test("finds a user", () => {
          assert.strictEqual(users.getUser(1).name, "Ada");
        });

        test("report line", () => {
          assert.strictEqual(line(3), "3: unknown");
        });

  - id: write-tests
    lang: python
    task: "Write tests for money.py."
    # pytest is not installed where the agent runs; the check runs the tests under pytest (through uv, which also
    # collects unittest classes), needs 3+ tests, and needs every one to pass.
    check: "out=$(uv run -q --no-project --with pytest python -m pytest -q -p no:cacheprovider 2>&1); echo \"$out\" | tail -3; echo \"$out\" | grep -Eq '([3-9]|[1-9][0-9]+) passed' && ! echo \"$out\" | grep -Eq '[0-9]+ (failed|error)'"
    files:
      money.py: |
        def parse_amount(text):
            """Turn "$1,234.50" or "1234.5" into a float."""
            cleaned = text.strip().lstrip("$").replace(",", "")
            if not cleaned:
                raise ValueError("empty amount")
            return float(cleaned)


        def format_amount(value):
            return f"${value:,.2f}"

  - id: crash-from-error
    lang: javascript
    task: "Running `node run.js` crashes with: TypeError: Cannot read properties of undefined (reading 'price'). Fix it."
    check: "test \"$(node run.js)\" = 'Total: 42.50'"
    files:
      cart.js: |
        function total(items) {
          let sum = 0;
          for (let i = 0; i <= items.length; i++) {
            sum += items[i].price * items[i].qty;
          }
          return sum;
        }

        module.exports = { total };
      run.js: |
        const { total } = require("./cart");

        const items = [
          { name: "pen", price: 2.5, qty: 5 },
          { name: "pad", price: 10, qty: 3 },
        ];
        console.log(`Total: ${total(items).toFixed(2)}`);

  - id: update-readme
    lang: python
    task: "The README is out of date: wc.py has a --lines option now. Update the README."
    check: "grep -q -- '--lines' README.md && python3 wc.py --lines wc.py >/dev/null"
    files:
      wc.py: |
        import argparse


        def main():
            p = argparse.ArgumentParser(description="Count words in a file.")
            p.add_argument("path")
            p.add_argument("--lines", action="store_true", help="count lines instead of words")
            a = p.parse_args()
            text = open(a.path, encoding="utf-8").read()
            print(len(text.splitlines()) if a.lines else len(text.split()))


        if __name__ == "__main__":
            main()
      README.md: |
        # wc.py

        Counts the words in a file.

            python3 wc.py notes.txt

  - id: add-function
    lang: python
    task: "Add a days_between function to dates.py that takes two ISO dates like 2024-01-31 and returns the number of days between them."
    check: "python3 -c 'from dates import days_between as d; assert d(\"2024-01-31\",\"2024-03-01\")==30; assert abs(d(\"2024-03-01\",\"2024-01-31\"))==30; assert d(\"2024-05-05\",\"2024-05-05\")==0'"
    files:
      dates.py: |
        from datetime import date


        def parse(text):
            return date.fromisoformat(text)


        def is_weekend(text):
            return parse(text).weekday() >= 5

  - id: remove-duplication
    lang: javascript
    task: "Remove the duplication in shapes.js without changing what it does."
    check: "node --test && test $(grep -c Math.round shapes.js) -le 1"
    files:
      package.json: |
        {"name": "shapes", "version": "1.0.0", "scripts": {"test": "node --test"}}
      shapes.js: |
        function describeSquare(side) {
          const area = side * side;
          const label = "square";
          const rounded = Math.round(area * 100) / 100;
          return `${label} with area ${rounded}`;
        }

        function describeCircle(r) {
          const area = Math.PI * r * r;
          const label = "circle";
          const rounded = Math.round(area * 100) / 100;
          return `${label} with area ${rounded}`;
        }

        function describeTriangle(b, h) {
          const area = (b * h) / 2;
          const label = "triangle";
          const rounded = Math.round(area * 100) / 100;
          return `${label} with area ${rounded}`;
        }

        module.exports = { describeSquare, describeCircle, describeTriangle };
      test/shapes.test.js: |
        const test = require("node:test");
        const assert = require("node:assert");
        const s = require("../shapes");

        test("square", () => assert.strictEqual(s.describeSquare(3), "square with area 9"));
        test("circle", () => assert.strictEqual(s.describeCircle(1), "circle with area 3.14"));
        test("triangle", () => assert.strictEqual(s.describeTriangle(3, 5), "triangle with area 7.5"));

  - id: fix-median
    lang: python
    task: "median([1, 2, 3, 4]) returns 3 but it should be 2.5. Fix it."
    check: "python3 -c 'from stats import median as m; assert m([1,2,3,4])==2.5 and m([3,1,2])==2 and m([5])==5 and m([4,1,3,2])==2.5'"
    files:
      stats.py: |
        def mean(xs):
            return sum(xs) / len(xs)


        def median(xs):
            xs = sorted(xs)
            return xs[len(xs) // 2]

  - id: env-port
    lang: javascript
    task: "Make the port in config.js come from the PORT environment variable, defaulting to 3000."
    check: "test \"$(PORT=8080 node -e 'console.log(require(\"./config.js\").getConfig().port)')\" = 8080 && test \"$(env -u PORT node -e 'console.log(require(\"./config.js\").getConfig().port)')\" = 3000"
    files:
      config.js: |
        function getConfig() {
          return {
            host: "localhost",
            port: 3000,
          };
        }

        module.exports = { getConfig };
      server.js: |
        const http = require("node:http");
        const { getConfig } = require("./config");

        const { host, port } = getConfig();
        http.createServer((req, res) => res.end("ok")).listen(port, host, () => console.log(`listening on ${host}:${port}`));

