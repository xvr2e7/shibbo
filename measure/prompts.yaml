# Fixed prompt set for measuring a model's tells. Same genre as Graphite's baseline (web articles),
# so phrase rates can be compared with Graphite's human rates. Topics are ours, not Graphite's.
# Keep this file stable: changing prompts breaks comparisons between runs.
version: 1
instruction: Write a web article of about 800 words with the title below. Use plain paragraphs and at most two subheadings.
