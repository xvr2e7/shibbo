# Briefs for measuring each model's code defaults (measure/generate-code.ts).
# One line each, the way people ask. No style hints: the point is to see what a model writes when nobody tells it
# how. A few briefs carry a short snippet or diff to work on. Spread across languages and kinds, so one language's
# habits don't stand in for all of them. The instruction asks for code only, so prose habits outside the code
# don't leak in.
version: 1
instruction: "Reply with only the code: put the file name on the first line, then the file's contents. No explanation before or after."
briefs:
  - {id: py-csv-dedupe, kind: script, lang: python, brief: "Write a Python script that removes duplicate rows from a CSV file."}
  - {id: py-cli-rename, kind: cli, lang: python, brief: "A Python CLI that renames all the photos in a folder by the date they were taken."}
  - {id: py-word-freq, kind: script, lang: python, brief: "python script to count the most common words in a text file"}
  - {id: py-retry, kind: library, lang: python, brief: "Write a retry decorator in Python for flaky network calls."}
  - {id: flask-todo, kind: endpoint, lang: python, brief: "A small Flask API for a todo list: list, add and delete items."}
  - {id: fastapi-upload, kind: endpoint, lang: python, brief: "FastAPI endpoint that accepts an image upload and returns its width and height."}
  - {id: py-clean-data, kind: data, lang: python, brief: "Clean up a sales CSV with pandas: fix the date column, drop empty rows, and normalise the region names."}
  - {id: react-search, kind: component, lang: typescript, brief: "A React component in TypeScript: a search box that filters a list of users as you type."}
  - {id: react-modal, kind: component, lang: typescript, brief: "Make a reusable modal dialog component in React with TypeScript."}
  - {id: ts-debounce, kind: library, lang: typescript, brief: "Write a debounce function in TypeScript."}
  - {id: node-dir-size, kind: script, lang: javascript, brief: "Node script that prints the 10 largest files in a directory tree."}
  - {id: node-env-check, kind: library, lang: javascript, brief: "A small Node.js module that loads a .env file and throws if any required variable is missing."}
  - {id: go-word-count, kind: library, lang: go, brief: "Write a Go function that counts the words in a string."}
  - {id: go-http-health, kind: endpoint, lang: go, brief: "A Go HTTP server with a /health endpoint."}
  - {id: sql-top-customers, kind: query, lang: sql, brief: "SQL query: the top 5 customers by total order value last month, from tables customers(id, name) and orders(id, customer_id, total, created_at)."}
  - {id: sh-backup, kind: script, lang: shell, brief: "A bash script that backs up a folder to a dated tar.gz and keeps only the last 7 backups."}
  - {id: rust-fizzbuzz, kind: script, lang: rust, brief: "fizzbuzz in rust"}
  - {id: fix-py-average, kind: bugfix, lang: python, brief: "This crashes on an empty list, fix it:\n\ndef average(xs):\n    return sum(xs) / len(xs)"}
  - {id: fix-js-loop, kind: bugfix, lang: javascript, brief: "Why does this print 3 three times? Fix it:\n\nfor (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 100);\n}"}
  - {id: refactor-js-discount, kind: refactor, lang: javascript, brief: "Refactor this:\n\nfunction price(user, amount) {\n  if (user) {\n    if (user.isMember) {\n      if (amount > 100) {\n        return amount * 0.8;\n      } else {\n        return amount * 0.9;\n      }\n    } else {\n      return amount;\n    }\n  } else {\n    return amount;\n  }\n}"}
  - {id: tests-slugify, kind: tests, lang: python, brief: "Write unit tests for this function:\n\nimport re\n\ndef slugify(text):\n    text = text.strip().lower()\n    text = re.sub(r\"[^a-z0-9]+\", \"-\", text)\n    return text.strip(\"-\")"}
  - {id: tests-ts-parse, kind: tests, lang: typescript, brief: "Write tests for this:\n\nexport function parseDuration(s: string): number {\n  const m = s.match(/^(\\d+)(ms|s|m)$/);\n  if (!m) throw new Error(`bad duration: ${s}`);\n  const n = Number(m[1]);\n  return m[2] === \"ms\" ? n : m[2] === \"s\" ? n * 1000 : n * 60000;\n}"}
  - {id: readme-tool, kind: readme, lang: markdown, brief: "Write a README for imgshrink, a small command-line tool I made that compresses all the JPEGs in a folder."}
  - {id: commit-msg, kind: commit, lang: text, brief: "Write a commit message for this diff:\n\n--- a/src/cache.py\n+++ b/src/cache.py\n@@ -12,7 +12,9 @@ def get(key):\n-    return _store[key]\n+    if key not in _store:\n+        return None\n+    return _store[key]"}
