    result:
      - '(fix|fixed|fixes|resolved|stopped|stops|break\w*|ends|ended|no longer|eliminat\w+).{0,80}(loop|redirect|bounc)'
      - '(loop|redirect loop|bouncing).{0,40}(is |are |now )(fixed|resolved|gone)'
