# Briefs for measuring each model's interface defaults (measure/generate-ui.ts).
# One line each, the way people ask. No style hints, no brand colours: the point is to see what a model picks
# when nobody tells it. Spread across page types, so one genre's habits don't stand in for all of them.
version: 1
instruction: "Build this as one self-contained HTML file with inline CSS (no build step; web fonts and CDN scripts are fine). Reply with only the HTML."
