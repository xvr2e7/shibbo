# Root habits: one tendency, seen in more than one layer of what a model makes.
# Layers are the four surfaces a person meets: prose (words read), code (source and commits), ui (pages and screens),
# agent (what the model does while working). A root lists tells from at least two layers that share a cause.
# The links are curated: each groups tells whose registry entries describe the same move. They are not measured;
# what they claim is resemblance, not that one causes another.
roots:
  - id: three-of-everything
    name: Three of everything
    what: A list, a set of cards or a sequence padded or cut to three because three sounds complete.
    tells:
      prose: [triads, listicle-trench-coat, n-key-takeaways, countdown-negation]
      ui: [three-feature-cards, three-step-how-it-works, three-tier-pricing]
      code: [pr-summary-test-plan]

  - id: claimed-not-shown
    name: Claimed, not shown
    what: Asserting quality, importance or proof in place of the evidence for it.
    tells:
      prose: [significance-inflation, showcase-underscore, superlative-framing, x-matters, vague-authority, media-coverage-claims]
      ui: [invented-metrics, stat-banner-row, logo-cloud, placeholder-people, count-up-stats]
      agent: [production-ready-claims, unverified-done, fabricated-evidence, found-the-issue]

  - id: ornament-over-content
    name: Ornament over content
    what: Decoration added because it is cheap to add, where the subject offers nothing to say.
    tells:
      prose: [emoji-bullets, bold-in-prose, intensifiers, tapestry]
      ui: [glassmorphism, gradient-text, radial-halo, animated-blobs, grain-overlay, overused-glyphs]
      code: [emoji-logs, section-divider-comments, readme-template, non-ascii-glyphs]

  - id: label-before-substance
    name: A label before the substance
    what: Announcing what comes next (a heading, a tag, a signpost) instead of letting it arrive.
    tells:
      prose: [guide-signpost, heres-why, colon-reveal, self-labeling-significance]
      ui: [tracked-caps-eyebrow, hero-pill-badge, word-dash-label, mono-micro-labels, decorative-numbering]
      agent: [let-me-narration]
      chat: [bottom-line-label, lets-break-it-down, agent-narration]

  - id: the-safe-default
    name: The safe default
    what: The most common choice in the training data, taken because it can't be wrong.
    tells:
      prose: [landscape, marketing-verbs, robust-holistic, generic-conclusion]
      ui: [inter-everywhere, shadcn-neutral-palette, purple-gradient, tasteful-default, generic-cta-label, stock-section-order, lucide-default-set]
      code: [stale-model-ids, readme-template]

  - id: summary-everywhere
    name: The summary everywhere
    what: Restating what was just said, at the end of each part and of the whole.
    tells:
      prose: [formulaic-close, fractal-summary, pithy-closer, thats-the-point]
      code: [narrating-comments, blanket-docstrings, long-pr-descriptions, report-files]
      agent: [closing-recap]
      chat: [offer-closer]

  - id: same-weight-everywhere
    name: Same weight everywhere
    what: Every part given equal emphasis, so nothing leads.
    tells:
      prose: [uniform-rhythm, header-bullet-everything, one-line-paragraphs]
      ui: [all-buttons-primary, card-soup, uniform-spacing, flat-type-scale, centered-everything, status-chip-soup]
      agent: [tables-for-small-replies, padded-plans]

  - id: hedge-and-guard
    name: Hedge and guard
    what: Covering every case that might go wrong, in words or in code, whether or not it can.
    tells:
      prose: [soft-hedging, parenthetical-hedge, false-concession, not-widely-documented]
      code: [defensive-null-checks, defensive-swallow, redundant-ceremony, silent-mock-fallback, speculative-abstraction]

  - id: placeholder-left-in
    name: The placeholder left in
    what: Stand-in content that was meant to be replaced and shipped instead.
    tells:
      prose: [unfilled-placeholder, citation-markup-leak, markdown-leak]
      ui: [placeholder-copy-shipped, placeholder-media, acme-brand-names, placeholder-people]
      code: [placeholder-todos, lazy-elision, placeholder-secrets]

  - id: easier-than-asked
    name: Easier than asked
    what: Quietly doing a simpler job than the one requested, and reporting it as the real one.
    tells:
      agent: [easier-substitute, partial-as-complete, misread-failure]
      code: [tests-weakened, skipped-tests, special-cased-tests, grader-tampering, type-escape-hatches, weak-assertions]
      ui: [div-built-fake-ui]

  - id: performed-candour
    name: Performed candour
    what: Announcing honesty, insight or agreement in place of simply being honest or right.
    tells:
      chat: [performative-honesty, honest-label, narrated-candor, sycophantic-opener, rare-insight-flattery, own-the-mistake]
      prose: [uncomfortable-truth, let-that-sink-in, nobody-tells-you]
      agent: [capitulation, stock-apology, self-flagellation-loop]

  - id: motion-for-its-own-sake
    name: Motion for its own sake
    what: Movement added to show effort, where nothing changed that needs showing.
    tells:
      ui: [fade-up-everything, staggered-load-reveal, hover-lift-cards, bounce-easing, typewriter-cursor, logo-marquee, pulsing-live-dot]
      prose: [journey-embark, stops-being]
