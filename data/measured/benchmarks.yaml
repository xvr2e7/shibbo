not_extracted:
  - title: EQ-Bench Creative Writing v3 leaderboard
    url: "https://eqbench.com/creative_writing.html"
    data_url: "https://eqbench.com/creative_writing.js (CSV embedded as `leaderboardDataCreativeWritingV3`: model_name, elo_score, creative_writing_score, avg_length, vocab_complexity, slop_score, repetition_score)"
    measures: "slop_score = frequency of words/phrases overused by LLMs (GPT-isms) in the model's stories, matched against a master slop list; lower is better. Judged by Claude Sonnet 4.6."
    coverage: "146 models as of 2026-11-07, incl. gpt-6-astra, gpt-6-sol, gpt-5.6-sol, claude-opus-5, claude-opus-4-6, claude-opus-5-5, kimi-k3, GLM-5.3, grok-4.7, Qwen3.8"
    license: "None stated. eqbench.com has no terms page text on reuse; github.com/EQ-bench/creative-writing-bench has no LICENSE file and its README asks only for citation. Ask Sam Paech before reuse."
  - title: EQ-Bench Longform Creative Writing leaderboard (live)
    url: "https://eqbench.com/creative_writing_longform.html"
    data_url: "https://eqbench.com/creative_writing_longform.js (CSV `leaderboardDataLongformV3`, includes slop_score)"
    measures: "slop_score = frequency of GPT-isms per completed chapter; lower is better; does not count toward the score."
    coverage: "dozens of models incl. claude-opus-4-6, claude-sonnet-4-6, Kimi-K2.5, GLM-5, gpt-5.2"
    license: "Site states none. The repo is MIT, but its committed results are an older mid-2025 snapshot (extracted above); the live numbers are not in the repo."
  - title: "Graphite: AI tells, Opus 5.5 update"
    url: "https://graphite.io/five-percent/research/ai-tells-opus-5-5-update"
    data_url: "https://drive.google.com/drive/folders/1GBwbAm0T0qM1K9H54mSCCMadfpE87936"
    measures: "Tell counts (phrases >=2x human rate vs 10,000 pre-ChatGPT articles), unigram Jensen-Shannon divergence from human, mannered-prose score 0-100, em dashes per 1k words, Cohen's d of 11 known tells."
    coverage: "10 models: Claude Opus 4, 4.6, 5, 5.5; GPT-4.1, GPT-5, GPT-5.6 Sol, GPT-6 Astra; Gemini 2.5 Pro, 3.1 Pro"
    license: "The Drive folder's LICENSE puts tells_vs_human.csv.gz and features.csv.gz under CC BY 4.0; the articles file is not covered and stays local. Imported into data/raw/graphite and data/measured/graphite.json (10 models, 9,974 topics) by scripts/import-graphite.ts, so it is not repeated as a leaderboard here."
  - title: "Antislop (Paech et al., arXiv:2510.15061)"
    url: "https://arxiv.org/abs/2510.15061"
    measures: "Per-token over-representation vs human baseline; Tables 4-5 give % of 67 models sharing each top word/trigram (per-pattern, not per-model). Fig. 7 plots not-x-but-y per 1k chars for several models (chart only)."
    coverage: "67 models in the overlap tables; no per-model score table"
    license: "CC BY 4.0. Nothing per-model to extract; the per-model not-x-but-y numbers live in the Slop Score dataset above."
  - title: "Idiosyncrasies in Large Language Models (Sun et al., arXiv:2502.12150)"
    url: "https://arxiv.org/abs/2502.12150"
    measures: "Accuracy of classifiers that tell which LLM wrote a text (97.1% five-way: ChatGPT, Claude, Grok, Gemini, DeepSeek)."
    coverage: "5 chat-API families plus some open-model sets; a classification score, not a tell rate"
    license: "Paper: arXiv non-exclusive license (no reuse grant). Code repo locuslab/llm-idiosyncrasies is MIT. Not extracted."
  - title: Pangram
    url: "https://pangram.com/blog/updating-pangram-text-gpt4o"
    measures: "AI-text detection accuracy; no public per-model tell table found."
    coverage: "n/a"
    license: "Proprietary. Nothing to extract."
