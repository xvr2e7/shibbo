tells:
  - id: eliza-reflection
    era_start: "1966"
    era_end: null
    systems: [ELIZA (DOCTOR script)]
    tell: Reflects the user's words back as a question
    example: "WHAT WOULD IT MEAN TO YOU IF YOU GOT SOME HELP"
    evidence: Weizenbaum's sample dialogue shows ELIZA turning each input into a question by keyword match and pronoun swap, such as "My father" answered with "YOUR FATHER".
    source:
      title: "ELIZA: A Computer Program for the Study of Natural Language Communication Between Man and Machine"
      url: "https://web.stanford.edu/class/cs124/p36-weizenabaum.pdf"
      year: 1966
    kind: documented

  - id: eliza-content-free
    era_start: "1966"
    era_end: null
    systems: [ELIZA (DOCTOR script)]
    tell: Content-free filler when no keyword matches
    example: "Please go on"
    evidence: The paper says the reserved keyword NONE triggers stock content-free remarks such as "Please go on", "That's very interesting" and "I see".
    source:
      title: "ELIZA: A Computer Program for the Study of Natural Language Communication Between Man and Machine"
      url: "https://web.stanford.edu/class/cs124/p36-weizenabaum.pdf"
      year: 1966
    kind: documented

  - id: parry-deflection
    era_start: "1972"
    era_end: null
    systems: [PARRY]
    tell: Suspicious deflection and topic refusal
    example: "I would rather not discuss that anymore."
    evidence: The RFC 439 transcript of PARRY talking to ELIZA's DOCTOR shows PARRY steering to fixed worries, such as the mob, and closing topics it does not want.
    source:
      title: "RFC 439: PARRY Encounters the DOCTOR"
      url: "https://www.rfc-editor.org/rfc/rfc439.txt"
      year: 1973
    kind: documented

  - id: neural-degeneration
    era_start: "2019"
    era_end: "2020"
    systems: [GPT-2]
    tell: Bland, looping text under likelihood decoding
    example: null
    evidence: Holtzman et al. found that decoding by likelihood "leads to text that is bland and strangely repetitive" and proposed nucleus sampling as the fix.
    source:
      title: "The Curious Case of Neural Text Degeneration (arXiv:1904.09751, ICLR 2020)"
      url: "https://arxiv.org/abs/1904.09751"
      year: 2019
    kind: documented

  - id: gltr-sampling-artifacts
    era_start: "2019"
    era_end: null
    systems: [GPT-2]
    tell: Statistical sampling artifacts visible to readers
    example: null
    evidence: GLTR applied baseline statistical methods to flag generation artifacts, and its overlay raised untrained humans' detection rate of fake text from 54% to 72%.
    source:
      title: "GLTR: Statistical Detection and Visualization of Generated Text (arXiv:1906.04043)"
      url: "https://arxiv.org/abs/1906.04043"
      year: 2019
    kind: measured

  - id: knowledge-cutoff-disclaimer
    era_start: "2022"
    era_end: "2023"
    systems: [GPT-3.5, GPT-4]
    tell: Knowledge-cutoff disclaimer
    example: "As of my last knowledge update in January 2022"
    evidence: Wikipedia's AI-writing guide lists "as of my last knowledge update" and "Up to my last training update" as 2022 to 2023 signs from models with fixed cutoffs such as GPT-3.5 and GPT-4.
    source:
      title: "Wikipedia:Signs of AI writing"
      url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing"
      year: 2026
    kind: documented

  - id: as-an-ai-language-model-wikipedia
    era_start: "2023"
    era_end: null
    systems: [ChatGPT]
    tell: '"As an AI language model" refusal boilerplate'
    example: "As an AI language model, I can't directly add content to Wikipedia for you"
    evidence: Wikipedia's guide lists "as an AI language model", "as a large language model" and "I'm sorry" as refusal signs, quotes a 2024 article edit, and says outright refusals have become rare.
    source:
      title: "Wikipedia:Signs of AI writing"
      url: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing"
      year: 2026
    kind: documented

  - id: as-an-ai-language-model-botnet
    era_start: "2023"
    era_end: null
    systems: [ChatGPT]
    tell: '"As an AI language model" leaked into bot tweets'
    example: "as an AI language model, I don't have to pay taxes"
    evidence: Yang and Menczer searched Twitter for the phrase to find LLM-run accounts, identified a botnet of 1,140 accounts, and found that LLM content classifiers could not tell them from humans.
    source:
      title: "Anatomy of an AI-powered malicious social botnet (arXiv:2307.16336)"
      url: "https://arxiv.org/abs/2307.16336"
      year: 2023
    kind: measured

  - id: regenerate-response-papers
    era_start: "2023"
    era_end: null
    systems: [ChatGPT]
    tell: ChatGPT interface text pasted into papers
    example: "Regenerate response"
    evidence: Retraction Watch reported that Guillaume Cabanac had posted more than 30 papers on PubPeer containing "Regenerate response", not counting predatory journals.
    source:
      title: "Signs of undeclared ChatGPT use in papers mounting (Retraction Watch)"
      url: "https://retractionwatch.com/2023/10/06/signs-of-undeclared-chatgpt-use-in-papers-mounting/"
      year: 2023
    kind: reported

  - id: as-an-ai-language-model-papers
    era_start: "2023"
    era_end: null
    systems: [ChatGPT]
    tell: '"As an AI language model" in published papers'
    example: "As an AI language model, I"
    evidence: The same Retraction Watch report says Cabanac had found the phrase "As an AI language model, I" in nine papers so far.
    source:
      title: "Signs of undeclared ChatGPT use in papers mounting (Retraction Watch)"
      url: "https://retractionwatch.com/2023/10/06/signs-of-undeclared-chatgpt-use-in-papers-mounting/"
      year: 2023
    kind: reported

  - id: refusal-product-titles
    era_start: "2024-01"
    era_end: null
    systems: [ChatGPT]
    tell: Refusal message used as a product title
    example: "I'm sorry but I cannot fulfill this request it goes against OpenAI use policy"
    evidence: Futurism found Amazon listings, including a dresser, a lounger and a recliner, whose product names were ChatGPT refusal messages.
    source:
      title: "Amazon Is Selling Products With AI-Generated Names Like 'I Cannot Fulfill This Request It Goes Against OpenAI Use Policy'"
      url: "https://futurism.com/amazon-products-ai-generated"
      year: 2024
    kind: reported

  - id: intricate-commendable-meticulous-papers
    era_start: "2023"
    era_end: null
    systems: [ChatGPT and other LLMs]
    tell: Rise of "intricate", "commendable", "meticulous" in papers
    example: "intricate"
    evidence: Gray found that between 2022 and 2023 "intricate" rose 117%, "commendable" 83%, "meticulous" 59% and "meticulously" 137% in Dimensions, implying at least 60,000 LLM-assisted 2023 papers (slightly over 1%).
    source:
      title: "ChatGPT 'contamination': estimating the prevalence of LLMs in the scholarly literature (arXiv:2403.16887)"
      url: "https://arxiv.org/abs/2403.16887"
      year: 2024
    kind: measured

  - id: peer-review-adjectives
    era_start: "2023"
    era_end: null
    systems: [ChatGPT]
    tell: Praise adjectives in peer reviews
    example: "commendable"
    evidence: Liang et al. found "commendable", "meticulous" and "intricate" 9.8, 34.7 and 11.2 times more likely to appear in a sentence in ICLR 2024 reviews, and estimated 6.5% to 16.9% of review text was substantially LLM-modified.
    source:
      title: "Monitoring AI-Modified Content at Scale: A Case Study on the Impact of ChatGPT on AI Conference Peer Reviews (arXiv:2403.07183)"
      url: "https://arxiv.org/abs/2403.07183"
      year: 2024
    kind: measured

  - id: realm-pivotal-showcasing
    era_start: "2023"
    era_end: null
    systems: [ChatGPT and other LLMs]
    tell: '"realm", "intricate", "showcasing", "pivotal" in abstracts'
    example: "realm"
    evidence: Liang et al. found these four words most over-used by LLMs relative to humans and saw them surge in arXiv CS abstracts from 2023, where up to 17.5% of papers were LLM-modified.
    source:
      title: "Mapping the Increasing Use of LLMs in Scientific Papers (arXiv:2404.01268)"
      url: "https://arxiv.org/abs/2404.01268"
      year: 2024
    kind: measured

  - id: delves-pubmed
    era_start: "2024"
    era_end: null
    systems: [ChatGPT and other LLMs]
    tell: '"delves", "underscores", "showcasing" in biomedical abstracts'
    example: "delves"
    evidence: Kobak et al. found 2024 excess ratios of r = 28.0 for "delves", 13.8 for "underscores" and 10.7 for "showcasing" across over 15 million PubMed abstracts, putting at least 13.5% of 2024 abstracts as LLM-processed.
    source:
      title: "Delving into LLM-assisted writing in biomedical publications through excess vocabulary (arXiv:2406.07016; Science Advances 2025)"
      url: "https://arxiv.org/abs/2406.07016"
      year: 2025
    kind: measured

  - id: style-verbs-over-nouns
    era_start: "2024"
    era_end: null
    systems: [ChatGPT and other LLMs]
    tell: Excess style verbs, not topic nouns
    example: "potential, findings, crucial"
    evidence: Kobak et al. found that past excess words were mostly nouns (79.2% of content words), while of 379 excess style words in 2024, 66% were verbs and 14% adjectives.
    source:
      title: "Delving into LLM-assisted writing in biomedical publications through excess vocabulary (arXiv:2406.07016; Science Advances 2025)"
      url: "https://arxiv.org/abs/2406.07016"
      year: 2025
    kind: measured

  - id: focal-words-rlhf
    era_start: "2023"
    era_end: null
    systems: [ChatGPT-3.5, Llama 2-Chat]
    tell: '"delve" and 20 other focal words, linked to RLHF'
    example: "delve, intricate, underscore, boasts, garnered, realm"
    evidence: Juzek and Ward identified 21 focal words that spiked in scientific English, found no cause in architecture or training data, and found evidence for RLHF by comparing Llama 2-Base with Llama 2-Chat.
    source:
      title: "Why Does ChatGPT \"Delve\" So Much? Exploring the Sources of Lexical Overrepresentation in Large Language Models (COLING 2025)"
      url: "https://arxiv.org/abs/2412.11385"
      year: 2025
    kind: measured

  - id: delve-decline
    era_start: "2024-04"
    era_end: null
    systems: [ChatGPT]
    tell: '"delve" falls after it is called out'
    example: "delve"
    evidence: Geng and Trotta found "delve" and other flagged words dropped in arXiv abstracts soon after they were pointed out in early 2024, while "significant" kept rising.
    source:
      title: "Human-LLM Coevolution: Evidence from Academic Writing (arXiv:2502.09606)"
      url: "https://arxiv.org/abs/2502.09606"
      year: 2025
    kind: measured

  - id: participial-clauses
    era_start: "2024"
    era_end: null
    systems: [GPT-4o, GPT-4o Mini, Llama 3 8B Instruct, Llama 3 70B Instruct]
    tell: Present participial clauses and nominalizations
    example: null
    evidence: Reinhart et al. found instruction-tuned models use present participial clauses at 2 to 5 times the human rate (GPT-4o 5.3 times) and nominalizations at 1.5 to 2 times (GPT-4o 2.1 times), with larger gaps than base models.
    source:
      title: "Do LLMs write like humans? Variation in grammatical and rhetorical styles (PNAS 2025; arXiv:2410.16107)"
      url: "https://arxiv.org/html/2410.16107v2"
      year: 2025
    kind: measured

  - id: camaraderie-tapestry-palpable
    era_start: "2024"
    era_end: null
    systems: [GPT-4o, GPT-4o Mini, Llama 3 8B Instruct, Llama 3 70B Instruct]
    tell: '"camaraderie", "tapestry", "palpable"'
    example: "tapestry"
    evidence: Relative to human text, GPT-4o used "camaraderie" 162 times, "tapestry" 155 times and "palpable" 95 times as often; Llama 3 70B Instruct used "camaraderie" 24 and "palpable" 47 times as often, and "tapestry" was not a top word for any Llama.
    source:
      title: "Do LLMs write like humans? Variation in grammatical and rhetorical styles (PNAS 2025; arXiv:2410.16107)"
      url: "https://arxiv.org/html/2410.16107v2"
      year: 2025
    kind: measured

  - id: syntactic-templates
    era_start: "2024"
    era_end: null
    systems: [instruction-tuned LLMs]
    tell: Repeated syntactic templates
    example: null
    evidence: Shaib et al. found models produce part-of-speech templates more often than human references, and 76% of templates in model text appear in pre-training data, against 35% for human text.
    source:
      title: "Detection and Measurement of Syntactic Templates in Generated Text (arXiv:2407.00211, EMNLP 2024)"
      url: "https://arxiv.org/abs/2407.00211"
      year: 2024
    kind: measured

  - id: model-idiosyncrasies
    era_start: "2025"
    era_end: null
    systems: [ChatGPT, Claude, Grok, Gemini, DeepSeek]
    tell: Per-model word choice fingerprint
    example: null
    evidence: Sun et al. trained a classifier that named the source model among ChatGPT, Claude, Grok, Gemini and DeepSeek with 97.1% accuracy, driven by word-level distributions that survive rewriting.
    source:
      title: "Idiosyncrasies in Large Language Models (arXiv:2502.12150, ICML 2025)"
      url: "https://arxiv.org/abs/2502.12150"
      year: 2025
    kind: measured

  - id: slop-patterns
    era_start: "2025"
    era_end: null
    systems: [LLMs profiled by Antislop]
    tell: Repeated "slop" phrases
    example: null
    evidence: Paech et al. report that some slop patterns appear over 1,000x more often in LLM output than in human text.
    source:
      title: "Antislop: A Comprehensive Framework for Identifying and Eliminating Repetitive Patterns in Language Models (arXiv:2510.15061)"
      url: "https://arxiv.org/abs/2510.15061"
      year: 2025
    kind: measured

  - id: length-and-markdown
    era_start: "2024"
    era_end: null
    systems: [GPT-4o-mini, Grok-2-mini, Claude 3.5 Sonnet, Llama-3.1-405B]
    tell: Long answers with lists, headers and bold
    example: null
    evidence: LMSYS found length the largest style factor in Arena votes (coefficient 0.249), with markdown lists 0.031, headers 0.024 and bold 0.019 when both are controlled.
    source:
      title: "Does style matter? Disentangling style and substance in Chatbot Arena (LMSYS)"
      url: "https://lmsys.org/blog/2024-08-28-style-control/"
      year: 2024
    kind: measured

  - id: unnecessary-refusals
    era_start: "2023"
    era_end: "2024-03"
    systems: [Claude 1, Claude 2]
    tell: Refusing harmless prompts
    example: null
    evidence: Anthropic wrote that previous Claude models "often made unnecessary refusals" and that Claude 3 refuses harmless prompts much less often.
    source:
      title: "Introducing the next generation of Claude"
      url: "https://www.anthropic.com/news/claude-3-family"
      year: 2024
    kind: documented

  - id: sycophancy-research
    era_start: "2023"
    era_end: null
    systems: [five RLHF-trained AI assistants]
    tell: Sycophancy, agreeing with the user's view
    example: null
