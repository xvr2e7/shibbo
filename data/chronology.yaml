# shibbo chronology: eras of conversational AI and the tells documented for each.
# Built 2026-11-06. Every entry cites a source opened while building this file.
# milestones[].source.kind: primary (lab, paper, official post) | secondary (news, Wikipedia)
# tells[].kind: measured (source counts or rates it) | documented (source records examples) | reported (news coverage)
# Dates taken from an arXiv paper use the arXiv v1 date; the note says so.

milestones:
  - id: eliza
    name: ELIZA
    maker: Joseph Weizenbaum
    lab: MIT Project MAC
    date: "1966-01"
    kind: chatbot
    weights: closed
    note: Weizenbaum's paper describes a keyword and transformation program whose DOCTOR script answers like a Rogerian therapist.
    source:
      title: "ELIZA: A Computer Program for the Study of Natural Language Communication Between Man and Machine (CACM 9(1), January 1966)"
      url: "https://web.stanford.edu/class/cs124/p36-weizenabaum.pdf"
      kind: primary

  - id: parry
    name: PARRY
    maker: Kenneth Colby
    lab: Stanford University
    date: "1971"
    kind: chatbot
    weights: closed
    note: Psychiatrist Kenneth Colby wrote PARRY to simulate a person with paranoid schizophrenia; his 1971 paper describes the model and quotes interviews with it.
    source:
      title: "Artificial Paranoia (Colby, Weber and Hilf, Artificial Intelligence 2, 1971)"
      url: "https://courses.cs.umbc.edu/471/papers/colby_71.pdf"
      kind: primary

  - id: parry-meets-doctor
    name: PARRY encounters the DOCTOR (RFC 439)
    maker: Vint Cerf (transcript)
    lab: Stanford / ARPANET
    date: "1973-01-21"
    kind: chatbot
    weights: closed
    note: RFC 439 records a session over ARPANET in which PARRY talks to ELIZA's DOCTOR script.
    source:
      title: "RFC 439: PARRY Encounters the DOCTOR"
      url: "https://www.rfc-editor.org/rfc/rfc439.txt"
      kind: primary

  - id: alice
    name: A.L.I.C.E.
    maker: Richard Wallace
    lab: Richard Wallace
    date: "1995"
    kind: chatbot
    weights: closed
    note: Wallace's chatbot used AIML, an XML schema for conversation rules, and won the Loebner Prize in 2000, 2001 and 2004. Wallace's own AIML set gives 1995 as the start; only Wikipedia gives a day.
    source:
      title: "Artificial Linguistic Internet Computer Entity - Wikipedia"
      url: "https://en.wikipedia.org/wiki/Artificial_Linguistic_Internet_Computer_Entity"
      kind: secondary

  - id: cleverbot
    name: Cleverbot
    maker: Rollo Carpenter
    lab: Rollo Carpenter
    date: "2008-10"
    kind: chatbot
    weights: closed
    note: Rollo Carpenter launched Cleverbot as a web app in October 2008; his earlier chatbot Jabberwacky went online in 1997.
    source:
      title: "Cleverbot.com - a clever bot - speak to an AI with some Actual Intelligence?"
      url: "https://web.archive.org/web/20081013201956/http://www.cleverbot.com/"
      kind: primary

  - id: ibm-watson-jeopardy
    name: IBM Watson (Jeopardy!)
    maker: IBM
    lab: IBM Research
    date: "2011-02"
    kind: assistant
    weights: closed
    note: Watson won the three-night Jeopardy! match with $77,147, ahead of Ken Jennings and Brad Rutter.
    source:
      title: "Watson, Jeopardy! champion"
      url: "https://www.ibm.com/history/watson-jeopardy"
      kind: primary

  - id: siri
    name: Siri (iPhone 4S)
    maker: Apple
    lab: Apple
    date: "2011-10-04"
    kind: assistant
    weights: closed
    note: Apple announced Siri with the iPhone 4S as an assistant you speak to in plain language.
    source:
      title: "Apple Launches iPhone 4S, iOS 5 & iCloud"
      url: "https://www.apple.com/newsroom/2011/10/04Apple-Launches-iPhone-4S-iOS-5-iCloud/"
      kind: primary

  - id: cortana
    name: Cortana
    maker: Microsoft
    lab: Microsoft
    date: "2014-04-02"
    kind: assistant
    weights: closed
    note: Microsoft unveiled Cortana, a voice assistant for Windows Phone 8.1 built on Bing, as a beta.
    source:
      title: "Cortana (yes!) and Many, Many Other Great Features coming in Windows Phone 8.1"
      url: "https://blogs.windows.com/windowsexperience/2014/04/02/cortana-yes-and-many-many-other-great-features-coming-in-windows-phone-8-1/"
      kind: primary

  - id: xiaoice
    name: Xiaoice
    maker: Microsoft
    lab: Microsoft (Asia) Software Technology Center
    date: "2014-05-29"
    kind: chatbot
    weights: closed
    note: Microsoft first released Xiaoice in China on 29 May 2014; its paper calls it an empathetic social chatbot built for long conversations.
    source:
      title: "The Design and Implementation of XiaoIce, an Empathetic Social Chatbot"
      url: "https://arxiv.org/abs/1812.08989v1"
      kind: primary

  - id: amazon-echo-alexa
    name: Amazon Echo / Alexa
    maker: Amazon
    lab: Amazon
    date: "2014-11-06"
    kind: assistant
    weights: closed
    note: Amazon launched Echo, a speaker that wakes to the word "Alexa", at first by invitation only.
    source:
      title: "Forget Siri, Amazon now brings you Alexa"
      url: "https://fortune.com/2014/11/06/forget-siri-amazon-now-brings-you-alexa"
      kind: secondary

  - id: tay-launch
    name: Tay
    maker: Microsoft
    lab: Microsoft
    date: "2016-03-23"
    kind: chatbot
    weights: closed
    note: Tay went live on Twitter as @TayandYou, and Microsoft took it offline after a coordinated attack in its first 24 hours taught it offensive replies.
    source:
      title: "Learning from Tay’s introduction"
      url: "https://blogs.microsoft.com/blog/2016/03/25/learning-tays-introduction/"
      kind: primary

  - id: tay-offline
    name: Tay taken offline
    maker: Microsoft
    lab: Microsoft
    date: "2016-03-25"
    kind: chatbot
    weights: closed
    note: Microsoft apologized for Tay's offensive tweets and said the bot was offline.
    source:
      title: "Learning from Tay's introduction"
      url: "https://blogs.microsoft.com/blog/2016/03/25/learning-tays-introduction/"
      kind: primary

  - id: google-assistant
    name: Google Assistant
    maker: Google
    lab: Google
    date: "2016-05-18"
    kind: assistant
    weights: closed
    note: Sundar Pichai introduced the Google Assistant at I/O as a two-way, conversational helper.
    source:
      title: "I/O: Building the next evolution of Google"
      url: "https://blog.google/products/assistant/io-building-next-evolution-of-google/"
      kind: primary

  - id: transformer
    name: Transformer ("Attention Is All You Need")
    maker: Google
    lab: Google Brain / Google Research
    date: "2017-06-12"
    kind: llm
    weights: closed
    note: Vaswani and co-authors posted the paper that introduced the Transformer architecture; the paper released no trained weights. Date is the arXiv v1 date.
    source:
      title: "Attention Is All You Need (arXiv:1706.03762)"
      url: "https://arxiv.org/abs/1706.03762"
      kind: primary

  - id: duplex
    name: Google Duplex
    maker: Google
    lab: Google AI
    date: "2018-05-08"
    kind: agent
    weights: closed
    note: Google unveiled Duplex, which holds natural-sounding phone calls to do narrow tasks such as booking appointments.
    source:
      title: "Google Duplex: An AI System for Accomplishing Real-World Tasks Over the Phone"
      url: "https://research.google/blog/google-duplex-an-ai-system-for-accomplishing-real-world-tasks-over-the-phone/"
      kind: primary

  - id: bert
    name: BERT
    maker: Google
    lab: Google AI Language
    date: "2018-10-11"
    kind: llm
    weights: open
    note: The paper presents BERT, a bidirectional Transformer pre-trained for language understanding. Date is the arXiv v1 date.
    source:
      title: "BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding"
      url: "https://arxiv.org/abs/1810.04805v1"
      kind: primary

  - id: gpt-2
    name: GPT-2 (announced, staged release)
    maker: OpenAI
    lab: OpenAI
    date: "2019-02-14"
    kind: llm
    weights: open
    note: OpenAI announced GPT-2 but held back the full model, releasing larger versions in stages over the year.
    source:
      title: "Better language models and their implications"
      url: "https://openai.com/index/better-language-models/"
      kind: primary

  - id: t5
    name: T5
    maker: Google
    lab: Google Research
    date: "2019-10-23"
    kind: llm
    weights: open
    note: The paper treats every text task as text-to-text with one Transformer model. Date is the arXiv v1 date.
    source:
      title: "Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer"
      url: "https://arxiv.org/abs/1910.10683v1"
      kind: primary

  - id: gpt-2-1-5b
    name: GPT-2 1.5B (full release)
    maker: OpenAI
    lab: OpenAI
    date: "2019-11-05"
    kind: llm
    weights: open
    note: OpenAI released the full 1.5B model after the 117M, 345M and 774M versions, saying it had seen no strong evidence of misuse.
    source:
      title: "GPT-2: 1.5B release"
      url: "https://openai.com/index/gpt-2-1-5b-release/"
      kind: primary

  - id: meena
    name: Meena
    maker: Google
    lab: Google Research (Brain)
    date: "2020-01-27"
    kind: chat-llm
    weights: closed
    note: Google described Meena, a 2.6B-parameter open-domain chatbot trained to predict the next token. Date is the arXiv v1 date.
    source:
      title: "Towards a Human-like Open-Domain Chatbot (arXiv:2001.09977)"
      url: "https://arxiv.org/abs/2001.09977"
      kind: primary

  - id: gpt-3
    name: GPT-3
    maker: OpenAI
    lab: OpenAI
    date: "2020-05-28"
    kind: llm
    weights: closed
    note: The paper describes a 175 billion parameter model whose news samples human raters had trouble telling from human writing. Date is the arXiv v1 date.
    source:
      title: "Language Models are Few-Shot Learners (arXiv:2005.14165)"
      url: "https://arxiv.org/abs/2005.14165"
      kind: primary

  - id: lamda
    name: LaMDA
    maker: Google
    lab: Google
    date: "2021-05-18"
    kind: chat-llm
    weights: closed
    note: Google introduced LaMDA, a language model trained on dialogue that can hold open-ended talks on many topics.
    source:
      title: "LaMDA: our breakthrough conversation technology"
      url: "https://blog.google/technology/ai/lamda/"
      kind: primary

  - id: instructgpt
    name: InstructGPT (RLHF)
    maker: OpenAI
    lab: OpenAI
    date: "2022-03-04"
    kind: chat-llm
    weights: closed
    note: OpenAI fine-tuned GPT-3 on demonstrations and then with reinforcement learning from human feedback; raters preferred the 1.3B InstructGPT to the 175B GPT-3. Date is the arXiv v1 date.
    source:
      title: "Training language models to follow instructions with human feedback (arXiv:2203.02155)"
      url: "https://arxiv.org/abs/2203.02155"
      kind: primary

