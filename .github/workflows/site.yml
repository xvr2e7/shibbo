name: site
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to pick up registry and data changes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run import:graphite && npm run map && npm run web:build
      # The project has to pass its own checks.
      - run: npx tsx src/cli.ts check README.md SCHEMA.md web/src/content --threshold 80 --format github
      - run: npm run plugin && git diff --exit-code -- plugins/shibbo/data || echo "::warning::plugin data is stale; run npm run plugin"
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
