name: measure
# Run by hand when a model ships. Spends API credit: about 30 article-length requests.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Claude model id to measure, e.g. claude-opus-5-5"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # Human baseline: n-gram counts built from Graphite's human articles at run time, never committed.
      - run: |
          mkdir -p .cache
          curl -sL "https://drive.usercontent.google.com/download?id=1Dx9obhW5xNGhHmq3jhqJaCs1SIOS-CYI&export=download&confirm=t" -o .cache/ai_tells_articles.jsonl.gz
          NODE_OPTIONS=--max-old-space-size=6000 npx tsx measure/analyze.ts --baseline .cache/ai_tells_articles.jsonl.gz
      - run: npx tsx measure/generate.ts --model "${{ inputs.model }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: npx tsx measure/analyze.ts measure/runs/${{ inputs.model }}/*.jsonl --as "${{ inputs.model }}"
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: measure/${{ inputs.model }}
          title: "Measure ${{ inputs.model }}"
          body: |
            Outputs and a tell report for `${{ inputs.model }}`. Review the candidate tells in `measure/reports/` before adding any to `data/tells.yaml`.
          add-paths: |
            measure/runs/**
            measure/reports/**
