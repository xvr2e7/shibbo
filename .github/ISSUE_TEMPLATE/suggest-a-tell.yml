name: Suggest a tell
description: A pattern that marks writing, code, an interface or agent behavior as machine-made
title: "Tell: "
labels: ["tell"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for adding to the registry. Every tell needs at least one source, so a link matters more than a perfect description. Search the [field guide](https://xvr2e7.github.io/shibbo/#/tells) first in case it's already there.
  - type: dropdown
    id: domain
    attributes:
      label: Kind of work
      options:
        - Prose
        - Chat replies
        - Code
        - Interfaces and type
        - Agent behavior
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Short name
      placeholder: e.g. "Rule of three", "Purple gradient hero"
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A real snippet, screenshot or exchange that shows it. Mark which part is the tell.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What to do instead
      description: The plain version a person would write.
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: A study, a public list, an issue report or a post that documents it. Which models do it, if known?
    validations:
      required: true
  - type: textarea
    id: detect
    attributes:
      label: How to detect it (optional)
      description: A regex, a rule of thumb, or the question a reader would ask.
