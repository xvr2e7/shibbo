name: Missing source or prior art
description: A study, list or checker the registry should cite
title: "Source: "
labels: ["source"]
body:
  - type: input
    id: url
    attributes:
      label: Link
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Measured study
        - Curated list or checker
        - Primary source (issue report, system prompt, changelog)
        - Essay or post
    validations:
      required: true
  - type: textarea
    id: covers
    attributes:
      label: What it adds
      description: Which tells it supports, adds or contradicts.
