name: Measure a model
description: Ask for a release to be measured, or offer to run it
title: "Measure: "
labels: ["measure"]
body:
  - type: input
    id: model
    attributes:
      label: Model and release date
      placeholder: e.g. Gemini 4 Argon, October 2026
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Can you run it?
      description: Measuring takes about 300 articles on the held-out topics. See the [measuring guide](https://xvr2e7.github.io/shibbo/docs/guide/measure.html).
      options:
        - I'm asking for it
        - I can run it with my own API access or GPU
    validations:
      required: true
