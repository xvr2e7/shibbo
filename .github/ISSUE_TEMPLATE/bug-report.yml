name: Bug report
description: The checker, a harness setup or the site behaves wrongly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The command or text you checked, and the output. For a false hit, paste the sentence.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and setup
      placeholder: "shibbo 0.1.1, Node 20, Claude Code plugin"
