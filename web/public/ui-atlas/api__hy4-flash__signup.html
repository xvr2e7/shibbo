<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Lingua</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: #ffffff;
      color: #111827;
      min-height: 100vh;
      display: flex;
    }

    .container {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* Left Panel Branding */
    .left-panel {
      flex: 1;
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
    }
    .circle-1 {
      width: 300px;
      height: 300px;
      top: -100px;
      left: -100px;
    }
    .circle-2 {
      width: 500px;
      height: 500px;
      bottom: -150px;
      right: -150px;
    }

    .brand {
      position: absolute;
      top: 2rem;
      left: 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.75rem;
      font-weight: 800;
      color: white;
      z-index: 10;
    }

    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 500px;
      color: white;
    }

    .hero-content h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .hero-content p {
      font-size: 1.125rem;
      opacity: 0.9;
      line-height: 1.6;
      margin-bottom: 3rem;
    }

    .illustration-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 0 auto;
    }

    .main-illustration {
      width: 100%;
      height: 100%;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .float-element {
      position: absolute;
      background: rgba(255, 255, 255, 0.15);
      padding: 0.5rem 1rem;
      border-radius: 1rem;
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: floating 4s ease-in-out infinite;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .float-element:nth-child(2) { animation-delay: 0.5s; }
    .float-element:nth-child(3) { animation-delay: 1s; }
    .float-element:nth-child(4) { animation-delay: 1.5s; }

    @keyframes floating {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-15px) rotate(3deg); }
    }

    /* Right Panel Form */
    .right-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-color: #ffffff;
    }

    .form-container {
      width: 100%;
      max-width: 420px;
    }

    .form-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-header h2 {
      font-size: 2rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 0.5rem;
    }

    .form-header p {
      color: #6b7280;
      font-size: 1rem;
    }

    .social-login {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem;
      background: white;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 700;
      color: #374151;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .social-btn:hover {
      background-color: #f9fafb;
      border-color: #9ca3af;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: #9ca3af;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background-color: #e5e7eb;
    }

    .divider span {
      padding: 0 1rem;
    }

    .input-group {
      margin-bottom: 1.25rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 700;
      color: #374151;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #9ca3af;
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-family: inherit;
      color: #111827;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input::placeholder {
      color: #9ca3af;
    }

    .input-group input:focus {
      outline: none;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      color: #4b5563;
    }

    .checkbox-group input {
      width: 1rem;
      height: 1rem;
      accent-color: #10b981;
      cursor: pointer;
    }

    .checkbox-group a {
      color: #10b981;
      font-weight: 700;
      text-decoration: none;
    }

    .checkbox-group a:hover {
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      padding: 0.875rem;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .submit-btn:hover {
      background-color: #059669;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #6b7280;
    }

    .login-link a {
      color: #10b981;
      font-weight: 700;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    /* Responsive Design */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }
      .left-panel {
        padding: 4rem 2rem 2rem 2rem;
      }
      .brand {
        top: 1.5rem;
        left: 1.5rem;
      }
      .hero-content h1 {
        font-size: 2.25rem;
      }
      .illustration-container {
        width: 250px;
        height: 250px;
        margin-top: 1.5rem;
      }
      .hero-content p {
        margin-bottom: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .right-panel {
        padding: 1.5rem;
      }
      .social-login {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Left Panel: Branding & Illustration -->
    <div class="left-panel">
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
      
      <div class="brand">
        <svg width="32" height="32" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="110" r="70" fill="white"/>
          <path d="M100 55 Q 100 10 60 15 Q 60 50 100 55" fill="#FCD34D"/>
          <path d="M100 55 Q 100 10 140 15 Q 140 50 100 55" fill="#FBBF24"/>
          <line x1="100" y1="18" x2="100" y2="180" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
          <line x1="30" y1="110" x2="170" y2="110" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
        </svg>
        Lingua
      </div>
      
      <div class="hero-content">
        <h1>Speak the world.</h1>
        <p>Join over 10 million learners and start your journey to fluency today. Fun, fast, and completely free.</p>
        
        <div class="illustration-container">
          <svg class="main-illustration" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Outer rings -->
            <circle cx="100" cy="110" r="80" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="10 10"/>
            <circle cx="100" cy="110" r="95" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
            
            <!-- Sparkles -->
            <path d="M35 30 Q35 45 50 45 Q35 45 35 60 Q35 45 20 45 Q35 45 35 30 Z" fill="rgba(255,255,255,0.8)"/>
            <path d="M165 130 Q165 140 175 140 Q165 140 165 150 Q165 140 155 140 Q165 140 165 130 Z" fill="rgba(255,255,255,0.6)"/>
            
            <!-- Main Globe -->
            <circle cx="100" cy="110" r="55" fill="white"/>
            <path d="M100 55 C 80 70, 80 150, 100 165 M100 55 C 120 70, 120 150, 100 165" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
            <path d="M45 110 C 60 90, 140 90, 155 110 M45 110 C 60 130, 140 130, 155 110" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
            <line x1="100" y1="55" x2="100" y2="165" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
            <line x1="45" y1="110" x2="155" y2="110" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
            
            <!-- Sprout -->
            <path d="M100 55 Q 100 10 60 15 Q 60 50 100 55" fill="#FCD34D"/>
            <path d="M100 55 Q 100 10 140 15 Q 140 50 100 55" fill="#FBBF24"/>
            <path d="M100 55 L 100 5" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
          </svg>
          
          <div class="float-element" style="top: 15%; left: -5%;">Hola</div>
          <div class="float-element" style="top: 60%; right: -10%;">Bonjour</div>
          <div class="float-element" style="bottom: 5%; left: -5%;">Ciao</div>
          <div class="float-element" style="top: 5%; right: 5%;">Hello</div>
        </div>
      </div>
    </div>
    
    <!-- Right Panel: Sign Up Form -->
    <div class="right-panel">
      <div class="form-container">
        <div class="form-header">
          <h2>Create your account</h2>
          <p>Start your learning journey with us.</p>
        </div>

        <form action="#" method="POST" onsubmit="event.preventDefault();">
          <div class="social-login">
            <button type="button" class="social-btn">
              <svg width="20" height="20" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              </svg>
              Google
            </button>
            <button type="button" class="social-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
              Facebook
            </button>
          </div>

          <div class="divider">
            <span>or sign up with email</span>
          </div>

          <div class="input-group">
            <label for="name">Full Name</label>
            <div class="input-wrapper">
              <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
              <input type="text" id="name" name="name" placeholder="Jane Doe" required>
            </div>
          </div>

          <div class="input-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
              </svg>
              <input type="email" id="email" name="email" placeholder="jane@example.com" required>
            </div>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
              <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
            </div>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
          </div>

          <button type="submit" class="submit-btn">Get Started</button>

          <p class="login-link">
            Already have an account? <a href="#">Log in</a>
          </p>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
