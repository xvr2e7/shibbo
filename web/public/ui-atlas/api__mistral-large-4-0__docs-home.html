<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="ember">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Meridian — a tiny, dependency-free charting library. Documentation home.">
<title>Meridian — Docs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D9480F'/%3E%3Cpath d='M7 21.5l6-8 5 4.5 7-9.5' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet">
<script>
try{
  var t=localStorage.getItem('mrd-theme'), a=localStorage.getItem('mrd-accent');
  if(!t) t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=t;
  if(a) document.documentElement.dataset.accent=a;
}catch(e){}
</script>
<style>
/* ---------- tokens ---------- */
:root{
  --font-sans:'Instrument Sans',ui-sans-serif,sans-serif;
  --font-display:'Fraunces',ui-serif,Georgia,serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --bg:#FAF8F2; --bg-raised:#FFFFFF; --bg-sunken:#F1EDE2;
  --ink:#1D1B15; --ink-2:#5B574A; --ink-3:#8B8676;
  --line:#E6E1D3; --line-strong:#D6D0BE;
  --code-bg:#191712; --code-ink:#E7E2D0;
  --c1:var(--accent); --c2:#0E7C66; --c3:#D9A441; --c4:#A93250; --c5:#7A7462;
  --shadow:0 1px 2px rgba(29,27,21,.05),0 10px 28px -14px rgba(29,27,21,.16);
  --accent:#D9480F; --on-accent:#FFF6EF;
  --accent-soft:rgba(217,72,15,.09); --accent-line:rgba(217,72,15,.38);
}
html[data-theme="dark"]{
  --bg:#141310; --bg-raised:#1C1A16; --bg-sunken:#0F0E0B;
  --ink:#ECE7D9; --ink-2:#ABA695; --ink-3:#716D5F;
  --line:#2A2820; --line-strong:#3A372C;
  --code-bg:#0E0D0A;
  --c2:#3EC9A7; --c3:#E3B04B; --c4:#E56B8C; --c5:#8B8574;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px -14px rgba(0,0,0,.6);
  --accent:#FF6B3A; --on-accent:#221009;
  --accent-soft:rgba(255,107,58,.15); --accent-line:rgba(255,107,58,.42);
}
html[data-accent="jade"]{ --accent:#0F7B64; --on-accent:#F0FBF7; --accent-soft:rgba(15,123,100,.10); --accent-line:rgba(15,123,100,.36); }
html[data-accent="ochre"]{ --accent:#96660B; --on-accent:#FFFBEE; --accent-soft:rgba(150,102,11,.11); --accent-line:rgba(150,102,11,.38); }
html[data-accent="wine"]{ --accent:#A93250; --on-accent:#FFF4F6; --accent-soft:rgba(169,50,80,.09); --accent-line:rgba(169,50,80,.36); }
html[data-accent="ink"]{ --accent:#26241E; --on-accent:#FAF8F2; --accent-soft:rgba(38,36,30,.08); --accent-line:rgba(38,36,30,.32); }
html[data-theme="dark"][data-accent="ember"]{ --accent:#FF6B3A; --on-accent:#221009; --accent-soft:rgba(255,107,58,.15); --accent-line:rgba(255,107,58,.42); }
html[data-theme="dark"][data-accent="jade"]{ --accent:#3EC9A7; --on-accent:#06231B; --accent-soft:rgba(62,201,167,.14); --accent-line:rgba(62,201,167,.4); }
html[data-theme="dark"][data-accent="ochre"]{ --accent:#E3B04B; --on-accent:#241A04; --accent-soft:rgba(227,176,75,.14); --accent-line:rgba(227,176,75,.42); }
html[data-theme="dark"][data-accent="wine"]{ --accent:#E56B8C; --on-accent:#2B0A13; --accent-soft:rgba(229,107,140,.14); --accent-line:rgba(229,107,140,.42); }
html[data-theme="dark"][data-accent="ink"]{ --accent:#E9E4D6; --on-accent:#171510; --accent-soft:rgba(233,228,214,.12); --accent-line:rgba(233,228,214,.35); }

html.tt, html.tt *, html.tt *::before, html.tt *::after{
  transition:background-color .32s,border-color .32s,color .32s,fill .32s,stroke .32s,box-shadow .32s !important;
}
/* ---------- base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font:400 15px/1.65 var(--font-sans);
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow-x:clip;
}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:inherit}
button{font-family:inherit;color:inherit}
code{font:500 .86em var(--font-mono);background:var(--bg-sunken);border:1px solid var(--line);padding:.5px 5px;border-radius:6px}
pre code{background:none;border:0;padding:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;height:60px;
  display:flex;align-items:center;gap:14px;padding:0 20px;
  border-bottom:1px solid var(--line);
  background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);
  font-family:var(--font-display);font-optical-sizing:auto;font-weight:600;font-size:19px;letter-spacing:-.01em}
.docs-tag{font:600 10.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:2.5px 8px}
.search{position:relative;flex:1;max-width:440px;margin:0 auto}
.search .s-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{
  width:100%;height:36px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg-sunken);color:var(--ink);
  font:400 13.5px var(--font-sans);padding:0 60px 0 34px;outline:none;
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{border-color:var(--accent-line);background:var(--bg-raised)}
.kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font:500 11px var(--font-mono);color:var(--ink-3);
  border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;background:var(--bg-raised)}
.search-panel{
  position:absolute;top:calc(100% + 8px);left:0;right:0;display:none;
  background:var(--bg-raised);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);overflow:hidden;max-height:340px;overflow-y:auto;
}
.search-panel.open{display:block}
.sr-item{display:flex;align-items:center;gap:10px;padding:9px 13px;font-size:13.5px;cursor:pointer}
.sr-item.active{background:var(--accent-soft)}
.sr-tag{margin-left:auto;font:500 10.5px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.sr-empty{padding:12px 14px;font-size:13px;color:var(--ink-2)}
.top-actions{display:flex;align-items:center;gap:9px;margin-left:auto}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;
  border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer}
.icon-btn:hover{background:var(--bg-sunken);border-color:var(--line);color:var(--ink)}
#menuBtn{display:none}
.ver{font:600 11.5px var(--font-mono);color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.gh{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:7px 11px;font:600 12.5px var(--font-mono)}
.gh:hover{border-color:var(--line-strong);background:var(--bg-sunken)}
.gh .star{color:var(--accent)}
html[data-theme="dark"] .i-sun{display:block}
html[data-theme="dark"] .i-moon{display:none}
html[data-theme="light"] .i-sun{display:none}

/* ---------- layout ---------- */
.shell{
  display:grid;grid-template-columns:258px minmax(0,1fr) 208px;gap:46px;
  max-width:1420px;margin:0 auto;padding:34px 28px 0;
}
.sidebar{position:sticky;top:60px;height:calc(100dvh - 60px);overflow-y:auto;
  padding:6px 18px 60px 0;scrollbar-width:thin}
.content{max-width:810px;width:100%;margin:0 auto;padding-bottom:90px}
.toc{position:sticky;top:60px;height:calc(100dvh - 60px);overflow-y:auto;padding:10px 0 60px 6px;font-size:13px}
.toc-title{font:600 10.5px var(--font-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin:0 0 10px 14px}
.toc a{display:block;padding:5px 0 5px 14px;color:var(--ink-2);text-decoration:none;border-left:2px solid var(--line)}
.toc a:hover{color:var(--ink)}
.toc a.active{color:var(--accent);border-left-color:var(--accent);font-weight:550}

/* ---------- sidebar nav ---------- */
.nav-group{margin-bottom:4px}
.nav-group summary{
  list-style:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  padding:8px 10px;border-radius:8px;user-select:none;
  font:600 11px var(--font-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);
}
.nav-group summary::-webkit-details-marker{display:none}
.nav-group summary:hover{color:var(--ink);background:var(--bg-sunken)}
.nav-group summary .chev{transition:transform .2s}
.nav-group:not([open]) summary .chev{transform:rotate(-90deg)}
.nav-group ul{list-style:none;margin:2px 0 12px 12px;padding:0;border-left:1px solid var(--line)}
.nav-group ul a{
  display:block;margin-left:-1.5px;padding:5.5px 12px;border-left:2px solid transparent;
  font-size:13.5px;color:var(--ink-2);text-decoration:none;border-radius:0 7px 7px 0;
}
.nav-group ul a:hover{color:var(--ink);background:var(--bg-sunken)}
.nav-group ul a.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:550}

/* ---------- hero ---------- */
#overview{padding-top:26px}
#overview > *{animation:rise .6s cubic-bezier(.2,.7,.3,1) both}
#overview > *:nth-child(2){animation-delay:.05s}
#overview > *:nth-child(3){animation-delay:.1s}
#overview > *:nth-child(4){animation-delay:.15s}
#overview > *:nth-child(5){animation-delay:.22s}
#overview > *:nth-child(6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:600 10.5px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;
  padding:4px 11px;border-radius:999px;border:1px solid var(--line);
  color:var(--ink-2);background:var(--bg-raised)}
.pill.hot{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
h1{
  font-family:var(--font-display);font-optical-sizing:auto;font-weight:600;
  font-size:clamp(46px,6vw,68px);line-height:1.02;letter-spacing:-.025em;margin:20px 0 16px;
}
.hdot{color:var(--accent)}
.lede{font-size:17.5px;line-height:1.65;color:var(--ink-2);max-width:58ch}
.lede em{font-family:var(--font-display);font-style:italic;font-size:1.05em;color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:26px 0 30px}
.btn{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 18px;
  border-radius:11px;font:600 14px var(--font-sans);cursor:pointer;text-decoration:none;
  border:1px solid var(--line);background:var(--bg-raised);color:var(--ink);transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.cmd{font-family:var(--font-mono);font-weight:500;font-size:13px;background:var(--bg-raised)}
.btn.cmd .ps1{color:var(--accent);font-weight:700}
.btn.cmd svg{color:var(--ink-3)}
.btn.cmd.done svg{color:var(--accent)}

/* ---------- demo card ---------- */
.demo-card,.theme-demo{
  border:1px solid var(--line);background:var(--bg-raised);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;
}
.demo-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:11px 14px;border-bottom:1px solid var(--line)}
.live{width:8px;height:8px;border-radius:50%;background:var(--c1);animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 var(--accent-line)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.demo-title{font:500 12px var(--font-mono);color:var(--ink-2)}
.seg{margin-left:auto;display:flex;gap:2px;background:var(--bg-sunken);border:1px solid var(--line);border-radius:10px;padding:3px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;
  font:550 12.5px var(--font-sans);color:var(--ink-2);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--bg-raised);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.demo-body{padding:10px 12px 2px}
.demo-chart{position:relative;cursor:crosshair}
.demo-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:10px 14px;border-top:1px solid var(--line);
  font:500 10.5px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}

/* hero svg */
.hero-svg{display:block;width:100%;height:auto}
.hero-svg .grid-l{stroke:var(--line)}
.hero-svg .axis{stroke:var(--line-strong)}
.hero-svg .ax{fill:var(--ink-3);font:500 10.5px var(--font-mono)}
.hero-svg .ln{stroke:var(--c1);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.hero-svg .ar{fill:var(--c1);fill-opacity:.13;opacity:0;transition:opacity .35s}
.hero-svg.t-area .ar{opacity:1}
.hero-svg .bar{fill:var(--c1);opacity:.92;transition:opacity .12s;transform-box:fill-box;transform-origin:50% 100%}
.hero-svg .dot{fill:var(--c1);opacity:.85;transform-box:fill-box;transform-origin:center}
.hero-svg .pl1{fill:var(--c1)}
.hero-svg .pl2{fill:var(--c1);opacity:.5;transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.5}80%,100%{transform:scale(3.4);opacity:0}}
.hero-svg .xh{stroke:var(--ink-3);stroke-dasharray:3 4;opacity:0;transition:opacity .12s}
.hero-svg .xh.show{opacity:.75}
.hero-svg .xd{fill:var(--bg-raised);stroke:var(--accent);stroke-width:2.5;opacity:0;transition:opacity .12s}
.hero-svg .xd.show{opacity:1}
.hero-svg .seg{transition:opacity .12s}
.hero-svg .ring{fill:none;stroke:var(--line)}
.hero-svg .spoke{stroke:var(--line)}
.hero-svg .rp{fill:var(--c1);fill-opacity:.18;stroke:var(--c1);stroke-width:2;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.hero-svg .rdot{fill:var(--bg-raised);stroke:var(--c1);stroke-width:2}
.hero-svg .dtotal{fill:var(--ink);font:600 24px var(--font-display);text-anchor:middle}
.hero-svg .dsub{fill:var(--ink-3);font:500 9.5px var(--font-mono);text-anchor:middle;letter-spacing:.14em;text-transform:uppercase}
.hero-svg.anim .ln{animation:drawIn 1s .2s cubic-bezier(.4,0,.2,1) both}
.hero-svg.anim .ar{animation:fadeIn .7s .55s both}
.hero-svg.anim .bar{animation:grow .55s calc(var(--i)*35ms + .1s) cubic-bezier(.2,.7,.3,1) both}
.hero-svg.anim .dot{animation:pop .4s calc(var(--i)*25ms + .15s) both}
.hero-svg.anim .seg{animation:segIn .7s calc(var(--i)*70ms + .1s) ease both}
.hero-svg.anim .rp{animation:pop2 .55s .25s both}
.hero-svg.anim .rdot{animation:pop .4s calc(var(--i)*40ms + .3s) both}
@keyframes drawIn{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes pop{from{transform:scale(0);opacity:0}}
@keyframes pop2{from{transform:scale(.55);opacity:0}}
@keyframes segIn{from{stroke-dasharray:0 999}}

/* tooltip */
.tip{position:absolute;z-index:6;pointer-events:none;background:var(--ink);color:var(--bg);
  border-radius:9px;padding:7px 11px;font:500 12px/1.5 var(--font-mono);white-space:nowrap;
  opacity:0;transform:translate(-50%,calc(-100% - 14px));transition:opacity .12s;box-shadow:0 8px 22px -8px rgba(0,0,0,.4)}
.tip.show{opacity:1}
.tip.below{transform:translate(-50%,18px)}
.tip-t{opacity:.6;font-size:10px;text-transform:uppercase;letter-spacing:.09em}
.tip-v{display:flex;align-items:center;gap:7px;font-weight:700}
.tip-v i{width:8px;height:8px;border-radius:2.5px;background:var(--accent)}
.delta{font-style:normal;font-weight:500;font-size:11px;margin-left:5px;color:#8FD6A0}
.delta.down{color:#FF9B8A}
.delta.dim{opacity:.6;color:inherit}

/* ---------- stats ---------- */
.stats{display:flex;margin-top:26px;border:1px solid var(--line);border-radius:14px;background:var(--bg-raised);overflow:hidden}
.stat{flex:1;padding:16px 20px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat-n{display:block;font-family:var(--font-display);font-optical-sizing:auto;font-weight:600;font-size:26px;letter-spacing:-.01em;line-height:1.15}
.stat-l{font:500 10.5px var(--font-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}

/* ---------- sections ---------- */
section{padding:54px 0 6px;scroll-margin-top:78px}
.sec-kicker{font:600 11.5px var(--font-mono);text-transform:uppercase;letter-spacing:.11em;color:var(--accent);margin-bottom:10px}
h2{font-family:var(--font-display);font-optical-sizing:auto;font-weight:560;font-size:clamp(26px,3vw,32px);letter-spacing:-.015em;margin:0 0 12px}
.sec-lede{color:var(--ink-2);font-size:15.5px;line-height:1.7;max-width:64ch;margin:0 0 26px}
.hint{margin-top:18px;font:400 13px/1.6 var(--font-mono);color:var(--ink-2);border-left:2px solid var(--accent-line);padding-left:12px}

/* ---------- code blocks ---------- */
.codeblock{border:1px solid #2B2820;background:var(--code-bg);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.codeblock + .codeblock{margin-top:18px}
.cb-head{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.dots{display:inline-flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:#3B382D}
.cb-label{font:500 11px var(--font-mono);letter-spacing:.06em;color:#8A8574}
.cb-tabs{margin-left:auto;display:flex;gap:2px;background:rgba(255,255,255,.07);padding:3px;border-radius:8px}
.cb-tabs button{border:0;background:transparent;padding:4px 10px;border-radius:6px;cursor:pointer;
  font:500 11.5px var(--font-mono);color:#948F7D}
.cb-tabs button.on{background:rgba(255,255,255,.14);color:#EDE8D8}
.copy-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;cursor:pointer;
  border:1px solid rgba(255,255,255,.16);color:#B9B3A0;font:500 11px var(--font-mono);
  padding:4px 9px;border-radius:7px}
.copy-btn:hover{color:#fff;border-color:rgba(255,255,255,.35)}
.copy-btn .i-check{display:none;color:#8FD6A0}
.copy-btn.done .i-copy{display:none}
.copy-btn.done .i-check{display:block}
.copy-btn.done{color:#8FD6A0;border-color:rgba(143,214,160,.5)}
pre{margin:0;padding:14px 0 16px;overflow-x:auto}
pre code{display:block;counter-reset:line;font:400 12.8px/1.75 var(--font-mono);color:var(--code-ink)}
.cl{display:block;white-space:pre;padding-right:22px;counter-increment:line}
.cl::before{content:counter(line);display:inline-block;width:2.1em;margin-right:16px;text-align:right;
  color:#57534A;user-select:none}
.tk-k{color:#F78C6C}.tk-s{color:#C3E88D}.tk-n{color:#FFCB6B}.tk-c{color:#6E6A5B;font-style:italic}.tk-f{color:#7CDCE0}.tk-p{color:#FF8A5C}.tk-dim{color:#7D7867}

/* ---------- feature spec rows ---------- */
.spec{border-top:1px solid var(--line)}
.spec-row{display:grid;grid-template-columns:52px 1fr auto;gap:18px;align-items:baseline;
  padding:17px 10px;border-bottom:1px solid var(--line);transition:background .15s;border-radius:6px}
.spec-row:hover{background:var(--accent-soft)}
.spec-num{font:500 12px var(--font-mono);color:var(--ink-3);transition:color .15s}
.spec-row:hover .spec-num{color:var(--accent)}
.spec-title{font-weight:600;font-size:15.5px}
.spec-desc{color:var(--ink-2);font-size:14px;margin-top:2px;max-width:62ch}
.spec-meta{font:500 11px var(--font-mono);color:var(--ink-3);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap}

/* ---------- gallery ---------- */
.g-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.g-card{border:1px solid var(--line);background:var(--bg-raised);border-radius:14px;padding:14px 14px 12px;
  display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;cursor:pointer;
  transition:transform .18s,border-color .18s,box-shadow .18s}
.g-card:hover{transform:translateY(-3px);border-color:var(--accent-line);box-shadow:var(--shadow)}
.w-4{grid-column:span 4}.w-2{grid-column:span 2}
.g-chart svg{display:block;width:100%;height:auto}
.g-meta{display:flex;align-items:center;gap:8px;margin-top:auto}
.g-name{font-weight:600;font-size:14px}
.g-count{font:500 10.5px var(--font-mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.g-go{margin-left:auto;color:var(--ink-3);transition:transform .18s,color .18s;display:inline-flex}
.g-card:hover .g-go{transform:translateX(3px);color:var(--accent)}

/* mini charts */
.mini{display:block;width:100%;height:auto}
.mini .ln{fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;vector-effect:non-scaling-stroke}
.mini .s1{stroke:var(--c1)}.mini .s2{stroke:var(--c2)}
.mini .ar{fill:var(--c1);fill-opacity:.14}
.mini .bar{fill:var(--c1);transform-box:fill-box;transform-origin:50% 100%}
.mini .bar.dim{fill:var(--c5);opacity:.5}
