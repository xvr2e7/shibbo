<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Board — Design Team Kanban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef0f5;
    --panel: #ffffff;
    --text: #1f2430;
    --muted: #747a8c;
    --border: #e3e6ee;
    --accent: #6c5ce7;
    --accent-light: #ece9fd;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20,20,43,0.04), 0 6px 16px rgba(20,20,43,0.06);
    --shadow-hover: 0 4px 10px rgba(20,20,43,0.08), 0 12px 28px rgba(20,20,43,0.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background:
      radial-gradient(circle at 10% 0%, #f6f0ff 0%, transparent 40%),
      radial-gradient(circle at 90% 10%, #eafaf4 0%, transparent 35%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:18px;
    padding:18px 28px;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .logo{
    width:36px;height:36px;border-radius:10px;
    background:linear-gradient(135deg,#6c5ce7,#a29bfe);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:16px;
    box-shadow:0 4px 10px rgba(108,92,231,0.35);
  }
  .board-title{
    font-size:19px;
    font-weight:800;
    outline:none;
    padding:4px 6px;
    border-radius:8px;
    min-width:80px;
  }
  .board-title:hover, .board-title:focus{
    background:var(--accent-light);
  }
  .board-sub{
    font-size:12.5px;
    color:var(--muted);
    margin-top:1px;
  }
  .topbar .spacer{flex:1;}

  .search-box{
    position:relative;
  }
  .search-box input{
    width:220px;
    padding:9px 12px 9px 32px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#fff;
    font-size:13.5px;
    font-family:inherit;
    outline:none;
    transition:box-shadow .15s, border-color .15s;
  }
  .search-box input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-light);
  }
  .search-box svg{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;color:var(--muted);
  }

  .btn{
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-weight:600;
    font-size:13.5px;
    border-radius:10px;
    padding:9px 14px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:var(--accent);
    color:#fff;
    box-shadow:0 4px 12px rgba(108,92,231,0.35);
  }
  .btn-primary:hover{background:#5d4ce0;}
  .btn-ghost{
    background:#fff;
    color:var(--text);
    border:1px solid var(--border);
  }
  .btn-ghost:hover{background:#f6f7fb;}

  .avatars{
    display:flex;
  }
  .avatars .avatar{
    margin-left:-8px;
    border:2px solid #fff;
  }
  .avatars .avatar:first-child{margin-left:0;}

  /* ---------- Board ---------- */
  .board-wrap{
    flex:1;
    overflow-x:auto;
    padding:22px 28px 36px;
  }
  .board{
    display:flex;
    gap:18px;
    align-items:flex-start;
    min-height:100%;
  }
  .column{
    background:rgba(255,255,255,0.65);
    border:1px solid var(--border);
    border-radius:var(--radius);
    width:290px;
    flex:0 0 290px;
    display:flex;
    flex-direction:column;
    max-height:calc(100vh - 150px);
    backdrop-filter:blur(6px);
  }
  .column-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:14px 14px 10px;
  }
  .column-dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 auto;
  }
  .column-title{
    font-weight:700;
    font-size:14px;
    flex:1;
    outline:none;
    border-radius:6px;
    padding:2px 4px;
  }
  .column-title:hover, .column-title:focus{background:rgba(108,92,231,0.1);}
  .column-count{
    background:#fff;
    border:1px solid var(--border);
    color:var(--muted);
    font-size:11.5px;
    font-weight:700;
    padding:1px 7px;
    border-radius:999px;
  }
  .column-menu-btn{
    background:transparent;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:2px 4px;
    border-radius:6px;
  }
  .column-menu-btn:hover{background:rgba(0,0,0,0.06); color:var(--text);}

  .cards-list{
    list-style:none;
    margin:0;
    padding:4px 10px 10px;
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:40px;
  }
  .cards-list.drag-over{
    background:rgba(108,92,231,0.06);
    border-radius:10px;
  }

  .card{
    background:var(--panel);
    border-radius:12px;
    padding:12px 13px 11px;
    box-shadow:var(--shadow);
    cursor:grab;
    border-left:4px solid #c9cce0;
    transition:box-shadow .15s ease, transform .1s ease;
  }
  .card:hover{box-shadow:var(--shadow-hover); transform:translateY(-1px);}
  .card.dragging{opacity:0.4;}
  .card-title{
    font-size:13.5px;
    font-weight:600;
    margin:0 0 8px;
    line-height:1.4;
    word-break:break-word;
  }
  .card-desc{
    font-size:12px;
    color:var(--muted);
    margin:0 0 10px;
    line-height:1.4;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-meta{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .badge{
    font-size:10.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    letter-spacing:.2px;
  }
  .badge.low{background:#e3fbee; color:#0f9d58;}
  .badge.medium{background:#fff4e0; color:#c9810a;}
  .badge.high{background:#feeaea; color:#e03b3b;}
  .due{
    font-size:11px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:3px;
  }
  .due.overdue{color:#e03b3b; font-weight:600;}
  .card-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
  }
  .avatar{
    width:24px;height:24px;
    border-radius:50%;
    color:#fff;
    font-size:10.5px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }

  .add-card-btn{
    margin:2px 10px 12px;
    background:transparent;
    border:1.5px dashed var(--border);
    color:var(--muted);
    border-radius:10px;
    padding:9px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    text-align:left;
    transition:background .15s, color .15s, border-color .15s;
  }
  .add-card-btn:hover{
    background:var(--accent-light);
    color:var(--accent);
    border-color:var(--accent);
  }

  .add-column{
    width:270px;
    flex:0 0 270px;
    align-self:flex-start;
  }
  .add-column-btn{
    width:100%;
    background:rgba(255,255,255,0.5);
    border:1.5px dashed var(--border);
    border-radius:var(--radius);
    padding:14px;
    font-weight:700;
    font-size:13.5px;
    color:var(--muted);
    cursor:pointer;
  }
  .add-column-btn:hover{color:var(--accent); border-color:var(--accent); background:var(--accent-light);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(20,20,35,0.45);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-overlay.hidden{display:none;}
  .modal{
    background:#fff;
    border-radius:16px;
    width:100%;
    max-width:440px;
    max-height:92vh;
    overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
    padding:22px 22px 18px;
  }
  .modal h2{
    margin:0 0 16px;
    font-size:17px;
  }
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field input[type=text],
  .field input[type=date],
  .field textarea,
  .field select{
    width:100%;
    padding:9px 10px;
    border-radius:9px;
    border:1px solid var(--border);
    font-family:inherit;
    font-size:13.5px;
    outline:none;
    background:#fbfbfe;
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-light);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .row2{
    display:flex;
    gap:12px;
  }
  .row2 .field{flex:1;}

  .label-swatches{
    display:flex;
    gap:8px;
    margin-top:2px;
  }
  .swatch{
    width:26px;height:26px;border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
    display:flex;align-items:center;justify-content:center;
    transition:transform .1s;
  }
  .swatch:hover{transform:scale(1.1);}
  .swatch.selected{border-color:#1f2430;}
  .swatch.none{background:#fff; border:2px solid var(--border); color:var(--muted); font-size:11px;}

  .modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
    gap:10px;
  }
  .modal-actions .right{display:flex; gap:8px;}
  .btn-danger{
    background:#fff;
    color:#e03b3b;
    border:1px solid #f3c6c6;
  }
  .btn-danger:hover{background:#fff0f0;}

  ::-webkit-scrollbar{height:10px; width:9px;}
  ::-webkit-scrollbar-thumb{background:#d6d9e6; border-radius:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">SB</div>
    <div>
      <div class="board-title" id="boardTitle" contenteditable="true" spellcheck="false">Design Team Board</div>
      <div class="board-sub">Studio workflow · drag cards to update status</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="searchInput" type="text" placeholder="Search cards or people…">
  </div>
  <button class="btn btn-ghost" id="resetBtn" title="Reset to sample data">↺ Reset</button>
</div>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<!-- Card Modal -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Edit card</h2>
    <form id="cardForm">
      <div class="field">
        <label>Title</label>
        <input type="text" id="f_title" required placeholder="e.g. Design onboarding flow">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="f_desc" placeholder="Add more detail…"></textarea>
      </div>
      <div class="row2">
        <div class="field">
          <label>Assignee</label>
          <input type="text" id="f_assignee" placeholder="e.g. Mia Chen">
        </div>
        <div class="field">
          <label>Priority</label>
          <select id="f_priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Due date</label>
          <input type="date" id="f_due">
        </div>
        <div class="field">
          <label>Column</label>
          <select id="f_column"></select>
        </div>
      </div>
      <div class="field">
        <label>Label color</label>
        <div class="label-swatches" id="labelSwatches"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteCardBtn">Delete</button>
        <div class="right">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save card</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "studioKanbanData_v1";

  const PRIORITY_LABELS = { low: "Low", medium: "Medium", high: "High" };
  const LABEL_COLORS = {
    none:   "#c9cce0",
    purple: "#8b5cf6",
    blue:   "#3b82f6",
    pink:   "#ec4899",
    green:  "#10b981",
    amber:  "#f59e0b"
  };
  const AVATAR_PALETTE = ["#6c5ce7","#00b894","#0984e3","#e17055","#d63031","#00cec9","#fd79a8","#fdcb6e","#636e72"];

  function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

  function seedData(){
    const colIds = { backlog: uid("col"), todo: uid("col"), progress: uid("col"), review: uid("col"), done: uid("col") };
    const cards = {};
    function addCard(colId, title, desc, assignee, priority, due, label){
      const id = uid("card");
      cards[id] = { id, title, desc: desc||"", assignee: assignee||"", priority: priority||"medium", due: due||"", label: label||"none", columnId: colId };
      return id;
    }
    const c1 = addCard(colIds.backlog, "Explore new color palette", "Look into accessible, warmer tones for the rebrand.", "Mia Chen", "low", "", "purple");
    const c2 = addCard(colIds.backlog, "Research competitor sites", "Audit 5 competitor landing pages for layout patterns.", "Theo Park", "medium", "", "blue");
    const c3 = addCard(colIds.backlog, "Collect customer interview notes", "", "Ava Smith", "low", "", "none");

    const c4 = addCard(colIds.todo, "Design mobile nav", "Simplify hamburger menu, add quick actions.", "Ava Smith", "high", daysFromNow(3), "blue");
    const c5 = addCard(colIds.todo, "Icon set v2", "Redraw 24 product icons at 2px stroke.", "Leo Martins", "medium", daysFromNow(6), "green");

    const c6 = addCard(colIds.progress, "Landing page hero redesign", "New headline, illustration, and CTA testing.", "Mia Chen", "high", daysFromNow(2), "pink");
    const c7 = addCard(colIds.progress, "Dashboard component library", "Buttons, inputs, tables in Figma.", "Sam Okafor", "medium", daysFromNow(5), "purple");

    const c8 = addCard(colIds.review, "Style guide update", "Typography scale + spacing tokens.", "Ava Smith", "medium", daysFromNow(1), "amber");

    const c9 = addCard(colIds.done, "Logo refresh", "Finalized monogram + wordmark.", "Theo Park", "low", daysFromNow(-2), "green");
    const c10 = addCard(colIds.done, "Onboarding illustrations", "Set of 6 custom illustrations delivered.", "Leo Martins", "low", daysFromNow(-5), "none");

    return {
      title: "Design Team Board",
      columns: [
        { id: colIds.backlog,  title: "Backlog",     color: "#b2b8d6", cardIds: [c1,c2,c3] },
        { id: colIds.todo,     title: "To Do",       color: "#3b82f6", cardIds: [c4,c5] },
        { id: colIds.progress, title: "In Progress", color: "#f59e0b", cardIds: [c6,c7] },
        { id: colIds.review,   title: "Review",      color: "#8b5cf6", cardIds: [c8] },
        { id: colIds.done,     title: "Done",        color: "#10b981", cardIds: [c9,c10] }
      ],
      cards
    };
  }

  function daysFromNow(n){
    const d = new Date();
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0,10);
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return seedData();
  }

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  let state = loadState();
  let editingCardId = null;
  let currentDraggedId = null;

  const boardEl = document.getElementById("board");
  const boardTitleEl = document.getElementById("boardTitle");
  const searchInput = document.getElementById("searchInput");
  const modalOverlay = document.getElementById("modalOverlay");
  const cardForm = document.getElementById("cardForm");
  const f_title = document.getElementById("f_title");
  const f_desc = document.getElementById("f_desc");
  const f_assignee = document.getElementById("f_assignee");
  const f_priority = document.getElementById("f_priority");
  const f_due = document.getElementById("f_due");
  const f_column = document.getElementById("f_column");
  const labelSwatches = document.getElementById("labelSwatches");
  const deleteCardBtn = document.getElementById("deleteCardBtn");
  const modalTitle = document.getElementById("modalTitle");

  boardTitleEl.textContent = state.title || "Design Team Board";
  boardTitleEl.addEventListener("blur", ()=>{
    state.title = boardTitleEl.textContent.trim() || "Untitled Board";
    boardTitleEl.textContent = state.title;
    saveState();
  });
  boardTitleEl.addEventListener("keydown", e=>{
    if(e.key === "Enter"){ e.preventDefault(); boardTitleEl.blur(); }
  });

  function initials(name){
    if(!name) return "?";
    const parts = name.trim().split(/\s+/);
    return ((parts[0]||"")[0] + ((parts[1]||"")[0]||"")).toUpperCase();
  }
  function avatarColor(name){
    let hash = 0;
    for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
    return AVATAR_PALETTE[Math.abs(hash) % AVATAR_PALETTE.length];
  }
  function formatDue(dateStr){
    if(!dateStr) return "";
    const d = new Date(dateStr + "T00:00:00");
    const opts = { month: "short", day: "numeric" };
    return d.toLocaleDateString(undefined, opts);
  }
  function isOverdue(dateStr){
    if(!dateStr) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(dateStr + "T00:00:00");
    return d < today;
  }

  function render(){
    const query = searchInput.value.trim().toLowerCase();
    boardEl.innerHTML = "";

    state.columns.forEach(col=>{
      const colEl = document.createElement("div");
      colEl.className = "column";
      colEl.dataset.columnId = col.id;

      const header = document.createElement("div");
      header.className = "column-header";
      header.innerHTML = `
        <span class="column-dot" style="background:${col.color}"></span>
        <div class="column-title" contenteditable="true" spellcheck="false">${escapeHtml(col.title)}</div>
        <span class="column-count">${col.cardIds.length}</span>
        <button class="column-menu-btn" title="Delete column">✕</button>
      `;
      const titleEl = header.querySelector(".column-title");
      titleEl.addEventListener("blur", ()=>{
        col.title = titleEl.textContent.trim() || "Untitled";
        titleEl.textContent = col.title;
        saveState();
      });
      titleEl.addEventListener("keydown", e=>{
        if(e.key==="Enter"){ e.preventDefault(); titleEl.blur(); }
      });
      header.querySelector(".column-menu-btn").addEventListener("click", ()=>{
        if(state.columns.length <= 1){ alert("You need at least one column."); return; }
        if(confirm(`Delete column "${col.title}" and all its cards?`)){
          col.cardIds.forEach(cid=> delete state.cards[cid]);
          state.columns = state.columns.filter(c=>c.id !== col.id);
          saveState();
          render();
        }
      });

      const list = document.createElement("ul");
      list.className = "cards-list";
      list.dataset.columnId = col.id;

      col.cardIds.forEach(cardId=>{
        const card = state.cards[cardId];
        if(!card) return;
        if(query){
          const hay = (card.title + " " + card.desc + " " + card.assignee).toLowerCase();
          if(!hay.includes(query)) return;
        }
        list.appendChild(createCardEl(card));
      });

      list.addEventListener("dragover", e=>{
        e.preventDefault();
        list.classList.add("drag-over");
        const afterEl = getDragAfterElement(list, e.clientY);
        const dragging = document.querySelector(".card.dragging");
        if(!dragging) return;
        if(afterEl == null){
          list.appendChild(dragging);
        }else{
          list.insertBefore(dragging, afterEl);
        }
      });
      list.addEventListener("dragleave", (e)=>{
        if(e.target === list) list.classList.remove("drag-over");
      });
      list.addEventListener("drop", e=>{
        e.preventDefault();
        list.classList.remove("drag-over");
        syncStateFromDOM();
        saveState();
        updateCounts();
      });

      const addBtn = document.createElement("button");
      addBtn.className = "add-card-btn";
      addBtn.textContent = "+ Add a card";
      addBtn.addEventListener("click", ()=> openModal(null, col.id));

      colEl.appendChild(header);
      colEl.appendChild(list);
      colEl.appendChild(addBtn);
      boardEl.appendChild(colEl);
    });

    const addColWrap = document.createElement("div");
    addColWrap.className = "add-column";
    const addColBtn = document.createElement("button");
    addColBtn.className = "add-column-btn";
    addColBtn.textContent = "+ Add column";
    addColBtn.addEventListener("click", ()=>{
      const name = prompt("Column name:");
      if(name && name.trim()){
        state.columns.push({ id: uid("col"), title: name.trim(), color: "#9aa0c4", cardIds: [] });
        saveState();
        render();
      }
    });
    addColWrap.appendChild(addColBtn);
    boardEl.appendChild(addColWrap);
  }

  function createCardEl(card){
    const li = document.createElement("li");
    li.className = "card";
    li.draggable = true;
    li.dataset.id = card.id;
    li.style.borderLeftColor = LABEL_COLORS[card.label] || LABEL_COLORS.none;

    const dueHtml = card.due
      ? `<span class="due ${isOverdue(card.due) ? 'overdue' : ''}">📅 ${formatDue(card.due)}</span>`
      : "";

    li.innerHTML = `
      <p class="card-title">${escapeHtml(card.title)}</p>
      ${card.desc ? `<p class="card-desc">${escapeHtml(card.desc)}</p>` : ""}
      <div class="card-meta">
        <span class="badge ${card.priority}">${PRIORITY_LABELS[card.priority]}</span>
        ${dueHtml}
      </div>
      <div class="card-footer">
        <span></span>
        ${card.assignee ? `<span class="avatar" style="background:${avatarColor(card.assignee)}" title="${escapeHtml(card.assignee)}">${initials(card.assignee)}</span>` : "<span></span>"}
      </div>
    `;

    li.addEventListener("click", ()=> openModal(card.id, card.columnId));
    li.addEventListener("dragstart", ()=>{
      li.classList.add("dragging");
      currentDraggedId = card.id;
    });
    li.addEventListener("dragend", ()=>{
      li.classList.remove("dragging");
      document.querySelectorAll(".cards-list").forEach(l=>l.classList.remove("drag-over"));
      syncStateFromDOM();
      saveState();
      updateCounts();
    });

    return li;
  }

  function getDragAfterElement(container, y){
    const els = [...container.querySelectorAll(".card:not(.dragging)")];
    return els.reduce((closest, child)=>{
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height/2;
      if(offset < 0 && offset > closest.offset){
        return { offset, element: child };
      }else{
        return closest;
      }
    }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
  }

  function syncStateFromDOM(){
    document.querySelectorAll(".cards-list").forEach(list=>{
      const colId = list.dataset.columnId;
      const col = state.columns.find(c=>c.id === colId);
      if(!col) return;
      const ids = [...list.querySelectorAll(".card")].map(el=>el.dataset.id);
      col.cardIds = ids;
      ids.forEach(id=>{
        if(state.cards[id]) state.cards[id].columnId = colId;
      });
    });
  }

  function updateCounts(){
    document.querySelectorAll(".column").forEach(colEl=>{
      const colId = colEl.dataset.columnId;
      const col = state.columns.find(c=>c.id === colId);
      const countEl = colEl.querySelector(".column-count");
      if(col && countEl) countEl.textContent = col.cardIds.length;
    });
  }

  // ---------- Modal ----------
  function populateColumnSelect(){
    f_column.innerHTML = state.columns.map(c=>`<option value="${c.id}">${escapeHtml(c.title)}</option>`).join("");
  }

  function populateSwatches(selected){
    labelSwatches.innerHTML = "";
    Object.keys(LABEL_COLORS).forEach(key=>{
      const sw = document.createElement("div");
      sw.className = "swatch" + (key === "none" ? " none" : "") + (key === selected ? " selected" : "");
      sw.dataset.label = key;
      if(key === "none"){
        sw.textContent = "×";
      }else{
        sw.style.background = LABEL_COLORS[key];
      }
      sw.addEventListener("click", ()=>{
        labelSwatches.querySelectorAll(".swatch").forEach(s=>s.classList.remove("selected"));
        sw.classList.add("selected");
      });
      labelSwatches.appendChild(sw);
    });
  }

  function openModal(cardId, defaultColumnId){
    editingCardId = cardId;
    populateColumnSelect();

    if(cardId){
      const card = state.cards[cardId];
      modalTitle.textContent = "Edit card";
      f_title.value = card.title;
      f_desc.value = card.desc;
      f_assignee.value = card.assignee;
      f_priority.value = card.priority;
      f_due.value = card.due;
      f_column.value = card.columnId;
      populateSwatches(card.label);
      deleteCardBtn.style.display = "inline-flex";
    }else{
      modalTitle.textContent = "New card";
      f_title.value = "";
      f_desc.value = "";
      f_assignee.value = "";
      f_priority.value = "medium";
      f_due.value = "";
      f_column.value = defaultColumnId || (state.columns[0] && state.columns[0].id);
      populateSwatches("none");
      deleteCardBtn.style.display = "none";
    }

    modalOverlay.classList.remove("hidden");
    setTimeout(()=> f_title.focus(), 50);
  }

  function closeModal(){
    modalOverlay.classList.add("hidden");
    editingCardId = null;
  }

  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", e=>{
    if(e.target === modalOverlay) closeModal();
  });
  document.addEventListener("keydown", e=>{
    if(e.key === "Escape" && !modalOverlay.classList.contains("hidden")) closeModal();
  });

  cardForm.addEventListener("submit", e=>{
    e.preventDefault();
    const selectedSwatch = labelSwatches.querySelector(".swatch.selected");
    const labelVal = selectedSwatch ? selectedSwatch.dataset.label : "none";
    const targetColumnId = f_column.value;

    if(editingCardId){
      const card = state.cards[editingCardId];
      const oldColId = card.columnId;
      card.title = f_title.value.trim() || "Untitled";
      card.desc = f_desc.value.trim();
      card.assignee = f_assignee.value.trim();
      card.priority = f_priority.value;
      card.due = f_due.value;
      card.label = labelVal;
      card.columnId = targetColumnId;

      if(oldColId !== targetColumnId){
        const oldCol = state.columns.find(c=>c.id === oldColId);
        const newCol = state.columns.find(c=>c.id === targetColumnId);
        if(oldCol) oldCol.cardIds = oldCol.cardIds.filter(id=>id !== card.id);
        if(newCol) newCol.cardIds.push(card.id);
      }
    }else{
      const id = uid("card");
      state.cards[id] = {
        id,
        title: f_title.value.trim() || "Untitled",
        desc: f_desc.value.trim(),
        assignee: f_assignee.value.trim(),
        priority: f_priority.value,
        due: f_due.value,
        label: labelVal,
        columnId: targetColumnId
      };
      const col = state.columns.find(c=>c.id === targetColumnId);
      if(col) col.cardIds.push(id);
    }

    saveState();
    closeModal();
    render();
  });

  deleteCardBtn.addEventListener("click", ()=>{
    if(!editingCardId) return;
    if(!confirm("Delete this card?")) return;
    const card = state.cards[editingCardId];
    const col = state.columns.find(c=>c.id === card.columnId);
    if(col) col.cardIds = col.cardIds.filter(id=>id !== card.id);
    delete state.cards[editingCardId];
    saveState();
    closeModal();
    render();
  });

  searchInput.addEventListener("input", render);

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(confirm("Reset the board to the sample data? This will erase current changes.")){
      state = seedData();
      saveState();
      boardTitleEl.textContent = state.title;
      render();
    }
  });

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str == null ? "" : str;
    return div.innerHTML;
  }

  render();
})();
</script>
</body>
</html>
