<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio North — Design board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f9f8f5;--paper:#fff;--ink:#252421;--muted:#6d6962;--line:#eae7e1;--accent:#f7c7bc;--radius:14px;--sidebar:224px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px "DM Sans",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid #995c4e;outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
svg.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.sidebar{background:#fffefa;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:26px 16px 16px;position:sticky;top:0;height:100dvh;z-index:3}
.brand{display:flex;align-items:center;gap:10px;padding:0 7px;margin-bottom:40px}
.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--accent);color:#302420}
.logo svg{width:23px;height:23px}
.brand strong{display:block;font:800 15px Manrope,sans-serif;letter-spacing:-.35px}
.brand small,.profile small{color:var(--muted);font-size:11px}
.nav-title{margin:0 10px 9px;font-size:10px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.nav-group{display:grid;gap:4px;margin-bottom:28px}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border:0;border-radius:8px;background:none;text-align:left;color:#605c55;font-weight:600}
.nav-item:hover,.nav-item.active{background:#f8eee9;color:#342822}
.nav-item.active{font-weight:800}
.nav-item .icon{width:17px;height:17px}
.project-dot,.status-dot{width:8px;height:8px;border-radius:50%;flex:none}
.project-dot{margin:0 5px;background:var(--dot)}
.profile{display:flex;align-items:center;gap:9px;padding:14px 4px 2px;margin-top:auto;border-top:1px solid var(--line)}
.profile strong{display:block;font-size:12px}
.avatar{display:inline-grid;place-items:center;flex:none;width:25px;height:25px;border-radius:50%;font-size:9px;font-weight:800;color:#38332e;background:var(--avatar,#e8e1d7)}
.profile .avatar{width:34px;height:34px;font-size:11px}
main{min-width:0}
.topbar{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:12px;background:#fffefa}
.crumb,.top-actions,.team,.heading-actions,.tools,.tool-actions,.view-switch{display:flex;align-items:center;gap:10px}
.crumb{color:var(--muted);font-size:12px}
.crumb strong{color:var(--ink)}
.crumb .icon{width:13px;height:13px}
.top-actions{gap:15px}
.team{gap:0;padding-left:5px}
.team .avatar{border:2px solid #fffefa;width:29px;height:29px;margin-left:-5px}
.team .avatar:last-child{background:#f2efe9}
.icon-btn,.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);border-radius:8px;background:var(--paper);min-height:35px;padding:0 11px;font-weight:700;font-size:12px;white-space:nowrap}
.icon-btn{width:35px;padding:0}
.icon-btn:hover,.btn:hover{background:#f0ede7}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#342420;padding:0 13px}
.btn.primary:hover{background:#f4b6a8;border-color:#f4b6a8}
.btn .icon{width:16px;height:16px}
.mobile-nav{display:none}
.content{max-width:1600px;margin:0 auto;padding:31px 32px 35px}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:24px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;background:#f6ebe5;color:#825345;border-radius:5px;padding:4px 7px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;font-size:9px}
.eyebrow .icon{width:12px;height:12px}
h1{font:800 clamp(30px,4vw,44px)/1.1 Manrope,sans-serif;letter-spacing:-.055em;margin:9px 0 6px}
.heading p{color:var(--muted);margin:0;font-size:13px;line-height:1.5}
.heading-actions{padding-bottom:2px}
.tools{justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:19px;gap:12px}
.view-switch{gap:17px;align-self:stretch}
.view{position:relative;display:flex;align-items:center;gap:6px;padding:0 2px 11px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:700}
.view .icon{width:15px;height:15px}
.view[aria-selected=true]{color:var(--ink)}
.view[aria-selected=true]::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;background:#b97465;border-radius:2px}
.tool-actions{padding-bottom:8px;gap:7px}
.search{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);height:34px;padding:0 8px;border-radius:8px;color:var(--muted)}
.search .icon{width:15px;height:15px}
.search input{border:0;background:none;min-width:0;width:108px;color:var(--ink);font-size:12px;outline:none}
.search:focus-within{outline:2px solid #995c4e;outline-offset:2px}
.search input:focus-visible{outline:none}
.filter-wrap{position:relative}
.filter-menu{position:absolute;right:0;top:41px;z-index:5;width:185px;border:1px solid var(--line);border-radius:10px;background:white;padding:12px;box-shadow:0 8px 25px #2f25151a}
.filter-menu label{display:block;font-size:11px;font-weight:800;margin:0 0 5px}
.filter-menu select{width:100%;margin-bottom:9px}
.filter-menu select:last-child{margin-bottom:0}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;align-items:start}
.lane{background:#f1efe9;border:1px solid #edeae3;border-radius:var(--radius);padding:0 8px 8px;min-width:0;min-height:130px;transition:background .15s;--status:#a6a29a}
.lane.over{background:#f5e2dc;border-color:#bf8b7f}
.lane-header{display:flex;align-items:center;gap:7px;padding:9px 2px 8px;min-height:44px}
.status-dot{background:var(--status);margin-left:3px}
.lane-header h2{font-size:12px;margin:0;font-weight:800;white-space:nowrap}
.count{font-size:10px;font-weight:800;color:var(--muted);background:#e7e4dd;border-radius:5px;min-width:18px;text-align:center;padding:2px 4px}
.lane-header button{margin-left:auto}
.quiet{border:0;background:transparent;display:grid;place-items:center;width:24px;height:24px;padding:0;border-radius:5px;color:#68645e}
.quiet:hover{background:#ebe8e1;color:var(--ink)}
.quiet .icon{width:15px;height:15px}
.cards{display:grid;gap:8px}
.card{min-width:0;background:#fff;border:1px solid #eae7e1;border-radius:11px;padding:10px;box-shadow:0 2px 3px #39312406;cursor:pointer}
.card:hover{border-color:#c7aca2}
.card.dragging{opacity:.45}
.card-top,.card-foot{display:flex;align-items:center;justify-content:space-between;gap:5px}
.tag{display:inline-block;font-size:9px;line-height:1.2;font-weight:800;border-radius:4px;padding:4px 6px;background:var(--tag);color:var(--tag-ink);max-width:100%;overflow-wrap:anywhere}
.card h3{font:800 13px/1.35 Manrope,sans-serif;letter-spacing:-.18px;margin:6px 0 4px;overflow-wrap:anywhere}
.card p{font-size:11px;color:var(--muted);line-height:1.45;margin:0 0 10px;overflow-wrap:anywhere}
.card-foot{border-top:1px solid #f0eee9;padding-top:8px;margin-top:8px}
.due,.card-meta{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:10px;white-space:nowrap}
.due .icon,.card-meta .icon{width:12px;height:12px}
.card-meta{gap:3px}
.card-meta .avatar{margin-left:4px}
.cover{display:block;width:100%;height:auto;aspect-ratio:2.65;object-fit:cover;border-radius:6px;margin:6px 0 8px}
.add-lane{display:flex;align-items:center;gap:5px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:700;padding:8px 4px 2px;width:100%;text-align:left;margin-top:4px;border-radius:5px}
.add-lane:hover{color:var(--ink)}
.add-lane .icon{width:14px;height:14px}
.board.list{grid-template-columns:1fr}
.list .cards{grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr))}
.list .lane{min-height:0}
.empty{color:var(--muted);font-size:11px;padding:8px}
.board-note{color:var(--muted);font-size:11px;margin:14px 0 0}
dialog{border:1px solid var(--line);border-radius:16px;padding:22px;width:min(460px,calc(100% - 28px));color:var(--ink);background:#fffefa;box-shadow:0 16px 55px #241f1930}
dialog::backdrop{background:#211b1655}
.dialog-head,.dialog-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dialog-head h2{font:800 22px Manrope,sans-serif;margin:0}
form{display:grid;gap:12px;margin-top:15px}
form label{display:grid;gap:5px;font-weight:700;font-size:12px}
form input,textarea,select{color:var(--ink);background:#fff;border:1px solid #e2ded6;border-radius:7px;padding:8px;min-width:0}
textarea{resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dialog-actions{margin-top:4px;justify-content:flex-end}
.delete{color:#942e23;margin-right:auto}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 15px;background:#302923;color:#fff;border-radius:8px;z-index:10;font-size:12px;max-width:calc(100% - 40px)}
[hidden]{display:none!important}
@media(max-width:1180px){:root{--sidebar:184px}.topbar{padding:0 20px}.content{padding-left:20px;padding-right:20px}.board{gap:9px}.lane{padding-left:6px;padding-right:6px}}
@media(max-width:1020px){.board:not(.list){grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:710px){.shell{display:block}.sidebar{display:none;position:fixed;top:55px;left:0;bottom:0;width:215px;height:auto;box-shadow:8px 0 24px #28231b19}.sidebar.open{display:flex}.topbar{height:55px;padding:0 14px}.mobile-nav{display:inline-flex}.content{padding:22px 14px}.crumb{gap:6px}.top-actions{gap:6px}.heading{align-items:flex-start}}
@media(max-width:440px){.board:not(.list){grid-template-columns:1fr}.heading{flex-wrap:wrap;gap:12px}.tools{gap:6px;flex-wrap:wrap}.view-switch{gap:10px}.search input{width:74px}.team .avatar{width:26px;height:26px}}
</style>
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg">
<defs>
<symbol id="i-mark" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19" stroke-width="2.4"/></symbol>
<symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-16v16"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.2 2.2 4.8-5"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></symbol>
<symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10m-7 5h4"/><circle cx="9" cy="7" r="1.5" fill="white"/><circle cx="15" cy="12" r="1.5" fill="white"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.4"/></symbol>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="15" rx="2"/><path d="M8 3v6m8-6v6M4 11h16"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
</defs>
</svg>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
    <div class="brand">
      <div class="logo"><svg class="icon" aria-hidden="true"><use href="#i-mark"/></svg></div>
      <div><strong>Studio North</strong><small>Team workspace</small></div>
    </div>
    <p class="nav-title">Workspace</p>
    <nav class="nav-group" aria-label="Task views">
      <button class="nav-item active" data-scope="all" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-board"/></svg>Design board</button>
      <button class="nav-item" data-scope="mine"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg>My tasks</button>
      <button class="nav-item" data-scope="done"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Completed</button>
    </nav>
    <p class="nav-title">Projects</p>
    <nav class="nav-group" id="project-nav" aria-label="Projects"></nav>
    <div class="profile"><span class="avatar" style="--avatar:#eed2b4">MC</span><div><strong>Maya Chen</strong><small>Design lead</small></div></div>
  </aside>
  <main>
    <header class="topbar">
      <div class="crumb"><button class="icon-btn mobile-nav" id="mobile-nav" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button><span>Workspace</span><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg><strong id="crumb-title">Design board</strong></div>
      <div class="top-actions"><div class="team" id="team" aria-label="Design team"></div></div>
    </header>
    <div class="content">
      <section class="heading" aria-labelledby="page-title">
        <div><span class="eyebrow"><svg class="icon" aria-hidden="true"><use href="#i-mark"/></svg>Design workspace</span><h1 id="page-title">Design board</h1><p id="page-description">See what’s planned, in progress, and ready for feedback.</p></div>
        <div class="heading-actions"><button class="btn primary" id="new-task"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>New task</button></div>
      </section>
      <div class="tools">
        <div class="view-switch" aria-label="Layout">
          <button class="view" id="board-view" aria-pressed="true" aria-selected="true"><svg class="icon" aria-hidden="true"><use href="#i-board"/></svg>Board</button>
          <button class="view" id="list-view" aria-pressed="false" aria-selected="false"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>List</button>
        </div>
        <div class="tool-actions">
          <label class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Find a task…" aria-label="Search tasks"></label>
          <div class="filter-wrap">
            <button class="btn" id="filter-toggle" aria-expanded="false" aria-controls="filter-menu"><svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg><span>Filter</span></button>
            <div class="filter-menu" id="filter-menu" hidden>
              <label for="filter-person">Assignee</label><select id="filter-person"></select>
              <label for="filter-project">Project</label><select id="filter-project"></select>
            </div>
          </div>
        </div>
      </div>
      <div class="board" id="board" aria-label="Tasks by status"></div>
      <p class="board-note">Drag tasks between columns, or open a task to change its status.</p>
    </div>
  </main>
</div>

<dialog id="editor" aria-labelledby="editor-title">
  <div class="dialog-head"><h2 id="editor-title">New task</h2><button class="icon-btn" id="close-editor" aria-label="Close editor"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <form id="task-form">
    <label>Task name<input name="title" maxlength="90" required autofocus></label>
    <label>Description<textarea name="description" rows="3" maxlength="500"></textarea></label>
    <div class="form-row"><label>Project<select name="project"></select></label><label>Status<select name="status"></select></label></div>
    <div class="form-row"><label>Assignee<select name="person"></select></label><label>Due date<input name="due" type="date"></label></div>
    <div class="dialog-actions"><button class="btn delete" type="button" id="delete-task" hidden>Delete task</button><button class="btn" type="button" id="cancel-edit">Cancel</button><button class="btn primary" type="submit">Save task</button></div>
  </form>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const $ = id => document.getElementById(id);
const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const people = {
  MC:{name:'Maya Chen',color:'#eed2b4'},
  AR:{name:'Avery Rivera',color:'#dccff0'},
  JL:{name:'Jordan Lee',color:'#cde3d6'},
  SK:{name:'Sam Kim',color:'#f2c8bf'}
};
const projects = {
  brand:{name:'Brand refresh',color:'#8e5a79',bg:'#f3e4ed',ink:'#764564'},
  web:{name:'Website',color:'#c87955',bg:'#fae9de',ink:'#934d32'},
  system:{name:'Design system',color:'#5c907a',bg:'#e2eee5',ink:'#366852'}
};
const statuses = {
  todo:{name:'To do',color:'#9b978d'},
  doing:{name:'In progress',color:'#db9b55'},
  review:{name:'In review',color:'#a48bc7'},
  done:{name:'Done',color:'#73a78b'}
};
const seed = [
  ['01','Explore packaging concepts','Collect references and sketch three directions for the first round.','brand','todo','AR','2026-11-24'],
  ['02','Mobile navigation audit','Map pain points in the current menu and propose simpler flows.','web','todo','JL','2026-11-26'],
  ['03','Document icon guidelines','Define sizing, stroke weights, and when to use filled icons.','system','todo','SK','2026-11-27'],
  ['04','Homepage hero explorations','Try a few compositions and test how they adapt to smaller screens.','web','doing','MC','2026-11-20','hero'],
  ['05','Type scale tokens','Build the responsive scale and document the naming convention.','system','doing','JL','2026-11-23'],
  ['06','Brand moodboard','Review the palette, photography, and type references before choosing a direction.','brand','review','AR','2026-11-19','mood'],
  ['07','Button component states','Check focus, hover, disabled, and loading states in Figma.','system','review','SK','2026-11-20'],
  ['08','Project kickoff deck','Share the brief, timeline, and review milestones with the team.','brand','done','MC','2026-11-13'],
  ['09','Update color primitives','Sync the core palette across design tokens and the Figma library.','system','done','JL','2026-11-16'],
  ['10','Footer wireframes','Confirm the content hierarchy and utility links across breakpoints.','web','done','AR','2026-11-17']
].map(([id,title,description,project,status,person,due,cover]) => ({id,title,description,project,status,person,due,cover}));
const covers = {
  hero: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120"><rect width="320" height="120" fill="#e8c2b5"/><rect x="34" y="14" width="252" height="118" rx="7" fill="#fff9ef"/><path d="M34 32h252" stroke="#e7d9ca"/><circle cx="45" cy="23" r="2" fill="#b67460"/><circle cx="52" cy="23" r="2" fill="#d6a18e"/><circle cx="59" cy="23" r="2" fill="#d6a18e"/><text x="50" y="66" font-family="Georgia" font-size="19" fill="#49372d">Make room</text><text x="50" y="86" font-family="Georgia" font-style="italic" font-size="19" fill="#49372d">for good things.</text><rect x="50" y="97" width="43" height="9" rx="4" fill="#bc7865"/><rect x="171" y="42" width="103" height="69" rx="3" fill="#e8b299"/><path d="M171 104c26-39 45-42 61-19s32 18 42 6v20H171z" fill="#9b5848"/><circle cx="235" cy="64" r="15" fill="#f4d49f"/><path d="M208 111q38-38 66-12v12z" fill="#c87761"/></svg>`,
  mood: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120"><rect width="320" height="120" fill="#eee3ce"/><rect x="10" y="10" width="91" height="100" rx="3" fill="#273d35"/><circle cx="55" cy="60" r="32" fill="none" stroke="#c9bb8f"/><path d="M55 32v56M27 60h56M36 41l38 38m0-38L36 79" stroke="#c9bb8f"/><rect x="107" y="10" width="106" height="100" rx="3" fill="#d89072"/><path d="M107 99q24-60 49-38t57-36v85H107z" fill="#a95845"/><path d="M107 107q30-24 61-9t45-24v36H107z" fill="#683f35"/><circle cx="143" cy="39" r="15" fill="#efbb8d"/><rect x="219" y="10" width="91" height="30" rx="3" fill="#baa878"/><rect x="219" y="45" width="91" height="30" rx="3" fill="#d2a48b"/><rect x="219" y="80" width="91" height="30" rx="3" fill="#f8f1e2"/><text x="251" y="102" font-family="Georgia" font-size="19" fill="#4a4235">Aa</text></svg>`
};
let tasks = seed;
try {
  const saved = JSON.parse(localStorage.getItem('studio-north-board-v1'));
  if (Array.isArray(saved)) tasks = saved.filter(t => t && statuses[t.status] && projects[t.project]);
} catch {}
let scope = 'all', layout = 'board', editing = null, dragged = null, toastTimer;
const board = $('board'), editor = $('editor'), fields = $('task-form').elements;
function avatar(id) {
  const person = people[id];
  return person ? `<span class="avatar" style="--avatar:${person.color}" title="${person.name}" aria-label="${person.name}">${id}</span>` : '';
}
$('team').innerHTML = Object.keys(people).map(avatar).join('');
$('project-nav').innerHTML = Object.entries(projects).map(([id,p]) => `<button class="nav-item" data-scope="${id}"><span class="project-dot" style="--dot:${p.color}"></span>${p.name}</button>`).join('');
function options(obj, start) {
  return (start ? `<option value="">${start}</option>` : '') + Object.entries(obj).map(([id,item]) => `<option value="${id}">${item.name}</option>`).join('');
}
fields.project.innerHTML = options(projects);
fields.status.innerHTML = options(statuses);
fields.person.innerHTML = options(people,'Unassigned');
$('filter-person').innerHTML = options(people,'Everyone') + '<option value="unassigned">Unassigned</option>';
$('filter-project').innerHTML = options(projects,'All projects');
function store(message) {
  try { localStorage.setItem('studio-north-board-v1', JSON.stringify(tasks)); }
  catch { message += ' Browser storage is unavailable.'; }
  $('toast').textContent = message;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').hidden = true, 3000);
}
function shortDate(date) {
  const parsed = new Date(date + 'T12:00:00');
  return Number.isNaN(parsed.getTime()) ? '' : new Intl.DateTimeFormat('en',{month:'short',day:'numeric'}).format(parsed);
}
function card(t) {
  const p = projects[t.project], name = escapeHTML(t.title);
  const cover = Object.hasOwn(covers,t.cover) ? `<img class="cover" alt="${t.cover === 'hero' ? 'Warm-toned homepage mockup' : 'Brand palette and illustration study'}" src="data:image/svg+xml,${encodeURIComponent(covers[t.cover]).replace(/'/g,'%27')}">` : '';
  return `<article class="card" tabindex="0" draggable="true" data-id="${escapeHTML(t.id)}" aria-label="${name}">
    <div class="card-top"><span class="tag" style="--tag:${p.bg};--tag-ink:${p.ink}">${p.name}</span><button class="quiet" data-edit aria-label="Edit ${name}">${icon('more')}</button></div>
    <h3>${name}</h3>${cover}${t.description ? `<p>${escapeHTML(t.description)}</p>` : ''}
    <div class="card-foot"><span class="due">${t.due ? `${icon('calendar')}${shortDate(t.due)}` : 'No due date'}</span><span class="card-meta">${avatar(t.person) || 'Unassigned'}</span></div>
  </article>`;
}
function render() {
  const query = $('search').value.trim().toLowerCase();
  const person = $('filter-person').value, project = $('filter-project').value;
  const visible = tasks.filter(t =>
    (scope === 'all' || scope === 'mine' && t.person === 'MC' || scope === 'done' && t.status === 'done' || scope === t.project) &&
    (!person || (person === 'unassigned' ? !t.person : t.person === person)) &&
    (!project || t.project === project) &&
    (!query || `${t.title} ${t.description} ${projects[t.project].name}`.toLowerCase().includes(query))
  );
  board.classList.toggle('list', layout === 'list');
  $('board-view').setAttribute('aria-pressed', layout === 'board');
  $('list-view').setAttribute('aria-pressed', layout === 'list');
  $('board-view').setAttribute('aria-selected', layout === 'board');
  $('list-view').setAttribute('aria-selected', layout === 'list');
  $('filter-toggle').querySelector('span').textContent = `Filter${person || project ? ` (${Number(!!person)+Number(!!project)})` : ''}`;
  board.innerHTML = Object.entries(statuses).filter(([id]) => scope !== 'done' || id === 'done').map(([id,s]) => {
    const group = visible.filter(t => t.status === id);
    return `<section class="lane" data-status="${id}" style="--status:${s.color}" aria-labelledby="lane-${id}">
      <header class="lane-header"><span class="status-dot"></span><h2 id="lane-${id}">${s.name}</h2><span class="count" aria-label="${group.length} tasks">${group.length}</span><button class="quiet" data-add="${id}" aria-label="Add task to ${s.name}">${icon('plus')}</button></header>
      <div class="cards">${group.length ? group.map(card).join('') : '<div class="empty">No tasks to show</div>'}</div>
      <button class="add-lane" data-add="${id}">${icon('plus')}Add task</button>
    </section>`;
  }).join('');
}
function openEditor(task, status) {
  editing = task ? task.id : null;
  $('editor-title').textContent = task ? 'Edit task' : 'New task';
  fields.title.value = task?.title ?? '';
  fields.description.value = task?.description ?? '';
  fields.project.value = task?.project ?? (projects[scope] ? scope : $('filter-project').value || 'brand');
  fields.status.value = task?.status ?? status ?? (scope === 'done' ? 'done' : 'todo');
  const filteredPerson = $('filter-person').value;
  fields.person.value = task?.person ?? (scope === 'mine' ? 'MC' : people[filteredPerson] ? filteredPerson : '');
  fields.due.value = task?.due ?? '';
  $('delete-task').hidden = !task;
  editor.showModal();
}
$('new-task').onclick = () => openEditor();
$('close-editor').onclick = $('cancel-edit').onclick = () => editor.close();
editor.addEventListener('click', e => {
  if (e.target !== editor) return;
  const r = editor.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) editor.close();
});
$('task-form').onsubmit = e => {
  e.preventDefault();
  const title = fields.title.value.trim();
  if (!title) { fields.title.setCustomValidity('Enter a task name.'); fields.title.reportValidity(); return; }
  const updated = {title,description:fields.description.value.trim(),project:fields.project.value,status:fields.status.value,person:fields.person.value,due:fields.due.value};
  if (editing) Object.assign(tasks.find(t => t.id === editing), updated);
  else tasks.push({id:globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random()}`, ...updated});
  editor.close();
  store(editing ? 'Task updated.' : 'Task added.');
  render();
};
fields.title.oninput = () => fields.title.setCustomValidity('');
editor.addEventListener('close', () => fields.title.setCustomValidity(''));
$('delete-task').onclick = () => {
  if (!confirm('Delete this task? This cannot be undone.')) return;
  tasks = tasks.filter(t => t.id !== editing);
  editor.close();
  store('Task deleted.');
  render();
};
board.addEventListener('click', e => {
  const add = e.target.closest('[data-add]');
  if (add) { openEditor(null,add.dataset.add); return; }
  const item = e.target.closest('.card');
  if (item) openEditor(tasks.find(t => t.id === item.dataset.id));
});
board.addEventListener('keydown', e => {
  if (e.target.classList.contains('card') && ['Enter',' '].includes(e.key)) {
    e.preventDefault();
    openEditor(tasks.find(t => t.id === e.target.dataset.id));
  }
});
board.addEventListener('dragstart', e => {
  const item = e.target.closest('.card');
  if (!item) return;
  dragged = item.dataset.id;
  e.dataTransfer.setData('text/plain', dragged);
  e.dataTransfer.effectAllowed = 'move';
  item.classList.add('dragging');
});
function clearDrag() {
  dragged = null;
  board.querySelectorAll('.over,.dragging').forEach(el => el.classList.remove('over','dragging'));
}
board.addEventListener('dragend',clearDrag);
board.addEventListener('dragover',e => {
  const lane = e.target.closest('.lane');
  if (!lane || !dragged) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  board.querySelectorAll('.over').forEach(el => {if (el !== lane) el.classList.remove('over');});
  lane.classList.add('over');
});
board.addEventListener('dragleave',e => {
  const lane = e.target.closest('.lane');
  if (lane && !lane.contains(e.relatedTarget)) lane.classList.remove('over');
});
board.addEventListener('drop',e => {
  const lane = e.target.closest('.lane');
  if (!lane || !dragged) return;
  e.preventDefault();
  const task = tasks.find(t => t.id === dragged);
  clearDrag();
  if (!task || task.status === lane.dataset.status) return;
  task.status = lane.dataset.status;
  store(`Task moved to ${statuses[task.status].name}.`);
  render();
});
$('search').oninput = render;
$('filter-person').onchange = $('filter-project').onchange = render;
$('board-view').onclick = () => { layout = 'board'; render(); };
$('list-view').onclick = () => { layout = 'list'; render(); };
function showFilter(show) {
  $('filter-menu').hidden = !show;
  $('filter-toggle').setAttribute('aria-expanded', show);
}
$('filter-toggle').onclick = () => showFilter($('filter-menu').hidden);
document.addEventListener('click', e => { if (!e.target.closest('.filter-wrap')) showFilter(false); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('filter-menu').hidden) {
    showFilter(false);
    $('filter-toggle').focus();
  }
});
function showNav(show) {
  $('sidebar').classList.toggle('open', show);
  $('mobile-nav').setAttribute('aria-expanded',show);
}
$('mobile-nav').onclick = () => showNav(!$('sidebar').classList.contains('open'));
$('sidebar').addEventListener('click',e => {
  const button = e.target.closest('[data-scope]');
  if (!button) return;
  scope = button.dataset.scope;
  document.querySelectorAll('[data-scope]').forEach(b => {
    b.classList.toggle('active', b === button);
    if (b === button) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  $('search').value = $('filter-person').value = $('filter-project').value = '';
  $('crumb-title').textContent = $('page-title').textContent = button.textContent.trim();
  $('page-description').textContent = ({
    all:'See what’s planned, in progress, and ready for feedback.',
    mine:'Tasks assigned to you, from to do through done.',
    done:'Finished work across the design team.'
  })[scope] ?? `Track design work for ${projects[scope].name.toLowerCase()}.`;
  showNav(false);
  render();
});
render();
</script>
</body>
</html>
