<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Dashboard · Tuesday, Nov 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --ink:#14202b; --muted:#6a7885; --line:#e4e9ee;
    --brand:#0f766e; --brand-soft:#e0f2f0;
    --blue:#2563eb; --blue-soft:#e8effd;
    --amber:#b45309; --amber-soft:#fef3c7;
    --red:#b91c1c; --red-soft:#fde8e8;
    --green:#15803d; --green-soft:#e3f5e8;
    --gray-soft:#eef1f4;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
  header h1{font-size:17px;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  .clock{text-align:right}
  .clock b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
  .clock span{color:var(--muted);font-size:12px}
  main{max-width:1320px;margin:0 auto;padding:24px 28px 40px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .stat .label{color:var(--muted);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
  .stat .value{font-size:30px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
  .stat .note{font-size:12px;color:var(--muted)}
  .stat.alert .value{color:var(--red)}
  .grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
  .col{display:flex;flex-direction:column;gap:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .card-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .card-head h2{font-size:15px;font-weight:600}
  .count{background:var(--gray-soft);color:var(--muted);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600}
  select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink)}
  .appt{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center;position:relative}
  .appt:last-child{border-bottom:0}
  .appt .time{font-variant-numeric:tabular-nums;font-weight:600}
  .appt .time small{display:block;color:var(--muted);font-weight:400;font-size:12px}
  .appt .who{font-weight:600}
  .appt .meta{color:var(--muted);font-size:13px}
  .appt.live{background:#f3fbfa}
  .appt.live::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
  .appt.faded .who{color:var(--muted)}
  .now-line{display:flex;align-items:center;gap:8px;padding:0 18px;height:20px;color:var(--red);font-size:11px;font-weight:700;letter-spacing:.05em}
  .now-line::after{content:"";flex:1;height:2px;background:var(--red);opacity:.6}
  .badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
  .b-done{background:var(--gray-soft);color:var(--muted)}
  .b-progress{background:var(--brand-soft);color:var(--brand)}
  .b-waiting{background:var(--amber-soft);color:var(--amber)}
  .b-scheduled{background:var(--blue-soft);color:var(--blue)}
  .b-noshow{background:var(--red-soft);color:var(--red)}
  .b-cancelled{background:var(--gray-soft);color:var(--muted);text-decoration:line-through}
  .noshow{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
  .noshow:last-child{border-bottom:0}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
  .noshow .info{flex:1;min-width:0}
  .noshow .who{font-weight:600}
  .noshow .meta{color:var(--muted);font-size:12.5px}
  button{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--ink)}
  button:hover{border-color:var(--brand);color:var(--brand)}
  button:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  button.done{background:var(--green-soft);color:var(--green);border-color:transparent;cursor:default}
  .rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
  .room{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:84px}
  .room .name{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;margin-bottom:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
  .room.occupied{background:var(--brand-soft);border-color:#b7dfda}
  .room.occupied .dot{background:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.2)}
  .room.cleaning{background:var(--amber-soft);border-color:#f3dc92}
  .room.cleaning .dot{background:#d97706}
  .room .pt{font-size:13px}
  .room .sm{color:var(--muted);font-size:12px}
  .legend{display:flex;gap:14px;padding:0 18px 14px;color:var(--muted);font-size:12px}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  .empty{padding:24px;text-align:center;color:var(--muted)}
  @media(max-width:980px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
  @media(max-width:520px){main{padding:16px}header{padding:12px 16px}.appt{grid-template-columns:54px 1fr}.appt .badge{grid-column:2;justify-self:start}}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">+</div>
  <div>
    <h1>Riverside Family Clinic</h1>
    <div class="sub">Appointments dashboard</div>
  </div>
  <div class="spacer"></div>
  <div class="clock">
    <b id="clock">10:42 AM</b>
    <span>Tuesday, November 10, 2026</span>
  </div>
</header>

<main>
  <section class="stats" id="stats" aria-label="Summary"></section>

  <div class="grid">
    <section class="card" aria-labelledby="sched-h">
      <div class="card-head">
        <h2 id="sched-h">Today's schedule</h2>
        <span class="count" id="sched-count"></span>
        <div class="spacer"></div>
        <label class="sub" for="prov" style="color:var(--muted)">Provider</label>
        <select id="prov"></select>
      </div>
      <div id="schedule"></div>
    </section>

    <div class="col">
      <section class="card" aria-labelledby="ns-h">
        <div class="card-head">
          <h2 id="ns-h">No-shows today</h2>
          <span class="count" id="ns-count"></span>
        </div>
        <div id="noshows"></div>
      </section>

      <section class="card" aria-labelledby="rm-h">
        <div class="card-head">
          <h2 id="rm-h">Rooms</h2>
          <span class="count" id="rm-count"></span>
        </div>
        <div class="rooms" id="rooms"></div>
        <div class="legend">
          <span><i style="background:var(--brand)"></i>In use</span>
          <span><i style="background:var(--green)"></i>Available</span>
          <span><i style="background:#d97706"></i>Cleaning</span>
        </div>
      </section>
    </div>
  </div>
</main>

<script>
// Demo data. "NOW" is fixed so the sample schedule always looks mid-morning.
const NOW = 10*60 + 42;
const t = (h,m)=>h*60+m;
const appts = [
  {s:t(8,0), d:30, pt:"Maria Alvarez",  pr:"Dr. Patel",  type:"Annual physical",    room:"Exam 1", st:"done"},
  {s:t(8,15),d:30, pt:"James Okoye",    pr:"Dr. Nguyen", type:"Follow-up",          room:"Exam 2", st:"done"},
  {s:t(8,45),d:30, pt:"Lena Fischer",   pr:"NP Brooks",  type:"Vaccination",        room:"Exam 4", st:"done"},
  {s:t(9,0), d:30, pt:"Tom Reyes",      pr:"Dr. Patel",  type:"Blood pressure check",room:"Exam 1",st:"noshow", phone:"(555) 014-2290"},
  {s:t(9,0), d:30, pt:"Aisha Rahman",   pr:"Dr. Nguyen", type:"Sick visit",         room:"Exam 2", st:"done"},
  {s:t(9,30),d:30, pt:"Peter Lindgren", pr:"NP Brooks",  type:"Wound care",         room:"Procedure", st:"done"},
  {s:t(9,45),d:30, pt:"Grace Kim",      pr:"Dr. Patel",  type:"Follow-up",          room:"Exam 3", st:"done"},
  {s:t(10,0),d:30, pt:"Ivan Petrov",    pr:"Dr. Nguyen", type:"Lab review",         room:"Exam 3", st:"noshow", phone:"(555) 019-7741"},
  {s:t(10,15),d:30,pt:"Daniel Osei",    pr:"Dr. Nguyen", type:"Physical",           room:"Exam 2", st:"progress"},
  {s:t(10,30),d:30,pt:"Sofia Marino",   pr:"Dr. Patel",  type:"Consultation",       room:"Exam 1", st:"progress"},
  {s:t(10,30),d:20,pt:"Henry Walsh",    pr:"NP Brooks",  type:"Flu shot",           room:"Exam 4", st:"progress"},
  {s:t(10,45),d:30,pt:"Priya Natarajan",pr:"Dr. Nguyen", type:"Follow-up",          room:"Exam 2", st:"waiting"},
  {s:t(11,0),d:45, pt:"Carlos Mendes",  pr:"Dr. Patel",  type:"Minor procedure",    room:"Procedure", st:"scheduled"},
  {s:t(11,15),d:30,pt:"Emma Larsson",   pr:"NP Brooks",  type:"Sick visit",         room:"Exam 4", st:"scheduled"},
  {s:t(11,30),d:30,pt:"Olivia Grant",   pr:"Dr. Nguyen", type:"Annual physical",    room:"Exam 2", st:"cancelled"},
  {s:t(13,0),d:30, pt:"Marcus Bell",    pr:"Dr. Patel",  type:"Follow-up",          room:"Exam 1", st:"scheduled"},
  {s:t(13,30),d:30,pt:"Yuki Tanaka",    pr:"Dr. Nguyen", type:"Consultation",       room:"Exam 2", st:"scheduled"},
  {s:t(14,15),d:45,pt:"Fatima Haddad",  pr:"Dr. Patel",  type:"Annual physical",    room:"Exam 1", st:"scheduled"},
  {s:t(15,0),d:30, pt:"Noah Peterson",  pr:"NP Brooks",  type:"Vaccination",        room:"Exam 4", st:"scheduled"},
];
const roomList = ["Exam 1","Exam 2","Exam 3","Exam 4","Procedure","Lab / Draw"];
const cleaning = {"Exam 3":"Turnover since 10:35"};

const fmt = m => { const h=Math.floor(m/60), mm=String(m%60).padStart(2,"0"); return `${(h+11)%12+1}:${mm}`; };
const ampm = m => m>=720 ? "PM":"AM";
const initials = n => n.split(" ").map(w=>w[0]).join("");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const labels = {done:"Completed",progress:"In progress",waiting:"Checked in",scheduled:"Upcoming",noshow:"No-show",cancelled:"Cancelled"};
const cls = {done:"b-done",progress:"b-progress",waiting:"b-waiting",scheduled:"b-scheduled",noshow:"b-noshow",cancelled:"b-cancelled"};

function renderStats(){
  const total = appts.length;
  const noshow = appts.filter(a=>a.st==="noshow").length;
  const done = appts.filter(a=>a.st==="done").length;
  const upcoming = appts.filter(a=>["scheduled","waiting"].includes(a.st)).length;
  const inUse = appts.filter(a=>a.st==="progress").length;
  const held = appts.filter(a=>a.st!=="cancelled").length;
  const rate = Math.round(noshow/Math.max(1,done+noshow)*100);
  const items = [
    ["Appointments today", total, `${appts.filter(a=>a.st==="cancelled").length} cancelled`],
    ["Seen / remaining", `${done + inUse} / ${upcoming}`, `${inUse} with a provider now`],
    ["No-shows", noshow, `${rate}% of appointments due so far`, true],
    ["Rooms in use", `${inUse} / ${roomList.length}`, `${Object.keys(cleaning).length} being cleaned`],
  ];
  document.getElementById("stats").innerHTML = items.map(([l,v,n,a])=>
    `<div class="stat${a?" alert":""}"><div class="label">${l}</div><div class="value">${v}</div><div class="note">${n}</div></div>`).join("");
}

function renderSchedule(){
  const p = document.getElementById("prov").value;
  const list = appts.filter(a=>p==="all"||a.pr===p).sort((a,b)=>a.s-b.s);
  document.getElementById("sched-count").textContent = list.length;
  if(!list.length){ document.getElementById("schedule").innerHTML = '<div class="empty">No appointments.</div>'; return; }
  let html="", placed=false;
  for(const a of list){
    if(!placed && a.s>NOW){ html+=`<div class="now-line">NOW · ${fmt(NOW)} ${ampm(NOW)}</div>`; placed=true; }
    const faded = ["done","noshow","cancelled"].includes(a.st);
    html += `<div class="appt${a.st==="progress"?" live":""}${faded?" faded":""}">
      <div class="time">${fmt(a.s)}<small>${ampm(a.s)} · ${a.d}m</small></div>
      <div><div class="who">${esc(a.pt)}</div><div class="meta">${esc(a.type)} · ${esc(a.pr)} · ${esc(a.room)}</div></div>
      <span class="badge ${cls[a.st]}">${labels[a.st]}</span></div>`;
  }
  document.getElementById("schedule").innerHTML = html;
}

function renderNoShows(){
  const list = appts.filter(a=>a.st==="noshow");
  document.getElementById("ns-count").textContent = list.length;
  document.getElementById("noshows").innerHTML = list.length ? list.map((a,i)=>
    `<div class="noshow">
      <div class="avatar">${initials(a.pt)}</div>
      <div class="info"><div class="who">${esc(a.pt)}</div>
      <div class="meta">${fmt(a.s)} ${ampm(a.s)} · ${esc(a.type)} · ${esc(a.pr)}<br>${esc(a.phone)}</div></div>
      <button data-i="${i}">Reschedule</button></div>`).join("")
    : '<div class="empty">No no-shows today 🎉</div>';
  document.querySelectorAll("#noshows button").forEach(b=>b.addEventListener("click",()=>{
    b.textContent="Outreach queued"; b.className="done"; b.disabled=true;
  }));
}

function renderRooms(){
  const busy = {};
  appts.filter(a=>a.st==="progress").forEach(a=>busy[a.room]=a);
  const used = Object.keys(busy).length;
  document.getElementById("rm-count").textContent = `${used} of ${roomList.length} in use`;
  document.getElementById("rooms").innerHTML = roomList.map(r=>{
    const a = busy[r];
    if(a){
      const left = Math.max(0,a.s+a.d-NOW);
      return `<div class="room occupied"><div class="name">${r}<span class="dot"></span></div>
        <div class="pt">${esc(a.pt)}</div><div class="sm">${esc(a.pr)} · ~${left} min left</div></div>`;
    }
    if(cleaning[r]) return `<div class="room cleaning"><div class="name">${r}<span class="dot"></span></div>
        <div class="pt">Cleaning</div><div class="sm">${cleaning[r]}</div></div>`;
    const next = appts.filter(x=>x.room===r && x.s>NOW && x.st!=="cancelled").sort((x,y)=>x.s-y.s)[0];
    return `<div class="room"><div class="name">${r}<span class="dot"></span></div>
      <div class="pt">Available</div><div class="sm">${next?`Next: ${fmt(next.s)} ${ampm(next.s)}`:"No more bookings"}</div></div>`;
  }).join("");
}

const sel = document.getElementById("prov");
sel.innerHTML = '<option value="all">All providers</option>' +
  [...new Set(appts.map(a=>a.pr))].map(p=>`<option>${esc(p)}</option>`).join("");
sel.addEventListener("change", renderSchedule);

renderStats(); renderSchedule(); renderNoShows(); renderRooms();
</script>
</body>
</html>
