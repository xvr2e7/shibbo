<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riverside Family Clinic — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef2f6;
    --card: #ffffff;
    --ink: #1b2430;
    --muted: #6b7786;
    --line: #e3e8ee;
    --teal: #0f9d8f;
    --teal-dark: #0b7d72;
    --blue: #3b6fe0;
    --amber: #d98e1f;
    --green: #2a9d5c;
    --red: #e0514a;
    --gray: #8a93a1;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20,30,45,0.04), 0 8px 24px rgba(20,30,45,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    font-family: 'Inter', system-ui, Arial, sans-serif;
    color: var(--ink);
    min-height:100vh;
  }
  .app{
    max-width: 1320px;
    margin: 0 auto;
    padding: 20px 24px 60px;
  }

  /* Header */
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand .logo{
    width:44px;height:44px;border-radius:12px;
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-weight:800; font-size:18px;
    box-shadow: var(--shadow);
  }
  .brand h1{
    font-size:19px;
    margin:0;
    font-weight:800;
    letter-spacing:-0.2px;
  }
  .brand p{
    margin:0;
    font-size:12.5px;
    color: var(--muted);
  }

  .clock-box{
    text-align:right;
  }
  .clock-box .time{
    font-size: 22px;
    font-weight:800;
    letter-spacing: -0.5px;
  }
  .clock-box .date{
    font-size:12.5px;
    color: var(--muted);
  }

  .search-wrap{
    flex: 1 1 260px;
    max-width: 340px;
    position:relative;
  }
  .search-wrap input{
    width:100%;
    padding: 10px 14px 10px 36px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    font-family: inherit;
    font-size: 13.5px;
    outline:none;
    transition: border .15s;
  }
  .search-wrap input:focus{
    border-color: var(--teal);
  }
  .search-wrap svg{
    position:absolute;
    left: 11px; top:50%;
    transform: translateY(-50%);
    width:14px;height:14px;
    stroke: var(--muted);
  }

  /* Stats */
  .stats{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat-card{
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .stat-card .label{
    font-size:12px;
    color: var(--muted);
    font-weight:600;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .stat-card .value{
    font-size: 26px;
    font-weight: 800;
  }
  .stat-card .sub{
    font-size:11.5px;
    color: var(--muted);
  }
  .stat-card.accent-blue .value{color: var(--blue);}
  .stat-card.accent-teal .value{color: var(--teal-dark);}
  .stat-card.accent-amber .value{color: var(--amber);}
  .stat-card.accent-red .value{color: var(--red);}
  .stat-card.accent-green .value{color: var(--green);}

  /* Main grid */
  .main-grid{
    display:grid;
    grid-template-columns: 2.2fr 1fr;
    gap: 18px;
    align-items:start;
  }

  .card{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }

  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
  }
  .card-head h2{
    font-size:15px;
    margin:0;
    font-weight:700;
  }
  .card-head .count{
    font-size:12px;
    background: var(--bg);
    color: var(--muted);
    padding: 3px 9px;
    border-radius: 999px;
    font-weight:600;
  }

  /* Schedule table */
  .schedule-body{
    padding: 6px 8px 14px;
  }
  table.schedule{
    width:100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.schedule thead th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.4px;
    color: var(--muted);
    padding: 10px 10px;
    font-weight:700;
  }
  table.schedule tbody tr{
    border-top: 1px solid var(--line);
    transition: background .15s;
  }
  table.schedule tbody tr:hover{
    background: #f8fafc;
  }
  table.schedule tbody tr.row-current{
    background: #fff7e8;
  }
  table.schedule tbody tr.row-current:hover{
    background: #fff1d8;
  }
  table.schedule td{
    padding: 10px 10px;
    vertical-align: middle;
  }
  .time-cell .t{
    font-weight:700;
    font-size: 13.5px;
  }
  .time-cell .dur{
    font-size:11px;
    color: var(--muted);
  }
  .patient-cell .name{
    font-weight:700;
  }
  .patient-cell .meta{
    font-size:11.5px;
    color: var(--muted);
  }
  .type-tag{
    display:inline-block;
    font-size:11px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #eef1f7;
    color: #44506a;
    font-weight:600;
    white-space:nowrap;
  }
  .room-tag{
    font-size:12.5px;
    font-weight:600;
    color: var(--ink);
  }
  .doctor-cell{
    font-size:12.5px;
    color: var(--ink);
  }

  select.status-select{
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor:pointer;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
    background-repeat:no-repeat;
    background-position: right 7px center;
    background-size: 9px;
    padding-right: 22px;
  }
  .st-scheduled{ background:#e8eefc; color:var(--blue); }
  .st-checked-in{ background:#e3f6f3; color:var(--teal-dark); }
  .st-in-progress{ background:#fdf1dc; color:var(--amber); }
  .st-completed{ background:#e6f6ec; color:var(--green); }
  .st-no-show{ background:#fcebea; color:var(--red); }
  .st-cancelled{ background:#eceff3; color:var(--gray); }

  .row-actions{
    display:flex;
    gap:6px;
  }
  .icon-btn{
    border:none;
    background: var(--bg);
    width: 28px;height:28px;
    border-radius: 7px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition: background .15s, transform .1s;
  }
  .icon-btn:hover{ background:#dfe6ee; }
  .icon-btn:active{ transform: scale(0.92); }
  .icon-btn svg{ width:14px;height:14px; stroke: var(--ink); }

  /* Side panel */
  .side-panel{
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .noshow-list, .room-list{
    padding: 10px 14px 14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .noshow-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: #fff6f5;
    border: 1px solid #f6d9d7;
  }
  .noshow-item .info .name{
    font-weight:700;
    font-size:13px;
  }
  .noshow-item .info .meta{
    font-size:11.5px;
    color: var(--muted);
  }
  .pill-btn{
    font-size:11px;
    font-weight:700;
    border:none;
    background: var(--red);
    color:#fff;
    padding: 6px 10px;
    border-radius: 8px;
    cursor:pointer;
  }
  .pill-btn.ghost{
    background: transparent;
    color: var(--teal-dark);
    border: 1px solid var(--teal);
  }
  .empty-note{
    text-align:center;
    color: var(--muted);
    font-size: 12.5px;
    padding: 14px 6px;
  }

  .room-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    gap:10px;
  }
  .room-item.occupied{
    background: #f2f8fb;
    border-color:#cfe6f0;
  }
  .room-item.free{
    background: #f6f9f6;
    border-color:#dcecdc;
  }
  .room-item .rname{
    font-weight:700;
    font-size: 13px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    display:inline-block;
  }
  .dot.on{ background: var(--amber); box-shadow:0 0 0 3px rgba(217,142,31,.18);}
  .dot.off{ background: var(--green); box-shadow:0 0 0 3px rgba(42,157,92,.15);}
  .room-item .rinfo{
    font-size:11.5px;
    color: var(--muted);
    text-align:right;
  }
  .room-item .rinfo b{
    color: var(--ink);
    font-size:12.5px;
    display:block;
  }

  footer.legend{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-top: 18px;
    font-size:12px;
    color: var(--muted);
    align-items:center;
  }
  footer.legend .lg{
    display:flex;align-items:center;gap:6px;
  }
  footer.legend .sw{
    width:10px;height:10px;border-radius:3px;
  }

  @media (max-width: 980px){
    .main-grid{ grid-template-columns: 1fr; }
    .stats{ grid-template-columns: repeat(2, 1fr); }
    table.schedule thead{ display:none; }
    table.schedule, table.schedule tbody, table.schedule tr, table.schedule td{
      display:block; width:100%;
    }
    table.schedule tbody tr{
      padding: 10px 4px;
      border-radius: 10px;
    }
    .row-actions{ margin-top:6px; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <div class="logo">RF</div>
      <div>
        <h1>Riverside Family Clinic</h1>
        <p>Front Desk Dashboard</p>
      </div>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="searchInput" type="text" placeholder="Search patient or doctor…">
    </div>

    <div class="clock-box">
      <div class="time" id="clockTime">--:--:--</div>
      <div class="date" id="clockDate">Loading…</div>
    </div>
  </header>

  <section class="stats" id="statsRow"></section>

  <div class="main-grid">
    <section class="card schedule-panel">
      <div class="card-head">
        <h2>Today's Schedule</h2>
        <span class="count" id="schedCount">0 appointments</span>
      </div>
      <div class="schedule-body">
        <table class="schedule">
          <thead>
            <tr>
              <th style="width:12%">Time</th>
              <th style="width:24%">Patient</th>
              <th style="width:16%">Doctor</th>
              <th style="width:12%">Type</th>
              <th style="width:9%">Room</th>
              <th style="width:15%">Status</th>
              <th style="width:12%"></th>
            </tr>
          </thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </section>

    <aside class="side-panel">
      <div class="card">
        <div class="card-head">
          <h2>No-Shows Today</h2>
          <span class="count" id="noshowCount">0</span>
        </div>
        <div class="noshow-list" id="noshowList"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Rooms in Use</h2>
          <span class="count" id="roomCount">0 / 0</span>
        </div>
        <div class="room-list" id="roomList"></div>
      </div>
    </aside>
  </div>

  <footer class="legend">
    <span class="lg"><span class="sw" style="background:#3b6fe0"></span>Scheduled</span>
    <span class="lg"><span class="sw" style="background:#0f9d8f"></span>Checked-in</span>
    <span class="lg"><span class="sw" style="background:#d98e1f"></span>In Progress</span>
    <span class="lg"><span class="sw" style="background:#2a9d5c"></span>Completed</span>
    <span class="lg"><span class="sw" style="background:#e0514a"></span>No-show</span>
    <span class="lg"><span class="sw" style="background:#8a93a1"></span>Cancelled</span>
  </footer>

</div>

<script>
  // ---------- Sample Data ----------
  let appointments = [
    { id:1,  time:"08:00", end:"08:20", patient:"Maria Gonzalez", age:34, doctor:"Dr. Patel",  type:"Check-up",      room:"Room 1", status:"completed" },
    { id:2,  time:"08:20", end:"08:40", patient:"Tom Becker",     age:58, doctor:"Dr. Ortiz",  type:"Follow-up",     room:"Room 2", status:"completed" },
    { id:3,  time:"08:45", end:"09:15", patient:"Aisha Khan",     age:27, doctor:"Dr. Patel",  type:"Consultation",  room:"Room 1", status:"no-show" },
    { id:4,  time:"09:00", end:"09:30", patient:"Liam O'Connor",  age:9,  doctor:"Dr. Reyes",  type:"Vaccination",   room:"Room 3", status:"completed" },
    { id:5,  time:"09:30", end:"10:00", patient:"Grace Nakamura", age:71, doctor:"Dr. Ortiz",  type:"Follow-up",     room:"Room 2", status:"in-progress" },
    { id:6,  time:"09:45", end:"10:15", patient:"Daniel Weiss",   age:41, doctor:"Dr. Reyes",  type:"Physical",      room:"Room 4", status:"checked-in" },
    { id:7,  time:"10:00", end:"10:20", patient:"Sofia Marin",    age:19, doctor:"Dr. Patel",  type:"Consultation",  room:"Room 1", status:"scheduled" },
    { id:8,  time:"10:15", end:"10:45", patient:"Chidi Okafor",   age:52, doctor:"Dr. Lee",    type:"Lab Review",    room:"Lab",    status:"checked-in" },
    { id:9,  time:"10:30", end:"10:50", patient:"Ellen Brooks",   age:66, doctor:"Dr. Ortiz",  type:"Follow-up",     room:"Room 2", status:"no-show" },
    { id:10, time:"11:00", end:"11:30", patient:"Noah Kim",       age:4,  doctor:"Dr. Reyes",  type:"Check-up",      room:"Room 3", status:"scheduled" },
    { id:11, time:"11:15", end:"11:35", patient:"Priya Nair",     age:38, doctor:"Dr. Lee",    type:"Consultation",  room:"Room 4", status:"scheduled" },
    { id:12, time:"11:30", end:"12:00", patient:"Hugo Fischer",   age:47, doctor:"Dr. Patel",  type:"Physical",      room:"Room 1", status:"cancelled" },
    { id:13, time:"13:00", end:"13:30", patient:"Isabel Cruz",    age:29, doctor:"Dr. Ortiz",  type:"Consultation",  room:"Room 2", status:"scheduled" },
    { id:14, time:"13:30", end:"14:00", patient:"Marcus Webb",    age:60, doctor:"Dr. Lee",    type:"Follow-up",     room:"Room 4", status:"scheduled" },
  ];

  const allRooms = ["Room 1","Room 2","Room 3","Room 4","Lab"];

  const statusLabels = {
    "scheduled":"Scheduled",
    "checked-in":"Checked-in",
    "in-progress":"In Progress",
    "completed":"Completed",
    "no-show":"No-show",
    "cancelled":"Cancelled"
  };

  // ---------- Clock ----------
  function updateClock(){
    const now = new Date();
    document.getElementById('clockTime').textContent =
      now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    document.getElementById('clockDate').textContent =
      now.toLocaleDateString([], {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ---------- Helpers ----------
  function initials(name){
    return name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase();
  }
  function duration(a){
    return a.time + " – " + a.end;
  }

  function icon(name){
    const icons = {
      checkin: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>',
      cancel: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>'
    };
    return icons[name] || '';
  }

  // ---------- Render ----------
  function render(){
    renderStats();
    renderSchedule();
    renderNoShows();
    renderRooms();
  }

  function renderStats(){
    const total = appointments.length;
    const checkedIn = appointments.filter(a=>a.status==="checked-in"||a.status==="in-progress").length;
    const completed = appointments.filter(a=>a.status==="completed").length;
    const noshows = appointments.filter(a=>a.status==="no-show").length;
    const roomsBusy = new Set(appointments.filter(a=>a.status==="checked-in"||a.status==="in-progress").map(a=>a.room)).size;

    const cards = [
      {label:"Today's Appointments", value: total, sub: "scheduled across all doctors", cls:"accent-blue"},
      {label:"Checked-in / Active", value: checkedIn, sub: "currently with staff", cls:"accent-teal"},
      {label:"Completed", value: completed, sub: "visits finished today", cls:"accent-green"},
      {label:"No-shows", value: noshows, sub: "missed appointments", cls:"accent-red"},
      {label:"Rooms Occupied", value: roomsBusy + " / " + allRooms.length, sub: "in use right now", cls:"accent-amber"},
    ];

    document.getElementById('statsRow').innerHTML = cards.map(c => `
      <div class="stat-card ${c.cls}">
        <div class="label">${c.label}</div>
        <div class="value">${c.value}</div>
        <div class="sub">${c.sub}</div>
      </div>
    `).join('');
  }

  function renderSchedule(filterText=""){
    const body = document.getElementById('scheduleBody');
    const term = filterText.trim().toLowerCase();

    const list = appointments
      .filter(a => !term || a.patient.toLowerCase().includes(term) || a.doctor.toLowerCase().includes(term))
      .sort((a,b)=> a.time.localeCompare(b.time));

    document.getElementById('schedCount').textContent = list.length + " appointment" + (list.length===1?"":"s");

    if(list.length === 0){
      body.innerHTML = `<tr><td colspan="7"><div class="empty-note">No appointments match your search.</div></td></tr>`;
      return;
    }

    body.innerHTML = list.map(a => `
      <tr class="${a.status==='in-progress' ? 'row-current' : ''}" data-id="${a.id}">
        <td>
          <div class="time-cell">
            <div class="t">${a.time}</div>
            <div class="dur">${duration(a)}</div>
          </div>
        </td>
        <td>
          <div class="patient-cell">
            <div class="name">${a.patient}</div>
            <div class="meta">Age ${a.age}</div>
          </div>
        </td>
        <td><div class="doctor-cell">${a.doctor}</div></td>
        <td><span class="type-tag">${a.type}</span></td>
        <td><span class="room-tag">${a.room}</span></td>
        <td>
          <select class="status-select st-${a.status}" onchange="changeStatus(${a.id}, this.value)">
            ${Object.keys(statusLabels).map(s => `<option value="${s}" ${s===a.status?'selected':''}>${statusLabels[s]}</option>`).join('')}
          </select>
        </td>
        <td>
          <div class="row-actions">
            <button class="icon-btn" title="Check in" onclick="changeStatus(${a.id}, 'checked-in')">${icon('checkin')}</button>
            <button class="icon-btn" title="Cancel" onclick="changeStatus(${a.id}, 'cancelled')">${icon('cancel')}</button>
          </div>
        </td>
      </tr>
    `).join('');

    // re-apply correct colored background on selects
    document.querySelectorAll('.status-select').forEach(sel=>{
      Array.from(sel.classList).forEach(c=>{ if(c.startsWith('st-')) sel.classList.remove(c); });
      sel.classList.add('st-' + sel.value);
    });
  }

  function renderNoShows(){
    const list = appointments.filter(a => a.status === "no-show");
    const el = document.getElementById('noshowList');
    document.getElementById('noshowCount').textContent = list.length;

    if(list.length === 0){
      el.innerHTML = `<div class="empty-note">No no-shows yet. 🎉</div>`;
      return;
    }

    el.innerHTML = list.map(a => `
      <div class="noshow-item">
        <div class="info">
          <div class="name">${a.patient}</div>
          <div class="meta">${a.time} · ${a.doctor} · ${a.type}</div>
        </div>
        <button class="pill-btn" onclick="changeStatus(${a.id}, 'scheduled')">Rebook</button>
      </div>
    `).join('');
  }

  function renderRooms(){
    const active = appointments.filter(a => a.status === "checked-in" || a.status === "in-progress");
    const el = document.getElementById('roomList');
    document.getElementById('roomCount').textContent = `${new Set(active.map(a=>a.room)).size} / ${allRooms.length}`;

    el.innerHTML = allRooms.map(room => {
      const appt = active.find(a => a.room === room);
      if(appt){
        return `
          <div class="room-item occupied">
            <div class="rname"><span class="dot on"></span>${room}</div>
            <div class="rinfo">
              <b>${appt.patient}</b>
              ${appt.doctor} · ${appt.time}–${appt.end}
            </div>
          </div>`;
      } else {
        return `
          <div class="room-item free">
            <div class="rname"><span class="dot off"></span>${room}</div>
            <div class="rinfo">Available</div>
          </div>`;
      }
    }).join('');
  }

  function changeStatus(id, status){
    const a = appointments.find(x => x.id === id);
    if(a){ a.status = status; }
    render();
  }
  window.changeStatus = changeStatus;

  document.getElementById('searchInput').addEventListener('input', (e)=>{
    renderSchedule(e.target.value);
  });

  render();
</script>
</body>
</html>
