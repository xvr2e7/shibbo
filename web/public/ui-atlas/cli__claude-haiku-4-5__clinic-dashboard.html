<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
        }

        .header-info {
            text-align: right;
        }

        .date {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .time {
            font-size: 24px;
            font-weight: 600;
            color: #667eea;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 600;
        }

        .card-content {
            padding: 20px;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .room {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .room.active {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .room.empty {
            border-color: #4caf50;
            background: #f1f8f4;
        }

        .room-number {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .room-status {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .room.active .room-status {
            color: #667eea;
        }

        .room.empty .room-status {
            color: #4caf50;
        }

        .room-time {
            font-size: 11px;
            color: #999;
        }

        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .appointment {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .appointment.completed {
            opacity: 0.6;
            border-left-color: #4caf50;
        }

        .appointment.no-show {
            border-left-color: #f44336;
            background: #ffebee;
        }

        .appointment-time {
            font-weight: 600;
            color: #667eea;
            min-width: 50px;
            margin-right: 15px;
        }

        .appointment.no-show .appointment-time {
            color: #f44336;
        }

        .appointment-details {
            flex: 1;
        }

        .appointment-patient {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .appointment-info {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }

        .appointment-badge {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 10px;
        }

        .appointment.no-show .appointment-badge {
            background: #f44336;
        }

        .appointment.completed .appointment-badge {
            background: #4caf50;
        }

        .no-shows-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .no-show-item {
            padding: 12px;
            background: #ffebee;
            border-left: 4px solid #f44336;
            border-radius: 4px;
            font-size: 13px;
        }

        .no-show-patient {
            font-weight: 600;
            color: #f44336;
            margin-bottom: 3px;
        }

        .no-show-time {
            font-size: 11px;
            color: #d32f2f;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #999;
            font-size: 14px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-top: 5px;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .header-info {
                text-align: center;
            }

            .rooms-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 Clinic Dashboard</h1>
            <div class="header-info">
                <div class="date" id="date"></div>
                <div class="time" id="time"></div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div>
                <div class="card">
                    <div class="card-header">Rooms in Use</div>
                    <div class="card-content">
                        <div class="rooms-grid" id="rooms"></div>
                    </div>
                </div>

                <div class="card" style="margin-top: 25px;">
                    <div class="card-header">Today's Schedule</div>
                    <div class="card-content">
                        <div class="stats-row">
                            <div class="stat">
                                <div class="stat-number" id="totalAppointments">0</div>
                                <div class="stat-label">Total</div>
                            </div>
                            <div class="stat">
                                <div class="stat-number" id="completedCount">0</div>
                                <div class="stat-label">Completed</div>
                            </div>
                            <div class="stat">
                                <div class="stat-number" id="upcomingCount">0</div>
                                <div class="stat-label">Upcoming</div>
                            </div>
                        </div>
                        <div class="schedule-list" id="schedule"></div>
                    </div>
                </div>
            </div>

            <div>
                <div class="card">
                    <div class="card-header">No-Shows</div>
                    <div class="card-content">
                        <div class="no-shows-list" id="noShows"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const rooms = [
            { id: 1, status: 'active', appointment: 'Sarah Johnson', time: '2:30 PM - 3:00 PM' },
            { id: 2, status: 'empty' },
            { id: 3, status: 'active', appointment: 'Mike Chen', time: '2:45 PM - 3:15 PM' },
            { id: 4, status: 'empty' }
        ];

        const appointments = [
            { time: '9:00 AM', patient: 'Alice Brown', type: 'Checkup', room: 1, status: 'completed' },
            { time: '9:30 AM', patient: 'David Wilson', type: 'Consultation', room: 2, status: 'completed' },
            { time: '10:15 AM', patient: 'Emma Davis', type: 'Follow-up', room: 3, status: 'completed' },
            { time: '11:00 AM', patient: 'James Miller', type: 'Checkup', room: 1, status: 'completed' },
            { time: '2:00 PM', patient: 'Lisa Anderson', type: 'Vaccination', room: 2, status: 'completed' },
            { time: '2:30 PM', patient: 'Sarah Johnson', type: 'Checkup', room: 1, status: 'active' },
            { time: '2:45 PM', patient: 'Mike Chen', type: 'Consultation', room: 3, status: 'active' },
            { time: '3:30 PM', patient: 'Jennifer Lee', type: 'Checkup', room: 1, status: 'scheduled' },
            { time: '4:00 PM', patient: 'Robert Taylor', type: 'Physical', room: 2, status: 'scheduled' },
            { time: '4:30 PM', patient: 'Patricia White', type: 'Checkup', room: 3, status: 'scheduled' }
        ];

        const noShows = [
            { time: '10:45 AM', patient: 'George Harris' },
            { time: '1:30 PM', patient: 'Nancy Clark' }
        ];

        function updateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            document.getElementById('date').textContent = dateStr;
            document.getElementById('time').textContent = timeStr;
        }

        function renderRooms() {
            const container = document.getElementById('rooms');
            container.innerHTML = rooms.map(room => `
                <div class="room ${room.status}">
                    <div class="room-number">Room ${room.id}</div>
                    <div class="room-status">${room.status === 'active' ? '✓ In Use' : '○ Available'}</div>
                    ${room.appointment ? `<div class="room-time">${room.appointment}</div>` : ''}
                </div>
            `).join('');
        }

        function renderSchedule() {
            const container = document.getElementById('schedule');
            const now = new Date();
            const currentHour = now.getHours() + now.getMinutes() / 60;

            const completed = appointments.filter(a => a.status === 'completed').length;
            const upcoming = appointments.filter(a => a.status === 'scheduled').length;

            document.getElementById('totalAppointments').textContent = appointments.length;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('upcomingCount').textContent = upcoming;

            container.innerHTML = appointments.map(apt => `
                <div class="appointment ${apt.status}">
                    <div class="appointment-time">${apt.time}</div>
                    <div class="appointment-details">
                        <div class="appointment-patient">${apt.patient}</div>
                        <div class="appointment-info">Room ${apt.room} • ${apt.type}</div>
                    </div>
                    <div class="appointment-badge">
                        ${apt.status === 'completed' ? 'Completed' : apt.status === 'active' ? 'In Progress' : 'Scheduled'}
                    </div>
                </div>
            `).join('');
        }

        function renderNoShows() {
            const container = document.getElementById('noShows');
            if (noShows.length === 0) {
                container.innerHTML = '<div class="empty-state">No no-shows today</div>';
                return;
            }
            container.innerHTML = noShows.map(ns => `
                <div class="no-show-item">
                    <div class="no-show-patient">${ns.patient}</div>
                    <div class="no-show-time">Missed: ${ns.time}</div>
                </div>
            `).join('');
        }

        updateTime();
        renderRooms();
        renderSchedule();
        renderNoShows();

        setInterval(updateTime, 1000);
    </script>
</body>
</html>
