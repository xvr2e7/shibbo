<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguoFlow | Start Your Journey</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #46a302;
            --secondary: #1cb0f6;
            --text-dark: #4b4b4b;
            --text-light: #777777;
            --bg-light: #f7f7f7;
            --white: #ffffff;
            --border-color: #e5e5e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .signup-container {
            background: var(--white);
            width: 100%;
            max-width: 900px;
            display: flex;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        /* Left Side - Visual/Marketing */
        .hero-section {
            background: var(--primary);
            color: white;
            width: 40%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .hero-section h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero-section p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .floating-icons {
            font-size: 3rem;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        /* Right Side - Form */
        .form-section {
            width: 60%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            margin-bottom: 30px;
        }

        .form-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .form-header p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(88, 204, 2, 0.2);
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
            box-shadow: 0 4px 0 var(--primary-dark);
        }

        .btn-submit:hover {
            background: var(--primary-dark);
        }

        .btn-submit:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .footer-text a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .signup-container {
                flex-direction: column;
            }
            .hero-section, .form-section {
                width: 100%;
            }
            .hero-section {
                padding: 40px 20px;
            }
            .form-section {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <!-- Branding/Visual Section -->
        <div class="hero-section">
            <h1>Master any language.</h1>
            <p>Join 10 million learners and start speaking from day one.</p>
            <div class="floating-icons">
                <span>🇪🇸</span>
                <span>🇫🇷</span>
                <span>🇯🇵</span>
                <span>🇩🇪</span>
            </div>
        </div>

        <!-- Form Section -->
        <div class="form-section">
            <div class="form-header">
                <h2>Create your account</h2>
                <p>Start your learning journey today!</p>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Min. 8 characters" required>
                </div>

                <div class="form-group">
                    <label for="language">Language you want to learn</label>
                    <select id="language" required>
                        <option value="" disabled selected>Select a language</option>
                        <option value="spanish">Spanish</option>
                        <option value="french">French</option>
                        <option value="japanese">Japanese</option>
                        <option value="german">German</option>
                        <option value="korean">Korean</option>
                        <option value="italian">Italian</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Get Started</button>
            </form>

            <div class="footer-text">
                Already have an account? <a href="#">Log in</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('fullName').value;
            alert(`Welcome to LinguoFlow, ${name}! Redirecting you to your dashboard...`);
        });
    </script>
</body>
</html>
