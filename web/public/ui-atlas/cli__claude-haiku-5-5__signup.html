<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account · Lingo Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #58cc02;
    --green-dark: #46a302;
    --blue: #1cb0f6;
    --ink: #3c3c3c;
    --muted: #777;
    --line: #e5e5e5;
    --bg: #f7f7f7;
    --error: #ea2b2b;
    --error-bg: #fff0f0;
    --ok: #58cc02;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 20px;
    padding: 36px 32px 28px;
    box-shadow: 0 4px 0 var(--line);
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .logo {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--green);
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 800;
    font-size: 26px;
    box-shadow: 0 3px 0 var(--green-dark);
  }
  .brand-name {
    font-weight: 800;
    font-size: 26px;
    color: var(--green);
    letter-spacing: -0.5px;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    margin: 12px 0 4px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 24px;
  }

  .social {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 13px 16px;
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 3px 0 var(--line);
    transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.15s;
  }
  .btn:hover { background: #fafafa; }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  .btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  .btn-primary {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
    box-shadow: 0 4px 0 var(--green-dark);
    margin-top: 6px;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .btn-primary:hover { background: #61d802; }
  .btn-primary:active { box-shadow: none; }
  .btn-primary:disabled {
    background: #cfcfcf;
    border-color: #cfcfcf;
    box-shadow: 0 4px 0 #b5b5b5;
    cursor: not-allowed;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 20px 0;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 2px;
    background: var(--line);
    border-radius: 2px;
  }

  form { display: flex; flex-direction: column; gap: 14px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input,
  .field select {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 12px 14px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus,
  .field select:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(28, 176, 246, 0.18);
  }
  .field.invalid input,
  .field.invalid select { border-color: var(--error); background: var(--error-bg); }
  .field .hint {
    font-size: 13px;
    color: var(--muted);
    margin-top: 5px;
    min-height: 0;
  }
  .field.invalid .hint { color: var(--error); font-weight: 600; }

  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 64px; }
  .toggle-pw {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--blue);
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 8px;
  }
  .toggle-pw:focus-visible { outline: 3px solid var(--blue); }

  .strength {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }
  .strength span {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--line);
    transition: background 0.2s;
  }
  .strength[data-level="1"] span:nth-child(1) { background: var(--error); }
  .strength[data-level="2"] span:nth-child(-n+2) { background: #ff9600; }
  .strength[data-level="3"] span:nth-child(-n+3) { background: #ffc800; }
  .strength[data-level="4"] span { background: var(--green); }

  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; min-width: 0; }

  .check {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.4;
    cursor: pointer;
  }
  .check input {
    appearance: none;
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    margin: 0;
    border: 2px solid #cfcfcf;
    border-radius: 7px;
    background: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .check input::after {
    content: "";
    width: 10px;
    height: 6px;
    border-left: 3px solid #fff;
    border-bottom: 3px solid #fff;
    transform: rotate(-45deg) translate(1px, -1px);
    opacity: 0;
  }
  .check input:checked { background: var(--green); border-color: var(--green); }
  .check input:checked::after { opacity: 1; }
  .check input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .check a { color: var(--blue); font-weight: 700; text-decoration: none; }
  .check a:hover { text-decoration: underline; }
  .check.invalid { color: var(--error); }
  .check.invalid input { border-color: var(--error); }

  .form-error {
    display: none;
    background: var(--error-bg);
    color: var(--error);
    border: 2px solid #ffc9c9;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
  }
  .form-error.show { display: block; }

  .success {
    display: none;
    text-align: center;
    padding: 12px 0;
  }
  .success.show { display: block; }
  .success .mascot {
    font-size: 56px;
    margin-bottom: 8px;
  }
  .success h2 { margin: 0 0 6px; font-size: 20px; font-weight: 800; color: var(--green); }
  .success p { margin: 0; color: var(--muted); }

  .footer {
    text-align: center;
    margin-top: 22px;
    font-size: 15px;
    color: var(--muted);
  }
  .footer a {
    color: var(--blue);
    font-weight: 700;
    text-decoration: none;
  }
  .footer a:hover { text-decoration: underline; }

  .fine {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 16px;
    line-height: 1.5;
  }

  .hidden { display: none !important; }

  @media (max-width: 480px) {
    .card { padding: 28px 22px 22px; border-radius: 16px; }
    .row { flex-direction: column; gap: 14px; }
  }
</style>
</head>
<body>

<main class="card" id="card">
  <div class="brand">
    <div class="logo" aria-hidden="true">L</div>
    <span class="brand-name">Lingo</span>
  </div>
  <h1>Create your account</h1>
  <p class="subtitle">Start your language journey in under a minute.</p>

  <div class="social">
    <button type="button" class="btn" id="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.7z"/>
        <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.5 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.3 7.4 24 12 24z"/>
        <path fill="#FBBC05" d="M5.4 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.6.4-2.4V6.5H1.4C.5 8.2 0 10.1 0 12s.5 3.8 1.4 5.5l4-3.1z"/>
        <path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.5l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/>
      </svg>
      Continue with Google
    </button>
    <button type="button" class="btn" id="btn-apple">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M16.37 12.6c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9s-2-.9-3.3-.9c-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.3.8c1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.8-1.1-2.8-4.3zM14.1 4.9c.7-.9 1.2-2 1-3.2-1 0-2.2.7-3 1.6-.6.7-1.2 1.9-1 3 1.1.1 2.3-.6 3-1.4z"/>
      </svg>
      Continue with Apple
    </button>
  </div>

  <div class="divider">or</div>

  <form id="signup" novalidate>
    <div class="form-error" id="form-error" role="alert"></div>

    <div class="row">
      <div class="field" id="field-first">
        <label for="first">First name</label>
        <input id="first" name="firstName" type="text" autocomplete="given-name" required>
        <div class="hint" id="hint-first"></div>
      </div>
      <div class="field" id="field-last">
        <label for="last">Last name</label>
        <input id="last" name="lastName" type="text" autocomplete="family-name" required>
        <div class="hint" id="hint-last"></div>
      </div>
    </div>

    <div class="field" id="field-email">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
      <div class="hint" id="hint-email"></div>
    </div>

    <div class="field" id="field-password">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="pw-help">
        <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">Show</button>
      </div>
      <div class="strength" id="strength" data-level="0" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="hint" id="pw-help">At least 8 characters.</div>
      <div class="hint" id="hint-password"></div>
    </div>

    <div class="field" id="field-language">
      <label for="language">I want to learn</label>
      <select id="language" name="language" required>
        <option value="">Choose a language</option>
        <option>Spanish</option>
        <option>French</option>
        <option>German</option>
        <option>Japanese</option>
        <option>Korean</option>
        <option>Italian</option>
        <option>Mandarin Chinese</option>
        <option>Portuguese</option>
      </select>
      <div class="hint" id="hint-language"></div>
    </div>

    <label class="check" id="field-terms">
      <input type="checkbox" id="terms" name="terms" required>
      <span>I agree to the <a href="#" onclick="return false;">Terms of Service</a> and <a href="#" onclick="return false;">Privacy Policy</a>.</span>
    </label>
    <div class="hint" id="hint-terms" style="color:var(--error);font-weight:600;font-size:13px;"></div>

    <button type="submit" class="btn btn-primary" id="submit">Create account</button>
  </form>

  <div class="success" id="success" role="status">
    <div class="mascot" aria-hidden="true">🎉</div>
    <h2>You're in!</h2>
    <p>Check your inbox to verify your email and start learning.</p>
  </div>

  <p class="footer">Already have an account? <a href="#" onclick="return false;">Log in</a></p>
  <p class="fine">By signing up you agree to receive learning reminders. You can change this anytime.</p>
</main>

<script>
(function () {
  const form = document.getElementById('signup');
  const submitBtn = document.getElementById('submit');
  const formError = document.getElementById('form-error');
  const success = document.getElementById('success');
  const pwInput = document.getElementById('password');
  const togglePw = document.getElementById('toggle-pw');
  const strength = document.getElementById('strength');
  const termsLabel = document.getElementById('field-terms');

  const rules = {
    first: {
      field: 'field-first', hint: 'hint-first',
      check: v => v.trim().length > 0 || 'Please enter your first name.'
    },
    last: {
      field: 'field-last', hint: 'hint-last',
      check: v => v.trim().length > 0 || 'Please enter your last name.'
    },
    email: {
      field: 'field-email', hint: 'hint-email',
      check: v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) || 'Enter a valid email address.'
    },
    password: {
      field: 'field-password', hint: 'hint-password',
      check: v => v.length >= 8 || 'Password must be at least 8 characters.'
    },
    language: {
      field: 'field-language', hint: 'hint-language',
      check: v => v !== '' || 'Choose a language to start learning.'
    }
  };

  function setFieldState(fieldEl, hintEl, message) {
    const invalid = message !== true;
    fieldEl.classList.toggle('invalid', invalid);
    hintEl.textContent = invalid ? message : '';
  }

  function validateOne(key) {
    const el = document.getElementById(key === 'first' ? 'first' : key === 'last' ? 'last' : key);
    const rule = rules[key];
    const result = rule.check(el.value);
    setFieldState(document.getElementById(rule.field), document.getElementById(rule.hint), result === true ? true : result);
    return result === true;
  }

  function validateTerms() {
    const ok = document.getElementById('terms').checked;
    termsLabel.classList.toggle('invalid', !ok);
    document.getElementById('hint-terms').textContent = ok ? '' : 'Please accept the terms to continue.';
    return ok;
  }

  // Password strength meter
  function scorePassword(pw) {
    let score = 0;
    if (pw.length >= 8) score++;
    if (pw.length >= 12) score++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
    if (/\d/.test(pw) || /[^A-Za-z0-9]/.test(pw)) score++;
    return pw.length === 0 ? 0 : Math.max(1, Math.min(4, score));
  }
  pwInput.addEventListener('input', () => {
    strength.dataset.level = scorePassword(pwInput.value);
    if (rules.password && form.dataset.submitted) validateOne('password');
  });

  togglePw.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    togglePw.textContent = show ? 'Hide' : 'Show';
    togglePw.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  // Live re-validation after first submit attempt
  Object.keys(rules).forEach(key => {
    const el = document.getElementById(key);
    el.addEventListener('input', () => {
      if (form.dataset.submitted) validateOne(key);
    });
    el.addEventListener('change', () => {
      if (form.dataset.submitted) validateOne(key);
    });
  });
  document.getElementById('terms').addEventListener('change', () => {
    if (form.dataset.submitted) validateTerms();
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    form.dataset.submitted = '1';
    formError.classList.remove('show');

    const results = Object.keys(rules).map(validateOne);
    const termsOk = validateTerms();
    const allOk = results.every(Boolean) && termsOk;

    if (!allOk) {
      formError.textContent = 'Please fix the highlighted fields.';
      formError.classList.add('show');
      const firstInvalid = form.querySelector('.field.invalid input, .field.invalid select, .check.invalid input');
      if (firstInvalid) firstInvalid.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account…';

    // Simulated network request — replace with a real API call.
    setTimeout(() => {
      form.classList.add('hidden');
      document.querySelector('.social').classList.add('hidden');
      document.querySelector('.divider').classList.add('hidden');
      document.querySelector('.footer').classList.add('hidden');
      document.querySelector('.fine').classList.add('hidden');
      document.querySelector('.subtitle').classList.add('hidden');
      document.querySelector('h1').classList.add('hidden');
      success.classList.add('show');
    }, 900);
  });

  // Social buttons are placeholders
  ['btn-google', 'btn-apple'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      formError.textContent = 'Social sign-up is not connected yet.';
      formError.classList.add('show');
    });
  });
})();
</script>
</body>
</html>
