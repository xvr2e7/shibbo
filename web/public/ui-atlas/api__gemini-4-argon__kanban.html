<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Horizon — Design Sprint Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #F8F7F4;
            --bg-column: #EFECE6;
            --bg-card: #FFFFFF;
            --bg-card-hover: #FDFCFB;
            --bg-glass: rgba(248, 247, 244, 0.85);
            
            --text-primary: #18181B;
            --text-secondary: #686763;
            --text-muted: #9D9B95;
            
            --border-subtle: #E4E1DA;
            --border-strong: #D0CCC3;
            --border-focus: #18181B;
            
            --accent-brand: #E14825;
            --accent-brand-hover: #C83B1B;
            
            /* Category Tags */
            --tag-ui-bg: #E6F0FF; --tag-ui-text: #0051CC; --tag-ui-border: #BBD6FF;
            --tag-ux-bg: #FFF0E5; --tag-ux-text: #B84300; --tag-ux-border: #FFD6B8;
            --tag-brand-bg: #F3E8FF; --tag-brand-text: #6B21A8; --tag-brand-border: #DFC2FF;
            --tag-sys-bg: #E5F9F0; --tag-sys-text: #066E3E; --tag-sys-border: #B3F0D4;
            --tag-motion-bg: #FFE8F0; --tag-motion-text: #A8134E; --tag-motion-border: #FFC2D9;

            /* Priorities */
            --prio-high: #E11D48;
            --prio-med: #D97706;
            --prio-low: #2563EB;

            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Instrument Serif', Georgia, serif;
            --font-mono: 'JetBrains Mono', monospace;

            --shadow-sm: 0 1px 2px rgba(24, 24, 27, 0.04);
            --shadow-card: 0 2px 4px rgba(24, 24, 27, 0.03), 0 1px 2px rgba(24, 24, 27, 0.04);
            --shadow-card-hover: 0 10px 20px -5px rgba(24, 24, 27, 0.08), 0 4px 6px -2px rgba(24, 24, 27, 0.04);
            --shadow-modal: 0 24px 48px -12px rgba(24, 24, 27, 0.18), 0 0 1px rgba(24, 24, 27, 0.2);

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-pill: 9999px;
        }

        [data-theme="dark"] {
            --bg-canvas: #111110;
            --bg-column: #191918;
            --bg-card: #222221;
            --bg-card-hover: #282826;
            --bg-glass: rgba(17, 17, 16, 0.85);
            
            --text-primary: #F4F3EF;
            --text-secondary: #9D9B95;
            --text-muted: #63625E;
            
            --border-subtle: #2C2C2A;
            --border-strong: #3E3E3B;
            --border-focus: #F4F3EF;
            
            --tag-ui-bg: rgba(0, 81, 204, 0.2); --tag-ui-text: #85B8FF; --tag-ui-border: rgba(133, 184, 255, 0.25);
            --tag-ux-bg: rgba(184, 67, 0, 0.2); --tag-ux-text: #FFB185; --tag-ux-border: rgba(255, 177, 133, 0.25);
            --tag-brand-bg: rgba(107, 33, 168, 0.2); --tag-brand-text: #D4A5FF; --tag-brand-border: rgba(212, 165, 255, 0.25);
            --tag-sys-bg: rgba(6, 110, 62, 0.2); --tag-sys-text: #7EE2B8; --tag-sys-border: rgba(126, 226, 184, 0.25);
            --tag-motion-bg: rgba(168, 19, 78, 0.2); --tag-motion-text: #FF94BE; --tag-motion-border: rgba(255, 148, 190, 0.25);

            --shadow-card: 0 2px 4px rgba(0, 0, 0, 0.2), 0 1px 1px rgba(0, 0, 0, 0.3);
            --shadow-card-hover: 0 12px 24px -6px rgba(0, 0, 0, 0.4), 0 4px 8px -4px rgba(0, 0, 0, 0.3);
            --shadow-modal: 0 24px 48px -12px rgba(0, 0, 0, 0.6), 0 0 1px rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.2s ease, color 0.2s ease;
            /* Subtle studio dot-grid background */
            background-image: radial-gradient(var(--border-strong) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* ================= HEADER ================= */
        .app-header {
            height: 68px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
            flex-shrink: 0;
        }

        .brand-area {
            display: flex;
            align-items: baseline;
            gap: 14px;
        }

        .studio-badge {
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 3px 8px;
            background: var(--text-primary);
            color: var(--bg-canvas);
            border-radius: 4px;
            font-weight: 500;
        }

        .board-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .board-title span.serif-accent {
            font-family: var(--font-serif);
            font-weight: 400;
            font-style: italic;
            font-size: 24px;
            color: var(--text-secondary);
        }

        /* Controls Bar */
        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-wrapper svg {
            position: absolute;
            left: 11px;
            width: 15px;
            height: 15px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-input {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-pill);
            padding: 7px 14px 7px 34px;
            font-family: var(--font-sans);
            font-size: 13px;
            color: var(--text-primary);
            width: 210px;
            transition: all 0.15s ease;
            box-shadow: var(--shadow-sm);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--border-focus);
            width: 250px;
        }

        .divider {
            width: 1px;
            height: 24px;
            background: var(--border-subtle);
        }

        /* Filter Pills */
        .category-filters {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-pill {
            font-size: 12px;
            font-weight: 600;
            padding: 5px 11px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .filter-pill:hover {
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        .filter-pill.active {
            background: var(--text-primary);
            color: var(--bg-canvas);
            border-color: var(--text-primary);
        }

        /* Team Avatars */
        .team-roster {
            display: flex;
            align-items: center;
        }

        .avatar-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--bg-canvas);
            margin-left: -8px;
            cursor: pointer;
            position: relative;
            transition: transform 0.15s ease, z-index 0s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            box-shadow: var(--shadow-sm);
        }

        .avatar-btn:first-child {
            margin-left: 0;
        }

        .avatar-btn:hover {
            transform: translateY(-2px) scale(1.06);
            z-index: 5;
        }

        .avatar-btn.active {
            box-shadow: 0 0 0 2px var(--bg-canvas), 0 0 0 4px var(--accent-brand);
            z-index: 6;
        }

        .avatar-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            background: var(--text-primary);
            color: var(--bg-canvas);
            font-size: 11px;
            font-weight: 500;
            padding: 3px 7px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.15s ease;
        }

        .avatar-btn:hover::after {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* Action Buttons */
        .btn-icon {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-icon:hover {
            color: var(--text-primary);
            border-color: var(--border-strong);
        }

        .btn-primary {
            background: var(--accent-brand);
            color: #FFFFFF;
            border: none;
            padding: 8px 15px;
            border-radius: var(--radius-sm);
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
            box-shadow: 0 2px 6px rgba(225, 72, 37, 0.25);
        }

        .btn-primary:hover {
            background: var(--accent-brand-hover);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* ================= BOARD LAYOUT ================= */
        .board-canvas {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 24px 28px;
            overflow-x: auto;
            overflow-y: hidden;
            align-items: flex-start;
        }

        .board-column {
            background: var(--bg-column);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            width: 325px;
            min-width: 325px;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .board-column.drag-over {
            border-color: var(--accent-brand);
            background: color-mix(in srgb, var(--bg-column) 94%, var(--accent-brand));
        }

        .column-header {
            padding: 14px 16px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .column-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .column-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-primary);
        }

        .column-count {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg-canvas);
            padding: 2px 7px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-subtle);
        }

        .column-add-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .column-add-btn:hover {
            background: var(--bg-canvas);
            color: var(--text-primary);
        }

        .column-cards {
            padding: 12px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 120px;
        }

        /* Custom subtle scrollbars */
        .column-cards::-webkit-scrollbar,
        .board-canvas::-webkit-scrollbar {
            width: 5px;
            height: 6px;
        }
        .column-cards::-webkit-scrollbar-thumb,
        .board-canvas::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 99px;
        }

        /* ================= CARDS ================= */
        .kanban-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 14px;
            box-shadow: var(--shadow-card);
            cursor: grab;
            transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.15s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
            user-select: none;
        }

        .kanban-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-card-hover);
            border-color: var(--border-strong);
            background: var(--bg-card-hover);
        }

        .kanban-card:active {
            cursor: grabbing;
        }

        .kanban-card.dragging {
            opacity: 0.4;
            transform: scale(0.97);
            border: 1px dashed var(--accent-brand);
        }

        .card-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .card-meta-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .task-id {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .category-tag {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 7px;
            border-radius: 4px;
            border: 1px solid transparent;
        }

        .tag-ui { background: var(--tag-ui-bg); color: var(--tag-ui-text); border-color: var(--tag-ui-border); }
        .tag-ux { background: var(--tag-ux-bg); color: var(--tag-ux-text); border-color: var(--tag-ux-border); }
        .tag-brand { background: var(--tag-brand-bg); color: var(--tag-brand-text); border-color: var(--tag-brand-border); }
        .tag-system { background: var(--tag-sys-bg); color: var(--tag-sys-text); border-color: var(--tag-sys-border); }
        .tag-motion { background: var(--tag-motion-bg); color: var(--tag-motion-text); border-color: var(--tag-motion-border); }

        .priority-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-secondary);
        }

        .prio-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .prio-high { background: var(--prio-high); box-shadow: 0 0 6px var(--prio-high); }
        .prio-med { background: var(--prio-med); }
        .prio-low { background: var(--prio-low); }

        /* Visual Swatch / Preview inside Design Cards */
        .card-swatch {
            height: 86px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swatch-label {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(17, 17, 16, 0.65);
            backdrop-filter: blur(4px);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 3px;
            letter-spacing: 0.04em;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.38;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .card-desc {
            font-size: 12.5px;
            line-height: 1.45;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Subtask Progress Bar */
        .subtask-bar-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtask-track {
            flex: 1;
            height: 4px;
            background: var(--bg-column);
            border-radius: 99px;
            overflow: hidden;
        }

        .subtask-fill {
            height: 100%;
            background: var(--text-primary);
            border-radius: 99px;
            transition: width 0.25s ease;
        }

        .subtask-fill.complete {
            background: #10B981;
        }

        .subtask-count {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 8px;
            margin-top: 2px;
            border-top: 1px solid var(--border-subtle);
        }

        .card-links {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 11px;
        }

        .card-metric {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .figma-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--bg-column);
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 500;
            transition: color 0.15s;
        }

        .kanban-card:hover .figma-pill {
            color: var(--text-primary);
        }

        .card-assignee {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        /* Empty Column State */
        .empty-slot {
            border: 1px dashed var(--border-strong);
            border-radius: var(--radius-md);
            padding: 28px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }

        /* ================= MODAL ================= */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(17, 17, 16, 0.55);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.18s ease;
        }

        .modal-backdrop.open {
            display: flex;
            opacity: 1;
        }

        .modal-dialog {
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 560px;
            box-shadow: var(--shadow-modal);
            overflow: hidden;
            transform: translateY(12px) scale(0.98);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal-backdrop.open .modal-dialog {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-body {
            padding: 22px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .form-input,
        .form-select,
        .form-textarea {
            font-family: var(--font-sans);
            font-size: 13.5px;
            color: var(--text-primary);
            background: var(--bg-canvas);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 9px 12px;
            transition: border-color 0.15s;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--border-focus);
        }

        .form-textarea {
            resize: vertical;
            min-height: 76px;
            line-height: 1.45;
        }

        /* Swatch Picker inside Modal */
        .swatch-picker {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .swatch-option {
            height: 36px;
            border-radius: var(--radius-sm);
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
            transition: transform 0.12s ease;
        }

        .swatch-option:hover {
            transform: scale(1.04);
        }

        .swatch-option.selected {
            border-color: var(--text-primary);
            box-shadow: 0 0 0 2px var(--bg-card) inset;
        }

        /* Checklist in Modal */
        .checklist-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 10px;
            background: var(--bg-canvas);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            font-size: 13px;
        }

        .check-item input[type="checkbox"] {
            accent-color: var(--accent-brand);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .check-item.done span {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .check-item button {

        .btn-secondary {

        @media (max-width: 1024px) {
            .category-filters { display: none; }
            .app-header { padding: 0 16px; }

    </style>
</head>
<body>

    <!-- ================= TOP STUDIO BAR ================= -->
    <header class="app-header">
        <div class="brand-area">
            <span class="studio-badge">Sprint 14</span>
            <h1 class="board-title">
                Atelier Nova <span class="serif-accent">Design System &amp; Web</span>
            </h1>
        </div>

        <div class="header-controls">
            <!-- Search -->
            <div class="search-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search tasks, IDs, tags... ( / )">
            </div>

            <!-- Discipline Filter Pills -->
            <div class="category-filters" id="categoryFilters">
                <button class="filter-pill active" data-cat="all">All</button>
                <button class="filter-pill" data-cat="ui">UI Design</button>
                <button class="filter-pill" data-cat="ux">Research</button>
                <button class="filter-pill" data-cat="brand">Brand</button>
                <button class="filter-pill" data-cat="system">Design Sys</button>
                <button class="filter-pill" data-cat="motion">Motion</button>
            </div>

            <div class="divider"></div>

            <!-- Designer Roster Filter -->
            <div class="team-roster" id="teamRoster"></div>

            <div class="divider"></div>

            <!-- Theme Switcher -->
            <button class="btn-icon" id="themeToggle" title="Toggle Dark/Light Mode">
                <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>

            <!-- New Task CTA -->
            <button class="btn-primary" id="newTaskBtn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                New Brief <span class="kbd-hint">N</span>
            </button>
        </div>
    </header>

    <!-- ================= KANBAN BOARD ================= -->
    <main class="board-canvas" id="boardCanvas"></main>

    <!-- ================= TASK DETAIL / CREATE MODAL ================= -->
    <div class="modal-backdrop" id="taskModal">
        <div class="modal-dialog" role="dialog" aria-modal="true">
            <div class="modal-header">
                <div class="modal-header-left">
                    <span class="task-id" id="modalTaskId">DSN-00</span>
                    <h2 style="font-size: 16px; font-weight: 700;" id="modalHeaderTitle">Design Brief</h2>
                </div>
                <button class="column-add-btn" id="closeModalBtn" aria-label="Close modal">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <form id="taskForm" class="modal-body">
                <input type="hidden" id="taskIdInput">

                <div class="form-group">
                    <label class="form-label" for="taskTitleInput">Deliverable Title</label>
                    <input type="text" id="taskTitleInput" class="form-input" placeholder="e.g., Responsive Checkout Drawer States" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="taskColumnSelect">Stage</label>
                        <select id="taskColumnSelect" class="form-select">
                            <option value="backlog">Backlog &amp; Discovery</option>
                            <option value="progress">In Exploration</option>
                            <option value="critique">Design Critique</option>
                            <option value="shipped">Ready for Dev</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="taskCategorySelect">Discipline</label>
                        <select id="taskCategorySelect" class="form-select">
                            <option value="ui">UI Design</option>
                            <option value="ux">UX Research</option>
                            <option value="brand">Brand &amp; Art</option>
                            <option value="system">Design System</option>
                            <option value="motion">Motion / 3D</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="taskAssigneeSelect">Lead Designer</label>
                        <select id="taskAssigneeSelect" class="form-select"></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="taskPrioritySelect">Priority &amp; Due</label>
                        <div style="display: flex; gap: 8px;">
                            <select id="taskPrioritySelect" class="form-select" style="flex: 1;">
                                <option value="high">High</option>
                                <option value="med">Medium</option>
                                <option value="low">Low</option>
                            </select>
                            <input type="text" id="taskDueInput" class="form-input" placeholder="Oct 24" style="width: 95px;">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="taskDescInput">Context &amp; Design Notes</label>
                    <textarea id="taskDescInput" class="form-textarea" placeholder="Outline key constraints, user flows, or critique questions..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="taskFigmaInput">Artifact Label (Canvas / Spec)</label>
                        <input type="text" id="taskFigmaInput" class="form-input" placeholder="e.g., Figma · v2.4">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Visual Thumbnail Mood</label>
                        <div class="swatch-picker" id="swatchPicker"></div>
                    </div>
                </div>

                <!-- Subtasks / Critique Checklist -->
                <div class="form-group">
                    <label class="form-label">Critique &amp; Deliverable Checklist</label>
                    <div class="checklist-items" id="modalChecklist"></div>
                    <div class="add-subtask-row">
                        <input type="text" id="newSubtaskInput" class="form-input" placeholder="Add a deliverable step (e.g., Dark mode tokens)...">
                        <button type="button" class="btn-secondary" id="addSubtaskBtn">Add</button>

                </div>
            </form>

            <div class="modal-footer">
                <button type="button" class="btn-danger" id="deleteTaskBtn">Delete Brief</button>
                <div class="modal-footer-right">
                    <button type="button" class="btn-secondary" id="cancelModalBtn">Cancel</button>
                    <button type="submit" form="taskForm" class="btn-primary">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           STUDIO CONFIGURATION & SEED DATA
           ========================================================================== */
        const COLUMNS = [
            { id: 'backlog',  title: 'Backlog & Discovery', color: '#8E8D8A' },
            { id: 'progress', title: 'In Exploration',      color: '#E14825' },
            { id: 'critique', title: 'Design Critique',     color: '#9333EA' },
            { id: 'shipped',  title: 'Ready for Dev',       color: '#10B981' }
        ];

        const DESIGNERS = [
            { id: 'maya',  name: 'Maya Lin',     role: 'Design Director', initials: 'ML', color: '#18181B' },
            { id: 'soren', name: 'Soren Kierk',  role: 'Staff Product',   initials: 'SK', color: '#E14825' },
            { id: 'chloe', name: 'Chloé Vance',  role: 'Brand & Motion',  initials: 'CV', color: '#6B21A8' },
            { id: 'taro',  name: 'Taro Yamada',  role: 'Design Systems',  initials: 'TY', color: '#0369A1' }
        ];

        const CATEGORIES = {
            ui:     { label: 'UI Design',     className: 'tag-ui' },
            ux:     { label: 'UX Research',   className: 'tag-ux' },

            system: { label: 'Design Sys',    className: 'tag-system' },
            motion: { label: 'Motion',        className: 'tag-motion' }
        };

        // Curated procedural SVG/CSS art swatches for design tasks
        const SWATCHES = [
            { id: 'none',   bg: 'transparent', label: 'No Cover' },
            { id: 'sunset', bg: 'linear-gradient(135deg, #FF6B4A 0%, #FFB88C 50%, #F9E7D2 100%)', label: 'Warm Editorial' },
            { id: 'cobalt', bg: 'radial-gradient(circle at 20% 20%, #3B82F6, #1D4ED8 60%, #0F172A 100%)', label: 'Spatial Grid' },
            { id: 'mint',   bg: 'linear-gradient(120deg, #D4FC79 0%, #96E6A1 100%)', label: 'Token Matrix' },
            { id: 'noir',   bg: 'repeating-linear-gradient(45deg, #1F1F1E, #1F1F1E 10px, #2C2C2A 10px, #2C2C2A 20px)', label: 'Wireframe Mono' }
        ];

        const INITIAL_TASKS = [
            {
                id: 'DSN-101',
                title: 'Typographic scale & variable serif pairing for Q4 editorial',
                desc: 'Testing Instrument Serif alongside Plus Jakarta for long-form case study templates and hero headers.',
                column: 'backlog',
                category: 'brand',
                assignee: 'chloe',
                priority: 'med',
                due: 'Oct 28',
                figma: 'Figma · Type Lab',
                swatch: 'sunset',
                comments: 4,
                subtasks: [
                    { text: 'Define fluid clamp() ratios for H1–H4', done: true },
                    { text: 'Test optical sizing on Safari & iOS', done: false }
                ]
            },
            {
                id: 'DSN-104',
                title: 'Synthesize 8 customer onboarding transcripts',
                desc: 'Distill friction points around workspace creation and team invite permissions into journey maps.',
                column: 'backlog',
                category: 'ux',
                assignee: 'maya',
                priority: 'high',
                due: 'Oct 22',
                figma: 'Dovetail · Synthesis',
                swatch: 'none',
                comments: 7,
                subtasks: [
                    { text: 'Tag clips by drop-off step', done: true },
                    { text: 'Draft executive summary deck', done: true },
                    { text: 'Present findings at Thursday sync', done: false }
                ]
            },
            {
                id: 'DSN-108',
                title: 'Command-K omni-search modal & keyboard navigation',
                desc: 'High-speed command palette supporting nested scopes, recent files, and quick theme switching.',
                column: 'progress',
                category: 'ui',
                assignee: 'soren',
                priority: 'high',
                due: 'Oct 24',
                figma: 'Figma · v3.2',
                swatch: 'cobalt',
                comments: 11,
                subtasks: [
                    { text: 'Empty, loading, and zero-result states', done: true },
                    { text: 'Keyboard focus ring contrast audit', done: true },
                    { text: 'Micro-interaction spring physics spec', done: false },
                    { text: 'Mobile bottom-sheet adaptation', done: false }
                ]
            },
            {
                id: 'DSN-112',
                title: 'Semantic color tokens for high-contrast dark mode',
                desc: 'Refactor surface elevation variables so cards maintain crisp hairline borders on OLED displays.',
                column: 'progress',
                category: 'system',
                assignee: 'taro',
                priority: 'med',
                due: 'Oct 26',
                figma: 'Tokens Studio · JSON',
                swatch: 'noir',
                comments: 3,
                subtasks: [
                    { text: 'Audit WCAG AAA contrast on muted text', done: true },
                    { text: 'Export CSS custom properties PR', done: false }
                ]
            },
            {
                id: 'DSN-115',
                title: 'Interactive WebGL spline hero for product launch page',
                desc: 'Subtle glassmorphic refraction ribbon that responds to cursor velocity without tanking mobile FPS.',
                column: 'critique',
                category: 'motion',
                assignee: 'chloe',
                priority: 'high',
                due: 'Oct 21',
                figma: 'Rive / Spline · RC1',
                swatch: 'mint',
                comments: 9,
                subtasks: [
                    { text: '60fps benchmark on M1 Air', done: true },
                    { text: 'Reduced-motion static fallback', done: true },
                    { text: 'Sign-off from Maya on lighting angle', done: false }
                ]
            },
            {
                id: 'DSN-119',
                title: 'Multi-select batch action bar & toast undo pattern',
                desc: 'Floating action dock when 2+ items are selected on canvas, with 6-second undo grace period.',
                column: 'critique',
                category: 'ui',
                assignee: 'soren',
                priority: 'low',
                due: 'Oct 29',
                figma: 'Figma · Critique Ready',
                swatch: 'none',
                comments: 6,
                subtasks: [
                    { text: 'Z-index stacking with bottom intercom', done: true },
                    { text: 'Destructive action confirmation popover', done: true }
                ]
            },
            {
                id: 'DSN-098',
                title: 'Unified Iconography Grid (24px / 1.75px stroke)',
                desc: '140 core interface glyphs exported as optimized SVGs with optical corner rounding.',
                column: 'shipped',
                category: 'system',
                assignee: 'taro',
                priority: 'med',
                due: 'Shipped',
                figma: 'Figma · Published',
                swatch: 'none',
                comments: 14,
                subtasks: [
                    { text: 'Boolean operations flattened', done: true },
                    { text: 'React icon package published v1.4', done: true },
                    { text: 'Figma component descriptions added', done: true }
                ]
            }
        ];

        /* ==========================================================================
           STATE MANAGEMENT
           ========================================================================== */
        const STORAGE_KEY = 'atelier_nova_kanban_v1';
        let tasks = [];
        let activeCategory = 'all';
        let activeDesigner = 'all';
        let searchQuery = '';
        let draggedTaskId = null;

        // Temporary checklist state while modal is open
        let modalSubtasks = [];
        let selectedSwatch = 'none';

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                tasks = saved ? JSON.parse(saved) : [...INITIAL_TASKS];
            } catch (e) {
                tasks = [...INITIAL_TASKS];
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            } catch (e) {}
        }

        /* ==========================================================================
           RENDERING PIPELINE
           ========================================================================== */
        function renderRoster() {
            const rosterEl = document.getElementById('teamRoster');
            rosterEl.innerHTML = DESIGNERS.map(d => `
                <button class="avatar-btn ${activeDesigner === d.id ? 'active' : ''}"
                        style="background-color: ${d.color}"
                        data-designer="${d.id}"
                        data-tooltip="${d.name} (${d.role})"
                        aria-label="Filter by ${d.name}">
                    ${d.initials}
                </button>
            `).join('');

            rosterEl.querySelectorAll('.avatar-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.designer;
                    activeDesigner = (activeDesigner === id) ? 'all' : id;
                    renderRoster();
                    renderBoard();
                });
            });
        }

        function renderSwatchGraphic(swatchId, figmaLabel) {
            const sw = SWATCHES.find(s => s.id === swatchId);
            if (!sw || sw.id === 'none') return '';
            return `
                <div class="card-swatch" style="background: ${sw.bg}">
                    <svg width="100%" height="100%" viewBox="0 0 280 86" fill="none" style="opacity: 0.22">
                        <circle cx="45" cy="43" r="28" stroke="white" stroke-width="1.5" stroke-dasharray="3 3"/>
                        <rect x="95" y="18" width="145" height="50" rx="6" stroke="white" stroke-width="1.5"/>
                        <line x1="0" y1="43" x2="280" y2="43" stroke="white" stroke-width="0.75"/>
                    </svg>
                    <span class="swatch-label">${figmaLabel || sw.label}</span>
                </div>
            `;
        }

        function filterTasks(list) {
            return list.filter(t => {
                const matchesCat = activeCategory === 'all' || t.category === activeCategory;
                const matchesDesigner = activeDesigner === 'all' || t.assignee === activeDesigner;
                const q = searchQuery.toLowerCase().trim();
                const matchesSearch = !q ||
                    t.title.toLowerCase().includes(q) ||
                    t.desc.toLowerCase().includes(q) ||
                    t.id.toLowerCase().includes(q) ||
                    t.figma.toLowerCase().includes(q);
                return matchesCat && matchesDesigner && matchesSearch;
            });
        }

        function renderBoard() {
            const boardEl = document.getElementById('boardCanvas');
            const filtered = filterTasks(tasks);

            boardEl.innerHTML = COLUMNS.map(col => {
                const colTasks = filtered.filter(t => t.column === col.id);
                return `
                    <section class="board-column" data-column="${col.id}">
                        <header class="column-header">
                            <div class="column-title-group">
                                <span class="status-dot" style="background: ${col.color}"></span>
                                <h2 class="column-title">${col.title}</h2>
                                <span class="column-count">${colTasks.length}</span>
                            </div>
                            <button class="column-add-btn" data-add-col="${col.id}" title="Add brief to ${col.title}">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                        </header>
                        <div class="column-cards" data-dropzone="${col.id}">
                            ${colTasks.length ? colTasks.map(renderCard).join('') : `
                                <div class="empty-slot">Drop design brief here</div>
                            `}
                        </div>
                    </section>
                `;
            }).join('');

            attachBoardEvents();
        }

        function renderCard(task) {
            const cat = CATEGORIES[task.category] || CATEGORIES.ui;
            const designer = DESIGNERS.find(d => d.id === task.assignee) || DESIGNERS[0];
            const totalSub = task.subtasks ? task.subtasks.length : 0;
            const doneSub = task.subtasks ? task.subtasks.filter(s => s.done).length : 0;
            const pct = totalSub > 0 ? Math.round((doneSub / totalSub) * 100) : 0;

            const prioLabel = task.priority === 'high' ? 'High' : task.priority === 'med' ? 'Med' : 'Low';

            return `
                <article class="kanban-card" draggable="true" data-task-id="${task.id}">
                    <div class="card-top-bar">
                        <div class="card-meta-left">
                            <span class="task-id">${task.id}</span>
                            <span class="category-tag ${cat.className}">${cat.label}</span>
                        </div>
                        <div class="priority-badge" title="${prioLabel} Priority · Due ${task.due}">
                            <span class="prio-dot prio-${task.priority}"></span>
                            <span>${task.due}</span>
                        </div>
                    </div>

                    ${renderSwatchGraphic(task.swatch, task.figma)}

                    <h3 class="card-title">${escapeHTML(task.title)}</h3>
                    ${task.desc ? `<p class="card-desc">${escapeHTML(task.desc)}</p>` : ''}

                    ${totalSub > 0 ? `
                        <div class="subtask-bar-wrap" title="${doneSub} of ${totalSub} checklist items completed">
                            <div class="subtask-track">
                                <div class="subtask-fill ${doneSub === totalSub ? 'complete' : ''}" style="width: ${pct}%"></div>
                            </div>
                            <span class="subtask-count">${doneSub}/${totalSub}</span>
                        </div>
                    ` : ''}

                    <div class="card-footer">
                        <div class="card-links">
                            <span class="figma-pill">
                                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5.5A3.5 3.5 0 0 1 8.5 2H12v7H8.5A3.5 3.5 0 0 1 5 5.5z"/><path d="M12 2h3.5a3.5 3.5 0 1 1 0 7H12V2z"/><path d="M12 12.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 1 1-7 0z"/><path d="M5 19.5A3.5 3.5 0 0 1 8.5 16H12v3.5a3.5 3.5 0 1 1-7 0z"/><path d="M5 12.5A3.5 3.5 0 0 1 8.5 9H12v7H8.5A3.5 3.5 0 0 1 5 12.5z"/></svg>
                                ${escapeHTML(task.figma || 'Spec')}
                            </span>
                            <span class="card-metric" title="${task.comments || 0} critique notes">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                                ${task.comments || 0}
                            </span>
                        </div>
                        <div class="card-assignee" style="background: ${designer.color}" title="Assigned to ${designer.name}">
                            ${designer.initials}
                        </div>
                    </div>
                </article>
            `;
        }

        /* ==========================================================================
           INTERACTION & DRAG-AND-DROP
           ========================================================================== */
        function attachBoardEvents() {
            // Card Click & Drag Events
            document.querySelectorAll('.kanban-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (card.classList.contains('dragging')) return;
                    openModal(card.dataset.taskId);
                });

                card.addEventListener('dragstart', (e) => {
                    draggedTaskId = card.dataset.taskId;
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', draggedTaskId);
                });

                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    draggedTaskId = null;
                    document.querySelectorAll('.board-column').forEach(c => c.classList.remove('drag-over'));
                });
            });

            // Quick Add Button on Column Header
            document.querySelectorAll('[data-add-col]').forEach(btn => {
                btn.addEventListener('click', () => {
                    openModal(null, btn.dataset.addCol);
                });
            });

            // Column Dropzones
            document.querySelectorAll('.board-column').forEach(colEl => {
                const colId = colEl.dataset.column;

                colEl.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    colEl.classList.add('drag-over');
                });

                colEl.addEventListener('dragleave', (e) => {
                    if (!colEl.contains(e.relatedTarget)) {
                        colEl.classList.remove('drag-over');
                    }
                });

                colEl.addEventListener('drop', (e) => {
                    e.preventDefault();
                    colEl.classList.remove('drag-over');
                    const id = draggedTaskId || e.dataTransfer.getData('text/plain');
                    if (!id) return;

                    const taskIndex = tasks.findIndex(t => t.id === id);
                    if (taskIndex > -1) {
                        tasks[taskIndex].column = colId;
                        // Move dropped card to end of column list
                        const [moved] = tasks.splice(taskIndex, 1);
                        tasks.push(moved);
                        saveState();
                        renderBoard();
                    }
                });
            });
        }

        /* ==========================================================================
           MODAL & FORM LOGIC
           ========================================================================== */
        const modalEl = document.getElementById('taskModal');
        const taskForm = document.getElementById('taskForm');

        function populateModalSelects() {
            const assigneeSelect = document.getElementById('taskAssigneeSelect');
            assigneeSelect.innerHTML = DESIGNERS.map(d =>
                `<option value="${d.id}">${d.name} — ${d.role}</option>`
            ).join('');
        }

        function renderSwatchPicker() {
            const container = document.getElementById('swatchPicker');
            container.innerHTML = SWATCHES.map(sw => `
                <button type="button"
                        class="swatch-option ${selectedSwatch === sw.id ? 'selected' : ''}"
                        style="background: ${sw.id === 'none' ? 'var(--bg-column)' : sw.bg}"
                        title="${sw.label}"
                        data-swatch="${sw.id}">
                    ${sw.id === 'none' ? '<span style="font-size:10px;color:var(--text-muted)">None</span>' : ''}
                </button>
            `).join('');

            container.querySelectorAll('.swatch-option').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedSwatch = btn.dataset.swatch;
                    renderSwatchPicker();
                });
            });
        }

        function renderModalChecklist() {
            const listEl = document.getElementById('modalChecklist');
            if (!modalSubtasks.length) {
                listEl.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:4px 0;">No deliverable steps added yet.</div>`;
                return;
            }
            listEl.innerHTML = modalSubtasks.map((item, idx) => `
                <div class="check-item ${item.done ? 'done' : ''}">
                    <input type="checkbox" ${item.done ? 'checked' : ''} data-idx="${idx}">
                    <span>${escapeHTML(item.text)}</span>
                    <button type="button" data-remove="${idx}" title="Remove step">&times;</button>
                </div>
            `).join('');

            listEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', () => {
                    const i = Number(cb.dataset.idx);
                    modalSubtasks[i].done = cb.checked;
                    renderModalChecklist();
                });
            });

            listEl.querySelectorAll('[data-remove]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const i = Number(btn.dataset.remove);
                    modalSubtasks.splice(i, 1);
                    renderModalChecklist();
                });
            });
        }

        function openModal(taskId = null, defaultCol = 'backlog') {
            const isEdit = Boolean(taskId);
            const task = isEdit ? tasks.find(t => t.id === taskId) : null;

            document.getElementById('taskIdInput').value = task ? task.id : '';
            document.getElementById('modalTaskId').textContent = task ? task.id : `DSN-${Math.floor(120 + Math.random() * 80)}`;
            document.getElementById('modalHeaderTitle').textContent = task ? 'Edit Design Brief' : 'New Design Brief';
            document.getElementById('taskTitleInput').value = task ? task.title : '';
            document.getElementById('taskColumnSelect').value = task ? task.column : defaultCol;
            document.getElementById('taskCategorySelect').value = task ? task.category : 'ui';
            document.getElementById('taskAssigneeSelect').value = task ? task.assignee : DESIGNERS[0].id;
            document.getElementById('taskPrioritySelect').value = task ? task.priority : 'med';
            document.getElementById('taskDueInput').value = task ? task.due : 'Nov 02';
            document.getElementById('taskDescInput').value = task ? task.desc : '';
            document.getElementById('taskFigmaInput').value = task ? task.figma : 'Figma · Spec';

            selectedSwatch = task ? (task.swatch || 'none') : 'sunset';
            modalSubtasks = task && task.subtasks ? JSON.parse(JSON.stringify(task.subtasks)) : [
                { text: 'Initial layout explorations', done: false },
                { text: 'Design critique review', done: false }
            ];

            document.getElementById('deleteTaskBtn').style.visibility = isEdit ? 'visible' : 'hidden';

            renderSwatchPicker();
            renderModalChecklist();

            modalEl.classList.add('open');
            setTimeout(() => document.getElementById('taskTitleInput').focus(), 60);
        }

        function closeModal() {
            modalEl.classList.remove('open');
        }

        // Add Subtask Handler
        document.getElementById('addSubtaskBtn').addEventListener('click', () => {
            const input = document.getElementById('newSubtaskInput');
            const val = input.value.trim();
            if (!val) return;
            modalSubtasks.push({ text: val, done: false });
            input.value = '';
            renderModalChecklist();
        });

        document.getElementById('newSubtaskInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('addSubtaskBtn').click();
            }
        });

        // Save Task Handler
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const existingId = document.getElementById('taskIdInput').value;
            const payload = {
                id: existingId || document.getElementById('modalTaskId').textContent,
                title: document.getElementById('taskTitleInput').value.trim(),
                column: document.getElementById('taskColumnSelect').value,
                category: document.getElementById('taskCategorySelect').value,
                assignee: document.getElementById('taskAssigneeSelect').value,
                priority: document.getElementById('taskPrioritySelect').value,
                due: document.getElementById('taskDueInput').value.trim() || 'TBD',
                desc: document.getElementById('taskDescInput').value.trim(),
                figma: document.getElementById('taskFigmaInput').value.trim() || 'Figma',
                swatch: selectedSwatch,
                subtasks: modalSubtasks,
                comments: existingId ? (tasks.find(t => t.id === existingId)?.comments || 2) : 1
            };

            if (existingId) {
                const idx = tasks.findIndex(t => t.id === existingId);
                if (idx > -1) tasks[idx] = payload;
            } else {
                tasks.unshift(payload);
            }

            saveState();
            renderBoard();
            closeModal();
        });

        // Delete Task Handler
        document.getElementById('deleteTaskBtn').addEventListener('click', () => {
            const existingId = document.getElementById('taskIdInput').value;
            if (!existingId) return;
            tasks = tasks.filter(t => t.id !== existingId);
            saveState();
            renderBoard();
            closeModal();
        });

        /* ==========================================================================
           HEADER CONTROLS & SHORTCUTS
           ========================================================================== */
        document.getElementById('newTaskBtn').addEventListener('click', () => openModal(null, 'backlog'));
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('cancelModalBtn').addEventListener('click', closeModal);

        modalEl.addEventListener('click', (e) => {
            if (e.target === modalEl) closeModal();
        });

        // Discipline Filter Pills
        document.querySelectorAll('#categoryFilters .filter-pill').forEach(pill => {
            pill.addEventListener('click', () => {
                document.querySelectorAll('#categoryFilters .filter-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                activeCategory = pill.dataset.cat;
                renderBoard();
            });
        });

        // Live Search
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderBoard();
        });

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        });

        // Studio Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            const tag = document.activeElement.tagName.toLowerCase();
            const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select';

            if (e.key === 'Escape' && modalEl.classList.contains('open')) {
                closeModal();
            } else if (!isTyping && (e.key === 'n' || e.key === 'N')) {
                e.preventDefault();
                openModal(null, 'backlog');
            } else if (!isTyping && e.key === '/') {
                e.preventDefault();
                searchInput.focus();
            }
        });

        function escapeHTML(str = '') {
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        /* ==========================================================================
           BOOT
           ========================================================================== */
        loadState();
        populateModalSelects();
        renderRoster();
        renderBoard();
    </script>
</body>
</html>
