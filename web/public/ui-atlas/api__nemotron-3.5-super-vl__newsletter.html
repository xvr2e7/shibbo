<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribe — The Urbanist Weekly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f5f4;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --primary: #0f6f5b;
    --primary-hover: #0b5c4a;
    --accent: #e87d4c;
    --border: #d1d5db;
    --radius: 12px;
    --shadow: 0 10px 30px -10px rgba(2, 6, 23, 0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .card {
    background: var(--card);
    max-width: 480px;
    width: 100%;
    padding: 2.5rem 2rem;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
  }
  .brand-dot {
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }
  p.subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 2rem;
  }
  .form-group { margin-bottom: 1.25rem; }
  label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
    color: var(--text);
  }
  input[type="email"],
  input[type="text"] {
    width: 100%;
    padding: 0.7rem 0.9rem;
    font-size: 1rem;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(15, 111, 91, 0.1);
  }
  input::placeholder { color: #9ca3af; }
  fieldset {
    border: none;
    padding: 0;
    margin-bottom: 1.25rem;
  }
  legend {
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 0.6rem;
    color: var(--text);
  }
  .checkbox-group {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.5rem;
  }
  .checkbox-item {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    font-size: 0.9rem;
    color: var(--muted);
    cursor: pointer;
  }
  .checkbox-item input {
    margin-top: 0.15rem;
    width: 18px;
    height: 18px;
    accent-color: var(--primary);
    flex-shrink: 0;
  }
  .checkbox-item span {
    display: block;
    margin-top: -0.05rem;
  }
  .consent {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }
  .consent input { margin-top: 0.12rem; flex-shrink: 0; }
  .consent a { color: var(--primary); text-decoration: underline; }
  button {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 0.85rem 1rem;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: var(--primary-hover); }
  button:active { transform: translateY(1px); }
  .success {
    text-align: center;
    display: none;
  }
  .success h2 {
    font-size: 1.5rem;
    font-weight: 800;
    margin-bottom: 0.5rem;
    color: var(--primary);
  }
  .success p { color: var(--muted); font-size: 0.95rem; }
  .check {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #dcfce7;
    color: #16a34a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin: 0 auto 1rem;
  }
  @media (max-width: 480px) {
    body { padding: 1rem; }
    .card { padding: 1.75rem 1.25rem; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-dot"></div>
      <div>
        <h1>The Urbanist Weekly</h1>
        <p class="subtitle">A Sunday briefing on zoning, transit, housing, and the design of public life.</p>
      </div>
    </div>

    <form id="newsletterForm">
      <div class="form-group">
        <label for="email">Email address <span style="color:var(--accent);">*</span></label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="name">Full name (optional)</label>
        <input type="text" id="name" name="name" placeholder="Alex Rivera">
      </div>

      <fieldset>
        <legend>Interests</legend>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" name="interest" value="zoning"><span>Zoning &amp; land use</span></label>
          <label class="checkbox-item"><input type="checkbox" name="interest" value="transit"><span>Public transit</span></label>
          <label class="checkbox-item"><input type="checkbox" name="interest" value="housing"><span>Affordable housing</span></label>
          <label class="checkbox-item"><input type="checkbox" name="interest" value="parks"><span>Parks &amp; public space</span></label>
          <label class="checkbox-item"><input type="checkbox" name="interest" value="climate"><span>Climate &amp; resilience</span></label>
        </div>
      </fieldset>

      <label class="consent">
        <input type="checkbox" name="consent" required>
        <span>I agree to receive weekly emails about urban planning. <a href="#">Privacy policy</a></span>
      </label>

      <button type="submit">Subscribe</button>
    </form>

    <div id="success" class="success">
      <div class="check">✓</div>
      <h2>You're subscribed.</h2>
      <p>Check your inbox to confirm. See you Sunday.</p>
    </div>
  </div>

  <script>
    document.getElementById('newsletterForm').addEventListener('submit', function(e) {
      e.preventDefault();
      this.style.display = 'none';
      document.getElementById('success').style.display = 'block';
    });
  </script>
</body>
</html>
