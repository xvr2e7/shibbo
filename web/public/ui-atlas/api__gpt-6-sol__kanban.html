<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forma — Design team board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #242631;
      --muted: #8a8d9b;
      --line: #e9e9ec;
      --canvas: #f7f7f5;
      --purple: #7662de;
      --purple-light: #f0edff;
      --sidebar: #fff;
      --shadow: 0 3px 12px rgba(33, 34, 52, .035);
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-family: "DM Sans", sans-serif; font-size: 14px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    svg { width: 19px; height: 19px; flex: none; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 252px; flex: none; background: var(--sidebar); border-right: 1px solid var(--line); padding: 31px 17px 24px; display: flex; flex-direction: column; min-height: 100vh; }
    .brand { display: flex; align-items: center; gap: 10px; margin: 0 13px 43px; font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 23px; letter-spacing: -.09em; }
    .brand-mark { width: 32px; height: 32px; background: #252631; color: #fff; border-radius: 10px; display: grid; place-items: center; font-size: 23px; line-height: 1; transform: rotate(-8deg); letter-spacing: -.1em; padding-right: 3px; }
    .brand span:last-child { letter-spacing: -.075em; }
    .nav-caption { padding: 0 15px; margin: 0 0 11px; color: #aaabb4; text-transform: uppercase; letter-spacing: .13em; font-weight: 700; font-size: 10px; }
    .nav-group { display: grid; gap: 4px; margin-bottom: 34px; }
    .nav-item { display: flex; align-items: center; gap: 13px; width: 100%; border: 0; background: transparent; color: #777987; border-radius: 10px; padding: 12px 14px; text-align: left; font-weight: 600; }
    .nav-item:hover, .project-item:hover { background: #f6f5fa; }
    .nav-item.active { background: var(--purple-light); color: #6653cb; }
    .nav-item svg { width: 18px; height: 18px; }
    .nav-item .count { margin-left: auto; color: #aaa4db; font-size: 12px; }
    .projects-heading { display: flex; align-items: center; justify-content: space-between; padding-right: 11px; }
    .projects-heading button { border: 0; background: none; color: #aaaab4; font-size: 21px; line-height: 12px; }
    .project-list { display: grid; gap: 5px; }
    .project-item { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: transparent; border-radius: 10px; padding: 11px 14px; text-align: left; color: #7b7d8a; font-weight: 600; }
    .project-item.active { color: #363441; background: #f7f6fb; }
    .project-dot { width: 10px; height: 10px; border-radius: 4px; flex: none; }
    .project-item .chevron { margin-left: auto; color: #a5a1b4; }
    .sidebar-bottom { margin-top: auto; padding-top: 30px; }
    .invite { width: 100%; border: 1px dashed #d8d6e1; background: #fbfafc; border-radius: 12px; padding: 13px; text-align: left; color: #686776; display: flex; align-items: center; gap: 11px; font-weight: 600; }
    .invite svg { color: #8574d8; }
    .profile { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding: 24px 7px 0; margin-top: 25px; }
    .avatar { display: inline-grid; place-items: center; flex: none; width: 29px; height: 29px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 10px; border: 2px solid #fff; letter-spacing: -.03em; }
    .avatar.large { width: 38px; height: 38px; font-size: 12px; }
    .profile-info { display: grid; gap: 2px; flex: 1; }
    .profile-info strong { font-size: 12px; }
    .profile-info small { color: #a3a3af; font-size: 11px; }
    .profile > svg { color: #aaaab4; width: 17px; }
    .main { min-width: 0; flex: 1; }
    .topbar { height: 79px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 43px; gap: 20px; }
    .breadcrumb { display: flex; align-items: center; gap: 12px; color: #a0a1ad; font-size: 13px; white-space: nowrap; }
    .breadcrumb strong { color: #464653; font-weight: 600; }
    .breadcrumb svg { width: 14px; height: 14px; }
    .top-actions { display: flex; align-items: center; gap: 20px; }
    .icon-button { border: 0; background: none; color: #777987; padding: 5px; position: relative; display: grid; place-items: center; }
    .icon-button:hover { color: var(--purple); }
    .notification-dot { position: absolute; width: 7px; height: 7px; background: #f18783; border-radius: 50%; top: 4px; right: 4px; border: 1px solid white; }
    .top-divider { width: 1px; height: 25px; background: var(--line); }
    .workspace { padding: 39px 43px 60px; max-width: 1900px; margin: auto; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
    .eyebrow { display: flex; align-items: center; gap: 7px; text-transform: uppercase; letter-spacing: .13em; color: #93929d; font-size: 10px; font-weight: 700; margin-bottom: 11px; }
    .eyebrow .spark { color: #b4a4ed; font-size: 17px; line-height: 8px; }
    h1 { font-family: "Plus Jakarta Sans", sans-serif; font-size: clamp(25px, 2.5vw, 34px); letter-spacing: -.055em; line-height: 1.25; margin: 0; }
    .subtitle { margin: 10px 0 0; color: #9393a0; font-size: 13px; }
    .head-right { display: flex; align-items: center; gap: 16px; padding-top: 25px; }
    .member-stack { display: flex; align-items: center; padding-left: 8px; }
    .member-stack .avatar { margin-left: -8px; width: 32px; height: 32px; }
    .member-stack .extra { background: #f0eff4; color: #777783; }
    .head-right .team-label { color: #9393a0; font-size: 12px; white-space: nowrap; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9px; padding: 10px 14px; border: 1px solid var(--line); background: #fff; color: #575765; font-weight: 700; font-size: 12px; white-space: nowrap; }
    .button:hover { border-color: #c7bfeb; color: var(--purple); }
    .button.primary { background: var(--purple); border-color: var(--purple); color: #fff; box-shadow: 0 4px 10px #7662de26; }
    .button.primary:hover { background: #6853ce; }
    .button svg { width: 16px; height: 16px; }
    .view-bar { margin-top: 37px; display: flex; align-items: end; justify-content: space-between; gap: 20px; border-bottom: 1px solid #e5e5e8; }
    .tabs { display: flex; align-items: center; gap: 29px; }
    .tab { background: none; border: 0; border-bottom: 2px solid transparent; color: #9696a1; font-weight: 700; padding: 0 1px 16px; font-size: 12px; white-space: nowrap; }
    .tab.active { color: #6753cb; border-color: #7662de; }
    .tab:hover { color: #6753cb; }
    .board-tools { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; }
    .search { height: 35px; width: 196px; display: flex; align-items: center; gap: 7px; padding: 0 10px; background: #fff; border: 1px solid #e9e8eb; border-radius: 8px; color: #a3a3ae; }
    .search svg { width: 15px; height: 15px; }
    .search input { min-width: 0; width: 100%; border: 0; outline: 0; font-size: 11px; color: var(--ink); background: transparent; }
    .search input::placeholder { color: #aaaab5; }
    .filter-select { height: 35px; border: 1px solid #e9e8eb; background: #fff; border-radius: 8px; padding: 0 10px; color: #777784; font-size: 11px; font-weight: 700; outline: none; }
    .board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 17px; margin-top: 25px; align-items: start; }
    .column { min-width: 0; border-radius: 12px; transition: background .2s; }
    .column.drag-over { background: #eeebfa; outline: 2px dashed #b5a8eb; outline-offset: 6px; }
    .column-head { height: 42px; display: flex; align-items: center; gap: 9px; margin-bottom: 12px; padding: 0 3px; }
    .status-mark { width: 10px; height: 10px; border-radius: 50%; }
    .column-title { font-family: "Plus Jakarta Sans", sans-serif; font-size: 13px; font-weight: 800; letter-spacing: -.03em; }
    .column-count { font-size: 10px; font-weight: 700; color: #9695a1; background: #ecebee; border-radius: 6px; padding: 3px 7px; }
    .column-add { margin-left: auto; border: 0; background: none; color: #a4a3ad; font-size: 22px; line-height: 1; padding: 3px; }
    .column-add:hover { color: var(--purple); }
    .cards { display: grid; gap: 12px; min-height: 75px; }
    .task-card { background: #fff; border: 1px solid #efedf0; border-radius: 11px; padding: 15px; box-shadow: var(--shadow); cursor: grab; transition: box-shadow .15s, transform .15s; }
    .task-card:hover { box-shadow: 0 8px 22px #32304412; transform: translateY(-2px); }
    .task-card.dragging { opacity: .4; }
    .card-cover { height: 112px; border-radius: 7px; margin-bottom: 15px; position: relative; overflow: hidden; }
    .cover-brand { background: #e7ddfe; }
    .cover-brand::before { content: ""; position: absolute; width: 190px; height: 190px; border: 28px solid #6d55cc; border-radius: 50%; left: 50%; top: -74px; transform: translateX(-50%); }
    .cover-brand::after { content: "n."; position: absolute; font-family: Georgia, serif; font-size: 76px; font-weight: bold; color: #fff; left: 50%; top: 38%; transform: translate(-50%,-50%); letter-spacing: -.13em; }
    .cover-palette { background: #e4d8c7; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .cover-palette span { height: 75px; width: 37px; border-radius: 50px; transform: rotate(22deg); box-shadow: 5px 5px 10px #6758431c; }
    .cover-palette span:nth-child(1) { background: #b85b48; }.cover-palette span:nth-child(2) { background: #e9aa79; }.cover-palette span:nth-child(3) { background: #f5eed9; }.cover-palette span:nth-child(4) { background: #454f43; }
    .cover-web { background: #d9e5dc; display: grid; place-items: center; }
    .mini-site { width: 74%; height: 89px; background: #f8faf4; border-radius: 5px 5px 0 0; margin-top: 23px; box-shadow: 0 8px 20px #4b6f5730; padding: 9px; }
    .mini-site::before { content: "northstar."; display: block; color: #294a37; font-family: Georgia, serif; font-weight: bold; font-size: 11px; }
    .mini-site::after { content: "A brighter way to grow."; display: block; width: 63%; color: #294a37; font-family: Georgia, serif; font-weight: bold; font-size: 18px; line-height: 1.05; margin-top: 13px; }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
    .task-id { color: #aaa9b4; font-size: 10px; font-weight: 700; letter-spacing: .03em; }
    .card-menu { border: 0; background: none; color: #a8a8b1; padding: 0; line-height: 0; }
    .card-menu svg { width: 17px; height: 17px; }
    .card-menu:hover { color: var(--purple); }
    .task-card h3 { font-family: "Plus Jakarta Sans", sans-serif; margin: 9px 0 7px; font-size: 12px; line-height: 1.5; letter-spacing: -.02em; font-weight: 700; }
    .description { margin: 0; color: #9999a4; font-size: 11px; line-height: 1.55; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 13px; }
    .tag { padding: 5px 7px; border-radius: 5px; font-size: 9px; font-weight: 700; }
    .tag.design { background: #f0edff; color: #7660c8; }
    .tag.research { background: #e9f4f1; color: #4b9c86; }
    .tag.content { background: #fff1e8; color: #ca9069; }
    .tag.review { background: #eaf1ff; color: #6384c4; }
    .tag.priority { background: #fff0ee; color: #d57773; }
    .progress-label { display: flex; justify-content: space-between; color: #92929e; font-size: 10px; font-weight: 600; margin: 17px 0 7px; }
    .progress-track { height: 5px; background: #efedf3; border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: #8573db; border-radius: inherit; }
    .card-footer { border-top: 1px solid #f0eff1; margin-top: 16px; padding-top: 12px; display: flex; align-items: center; gap: 9px; color: #a0a0aa; font-size: 10px; font-weight: 600; }
    .card-footer .avatar { width: 26px; height: 26px; font-size: 9px; margin-right: auto; }
    .meta { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .meta svg { width: 13px; height: 13px; }
    .meta.overdue { color: #d77773; }
    .empty { padding: 22px 12px; text-align: center; color: #aaa9b2; font-size: 11px; background: #ffffff85; border: 1px dashed #e2e0e6; border-radius: 10px; }
    .add-card { width: 100%; display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 11px 12px; border: 1px dashed #dcdae3; border-radius: 9px; background: transparent; text-align: left; color: #9996a7; font-size: 11px; font-weight: 700; }
    .add-card:hover { color: var(--purple); border-color: #b8ace8; background: #f2effd; }
    .add-card svg { width: 15px; height: 15px; }
    .dialog-backdrop { display: none; position: fixed; inset: 0; z-index: 20; background: #1c1a2b85; align-items: center; justify-content: center; padding: 20px; }
    .dialog-backdrop.open { display: flex; }
    .dialog { width: min(100%, 460px); background: white; border-radius: 16px; padding: 26px; box-shadow: 0 25px 80px #17122545; }
    .dialog-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 23px; }
    .dialog h2 { font-family: "Plus Jakarta Sans", sans-serif; font-size: 19px; letter-spacing: -.04em; margin: 0; }
    .dialog label { display: block; font-size: 11px; font-weight: 700; color: #656572; margin-bottom: 7px; }
    .field { margin-bottom: 17px; }
    .field input, .field textarea, .field select { width: 100%; border: 1px solid #e6e4eb; outline: none; border-radius: 8px; background: #fff; padding: 10px 11px; color: var(--ink); font-size: 12px; }
    .field textarea { resize: vertical; min-height: 75px; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: #a99be6; box-shadow: 0 0 0 3px #eeeafb; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 23px; }
    .toast { position: fixed; bottom: 24px; right: 24px; z-index: 30; background: #292633; color: #fff; border-radius: 9px; padding: 12px 17px; font-size: 12px; box-shadow: 0 10px 28px #2223; opacity: 0; transform: translateY(10px); pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 1200px) { .board { overflow-x: auto; grid-template-columns: repeat(4, minmax(245px, 1fr)); padding-bottom: 15px; } .workspace { padding-left: 28px; padding-right: 28px; } .topbar { padding: 0 28px; } }
    @media (max-width: 780px) { .sidebar { width: 70px; padding: 26px 10px; align-items: center; } .brand { margin: 0 0 40px; }.brand span:last-child, .nav-caption, .nav-item span, .nav-item .count, .project-list, .projects-heading, .sidebar-bottom .invite, .profile-info, .profile > svg { display: none; } .nav-group { width: 100%; }.nav-item { justify-content: center; padding: 13px 0; }.profile { padding: 20px 0 0; }.topbar { height: 65px; }.workspace { padding-top: 28px; }.head-right .team-label, .member-stack { display: none; } }
    @media (max-width: 570px) { .topbar { padding: 0 18px; }.workspace { padding: 25px 18px; }.top-actions { gap: 8px; }.page-head { flex-wrap: wrap; }.head-right { padding-top: 0; }.view-bar { display: block; }.board-tools { padding: 12px 0; }.search { flex: 1; }.board { margin-top: 15px; }.subtitle { line-height: 1.5; } }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m8 12 2.5 2.5L16 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 5h16l2 11v4H2v-4L4 5Z M2 15h6l1.5 2h5L16 15h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 3v4m10-4v4M3 10h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 8-3 8-3 10h18c0-2-3-2-3-10ZM10 21h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="m9 13 5.8-5.8a3 3 0 0 1 4.2 4.2l-8.1 8.1a5 5 0 0 1-7.1-7.1l8.5-8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8 9 9 0 0 1-3.5-.8L4 20l1.3-4.5A8 8 0 1 1 20 11.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>

    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 20v-2a6 6 0 0 1 12 0v2H3Zm13-15a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">f.</span><span>forma.</span></div>
      <p class="nav-caption">Workspace</p>
      <nav class="nav-group" aria-label="Workspace">
        <button class="nav-item active" data-view="board"><svg><use href="#i-grid"/></svg><span>Board</span></button>
        <button class="nav-item" data-view="mine"><svg><use href="#i-check"/></svg><span>My tasks</span></button>
        <button class="nav-item" data-view="completed"><svg><use href="#i-inbox"/></svg><span>Completed</span></button>
      </nav>
      <div class="projects-heading"><p class="nav-caption">Projects</p><button id="newProject" aria-label="Add project">+</button></div>
      <div class="project-list" id="projectList"></div>
      <div class="sidebar-bottom">
        <button class="invite" id="inviteButton"><svg><use href="#i-users"/></svg> Invite teammates</button>
        <div class="profile"><span class="avatar large" style="background:#c18070">SC</span><span class="profile-info"><strong>Sarah Chen</strong><small>Design lead</small></span><svg><use href="#i-more"/></svg></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="breadcrumb">Workspace <svg><use href="#i-chevron"/></svg> Projects <svg><use href="#i-chevron"/></svg> <strong id="breadcrumbProject">Northstar</strong></div>
        <div class="top-actions">
          <button class="icon-button" id="searchFocus" title="Search tasks" aria-label="Search tasks"><svg><use href="#i-search"/></svg></button>
          <button class="icon-button" id="notifications" title="Notifications" aria-label="Notifications"><svg><use href="#i-bell"/></svg><span class="notification-dot"></span></button>
          <span class="top-divider"></span>
          <span class="avatar" style="background:#c18070;width:32px;height:32px">SC</span>
        </div>
      </header>
      <div class="workspace">
        <section class="page-head">
          <div>
            <div class="eyebrow"><span class="spark">✳</span> Design workspace <span style="margin:0 3px">/</span> <span id="projectCategory">Brand identity</span></div>
            <h1 id="pageTitle">Northstar brand refresh</h1>
            <p class="subtitle" id="pageSubtitle">A little more clarity, a lot more creativity. Let's make something good.</p>
          </div>
          <div class="head-right">
            <div class="member-stack" aria-label="Project members">
              <span class="avatar" title="Sarah Chen" style="background:#c18070">SC</span>
              <span class="avatar" title="Marcus Lee" style="background:#7a91ac">ML</span>
              <span class="avatar" title="Amara Okafor" style="background:#a391bf">AO</span>
              <span class="avatar" title="Jamie Rivera" style="background:#8caa98">JR</span>
              <span class="avatar extra">+2</span>
            </div>
            <span class="team-label">6 members</span>
            <button class="button primary" id="newTask"><svg><use href="#i-plus"/></svg> New task</button>
          </div>
        </section>

        <div class="view-bar">
          <div class="tabs" aria-label="Task views">
            <button class="tab active" data-view="board">All tasks</button>
            <button class="tab" data-view="mine">My tasks</button>
            <button class="tab" data-view="completed">Completed</button>
          </div>
          <div class="board-tools">
            <label class="search"><svg><use href="#i-search"/></svg><input id="searchInput" type="search" placeholder="Search tasks..." aria-label="Search tasks" /></label>
            <select id="priorityFilter" class="filter-select" aria-label="Filter by priority">
              <option value="all">All priorities</option>
              <option value="high">High priority</option>
              <option value="normal">Normal priority</option>
            </select>
          </div>
        </div>
        <div class="board" id="board" aria-label="Kanban board"></div>
      </div>
    </main>
  </div>

  <div class="dialog-backdrop" id="dialogBackdrop">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dialog-head"><h2 id="dialogTitle">Create a new task</h2><button class="icon-button" id="closeDialog" aria-label="Close dialog" style="font-size:22px;line-height:1">×</button></div>
      <form id="taskForm">
        <div class="field"><label for="taskTitle">Task name</label><input id="taskTitle" required maxlength="100" placeholder="What needs to be done?" /></div>
        <div class="field"><label for="taskDescription">Description</label><textarea id="taskDescription" placeholder="Add a little context..."></textarea></div>
        <div class="field-row">
          <div class="field"><label for="taskStatus">Status</label><select id="taskStatus"><option value="backlog">Backlog</option><option value="todo">To do</option><option value="progress">In progress</option><option value="done">Done</option></select></div>
          <div class="field"><label for="taskAssignee">Assignee</label><select id="taskAssignee"><option value="SC">Sarah Chen</option><option value="ML">Marcus Lee</option><option value="AO">Amara Okafor</option><option value="JR">Jamie Rivera</option></select></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="taskTag">Category</label><select id="taskTag"><option value="design">Design</option><option value="research">Research</option><option value="content">Content</option><option value="review">Review</option></select></div>
          <div class="field"><label for="taskPriority">Priority</label><select id="taskPriority"><option value="normal">Normal</option><option value="high">High</option></select></div>
        </div>
        <div class="dialog-actions"><button type="button" class="button" id="cancelDialog">Cancel</button><button type="submit" class="button primary">Create task</button></div>
      </form>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const columns = [
      { id: "backlog", title: "Backlog", color: "#b7b2c3" },
      { id: "todo", title: "To do", color: "#e9b66c" },
      { id: "progress", title: "In progress", color: "#8874df" },
      { id: "done", title: "Done", color: "#78b69a" }
    ];
    const projects = [
      { id: "northstar", name: "Northstar", title: "Northstar brand refresh", category: "Brand identity", color: "#8c76df", subtitle: "A little more clarity, a lot more creativity. Let's make something good." },
      { id: "orbit", name: "Orbit website", title: "Orbit website", category: "Web design", color: "#eba973", subtitle: "A fresh digital home, built together from the ground up." },
      { id: "fieldnotes", name: "Fieldnotes app", title: "Fieldnotes app", category: "Product design", color: "#81b8a3", subtitle: "Thoughtful details for a simpler everyday experience." }
    ];
    const seed = [
      { id: 101, project: "northstar", status: "backlog", title: "Explore visual directions", description: "Gather references and find a fresh point of view for the brand.", tags: ["design", "research"], assignee: "AO", due: "Nov 18", comments: 3, files: 2, cover: "brand", priority: "normal" },
      { id: 102, project: "northstar", status: "backlog", title: "Competitor landscape audit", description: "Look at what's out there and find the space we can own.", tags: ["research"], assignee: "ML", due: "Nov 20", comments: 2, files: 0, priority: "normal" },
      { id: 103, project: "northstar", status: "backlog", title: "Draft brand voice guidelines", description: "Define how Northstar sounds across every touchpoint.", tags: ["content"], assignee: "SC", due: "Nov 22", comments: 0, files: 1, priority: "normal" },
      { id: 104, project: "northstar", status: "todo", title: "Build out color palette", description: "Develop a flexible palette for digital and print.", tags: ["design"], assignee: "JR", due: "Nov 14", comments: 5, files: 3, cover: "palette", priority: "high" },
      { id: 105, project: "northstar", status: "todo", title: "Type pairing exploration", description: "Test expressive display fonts with readable body type.", tags: ["design"], assignee: "AO", due: "Nov 16", comments: 2, files: 0, priority: "normal" },
      { id: 106, project: "northstar", status: "todo", title: "Write homepage copy", description: "Create a clear, welcoming story for new visitors.", tags: ["content"], assignee: "SC", due: "Nov 19", comments: 1, files: 0, priority: "normal" },
      { id: 107, project: "northstar", status: "progress", title: "Design landing page concepts", description: "First pass at the new look and feel in action.", tags: ["design", "priority"], assignee: "ML", due: "Nov 13", comments: 8, files: 4, cover: "web", progress: 65, priority: "high" },
      { id: 108, project: "northstar", status: "progress", title: "Refine logo directions", description: "Narrow the strongest concepts down to two routes.", tags: ["design"], assignee: "SC", due: "Nov 15", comments: 6, files: 2, progress: 40, priority: "normal" },
      { id: 109, project: "northstar", status: "done", title: "Brand discovery workshop", description: "Align on goals, audiences, and what makes Northstar different.", tags: ["research"], assignee: "SC", due: "Nov 06", comments: 4, files: 1, priority: "normal" },
      { id: 110, project: "northstar", status: "done", title: "Collect inspiration & references", description: "A shared moodboard to kick off the creative process.", tags: ["design"], assignee: "JR", due: "Nov 04", comments: 2, files: 5, priority: "normal" },
      { id: 201, project: "orbit", status: "backlog", title: "Map the content architecture", description: "Organize the pages and their key messages.", tags: ["content"], assignee: "SC", due: "Nov 24", comments: 1, priority: "normal" },
      { id: 202, project: "orbit", status: "todo", title: "Sketch homepage wireframes", description: "Explore layouts for the main story.", tags: ["design"], assignee: "AO", due: "Nov 17", comments: 3, priority: "high" },
      { id: 203, project: "orbit", status: "progress", title: "Research customer journeys", description: "Understand what visitors need to find.", tags: ["research"], assignee: "ML", due: "Nov 15", comments: 2, progress: 55, priority: "normal" },
      { id: 204, project: "orbit", status: "done", title: "Project kickoff", description: "Set goals, scope, and milestones with the team.", tags: ["review"], assignee: "SC", due: "Nov 05", comments: 2, priority: "normal" },
      { id: 301, project: "fieldnotes", status: "backlog", title: "Explore onboarding moments", description: "Make a great first impression for new users.", tags: ["design"], assignee: "JR", due: "Nov 25", comments: 1, priority: "normal" },
      { id: 302, project: "fieldnotes", status: "todo", title: "Prototype note organization", description: "Test ways to make finding notes effortless.", tags: ["design", "priority"], assignee: "SC", due: "Nov 18", comments: 4, priority: "high" },
      { id: 303, project: "fieldnotes", status: "progress", title: "Run usability sessions", description: "Put the current flow in front of real people.", tags: ["research"], assignee: "AO", due: "Nov 14", comments: 3, progress: 75, priority: "normal" },
      { id: 304, project: "fieldnotes", status: "done", title: "Define product principles", description: "A small set of ideas to guide the work.", tags: ["content"], assignee: "ML", due: "Nov 03", comments: 1, priority: "normal" }
    ];
    const people = { SC: ["#c18070", "Sarah Chen"], ML: ["#7a91ac", "Marcus Lee"], AO: ["#a391bf", "Amara Okafor"], JR: ["#8caa98", "Jamie Rivera"] };
    const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    let tasks;
    try { tasks = JSON.parse(localStorage.getItem("forma-tasks")) || structuredClone(seed); if (!Array.isArray(tasks)) throw Error(); }
    catch { tasks = structuredClone(seed); }
    let currentProject = "northstar", currentView = "board", editingId = null, draggedId = null;
    const $ = id => document.getElementById(id);
    const save = () => localStorage.setItem("forma-tasks", JSON.stringify(tasks));
    const icon = id => `<svg><use href="#i-${id}"/></svg>`;
    function showToast(message) { const el = $("toast"); el.textContent = message; el.classList.add("show"); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => el.classList.remove("show"), 2800); }
    function renderProjects() {
      $("projectList").innerHTML = projects.map(p => `<button class="project-item ${p.id === currentProject ? "active" : ""}" data-project="${p.id}"><span class="project-dot" style="background:${p.color}"></span>${escapeHTML(p.name)}${p.id === currentProject ? `<span class="chevron">${icon("chevron")}</span>` : ""}</button>`).join("");
      const p = projects.find(p => p.id === currentProject);
      $("breadcrumbProject").textContent = p.name;
      $("pageTitle").textContent = p.title;
      $("projectCategory").textContent = p.category;
      $("pageSubtitle").textContent = p.subtitle;
    }
    function coverMarkup(cover) {
      if (cover === "palette") return `<div class="card-cover cover-palette" aria-label="Color palette preview"><span></span><span></span><span></span><span></span></div>`;
      if (cover === "web") return `<div class="card-cover cover-web" aria-label="Website concept preview"><div class="mini-site"></div></div>`;
      return cover === "brand" ? `<div class="card-cover cover-brand" aria-label="Brand concept preview"></div>` : "";
    }
    function cardMarkup(t) {
      const person = people[t.assignee] || people.SC;
      return `<article class="task-card" draggable="true" data-id="${t.id}" aria-label="${escapeHTML(t.title)}">
        ${coverMarkup(t.cover)}
        <div class="card-top"><span class="task-id">FRM-${t.id}</span><button class="card-menu" data-edit="${t.id}" aria-label="Edit ${escapeHTML(t.title)}" title="Edit task">${icon("more")}</button></div>
        <h3>${escapeHTML(t.title)}</h3>${t.description ? `<p class="description">${escapeHTML(t.description)}</p>` : ""}
        <div class="tags">${(t.tags || []).map(tag => `<span class="tag ${escapeHTML(tag)}">${tag === "priority" ? "High priority" : escapeHTML(tag[0].toUpperCase() + tag.slice(1))}</span>`).join("")}</div>
        ${t.status === "progress" && t.progress != null ? `<div class="progress-label"><span>Progress</span><span>${t.progress}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${t.progress}%"></div></div>` : ""}
        <div class="card-footer"><span class="avatar" title="${person[1]}" style="background:${person[0]}">${escapeHTML(t.assignee)}</span>
        ${t.due ? `<span class="meta">${icon("calendar")}${escapeHTML(t.due)}</span>` : ""}
        ${t.files ? `<span class="meta">${icon("clip")}${t.files}</span>` : ""}
        ${t.comments ? `<span class="meta">${icon("message")}${t.comments}</span>` : ""}</div></article>`;
    }
    function render() {
      renderProjects();
      document.querySelectorAll("[data-view]").forEach(el => el.classList.toggle("active", el.dataset.view === currentView));
      const query = $("searchInput").value.trim().toLowerCase(), priority = $("priorityFilter").value;
      const visible = tasks.filter(t => t.project === currentProject &&
        (currentView === "board" || (currentView === "mine" ? t.assignee === "SC" : t.status === "done")) &&
        (priority === "all" || t.priority === priority) &&
        (!query || `${t.title} ${t.description || ""} ${(t.tags || []).join(" ")}`.toLowerCase().includes(query)));
      $("board").innerHTML = columns.map(col => {
        const cards = visible.filter(t => t.status === col.id);
        return `<section class="column" data-status="${col.id}" aria-label="${col.title}">
          <div class="column-head"><span class="status-mark" style="background:${col.color}"></span><span class="column-title">${col.title}</span><span class="column-count">${cards.length}</span><button class="column-add" data-add="${col.id}" aria-label="Add task to ${col.title}">+</button></div>
          <div class="cards">${cards.length ? cards.map(cardMarkup).join("") : `<div class="empty">No tasks here yet</div>`}</div>
          <button class="add-card" data-add="${col.id}">${icon("plus")} Add a task</button>
        </section>`;
      }).join("");
    }
    function openDialog(status = "backlog", id = null) {
      editingId = id;
      const task = tasks.find(t => t.id === id);
      $("taskForm").reset();
      $("dialogTitle").textContent = task ? "Edit task" : "Create a new task";
      $("taskTitle").value = task?.title || "";
      $("taskDescription").value = task?.description || "";
      $("taskStatus").value = task?.status || status;
      $("taskAssignee").value = task?.assignee || "SC";
      $("taskTag").value = (task?.tags || []).find(t => t !== "priority") || "design";
      $("taskPriority").value = task?.priority || "normal";
      document.querySelector("#taskForm button[type=submit]").textContent = task ? "Save changes" : "Create task";
      $("dialogBackdrop").classList.add("open");
      setTimeout(() => $("taskTitle").focus(), 50);
    }
    function closeDialog() { $("dialogBackdrop").classList.remove("open"); editingId = null; }
    document.addEventListener("click", e => {
      const project = e.target.closest("[data-project]"), view = e.target.closest("[data-view]"), add = e.target.closest("[data-add]"), edit = e.target.closest("[data-edit]");
      if (project) { currentProject = project.dataset.project; $("searchInput").value = ""; render(); }
      if (view) { currentView = view.dataset.view; render(); }
      if (add) openDialog(add.dataset.add);
      if (edit) openDialog(null, Number(edit.dataset.edit));
    });
    $("newTask").onclick = () => openDialog();
    $("closeDialog").onclick = $("cancelDialog").onclick = closeDialog;
    $("dialogBackdrop").onclick = e => { if (e.target === $("dialogBackdrop")) closeDialog(); };
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeDialog(); });
    $("searchInput").oninput = render;
    $("priorityFilter").onchange = render;
    $("searchFocus").onclick = () => $("searchInput").focus();
    $("notifications").onclick = () => showToast("You're all caught up!");
    $("inviteButton").onclick = () => { navigator.clipboard?.writeText(location.href).then(() => showToast("Board link copied to clipboard")).catch(() => showToast("Share this page to invite your team")); };
    $("newProject").onclick = () => showToast("Select a project from the list to switch boards");
    $("taskForm").onsubmit = e => {
      e.preventDefault();
      const values = {
        title: $("taskTitle").value.trim(), description: $("taskDescription").value.trim(),
        status: $("taskStatus").value, assignee: $("taskAssignee").value,
        priority: $("taskPriority").value,
        tags: [$("taskTag").value, ...($("taskPriority").value === "high" ? ["priority"] : [])]
      };
      if (!values.title) return;
      if (editingId !== null) Object.assign(tasks.find(t => t.id === editingId), values);
      else tasks.push({ id: Math.max(0, ...tasks.map(t => Number(t.id) || 0)) + 1, project: currentProject, ...values, comments: 0, files: 0 });
      save(); closeDialog(); render(); showToast(editingId === null ? "Task saved" : "Changes saved");
    };
    $("board").addEventListener("dragstart", e => {
      const card = e.target.closest(".task-card"); if (!card) return;
      draggedId = Number(card.dataset.id); e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", String(draggedId));
      requestAnimationFrame(() => card.classList.add("dragging"));
    });
    $("board").addEventListener("dragover", e => {
      const col = e.target.closest(".column"); if (!col || draggedId === null) return;
      e.preventDefault(); e.dataTransfer.dropEffect = "move";
      document.querySelectorAll(".column").forEach(c => c.classList.toggle("drag-over", c === col));
    });
    $("board").addEventListener("drop", e => {
      const col = e.target.closest(".column"); if (!col || draggedId === null) return;
      e.preventDefault();
      const task = tasks.find(t => t.id === draggedId);
      if (task && task.status !== col.dataset.status) {
        task.status = col.dataset.status;
        save(); render(); showToast(`Moved to ${columns.find(c => c.id === task.status).title}`);
      }
      draggedId = null; document.querySelectorAll(".column").forEach(c => c.classList.remove("drag-over"));
    });
    $("board").addEventListener("dragend", () => {
      draggedId = null;
      document.querySelectorAll(".column").forEach(c => c.classList.remove("drag-over"));
      document.querySelectorAll(".dragging").forEach(c => c.classList.remove("dragging"));
    });
    render();
  </script>
</body>
</html>
