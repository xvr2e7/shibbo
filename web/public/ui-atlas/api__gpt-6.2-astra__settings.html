<style>
*{box-sizing:border-box}body{margin:0;background:#f6f6ef;color:#292b27;font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button{background:none;border:0}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e3aa33;outline-offset:3px}.top{height:66px;background:#242622;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(5%,calc((100vw - 1220px)/2))}.brand,.right,.workspace,.row,.crumb,.identity,.actions{display:flex;align-items:center}.brand{gap:10px;font-size:24px;font-weight:720;letter-spacing:-1.4px}.logo{width:32px;height:32px;border-radius:9px;background:#f9cb55;display:grid;place-items:center}.workspace{border-left:1px solid #55564f;margin-left:14px;padding-left:23px;gap:9px;font-size:13px;letter-spacing:0;font-weight:500;color:#dedfd6}.ws{background:#505249;padding:2px 6px;border-radius:4px;color:#f4e8bc;font-weight:700}.right{gap:17px}.pill{border:1px solid #53554f;border-radius:20px;padding:4px 10px;font-size:11px;color:#d7d9cf}.pill:before{content:"";display:inline-block;background:#bfd39b;border-radius:50%;width:6px;height:6px;margin-right:7px}.mini,.avatar{display:grid;place-items:center;background:#f6cd66;color:#383322;font-weight:700;border-radius:50%}.mini{width:32px;height:32px;font-size:12px}.wrap{max-width:1220px;width:90%;margin:auto}.crumb{gap:12px;font-size:12px;color:#777970;padding:27px 0 19px}.crumb span:last-child{color:#34382f}.hero{position:relative;overflow:hidden;border:1px solid #deddd0;background:#eeeee3;border-radius:12px;padding:30px 34px;margin-bottom:27px}.eyebrow{font:700 10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.5px;color:#66695d}.hero h1{font-size:clamp(33px,4vw,49px);line-height:1.1;letter-spacing:-2.6px;margin:8px 0 9px;font-weight:650}.hero p,.sub{color:#71736a;margin:0}.art{position:absolute;width:325px;height:100%;right:12px;top:0}.layout{display:grid;grid-template-columns:228px 1fr;gap:24px;align-items:start;margin-bottom:40px}.side,.card{background:#fff;border:1px solid #dedfd5;border-radius:12px}.side{padding:21px 12px 12px}.side .eyebrow{padding:0 13px;margin-bottom:12px}.nav{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px;border-radius:7px;font-weight:500;color:#61645c}.nav.active{background:#fff0bf;color:#332f21;font-weight:650}.nav.active:after{content:"";border-radius:100%;background:#c68d16;width:6px;height:6px;margin-left:auto}.nav:hover:not(.active){background:#f6f6ef}.sep{height:1px;background:#e9e9e2;margin:13px 5px}.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.card{overflow:hidden}.cardhead{padding:22px 26px 20px;border-bottom:1px solid #e7e8df;display:flex;align-items:center;gap:14px}.tile{height:41px;width:41px;border:1px solid #e9dbad;background:#fff5d6;border-radius:11px;display:grid;place-items:center}.tile .icon{width:21px;height:21px}h2{font-size:21px;line-height:1.4;letter-spacing:-.7px;margin:0}.sub{font-size:13px}.body{padding:23px 26px}.identity{gap:17px;padding-bottom:23px;border-bottom:1px solid #e7e8df;margin-bottom:19px}.avatar{width:64px;height:64px;font-size:23px;letter-spacing:-1px;background-size:cover;background-position:center;flex-shrink:0}.btn{border:1px solid #d8d9cf;border-radius:6px;background:white;padding:8px 13px;font-weight:600;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{filter:brightness(.97)}.btn .icon{width:15px;height:15px}.hint{color:#818379;font-size:11px;margin:6px 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px 18px}.field{display:block;font-size:12px;font-weight:600}.field input,.field select,.field textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid #d9dbd1;border-radius:6px;background:white;font-size:13px;font-weight:400}.full{grid-column:1/-1}.field textarea{resize:vertical;min-height:70px}.optional{font-weight:400;color:#8b8d84}.actions{border-top:1px solid #e7e8df;padding:15px 26px;justify-content:space-between;background:#fcfcf8;gap:10px}.note{font-size:11px;color:#7d8075;display:flex;align-items:center;gap:6px}.note .icon{width:14px;height:14px}.gold{background:#f8c951;border-color:#deaf38;margin-left:6px}.switchrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.switchrow input{accent-color:#b28921;width:18px;height:18px}footer{border-top:1px solid #dedfd4;padding:14px 0 23px;color:#8a8b80;display:flex;justify-content:space-between;font-size:11px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#292c25;color:white;border-radius:8px;padding:11px 18px;box-shadow:0 5px 20px #0002}.hidden,[hidden]{display:none!important}@media(max-width:800px){.layout{grid-template-columns:180px 1fr;gap:14px}.art{width:230px;right:-25px}.wrap{width:94%}.body,.cardhead,.actions{padding-left:18px;padding-right:18px}}@media(max-width:620px){.workspace,.art,.pill,.note{display:none}.hero{padding:22px;margin-bottom:15px}.layout{display:block}.side{display:flex;overflow:auto;padding:6px;margin-bottom:15px}.side .eyebrow,.sep{display:none}.nav{width:auto;white-space:nowrap;padding:9px;font-size:12px}.nav.active:after{display:none}.grid{gap:12px}.actions{justify-content:flex-end}.top{height:56px}.crumb{padding:17px 0 12px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-2a7 7 0 0 1 14 0v2Z"/></symbol>
<symbol id="sliders" viewBox="0 0 24 24"><path d="M4 7h7m4 0h5M4 17h3m4 0h9"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M5 17h14l-2-4V9a5 5 0 0 0-10 0v4ZM10 20q2 2 4 0"/></symbol>
<symbol id="shield" viewBox="0 0 24 24"><path d="m12 3 8 3v5q0 7-8 10-8-3-8-10V6Z"/><path d="m9 12 2 2 4-5"/></symbol>
<symbol id="upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4h16v-4"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
</defs></svg>
<header class="top"><div class="brand"><span class="logo"><svg width="26" height="26" viewBox="0 0 30 30"><circle cx="15" cy="15" r="7" fill="#292b25"/><ellipse cx="15" cy="15" rx="13" ry="5" transform="rotate(-38 15 15)" fill="none" stroke="#292b25" stroke-width="2"/></svg></span>Orbit<div class="workspace"><span class="ws">S</span> Studio North</div></div><div class="right"><span class="pill">Workspace online</span><span class="mini">JD</span></div></header>
<main class="wrap">
<div class="crumb">Workspace <b>›</b> Settings <b>›</b> <span>Account</span></div>
<section class="hero"><div class="eyebrow">PERSONAL WORKSPACE</div><h1>Account settings</h1><p>Manage your profile, preferences, and account security.</p>
<svg class="art" viewBox="0 0 325 164" aria-hidden="true"><defs><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b6b7a6"/></pattern></defs><rect x="166" y="16" width="124" height="129" fill="url(#dots)"/><g transform="rotate(-24 165 85)" stroke="#414538" stroke-width="1.4"><ellipse cx="167" cy="84" rx="133" ry="38" fill="none"/><circle cx="165" cy="84" r="53" fill="#f6ca56"/><ellipse cx="165" cy="84" rx="31" ry="53" fill="none"/><ellipse cx="165" cy="84" rx="12" ry="53" fill="none"/><path d="M114 68q50 17 101 0m-101 33q50 17 101 0" fill="none"/><path d="M34 84a133 38 0 0 0 266 0" fill="none" stroke-width="2"/><circle cx="60" cy="106" r="6" fill="#414538"/></g><path d="m80 25 2 7 7 2-7 2-2 7-2-7-7-2 7-2zM267 111l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#46493f"/></svg>
</section>
<div class="layout"><aside class="side" aria-label="Account settings sections"><div class="eyebrow">ACCOUNT</div><button class="nav active" data-tab="Profile" data-icon="user">Profile</button><button class="nav" data-tab="Preferences" data-icon="sliders">Preferences</button><button class="nav" data-tab="Notifications" data-icon="bell">Notifications</button><div class="sep"></div><button class="nav" data-tab="Security" data-icon="shield">Security</button></aside>
<section class="card"><header class="cardhead"><span class="tile" id="tile"></span><div><h2 id="title">Profile details</h2><p class="sub" id="description">Your personal information and how others see you.</p></div></header>
<form id="form"><div class="body" id="content"></div><div class="actions"><span class="note" id="status"></span><div><button class="btn" type="button" id="cancel">Cancel</button><button class="btn gold" type="submit">Save changes</button></div></div></form></section></div>
<footer><span>Orbit workspace</span><span>Personal settings</span></footer></main><div class="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s),icon=n=>`<svg class="icon" aria-hidden="true"><use href="#${n}"/></svg>`;
let state={first:"Jamie",last:"Davis",email:"jamie@studionorth.design",role:"Product Designer",bio:"Designing thoughtful experiences with the team at Studio North.",language:"English",week:"Monday",mentions:true,updates:true,digest:false,lock:false,photo:""},tab="Profile",photo;
try{Object.assign(state,JSON.parse(localStorage.getItem("orbit_settings")||"{}"))}catch{}
const info={Profile:["Profile details","Your personal information and how others see you."],Preferences:["Preferences","Choose how your workspace is displayed."],Notifications:["Notifications","Choose the updates you want to receive."],Security:["Security","Manage privacy for your local workspace."]};
function field(label,name,type="text",full=false){return `<label class="field ${full?"full":""}">${label}<input type="${type}" name="${name}" ${["first","last","email"].includes(name)?"required":""}></label>`}
function select(label,name,items){return `<label class="field">${label}<select name="${name}">${items.map(i=>`<option>${i}</option>`).join("")}</select></label>`}
function toggle(label,name,desc){return `<label class="switchrow"><span><strong>${label}</strong><br><span class="sub">${desc}</span></span><input type="checkbox" name="${name}"></label>`}
function paint(){let initials=((state.first[0]||"")+(state.last[0]||"")).toUpperCase();$(".mini").textContent=initials;let a=$(".avatar");if(a){a.textContent=photo?"":initials;a.style.backgroundImage=photo?`url("${photo}")`:"none"}}
function render(){photo=state.photo;document.querySelectorAll(".nav").forEach(b=>{b.classList.toggle("active",b.dataset.tab===tab);b.setAttribute("aria-pressed",b.dataset.tab===tab)});$("#tile").innerHTML=icon($(".nav.active").dataset.icon);$("#title").textContent=info[tab][0];$("#description").textContent=info[tab][1];$("#content").innerHTML=tab==="Profile"?`<div class="identity"><span class="avatar"></span><div><button class="btn" id="change" type="button">${icon("upload")} Change photo</button><input type="file" id="file" hidden accept="image/png,image/jpeg"><p class="hint">JPG or PNG. Max 2 MB.</p></div></div><div class="grid">${field("First name","first")}${field("Last name","last")}${field("Email address","email","email")}${field("Job title","role")}<label class="field full">Bio <span class="optional">(optional)</span><textarea name="bio" maxlength="300"></textarea></label></div>`:tab==="Preferences"?`<div class="grid">${select("Language","language",["English","Spanish","French"])}${select("Start of week","week",["Monday","Sunday","Saturday"])}</div>`:tab==="Notifications"?toggle("Direct mentions","mentions","When a teammate mentions you.")+toggle("Project updates","updates","Changes to projects you follow.")+toggle("Weekly digest","digest","A weekly summary of your workspace."):toggle("Hide email in profile preview","lock","Keep your email private in the saved profile summary.");
document.querySelectorAll("[name]").forEach(e=>{if(e.name in state){if(e.type==="checkbox")e.checked=state[e.name];else e.value=state[e.name]}});paint();$("#status").innerHTML=icon("check")+" All changes saved";
if($("#change")){$("#change").onclick=()=>$("#file").click();$("#file").onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>2097152||!["image/png","image/jpeg"].includes(f.type))return toast("Choose a JPG or PNG under 2 MB.");let r=new FileReader;r.onload=()=>{photo=r.result;paint();dirty()};r.readAsDataURL(f)}}}
function dirty(){$("#status").textContent="Unsaved changes"}let timer;function toast(s){let t=$(".toast");t.textContent=s;t.hidden=false;clearTimeout(timer);timer=setTimeout(()=>t.hidden=true,2400)}
document.querySelectorAll(".nav").forEach(b=>{b.innerHTML=icon(b.dataset.icon)+b.textContent;b.onclick=()=>{tab=b.dataset.tab;render()}});$("#form").oninput=dirty;$("#cancel").onclick=render;$("#form").onsubmit=e=>{e.preventDefault();document.querySelectorAll("#content [name]").forEach(el=>state[el.name]=el.type==="checkbox"?el.checked:el.value.trim());if(tab==="Profile")state.photo=photo;try{localStorage.setItem("orbit_settings",JSON.stringify(state));render();toast("Changes saved")}catch{toast("Unable to save. Try a smaller photo.")}};render();
</script>
</body></html>
