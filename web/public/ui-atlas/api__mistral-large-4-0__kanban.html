<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Kanban — Design Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg1:#f7f8fc; --bg2:#eceef7;
    --surface:#ffffff; --col-bg:#eef0f7;
    --border:#e3e6f0; --text:#171a26; --muted:#767d97; --faint:#a7aec3;
    --accent:#6366f1; --accent-soft:rgba(99,102,241,.12);
    --danger:#dc2626;
    --shadow:0 1px 2px rgba(23,26,38,.05),0 10px 26px -14px rgba(23,26,38,.18);
    --header-bg:rgba(255,255,255,.72);
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --bg1:#0c0e15; --bg2:#111420;
    --surface:#1a1d2b; --col-bg:#151826;
    --border:#272c40; --text:#e9ebf5; --muted:#98a0b8; --faint:#5d6478;
    --accent:#818cf8; --accent-soft:rgba(129,140,248,.16);
    --danger:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.65);
    --header-bg:rgba(12,14,21,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    color:var(--text);
    display:flex;flex-direction:column;
    min-height:100vh;overflow:hidden;
    background:
      radial-gradient(900px 480px at 88% -12%, color-mix(in srgb,var(--accent) 11%, transparent), transparent 62%),
      radial-gradient(720px 520px at -12% 112%, rgba(236,72,153,.09), transparent 60%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
  }
  button{font-family:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;border:2.5px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-corner{background:transparent}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 22px;flex:none;z-index:40;
    background:var(--header-bg);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,#6366f1,#a855f7 55%,#ec4899);
    box-shadow:0 8px 18px -8px rgba(99,102,241,.7)}
  .logo svg{width:20px;height:20px}
  .board-name{font-family:'Sora',sans-serif;font-size:17.5px;font-weight:700;color:var(--text);
    background:transparent;border:none;border-bottom:1px dashed transparent;outline:none;
    width:24ch;min-width:10ch;padding:2px 0}
  .board-name:hover{border-bottom-color:var(--border)}
  .board-name:focus{border-bottom-color:var(--accent)}
  .subtitle{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46ch}
  .h-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 11px;color:var(--muted)}
  .search svg{width:15px;height:15px;flex:none}
  .search input{border:none;outline:none;background:transparent;font:inherit;font-size:13px;color:var(--text);width:150px}
  .search input::placeholder{color:var(--faint)}
  .stat{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 12px;white-space:nowrap}
  .stat .bar{width:70px;height:5px;border-radius:99px;background:var(--col-bg);overflow:hidden}
  .stat .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#6366f1,#22c55e);transition:width .35s}
  .avatars{display:flex;padding-left:6px}
  .avatars span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:9.5px;font-weight:800;border:2px solid var(--bg1);margin-left:-6px}
  .icon-btn{width:33px;height:33px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.15s;flex:none}
  .icon-btn:hover{color:var(--text);border-color:var(--faint)}
  .icon-btn svg{width:15px;height:15px}
  .btn{border:none;border-radius:10px;font-weight:600;cursor:pointer;padding:8px 14px;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .btn svg{width:14px;height:14px}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 16px -8px color-mix(in srgb,var(--accent) 75%,transparent)}
  .btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .btn.ghost:hover{color:var(--text);background:var(--col-bg)}
  .btn.danger{background:rgba(239,68,68,.12);color:var(--danger)}
  .btn.danger.confirm{background:var(--danger);color:#fff}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}

  /* ---------- board ---------- */
  #board{flex:1;min-height:0;display:flex;gap:14px;padding:18px 22px 26px;align-items:flex-start;overflow-x:auto;overflow-y:hidden}
  .column{flex:0 0 296px;max-height:100%;display:flex;flex-direction:column;background:var(--col-bg);border:1px solid var(--border);border-radius:16px;transition:outline .12s}
  .column.drag-over{outline:2px dashed var(--accent);outline-offset:-2px}
  .col-head{display:flex;align-items:center;gap:8px;padding:13px 10px 9px 14px}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .col-title{flex:1;min-width:0;font-size:13px;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
  .col-rename{flex:1;min-width:0;font:inherit;font-size:13px;font-weight:700;color:var(--text);background:var(--surface);border:1px solid var(--accent);border-radius:7px;padding:2px 6px;outline:none}
  .count{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:2px 8px;border-radius:999px;flex:none}
  .count.over{background:var(--danger);border-color:var(--danger);color:#fff}
  .col-del{opacity:0;width:26px;height:26px;border:none;background:transparent;box-shadow:none}
  .column:hover .col-del{opacity:1}
  .col-del.confirm{opacity:1;color:#fff;background:var(--danger)}
  .col-del svg{width:13px;height:13px}
  .col-cards{flex:1;overflow-y:auto;padding:2px 10px 8px;display:flex;flex-direction:column;gap:9px;min-height:56px;scrollbar-width:thin}
  .empty{border:1.5px dashed var(--border);border-radius:12px;padding:18px 12px;text-align:center;font-size:12px;color:var(--faint)}
  .drop-ph{height:4px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);flex:none}

  /* ---------- card ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 12px 11px 15px;position:relative;cursor:grab;user-select:none;-webkit-user-select:none;box-shadow:0 1px 2px rgba(15,18,30,.04);transition:transform .15s,box-shadow .15s,border-color .15s,opacity .15s;animation:cardIn .16s ease}
  @keyframes cardIn{from{opacity:0;transform:translateY(5px)}}
  .card::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--pc,transparent)}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.35;transform:rotate(2deg) scale(.98)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .chip{font-size:10px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flag{display:grid;place-items:center;flex:none}
  .flag svg{width:13px;height:13px;display:block}
  .card-title{font-size:13.5px;font-weight:600;line-height:1.35;margin:7px 0 3px;overflow-wrap:anywhere}
  .card-desc{font-size:11.8px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .card-meta{display:flex;align-items:center;gap:9px;margin-top:10px;color:var(--muted)}
  .meta-item{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600}
  .meta-item svg{width:12.5px;height:12.5px}
  .due{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2.5px 7px;border-radius:6px;background:var(--col-bg);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
  .due svg{width:11px;height:11px}
  .due.today{background:rgba(245,158,11,.15);color:#d97706;border-color:transparent}
  [data-theme="dark"] .due.today{color:#fbbf24}
  .due.soon{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .due.overdue{background:rgba(239,68,68,.14);color:var(--danger);border-color:transparent}
  .avatar{margin-left:auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:800;flex:none;box-shadow:0 0 0 2px var(--surface)}

  /* ---------- quick add / add column ---------- */
  .quick-add{padding:0 10px 12px}
  .add-btn{width:100%;display:flex;align-items:center;gap:7px;padding:9px 11px;border-radius:10px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
  .add-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .add-btn svg{width:14px;height:14px}
  .qa-form{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px;box-shadow:var(--shadow)}
  .qa-form textarea,.qa-form input{width:100%;border:none;outline:none;background:transparent;font:inherit;font-size:13px;color:var(--text);resize:none}
  .qa-form textarea::placeholder,.qa-form input::placeholder{color:var(--faint)}
  .qa-actions{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
  .add-col{background:transparent;border:1.5px dashed var(--border);min-height:150px}
  .add-col-btn{flex:1;margin:12px;border:none;background:transparent;border-radius:12px;color:var(--faint);font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.15s}
  .add-col-btn:hover{color:var(--accent);background:var(--accent-soft)}
  .add-col-btn svg{width:16px;height:16px}
  .add-col .qa-form{margin:12px;flex:1;display:flex;flex-direction:column}

  /* ---------- modal ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(8,10,18,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:100}
  .backdrop.open{opacity:1;pointer-events:auto}
  .modal{width:min(540px,100%);max-height:calc(100vh - 60px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px 22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);transform:translateY(10px) scale(.98);transition:transform .18s}
  .backdrop.open .modal{transform:none}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .modal-head h3{font-family:'Sora',sans-serif;font-size:16px}
  .field{display:block;margin-bottom:13px}
  .field>span{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;background:var(--col-bg);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;color:var(--text);outline:none;transition:.15s}
  .field textarea{resize:vertical;min-height:70px}
  .field :is(input,select,textarea):focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
  #fDelete{margin-right:auto}

  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);background:var(--text);color:var(--bg1);padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 14px 30px -10px rgba(0,0,0,.45)}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:900px){
    .stat{display:none}
    .search input{width:100px}
    .subtitle{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo" id="logoIcon"></div>
    <div>
      <input class="board-name" id="boardName" spellcheck="false" aria-label="Board name">
      <div class="subtitle">Small design team · drag cards between columns · double-click a column to rename</div>
    </div>
  </div>
  <div class="h-right">
    <label class="search"><span id="searchIcon"></span><input id="search" placeholder="Search cards…" autocomplete="off"></label>
    <div class="stat" title="Completed vs total cards"><span id="statText"></span><span class="bar"><i id="statBar"></i></span></div>
    <div class="avatars" id="avatars"></div>
    <button class="icon-btn" id="themeBtn" title="Toggle dark mode"></button>
    <button class="btn primary" id="newCardBtn"><span id="plusIcon"></span>New card</button>
  </div>
</header>

<main id="board"></main>

<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 id="modalTitle">Edit card</h3>
      <button class="icon-btn" id="modalClose" title="Close"></button>
    </div>
    <form id="cardForm">
      <label class="field"><span>Title</span><input id="fTitle" required maxlength="120" placeholder="What needs to be done?"></label>
      <label class="field"><span>Description</span><textarea id="fDesc" rows="3" placeholder="Add a few details…"></textarea></label>
      <div class="row2">
        <label class="field"><span>Label</span><select id="fLabel"></select></label>
        <label class="field"><span>Assignee</span><select id="fAssignee"></select></label>
      </div>
      <div class="row2">
        <label class="field"><span>Due date</span><input type="date" id="fDue"></label>
        <label class="field"><span>Priority</span>
          <select id="fPriority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>
      </div>
      <label class="field" id="fColWrap" hidden><span>Column</span><select id="fCol"></select></label>
      <div class="modal-foot">
        <button type="button" class="btn danger" id="fDelete" hidden>Delete</button>
        <button type="button" class="btn ghost" id="fCancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const boardEl = $('#board');

  /* ---------- icons ---------- */
  const svg = inner => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  const I = {
    search: svg('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>'),
    plus:   svg('<path d="M12 5v14M5 12h14"/>'),
    x:      svg('<path d="M18 6 6 18M6 6l12 12"/>'),
    comment:svg('<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>'),
    clip:   svg('<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>'),
    flag:   svg('<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>'),
    trash:  svg('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>'),
    cal:    svg('<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>'),
    sun:    svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>'),
    moon:   svg('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'),
    pen:    svg('<path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/>')
  };

  /* ---------- data ---------- */
  const LABELS = {
    'UI/UX':'#6366f1','Branding':'#ec4899','Research':'#14b8a6','Motion':'#f59e0b',
    'Web':'#3b82f6','Mobile':'#8b5cf6','Design System':'#64748b','Marketing':'#f97316'
  };
  const PRIORITIES = { high:'#ef4444', medium:'#f59e0b', low:'#94a3b8' };
  const TEAM = [
    {id:'maya',  name:'Maya Chen',   initials:'MC', grad:'linear-gradient(135deg,#f472b6,#fb7185)'},
    {id:'leo',   name:'Leo Martins', initials:'LM', grad:'linear-gradient(135deg,#60a5fa,#22d3ee)'},
    {id:'priya', name:'Priya Nair',  initials:'PN', grad:'linear-gradient(135deg,#34d399,#2dd4bf)'},
    {id:'jonas', name:'Jonas Weber', initials:'JW', grad:'linear-gradient(135deg,#a78bfa,#818cf8)'}
  ];
  const COL_COLORS = ['#6366f1','#ec4899','#14b8a6','#f59e0b','#3b82f6','#8b5cf6','#22c55e','#f97316'];

  const uid = () => 'k' + Math.random().toString(36).slice(2, 10);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const iso = off => { const d = new Date(); d.setDate(d.getDate() + off); return d.toISOString().slice(0,10); };
  const member = id => TEAM.find(m => m.id === id);

  const KEY = 'studio-kanban-design-v1';

  function seed(){
    return {
      boardName:'Sprint 24 · Design Board',
      theme:'light',
      columns:[
        { id:'c-backlog', title:'Backlog', color:'#94a3b8', wip:0, cards:[
          {id:'k1', title:'Onboarding flow v3', desc:'Rework the 3-step onboarding with a progress indicator and a skip option. Wire up analytics events for each step.', label:'UI/UX', assignee:'maya', due:iso(5), priority:'high', comments:4, attachments:2},
          {id:'k2', title:'Brand refresh moodboards', desc:'Collect 3 directional moodboards for the rebrand — print-inspired, brutalist and warm minimal.', label:'Branding', assignee:'leo', due:iso(9), priority:'low', comments:1, attachments:5},
          {id:'k3', title:'User interviews — round 2', desc:'Recruit 5 power users and run moderated sessions on the new dashboard concept.', label:'Research', assignee:'priya', due:iso(3), priority:'medium', comments:2, attachments:0},
          {id:'k4', title:'Icon set: 40 new glyphs', desc:'Extend the icon library with 40 line icons on a 24px grid, consistent 2px stroke.', label:'Design System', assignee:'jonas', due:iso(12), priority:'low', comments:0, attachments:1}
        ]},
        { id:'c-progress', title:'In Progress', color:'#6366f1', wip:3, cards:[
          {id:'k5', title:'Mobile app — home screen redesign', desc:'Search-first home layout with quick actions and personalized feed cards.', label:'Mobile', assignee:'maya', due:iso(1), priority:'high', comments:7, attachments:3},
          {id:'k6', title:'Marketing site hero animations', desc:'Subtle scroll-driven motion for the hero. Respect prefers-reduced-motion.', label:'Motion', assignee:'jonas', due:iso(4), priority:'medium', comments:3, attachments:1},
          {id:'k7', title:'Design tokens cleanup', desc:'Merge duplicate color tokens, map semantic aliases, document naming rules in Storybook.', label:'Design System', assignee:'priya', due:iso(2), priority:'medium', comments:5, attachments:0}
        ]},
        { id:'c-review', title:'In Review', color:'#f59e0b', wip:3, cards:[
          {id:'k8', title:'Checkout flow prototype', desc:'High-fi prototype of the 2-step checkout with Apple Pay and Klarna express options.', label:'UI/UX', assignee:'leo', due:iso(0), priority:'high', comments:9, attachments:4},
          {id:'k9', title:'Transactional email templates', desc:'Six transactional email templates matching the new brand, dark-mode safe.', label:'Marketing', assignee:'priya', due:iso(1), priority:'low', comments:2, attachments:2}
        ]},
        { id:'c-done', title:'Done', color:'#22c55e', wip:0, isDone:true, cards:[
          {id:'k10', title:'Logo exploration — round 1', desc:'12 logo directions presented to stakeholders; feedback consolidated.', label:'Branding', assignee:'leo', due:iso(-3), priority:'medium', comments:6, attachments:8},
          {id:'k11', title:'Usability test report — v2 dashboard', desc:'Synthesis of 8 sessions with severity-ranked issues and recommended fixes.', label:'Research', assignee:'priya', due:iso(-5), priority:'medium', comments:3, attachments:1},
          {id:'k12', title:'Accessibility audit fixes', desc:'Contrast fixes, focus rings and aria labels across marketing pages. WCAG AA pass.', label:'Web', assignee:'maya', due:iso(-7), priority:'high', comments:4, attachments:0}
        ]}
      ]
    };
  }

  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch(e) { state = null; }
  if (!state || !Array.isArray(state.columns)) state = seed();
  state.query = '';

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify({ boardName:state.boardName, theme:state.theme, columns:state.columns })); } catch(e){}
  }

  /* ---------- helpers ---------- */
  function matches(c){
    const q = (state.query || '').trim().toLowerCase();
    if (!q) return true;
    const m = member(c.assignee);
    return (c.title + ' ' + (c.desc||'') + ' ' + (c.label||'') + ' ' + (m ? m.name : '')).toLowerCase().includes(q);
  }
  function dueChip(due){
    if (!due) return '';
    const d = new Date(due + 'T00:00:00');
    const t = new Date(); t.setHours(0,0,0,0);
    const diff = Math.round((d - t) / 864e5);
    const fmt = d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
    if (diff < 0)  return `<span class="due overdue">${I.cal}Overdue</span>`;
    if (diff === 0) return `<span class="due today">${I.cal}Today</span>`;
    if (diff === 1) return `<span class="due soon">${I.cal}Tomorrow</span>`;
    return `<span class="due">${I.cal}${fmt}</span>`;
  }
  function cardHTML(c){
    const m = member(c.assignee);
    const lc = LABELS[c.label] || '#64748b';
    const pc = PRIORITIES[c.priority] || 'transparent';
    return `<article class="card" draggable="true" data-id="${c.id}" style="--pc:${pc}">
      <div class="card-top">
        <span class="chip" style="--c:${lc}">${esc(c.label || 'No label')}</span>
        <span class="flag" style="color:${pc}" title="${c.priority} priority">${I.flag}</span>
      </div>
      <h4 class="card-title">${esc(c.title)}</h4>
      ${c.desc ? `<p class="card-desc">${esc(c.desc)}</p>` : ''}
      <div class="card-meta">
        ${dueChip(c.due)}
        ${c.comments ? `<span class="meta-item" title="Comments">${I.comment}${c.comments}</span>` : ''}
        ${c.attachments ? `<span class="meta-item" title="Attachments">${I.clip}${c.attachments}</span>` : ''}
        <span class="avatar" style="background:${m ? m.grad : '#94a3b8'}" title="${m ? esc(m.name) : 'Unassigned'}">${m ? m.initials : '–'}</span>
      </div>
    </article>`;
  }

  /* ---------- drag & drop ---------- */
  let drag = null, ph = null, lastDragEnd = 0;
  function makePh(){ const d = document.createElement('div'); d.className = 'drop-ph'; return d; }
  function removePh(){ if (ph){ ph.remove(); ph = null; } }
  function getAfter(list, y){
    const els = [...list.querySelectorAll('.card:not(.dragging)')];
    return els.find(el => y < el.getBoundingClientRect().top + el.offsetHeight / 2);
  }
  document.addEventListener('dragend', () => { removePh(); document.querySelectorAll('.column.drag-over').forEach(c => c.classList.remove('drag-over')); });

  /* ---------- render ---------- */
  function render(){
    boardEl.innerHTML = '';
    state.columns.forEach(col => boardEl.appendChild(buildColumn(col)));
    boardEl.appendChild(buildAddColumn());
    bindStats();
  }

  function buildColumn(col){
    const el = document.createElement('section');
    el.className = 'column';
    el.dataset.col = col.id;
    const visible = col.cards.filter(matches);
    el.innerHTML = `
      <div class="col-head">
        <span class="dot" style="background:${col.color}"></span>
        <h3 class="col-title" title="Double-click to rename">${esc(col.title)}</h3>
        <span class="count ${col.wip && col.cards.length > col.wip ? 'over' : ''}" title="${col.wip ? 'WIP limit ' + col.wip : 'Card count'}">${col.cards.length}${col.wip ? '/' + col.wip : ''}</span>
        <button class="icon-btn col-del" title="Delete column">${I.trash}</button>
      </div>
      <div class="col-cards" data-col="${col.id}">
        ${visible.length ? visible.map(cardHTML).join('') : `<div class="empty">No cards here${state.query ? ' matching &ldquo;' + esc(state.query) + '&rdquo;' : ''}.</div>`}
      </div>
      <div class="quick-add">
        <button class="add-btn">${I.plus}<span>Add card</span></button>
        <div class="qa-form" hidden>
          <textarea rows="2" placeholder="Card title… (Enter to add)"></textarea>
          <div class="qa-actions">
            <button class="btn primary sm" data-qa-add>Add</button>
            <button class="btn ghost sm" data-qa-cancel>Cancel</button>
          </div>
        </div>
      </div>`;

    const list = el.querySelector('.col-cards');

    /* cards: drag + click-to-edit */
    el.querySelectorAll('.card').forEach(cardEl => {
      const card = col.cards.find(c => c.id === cardEl.dataset.id);
      cardEl.addEventListener('dragstart', e => {
        drag = { id: card.id, from: col.id };
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', card.id);
        requestAnimationFrame(() => cardEl.classList.add('dragging'));
      });
      cardEl.addEventListener('dragend', () => {
        cardEl.classList.remove('dragging');
        removePh();
        drag = null;
        lastDragEnd = Date.now();
      });
      cardEl.addEventListener('click', () => {
        if (Date.now() - lastDragEnd < 150) return;
        openModal(card, col.id);
      });
    });

    /* column-level drop zone */
    el.addEventListener('dragover', e => {
      if (!drag) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      el.classList.add('drag-over');
      if (!ph) ph = makePh();
      const after = getAfter(list, e.clientY);
      if (after == null) list.appendChild(ph); else list.insertBefore(ph, after);
    });
    el.addEventListener('drop', e => {
      e.preventDefault();
      if (!drag) return;
      const targetCol = state.columns.find(c => c.id === list.dataset.col);
      const fromCol = state.columns.find(c => c.id === drag.from);
      const card = fromCol && fromCol.cards.find(c => c.id === drag.id);
      if (!targetCol || !card) { removePh(); return; }
      fromCol.cards = fromCol.cards.filter(c => c.id !== card.id);
      let refId = null;
      if (ph && ph.parentNode === list){
        let n = ph.nextElementSibling;
        while (n && !n.classList.contains('card')) n = n.nextElementSibling;
        if (n) refId = n.dataset.id;
      }
      const refIdx = refId ? targetCol.cards.findIndex(c => c.id === refId) : -1;
      if (refIdx >= 0) targetCol.cards.splice(refIdx, 0, card); else targetCol.cards.push(card);
      removePh();
      el.classList.remove('drag-over');
      if (targetCol.wip && targetCol.cards.length > targetCol.wip)
        toast(`WIP limit for “${targetCol.title}” exceeded (${targetCol.wip})`);
      else toast(`Moved to ${targetCol.title}`);
      save(); render();
    });

    /* quick add */
    const addBtn = el.querySelector('.add-btn');
    const qaForm = el.querySelector('.qa-form');
    const ta = qaForm.querySelector('textarea');
    const closeQa = () => { qaForm.hidden = true; ta.value = ''; addBtn.hidden = false; };
    addBtn.addEventListener('click', () => { addBtn.hidden = true; qaForm.hidden = false; ta.focus(); });
    qaForm.querySelector('[data-qa-cancel]').addEventListener('click', closeQa);
    const doAdd = () => {
      const v = ta.value.trim();
      if (!v){ ta.focus(); return; }
      col.cards.push({ id: uid(), title: v, desc:'', label:'UI/UX', assignee:'', due:'', priority:'medium', comments:0, attachments:0 });
      closeQa(); save(); render(); toast('Card added to ' + col.title);
    };
    qaForm.querySelector('[data-qa-add]').addEventListener('click', doAdd);
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); doAdd(); }
      if (e.key === 'Escape') closeQa();
    });

    /* rename column */
    const titleEl = el.querySelector('.col-title');
    titleEl.addEventListener('dblclick', () => {
      const inp = document.createElement('input');
      inp.className = 'col-rename';
      inp.value = col.title;
      inp.maxLength = 40;
      titleEl.replaceWith(inp);
      inp.focus(); inp.select();
      const commit = () => { const v = inp.value.trim(); if (v) col.title = v; save(); render(); };
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') inp.blur();
        if (e.key === 'Escape'){ inp.value = col.title; inp.blur(); }
      });
    });

    /* delete column (two-step confirm) */
    const delBtn = el.querySelector('.col-del');
    let delTimer;
    delBtn.addEventListener('click', () => {
      if (delBtn.classList.contains('confirm')){
        state.columns = state.columns.filter(c => c.id !== col.id);
        save(); render(); toast('Column deleted');
      } else {
        delBtn.classList.add('confirm');
        delBtn.title = 'Click again to confirm';
        clearTimeout(delTimer);
        delTimer = setTimeout(() => { delBtn.classList.remove('confirm'); delBtn.title = 'Delete column'; }, 2600);
      }
    });

    return el;
  }

  function buildAddColumn(){
    const el = document.createElement('section');
    el.className = 'column add-col';
    el.innerHTML = `
      <button class="add-col-btn">${I.plus}<span>Add column</span></button>
      <div class="qa-form" hidden>
        <input class="col-name-in" placeholder="Column name…" maxlength="40">
        <div class="qa-actions">
          <button class="btn primary sm" data-ac-add>Add</button>
          <button class="btn ghost sm" data-ac-cancel>Cancel</button>
        </div>
      </div>`;
    const btn = el.querySelector('.add-col-btn');
    const form = el.querySelector('.qa-form');
    const inp = form.querySelector('input');
    const close = () => { form.hidden = true; inp.value = ''; btn.hidden = false; };
    btn.addEventListener('click', () => { btn.hidden = true; form.hidden = false; inp.focus(); });
    form.querySelector('[data-ac-cancel]').addEventListener('click', close);
    const add = () => {
      const v = inp.value.trim();
      if (!v){ inp.focus(); return; }
      const color = COL_COLORS[state.columns.length % COL_COLORS.length];
      state.columns.push({ id: uid(), title: v, color, wip: 0, cards: [] });
      close(); save(); render(); toast('Column “' + v + '” added');
    };
    form.querySelector('[data-ac-add]').addEventListener('click', add);
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ e.preventDefault(); add(); }
      if (e.key === 'Escape') close();
    });
    return el;
  }

  function bindStats(){
    const total = state.columns.reduce((n, c) => n + c.cards.length, 0);
    const doneCol = state.columns.find(c => c.isDone) || state.columns.find(c => /done/i.test(c.title));
    const done = doneCol ? doneCol.cards.length : 0;
    $('#statText').textContent = `${done}/${total} done`;
    $('#statBar').style.width = (total ? (done / total * 100) : 0) + '%';
  }

  /* ---------- modal ---------- */
  const backdrop = $('#backdrop');
  let editing = null; // {card, colId} | {isNew:true}
  $('#fLabel').innerHTML = Object.keys(LABELS).map(l => `<option>${esc(l)}</option>`).join('');
  $('#fAssignee').innerHTML = `<option value="">Unassigned</option>` + TEAM.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
  $('#modalClose').innerHTML = I.x;

  function openModal(card, colId){
    editing = card ? { card, colId } : { isNew: true };
    $('#modalTitle').textContent = card ? 'Edit card' : 'New card';
    $('#fTitle').value = card ? card.title : '';
    $('#fDesc').value = card ? (card.desc || '') : '';
    $('#fLabel').value = card ? (card.label || 'UI/UX') : 'UI/UX';
    $('#fAssignee').value = card ? (card.assignee || '') : '';
    $('#fDue').value = card && card.due ? card.due : '';
    $('#fPriority').value = card ? (card.priority || 'medium') : 'medium';
    const delBtn = $('#fDelete');
    delBtn.hidden = !card;
    delBtn.classList.remove('confirm');
    delBtn.textContent = 'Delete';
    if (!card){
      const cols = state.columns.map(c => `<option value="${c.id}">${esc(c.title)}</option>`).join('');
      $('#fCol').innerHTML = cols;
      const prog = state.columns.find(c => /progress/i.test(c.title));
      $('#fCol').value = prog ? prog.id : state.columns[0].id;
      $('#fColWrap').hidden = false;
    } else {
      $('#fColWrap').hidden = true;
    }
    backdrop.classList.add('open');
    setTimeout(() => $('#fTitle').focus(), 60);
  }
  function closeModal(){ backdrop.classList.remove('open'); editing = null; }

  $('#modalClose').addEventListener('click', closeModal);
  $('#fCancel').addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && backdrop.classList.contains('open')) closeModal(); });

  $('#cardForm').addEventListener('submit', e => {
    e.preventDefault();
    const data = {
      title: $('#fTitle').value.trim(),
      desc: $('#fDesc').value.trim(),
      label: $('#fLabel').value,
      assignee: $('#fAssignee').value,
      due: $('#fDue').value,
      priority: $('#fPriority').value
    };
    if (!data.title){ $('#fTitle').focus(); return; }
    if (editing && editing.isNew){
      const col = state.columns.find(c => c.id === $('#fCol').value) || state.columns[0];
      col.cards.push({ ...data, id: uid(), comments: 0, attachments: 0 });
      toast('Card created');
    } else if (editing){
      Object.assign(editing.card, data);
      toast('Card updated');
    }
    closeModal(); save(); render();
  });

  $('#fDelete').addEventListener('click', function(){
    const btn = this;
    if (!btn.classList.contains('confirm')){
      btn.classList.add('confirm');
      btn.textContent = 'Confirm delete?';
      setTimeout(() => { btn.classList.remove('confirm'); btn.textContent = 'Delete'; }, 2600);
      return;
    }
    if (editing && editing.card){
      const col = state.columns.find(c => c.id === editing.colId);
      if (col) col.cards = col.cards.filter(c => c.id !== editing.card.id);
      closeModal(); save(); render(); toast('Card deleted');
    }
  });

  /* ---------- toast ---------- */
  let toastTimer;
  function toast(msg){
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ---------- header ---------- */
  $('#logoIcon').innerHTML = I.pen;
  $('#searchIcon').innerHTML = I.search;
  $('#plusIcon').innerHTML = I.plus;
  $('#avatars').innerHTML = TEAM.map(m => `<span style="background:${m.grad}" title="${esc(m.name)}">${m.initials}</span>`).join('');

  const nameInput = $('#boardName');
  nameInput.value = state.boardName;
  nameInput.addEventListener('input', () => { state.boardName = nameInput.value; save(); });

  $('#search').addEventListener('input', e => { state.query = e.target.value; render(); });
  $('#newCardBtn').addEventListener('click', () => openModal(null));

  function applyTheme(){
    document.documentElement.dataset.theme = state.theme;
    $('#themeBtn').innerHTML = state.theme === 'dark' ? I.sun : I.moon;
    $('#themeBtn').title = state.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
  }
  $('#themeBtn').addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    applyTheme(); save();
  });

  /* ---------- init ---------- */
  applyTheme();
  render();
})();
</script>
</body>
</html>
