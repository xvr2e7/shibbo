<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaFlow · sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #fefaf0 0%, #f6f3ec 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }

    .signup-card {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.06), 0 8px 20px rgba(0, 0, 0, 0.03);
      transition: transform 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(2px);
    }

    .signup-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 32px 60px rgba(0, 0, 0, 0.08), 0 12px 28px rgba(0, 0, 0, 0.05);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
    }

    .logo-icon {
      background: #e8f5e9;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: #2e7d32;
    }

    .logo-text {
      font-weight: 700;
      font-size: 1.7rem;
      letter-spacing: -0.03em;
      color: #1f2a24;
    }

    .logo-text span {
      color: #3f9142;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      color: #1e2a21;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .subhead {
      color: #5d6d5e;
      font-size: 1rem;
      font-weight: 400;
      margin-bottom: 2.2rem;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #2d3b2f;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 0.4rem;
    }

    input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      background: #faf9f5;
      border: 1.5px solid #e0dfd6;
      border-radius: 16px;
      outline: none;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: #1d2b20;
    }

    input::placeholder {
      color: #a3ada0;
      font-weight: 400;
      opacity: 0.8;
    }

    input:focus {
      border-color: #4d9e53;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(77, 158, 83, 0.12);
    }

    .password-hint {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.3rem;
    }

    .password-hint a {
      font-size: 0.75rem;
      color: #5f7a5c;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }

    .password-hint a:hover {
      color: #2f5c32;
      text-decoration: underline;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      margin: 1.8rem 0 2rem 0;
    }

    .terms input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #3f9142;
      margin-top: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .terms label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #425547;
      line-height: 1.4;
      text-transform: none;
      letter-spacing: normal;
      cursor: pointer;
    }

    .terms a {
      color: #2e6b31;
      text-decoration: none;
      font-weight: 600;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    .btn-primary {
      width: 100%;
      background: #2e6b31;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 1rem 1.5rem;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      letter-spacing: 0.01em;
      box-shadow: 0 8px 18px rgba(46, 107, 49, 0.22);
      font-family: 'Inter', sans-serif;
      margin-bottom: 1.6rem;
    }

    .btn-primary:hover {
      background: #245a29;
      box-shadow: 0 10px 22px rgba(46, 107, 49, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: #1d4a22;
    }

    .divider {
      display: flex;
      align-items: center;
      color: #9aa89a;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 1px;
      margin: 1.2rem 0 1.4rem;
      gap: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e4da;
    }

    .social-row {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #ffffff;
      border: 1.5px solid #deddd3;
      border-radius: 40px;
      padding: 0.8rem 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: #37473b;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
      font-family: 'Inter', sans-serif;
    }

    .social-btn:hover {
      background: #f6f7f2;
      border-color: #bccdb5;
      transform: translateY(-1px);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .login-footer {
      text-align: center;
      font-size: 0.9rem;
      color: #4d5f50;
      font-weight: 500;
    }

    .login-footer a {
      color: #2e6b31;
      font-weight: 700;
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .language-badge {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .badge {
      background: #ecf3e9;
      color: #2b532b;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.3rem 0.8rem;
      border-radius: 30px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      transition: background 0.1s;
    }

    .badge:hover {
      background: #daead5;
    }

    /* small screen adjustments */
    @media (max-width: 420px) {
      .signup-card {
        padding: 2rem 1.4rem;
      }
      h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <main class="signup-card">
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <div class="logo-text">Lingua<span>Flow</span></div>
    </div>

    <div class="language-badge">
      <span class="badge">🇪🇸 Spanish</span>
      <span class="badge">🇫🇷 French</span>
      <span class="badge">🇯🇵 Japanese</span>
      <span class="badge">🇩🇪 German</span>
      <span class="badge">+18</span>
    </div>

    <h1>Create your account</h1>
    <p class="subhead">Start speaking from day one — free 7-day trial.</p>

    <form onsubmit="event.preventDefault(); alert('Welcome to LinguaFlow! (demo sign-up)');">
      <div class="field">
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" placeholder="Alex Rivera" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="alex@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" minlength="8" required>
        <div class="password-hint">
          <a href="#" onclick="event.preventDefault();">Forgot password?</a>
        </div>
      </div>

      <div class="terms">
        <input type="checkbox" id="terms" required>
        <label for="terms">I agree to the <a href="#" onclick="event.preventDefault();">Terms of Service</a> and <a href="#" onclick="event.preventDefault();">Privacy Policy</a>.</label>
      </div>

      <button type="submit" class="btn-primary">Start learning →</button>

      <div class="divider">or continue with</div>

      <div class="social-row">
        <button type="button" class="social-btn" onclick="alert('Google sign-in (demo)')">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button type="button" class="social-btn" onclick="alert('Apple sign-in (demo)')">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" fill="#1D1D1F"/></svg>
          Apple
        </button>
      </div>
    </form>

    <div class="login-footer">
      Already have an account? <a href="#" onclick="event.preventDefault();">Log in</a>
    </div>
  </main>
</body>
</html>
