<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forma — Design board</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@500;600;650;700;750;800&display=swap');
:root{--ink:#263a33;--green:#214e3e;--muted:#798179;--line:#dddfd5;--paper:#f8f8f2}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font:14px 'DM Sans',sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #72994d;outline-offset:3px}button{border:0;background:none}header{height:72px;background:#203f33;color:#f8faf4;display:flex;align-items:center;padding:0 3.2%;gap:30px}.logo{display:flex;align-items:center;gap:11px;font:800 28px Manrope,sans-serif;letter-spacing:-1.8px}.mark{width:32px;height:31px;position:relative;display:inline-block}.mark i{position:absolute;width:10px;background:#c5dc95;border-radius:8px;transform:rotate(26deg);top:3px;height:25px}.mark i:nth-child(2){left:11px;height:31px;top:0}.mark i:nth-child(3){left:22px;height:19px;top:3px}.workspace{border-left:1px solid #587064;padding:5px 0 5px 25px;color:#d4dfd4;font-size:13px}.topright{margin-left:auto;display:flex;align-items:center;gap:20px}.online{font-size:12px;color:#d9e2d5}.online:before{content:'';display:inline-block;background:#bed78f;width:7px;height:7px;border-radius:50%;margin-right:8px}.avatar{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:700;font-size:10px;border:2px solid white}.a0{background:#ebc6ac;color:#754e3d}.a1{background:#cedabd;color:#4d6644}.a2{background:#d9cee9;color:#67537d}.a3{background:#c1d7df;color:#426374}header .avatar{width:34px;height:34px;border-color:#759080}.main{max-width:1700px;margin:auto;padding:32px 3.2%}.crumb{color:#7d857b;font-size:12px}.crumb b{color:#415447;font-weight:500}.crumb span{margin:0 9px;color:#a4aa9d}.intro{display:flex;align-items:center;justify-content:space-between;margin:24px 0 27px}.eyebrow{font-size:10px;letter-spacing:1.7px;color:#67795e;font-weight:750;display:flex;align-items:center;gap:8px}.eyebrow:before{content:'';width:18px;height:2px;background:#8ca670}h1{font:800 clamp(36px,4vw,54px)/1.15 Manrope,sans-serif;letter-spacing:-2.9px;margin:9px 0 8px}.subtitle{margin:0;color:#727b71;font-size:14px}.team{display:flex;align-items:center;gap:10px;font-size:12px;color:#657162}.stack{display:flex;padding-left:6px}.stack .avatar{margin-left:-6px;width:31px;height:31px;border-color:var(--paper)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px}.tabs{display:flex;background:#eceee5;border:1px solid #dce0d4;border-radius:8px;padding:3px;gap:2px}.tabs button,.ctrl,.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;font-size:12px;font-weight:600}.tabs button{padding:7px 12px;color:#737c70}.tabs .active{background:white;color:#314d3b;box-shadow:0 1px 4px #213d3020}.actions{display:flex;gap:9px;align-items:center}.ctrl,.primary{height:35px;padding:0 13px;border:1px solid var(--line);background:#fffefa}.primary{background:var(--green);color:white;border-color:var(--green)}svg.icon{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.search{position:relative}.search svg{position:absolute;top:10px;left:11px;color:#7c857c}.search input{width:166px;height:35px;border:1px solid var(--line);border-radius:6px;background:#fffefa;padding:0 10px 0 33px;font-size:12px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;align-items:stretch}.column{--accent:#8d9788;border:1px solid #dce0d3;border-top:3px solid var(--accent);background:#eef0e8;border-radius:9px;padding:13px 11px 10px;min-height:420px}.column:nth-child(2){--accent:#d4aa5d;background:#f3f0e6}.column:nth-child(3){--accent:#a592bb;background:#efecf1}.column:nth-child(4){--accent:#7a9b78;background:#eaf0e7}.colhead,.coltitle,.cardfoot,.meta,.tags{display:flex;align-items:center}.colhead{justify-content:space-between;padding:1px 3px 13px}.coltitle{gap:8px;font:750 15px Manrope,sans-serif;letter-spacing:-.5px}.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}.count{font:600 11px 'DM Sans',sans-serif;background:#ffffff87;border:1px solid #29372413;border-radius:5px;min-width:21px;text-align:center;padding:1px 4px;color:#70776b}.plus{font-size:20px;line-height:20px;color:#777f73}.card{border:1px solid #d8ddd1;background:#fffefa;border-radius:8px;padding:13px;margin-bottom:10px;box-shadow:0 2px 2px #26352105;cursor:pointer;transition:box-shadow .2s,transform .2s}.card:hover{box-shadow:0 3px 11px #243d3314;transform:translateY(-1px)}.art{display:block;width:100%;height:103px;border-radius:5px;overflow:hidden;margin-bottom:13px}.tags{gap:5px}.tag{display:inline-block;border-radius:4px;padding:3px 7px;font-size:10px;font-weight:650;background:#e5ebdc;color:#536947}.Brand{background:#e6dfed;color:#755e85}.Product{background:#dfeaf0;color:#4e7184}.Research{background:#f4e4d4;color:#986a43}.Content{background:#f2e9bf;color:#857335}.card h3{font:750 15px/1.4 Manrope,sans-serif;letter-spacing:-.45px;margin:9px 0 4px}.desc{color:#778074;font-size:12px;line-height:1.5;margin:0}.cardfoot{justify-content:space-between;border-top:1px solid #e8eae2;margin-top:13px;padding-top:9px}.meta{gap:5px;color:#82897e;font-size:10px}.meta svg{width:12px;height:12px}.cardfoot .avatar{width:24px;height:24px;font-size:9px;border:0}.add{width:100%;height:31px;border:1px dashed #c8cebf;border-radius:5px;color:#788271;font-size:12px}.footer{display:flex;justify-content:space-between;color:#899082;font-size:11px;margin-top:17px}.footer span:first-child:before{content:'✓';margin-right:6px}.filterwrap{position:relative}.filterbox{position:absolute;right:0;top:42px;z-index:2;background:#fffefa;padding:15px;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px #223a3019;width:185px}.filterbox select{width:100%;margin-top:8px}.list{display:block}.list .column{min-height:0;margin-bottom:10px}.list .card{display:flex;gap:15px;align-items:center}.list .art,.list .desc{display:none}.list h3{flex:1}.list .cardfoot{margin:0;padding:0;border:0;gap:12px}.list .add{width:auto}.dragover{outline:2px dashed #759065}dialog{width:min(420px,92vw);border:1px solid var(--line);border-radius:12px;color:var(--ink);background:var(--paper);padding:25px}dialog::backdrop{background:#18302565}dialog h2{margin:0 0 20px;font:750 23px Manrope}label{display:block;font-size:12px;font-weight:600;margin:12px 0}dialog input,dialog textarea,select{background:#fffefa;border:1px solid var(--line);border-radius:5px;padding:8px;color:var(--ink)}dialog input,dialog textarea,dialog select{width:100%;margin-top:5px}.row{display:flex;gap:12px}.row label{flex:1}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.delete{margin-right:auto;color:#945646}
@media(min-width:1450px){.art{height:135px}.card{padding:16px}}@media(max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.column{min-height:0}}@media(max-width:620px){header{height:58px;gap:16px}.workspace{padding-left:15px}.online,.team{display:none}.main{padding:22px 16px}.intro{margin:20px 0}.toolbar{align-items:flex-start;flex-direction:column}.actions{width:100%}.search{flex:1}.search input{width:100%}.board{grid-template-columns:1fr}.art{height:140px}.footer{gap:8px}}
</style>
</head>
<body>
<header><div class="logo"><span class="mark"><i></i><i></i><i></i></span>forma</div><div class="workspace">Studio workspace</div><div class="topright"><span class="online">Workspace online</span><span class="avatar a0">JL</span></div></header>
<main class="main">
<div class="crumb">Workspace<span>/</span>Projects<span>/</span><b>Design board</b></div>
<section class="intro"><div><div class="eyebrow">PROJECT SPACE</div><h1>Design board</h1><p class="subtitle">A shared space for ideas, explorations, and work in motion.</p></div><div class="team"><div class="stack"><span class="avatar a0">JL</span><span class="avatar a1">MK</span><span class="avatar a2">AS</span><span class="avatar a3">RT</span></div>Design team</div></section>
<div class="toolbar"><div class="tabs"><button id="boardBtn" class="active"></button><button id="listBtn"></button></div><div class="actions"><div class="search" id="searchWrap"><input id="search" aria-label="Search tasks" placeholder="Search tasks…"></div><div class="filterwrap"><button class="ctrl" id="filterBtn"></button><div class="filterbox" id="filterBox" hidden><label>Filter by category<select id="filter"></select></label></div></div><button class="primary" id="newBtn">＋ New task</button></div></div>
<div id="board" class="board"></div><div class="footer"><span id="saveState">All changes saved</span><span id="summary"></span></div>
</main>
<dialog id="modal"><form id="form"><h2 id="modalTitle">New task</h2><label>Task title<input id="titleInput" maxlength="100" required></label><label>Description<textarea id="description" rows="3"></textarea></label><div class="row"><label>Status<select id="status"></select></label><label>Category<select id="category"></select></label></div><div class="row"><label>Assignee<select id="assignee"></select></label><label>Due date<input type="date" id="due"></label></div><div class="modalactions"><button class="delete" type="button" id="del">Delete</button><button class="ctrl" type="button" id="cancel">Cancel</button><button class="primary">Save task</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id),states=['Backlog','In progress','In review','Done'],cats=['Brand','Product','Research','Content','Design system'],people=['Jamie Lee','Maya Kim','Alex Stone','Riley Tran'],initials=['JL','MK','AS','RT'];
const icons={board:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-16v16"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',filter:'<path d="M3 7h7m5 0h6M3 17h11m5 0h2"/><circle cx="12" cy="7" r="2"/><circle cx="16" cy="17" r="2"/>',date:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 11h16"/>'};
const icon=k=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg>`;
$('boardBtn').innerHTML=icon('board')+'Board';$('listBtn').innerHTML=icon('list')+'List';$('searchWrap').insertAdjacentHTML('afterbegin',icon('search'));$('filterBtn').innerHTML=icon('filter')+'Filter';
const arts={
brand:`<rect width="300" height="120" fill="#d6c7e5"/><g fill="#51425e" transform="translate(68 61)">${Array.from({length:10},(_,i)=>`<ellipse cy="-23" rx="12" ry="27" transform="rotate(${i*36})"/>`).join('')}</g><g fill="#9680ae" transform="translate(205 60) rotate(-14)"><rect x="-44" y="-42" width="88" height="84" rx="16"/><rect x="-20" y="-20" width="40" height="40" rx="8" fill="#d6c7e5"/></g><circle cx="68" cy="61" r="11" fill="#decede"/>`,
type:`<rect width="300" height="120" fill="#eed0ad"/><g stroke="#bd9673" stroke-width=".7" stroke-dasharray="3 3"><path d="M0 28h300M0 85h300M0 102h300M30 0v120M171 0v120"/></g><text x="20" y="91" font-family="Georgia,serif" font-size="99" fill="#654531" letter-spacing="-8">Aa</text><g fill="#936848"><text x="174" y="54" font-family="Georgia" font-size="30">Ag</text><path d="M176 69h81v2h-81zm0 8h63v2h-63zm0 8h72v2h-72z"/></g>`,
palette:`<rect width="300" height="120" fill="#cddac4"/><g transform="translate(52 21) rotate(-12 38 45)"><rect width="72" height="100" rx="5" fill="#f7f5e9"/><rect x="5" y="5" width="62" height="64" rx="2" fill="#45684f"/><path d="M8 80h28" stroke="#a0a995" stroke-width="3"/></g><g transform="translate(113 12) rotate(3 35 45)"><rect width="72" height="100" rx="5" fill="#fff9eb"/><rect x="5" y="5" width="62" height="64" rx="2" fill="#abc091"/><path d="M8 80h28" stroke="#a0a995" stroke-width="3"/></g><g transform="translate(176 21) rotate(15 35 45)"><rect width="72" height="100" rx="5" fill="#fbf8e9"/><rect x="5" y="5" width="62" height="64" rx="2" fill="#d9c78a"/><path d="M8 80h28" stroke="#a0a995" stroke-width="3"/></g>`};
let tasks=[
['Brand explorations','Explore new shapes and directions for our visual identity.',0,'Brand',2,22,'brand'],
['Customer interview guide','Draft questions for the next round of discovery calls.',0,'Research',1,24],
['Empty state copy','Write helpful messages for first-time users.',0,'Content',0,25],
['Type scale refresh','Refine our type hierarchy across desktop and mobile.',1,'Design system',0,20,'type'],
['Dashboard wireframes','Map out the core layout for the new overview screen.',1,'Product',3,21],
['Navigation audit','Review wayfinding across the main product flows.',1,'Research',1,22],
['Onboarding flow','A simpler introduction to the workspace for new teams.',2,'Product',3,19],
['Voice & tone guidelines','Align on a clear, friendly voice for product writing.',2,'Content',2,20],
['Core color palette','Finalize primary colors and supporting neutrals.',3,'Brand',1,17,'palette'],
['Button components','Document states, sizes, and usage for our button set.',3,'Design system',0,18]
].map(([title,desc,s,cat,p,d,art],i)=>({id:i+1,title,desc,s,cat,p,date:'2026-06-'+d,art}));
try{const stored=JSON.parse(localStorage.getItem('forma-board-v1'));if(Array.isArray(stored))tasks=stored}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(a)=>a.map(x=>`<option>${esc(x)}</option>`).join('');
$('filter').innerHTML=opts(['All categories',...cats]);$('status').innerHTML=opts(states);$('category').innerHTML=opts(cats);$('assignee').innerHTML=opts(people);
let list=false,editing=null,drag=null;
function render(){const txt=$('search').value.toLowerCase(),cat=$('filter').value;let visible=tasks.filter(t=>(cat==='All categories'||cat===t.cat)&&(t.title+' '+t.desc+' '+t.cat).toLowerCase().includes(txt));$('board').className='board'+(list?' list':'');$('board').innerHTML=states.map((s,i)=>{let arr=visible.filter(t=>t.s===i);return `<section class="column" data-s="${i}"><div class="colhead"><div class="coltitle"><i class="dot"></i>${s}<span class="count">${arr.length}</span></div><button class="plus" data-add="${i}" aria-label="Add task to ${s}">＋</button></div>${arr.map(t=>`<article tabindex="0" role="button" class="card" draggable="true" data-id="${t.id}">${arts[t.art]?`<svg class="art" viewBox="0 0 300 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${arts[t.art]}</svg>`:''}<div class="tags"><span class="tag ${esc(t.cat.split(' ')[0])}">${esc(t.cat)}</span></div><h3>${esc(t.title)}</h3><p class="desc">${esc(t.desc)}</p><div class="cardfoot"><span class="meta">${icon('date')}${t.date?new Date(t.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'No date'}</span><span class="avatar a${t.p}" title="${people[t.p]}">${initials[t.p]}</span></div></article>`).join('')}<button class="add" data-add="${i}">＋ Add task</button></section>`}).join('');$('summary').textContent=`${visible.length} tasks · 4 columns`;$('filterBtn').innerHTML=icon('filter')+(cat==='All categories'?'Filter':'Filter · 1')}
function save(){try{localStorage.setItem('forma-board-v1',JSON.stringify(tasks))}catch{$('saveState').textContent='Saved for this session'}render()}
function openTask(s=0,t=null){editing=t;$('modalTitle').textContent=t?'Edit task':'New task';$('titleInput').value=t?.title||'';$('description').value=t?.desc||'';$('status').selectedIndex=t?.s??s;$('category').value=t?.cat||cats[0];$('assignee').selectedIndex=t?.p??0;$('due').value=t?.date||'';$('del').hidden=!t;$('modal').showModal();$('titleInput').focus()}
$('form').onsubmit=e=>{e.preventDefault();const title=$('titleInput').value.trim();if(!title){$('titleInput').focus();return}let t=editing||{id:Date.now()};Object.assign(t,{title,desc:$('description').value.trim(),s:$('status').selectedIndex,cat:$('category').value,p:$('assignee').selectedIndex,date:$('due').value});if(!editing)tasks.push(t);save();$('modal').close()};
$('del').onclick=()=>{tasks=tasks.filter(t=>t!==editing);save();$('modal').close()};$('cancel').onclick=()=>$('modal').close();$('newBtn').onclick=()=>openTask();
$('board').onclick=e=>{const add=e.target.closest('[data-add]'),c=e.target.closest('.card');if(add)openTask(+add.dataset.add);else if(c)openTask(0,tasks.find(t=>t.id===+c.dataset.id))};$('board').onkeydown=e=>{if(e.target.matches('.card')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.click()}};
$('search').oninput=render;$('filterBtn').onclick=()=>$('filterBox').hidden=!$('filterBox').hidden;$('filter').onchange=()=>{render();$('filterBox').hidden=true};document.addEventListener('click',e=>{if(!e.target.closest('.filterwrap'))$('filterBox').hidden=true});
for(const [id,mode] of [['boardBtn',false],['listBtn',true]])$(id).onclick=()=>{list=mode;$('boardBtn').classList.toggle('active',!list);$('listBtn').classList.toggle('active',list);render()};
$('board').ondragstart=e=>{drag=+e.target.closest('.card').dataset.id;e.dataTransfer.setData('text/plain',String(drag))};$('board').ondragover=e=>{if(!drag)return;e.preventDefault();document.querySelectorAll('.column').forEach(c=>c.classList.toggle('dragover',c===e.target.closest('.column')))};$('board').ondrop=e=>{e.preventDefault();let c=e.target.closest('.column'),t=tasks.find(t=>t.id===drag);if(c&&t){t.s=+c.dataset.s;save()}drag=null};$('board').ondragend=()=>{drag=null;document.querySelectorAll('.dragover').forEach(c=>c.classList.remove('dragover'))};render();
</script>
</body>
</html>
