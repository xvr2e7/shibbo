<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forma — Design Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#222429;--muted:#8b8d96;--line:#e9e9ed;--purple:#7357d9;--purple-light:#eeeafd;--bg:#f7f7f9;--white:#fff;--sidebar:#fbfbfc}
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:var(--bg);font-family:"DM Sans",sans-serif;font-size:14px}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #c6baf6;outline-offset:2px}
  .icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .app{min-height:100vh;display:flex}
  .sidebar{width:226px;flex:none;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:28px 16px 18px;position:fixed;inset:0 auto 0 0;z-index:5}
  .brand{display:flex;align-items:center;gap:10px;padding:0 9px 35px;font:800 20px Manrope,sans-serif;letter-spacing:-1px}
  .brand-mark{width:29px;height:29px;background:#25232d;border-radius:9px;display:grid;place-items:center;color:white}
  .brand-mark svg{width:18px;height:18px}
  .workspace-label{padding:0 10px;margin-bottom:11px;color:#aaaab2;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
  .nav{display:grid;gap:4px}
  .nav-item{height:41px;display:flex;align-items:center;gap:12px;padding:0 11px;border:0;border-radius:8px;background:transparent;color:#85858e;text-align:left;font-weight:600}
  .nav-item.active{background:#eeebf9;color:#6650c7}
  .nav-item:not(.active):hover{background:#f0f0f3;color:#444}
  .nav-item .count{margin-left:auto;font-size:11px;color:#9d9ba6}
  .nav-section{margin-top:34px}
  .project-dot{height:9px;width:9px;border-radius:3px;flex:none}
  .sidebar-bottom{margin-top:auto}
  .invite{width:100%;border:1px dashed #d9d8e0;border-radius:9px;background:#fff;color:#6e6e79;padding:11px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:700}
  .profile{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:20px;padding:19px 3px 0}
  .profile-info{min-width:0;flex:1}.profile-info strong{display:block;font-size:12px}.profile-info span{display:block;color:#9b9ba4;font-size:11px;margin-top:3px}
  .avatar{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:9px;font-weight:700;border:2px solid white;flex:none}
  .avatar.a{background:#d99381}.avatar.b{background:#889bc3}.avatar.c{background:#a78bb4}.avatar.d{background:#d1ad73}.avatar.e{background:#86a99c}
  .profile .avatar{width:36px;height:36px;font-size:11px}
  .main{margin-left:226px;min-width:0;flex:1}
  .topbar{height:76px;background:rgba(255,255,255,.77);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px}
  .breadcrumb{display:flex;align-items:center;gap:10px;color:#a1a1aa;font-size:12px;font-weight:600}.breadcrumb strong{color:#46464f}.breadcrumb .icon{width:14px;height:14px}
  .top-actions{display:flex;align-items:center;gap:21px}
  .search-wrap{display:flex;align-items:center;gap:8px;color:#a5a5ae}.search-wrap .icon{width:17px;height:17px}
  .search-wrap input{width:145px;border:0;background:transparent;outline:0;color:#444;font-size:12px}.search-wrap input::placeholder{color:#b2b2bb}
  .top-icon{position:relative;background:none;border:0;color:#92929d;padding:4px;display:grid;place-items:center}.notification-dot{position:absolute;width:7px;height:7px;background:#e78e87;border:1px solid white;border-radius:50%;top:3px;right:4px}
  .content{padding:36px 38px 60px;max-width:1800px;margin:auto}
  .eyebrow{display:flex;align-items:center;gap:8px;color:#a19da9;font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:12px}
  .eyebrow span{width:7px;height:7px;border-radius:50%;background:#9a84eb}
  .heading-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
  h1{font:800 29px/1.15 Manrope,sans-serif;letter-spacing:-1.2px;margin:0}
  .subtitle{color:#9696a0;margin:9px 0 0;font-size:13px}
  .heading-actions{display:flex;align-items:center;gap:15px}
  .avatar-stack{display:flex;padding-left:8px}.avatar-stack .avatar{margin-left:-8px;width:32px;height:32px}
  .avatar.more{background:#f1eff5;color:#85818d;font-size:10px}
  .divider{height:28px;width:1px;background:#e5e4e9}
  .btn{border:1px solid #e8e7ed;background:#fff;border-radius:8px;padding:10px 13px;color:#676772;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
  .btn:hover{border-color:#cfcbdc;background:#faf9ff}.btn .icon{width:15px;height:15px}
  .btn.primary{background:#7357d9;color:white;border-color:#7357d9;box-shadow:0 4px 10px #7357d923}.btn.primary:hover{background:#6248c7}
  .tabs-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e6e6eb;margin-top:34px}
  .tabs{display:flex;gap:28px}.tab{position:relative;border:0;background:none;color:#a0a0a9;padding:0 0 15px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700}.tab .icon{width:15px;height:15px}.tab.active{color:#7155d4}.tab.active:after{content:"";position:absolute;height:2px;background:#7659dc;bottom:-1px;left:0;right:0}
  .board-tools{display:flex;align-items:center;gap:9px;padding-bottom:10px}.tool{border:0;background:transparent;color:#8d8d97;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px}.tool .icon{width:15px;height:15px}.tool.active{color:#7155d4}
  .board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:17px;margin-top:24px;align-items:start}
  .column{background:#f0f0f3;border:1px solid #ededf0;border-radius:11px;padding:13px;min-height:440px}
  .column-head{display:flex;align-items:center;gap:8px;padding:3px 2px 15px}.status-dot{height:8px;width:8px;border-radius:50%;background:var(--dot)}.column-title{font-size:12px;font-weight:700}.column-count{display:grid;place-items:center;width:20px;height:20px;background:#e6e6ea;border-radius:6px;color:#92929c;font-size:10px;font-weight:700}.column-actions{margin-left:auto;display:flex;gap:7px}.icon-button{border:0;background:none;color:#a5a5ae;padding:1px;display:grid;place-items:center}.icon-button .icon{width:16px;height:16px}
  .card-list{display:grid;gap:10px;min-height:38px}.card-list.drag-over{background:#e4e0f3;border-radius:8px;outline:2px dashed #b5a5eb}
  .card{background:#fff;border:1px solid #eae9ed;border-radius:9px;padding:14px;box-shadow:0 2px 4px rgba(35,35,45,.025);cursor:grab}.card:active{cursor:grabbing}.card.dragging{opacity:.45}
  .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.tag{display:inline-block;border-radius:5px;padding:5px 7px;font-size:9px;font-weight:700;letter-spacing:.1px}.tag.branding{color:#a277bb;background:#f5edf9}.tag.product{color:#6689b0;background:#edf4fb}.tag.research{color:#b39057;background:#fcf5e8}.tag.marketing{color:#c48075;background:#fcf0ed}
  .card-menu{color:#b7b6bd}.card h3{font:700 13px/1.45 Manrope,sans-serif;letter-spacing:-.15px;margin:0 0 5px}.card p{font-size:11px;line-height:1.55;color:#a0a0a9;margin:0}.card-footer{display:flex;align-items:center;justify-content:space-between;gap:4px;border-top:1px solid #f2f1f3;margin-top:15px;padding-top:12px}
  .card-meta{display:flex;align-items:center;gap:10px;color:#aaaab2;font-size:10px}.card-meta span{display:flex;align-items:center;gap:4px}.card-meta .icon{width:13px;height:13px}.card-avatars{display:flex;padding-left:6px}.card-avatars .avatar{width:25px;height:25px;margin-left:-6px;font-size:8px}
  .add-card{width:100%;margin-top:12px;border:0;background:transparent;color:#a1a1ab;display:flex;align-items:center;gap:7px;padding:7px 3px;font-size:11px;font-weight:700;text-align:left}.add-card:hover{color:#7155d4}.add-card .icon{width:15px;height:15px}
  .empty{color:#a4a4ad;font-size:11px;text-align:center;padding:20px 3px}
  dialog{width:min(460px,calc(100% - 32px));border:0;border-radius:14px;padding:0;box-shadow:0 20px 70px #2223;color:var(--ink)}dialog::backdrop{background:rgba(34,32,44,.38)}.modal{padding:24px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.modal-head h2{font:800 19px Manrope,sans-serif;margin:0}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-weight:700;font-size:12px;color:#666670}.field input,.field textarea,.field select{width:100%;border:1px solid #e4e3e9;border-radius:8px;padding:10px 11px;background:#fff;color:#333;outline:none}.field textarea{resize:vertical;min-height:76px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9d8ae2}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
  .toast{position:fixed;right:24px;bottom:24px;background:#292733;color:white;padding:12px 16px;border-radius:9px;font-size:12px;box-shadow:0 8px 25px #0002;z-index:20}
  @media(max-width:1150px){.board{grid-template-columns:repeat(4,250px);overflow-x:auto;padding-bottom:15px}.content{padding-left:26px;padding-right:26px}.topbar{padding:0 26px}}
  @media(max-width:760px){.sidebar{width:65px;padding:22px 10px}.brand{padding:0 7px 32px}.brand-name,.workspace-label,.nav-item span:not(.project-dot),.nav-item .count,.sidebar-bottom,.project-label{display:none}.nav-item{justify-content:center;padding:0}.nav-section{margin-top:25px}.main{margin-left:65px}.topbar{height:62px;padding:0 18px}.search-wrap input{width:85px}.top-actions{gap:10px}.content{padding:28px 18px}.heading-row{align-items:flex-start;flex-direction:column}.heading-actions{width:100%}.heading-actions .primary{margin-left:auto}.tabs-row{margin-top:26px}.tabs{gap:17px}.board-tools .tool-label{display:none}.board{grid-template-columns:repeat(4,245px)}h1{font-size:25px}}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
  <symbol id="board" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></symbol>
  <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></symbol>
  <symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1M16 5a3 3 0 0 1 0 6M17 14a5 5 0 0 1 4 5v1"/></symbol>
  <symbol id="settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5l1.5 1.2-1.5 2.6-1.9-.6a8 8 0 0 1-2.1 1.2l-.4 2h-3l-.4-2a8 8 0 0 1-2.1-1.2l-1.9.6-1.5-2.6L7 13.5a8 8 0 0 1 0-3L5.5 9.3 7 6.7l1.9.6A8 8 0 0 1 11 6.1l.4-2h3l.4 2a8 8 0 0 1 2.1 1.2l1.9-.6 1.5 2.6-1.5 1.2a8 8 0 0 1 0 3z"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
  <symbol id="bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-2 7-2 9h16c0-2-2-2-2-9M10 20h4"/></symbol>
  <symbol id="filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></symbol>
  <symbol id="sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
  <symbol id="list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/></symbol>
  <symbol id="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/></symbol>
  <symbol id="message" viewBox="0 0 24 24"><path d="M20 11a7 7 0 0 1-7 7H7l-3 3v-5a7 7 0 1 1 16-5z"/></symbol>
  <symbol id="clip" viewBox="0 0 24 24"><path d="m8 12 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l8-8"/></symbol>
  <symbol id="close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
</svg>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 17.5 12 4l8 13.5h-5l-3-5-3 5H4Z" fill="currentColor"/></svg></span><span class="brand-name">forma.</span></div>
    <div class="workspace-label">Workspace</div>
    <nav class="nav" aria-label="Main navigation">
      <button class="nav-item" data-notice="Overview is coming soon"><svg class="icon"><use href="#grid"/></svg><span>Overview</span></button>
      <button class="nav-item active"><svg class="icon"><use href="#board"/></svg><span>Board</span></button>
      <button class="nav-item" data-notice="Calendar is coming soon"><svg class="icon"><use href="#calendar"/></svg><span>Calendar</span></button>
      <button class="nav-item" data-notice="Team settings are coming soon"><svg class="icon"><use href="#users"/></svg><span>Team</span><span class="count">5</span></button>
    </nav>
    <div class="nav-section">
      <div class="workspace-label">Projects</div>
      <nav class="nav" aria-label="Projects">
        <button class="nav-item active"><i class="project-dot" style="background:#9a83e6"></i><span>Design team</span></button>
        <button class="nav-item" data-notice="Website project is coming soon"><i class="project-dot" style="background:#e8b583"></i><span>Website</span></button>
        <button class="nav-item" data-notice="Brand refresh is coming soon"><i class="project-dot" style="background:#86b6a3"></i><span>Brand refresh</span></button>
      </nav>
    </div>
    <div class="sidebar-bottom">
      <button class="invite" data-notice="Invite link copied to clipboard" id="invite"><svg class="icon"><use href="#plus"/></svg> Invite teammates</button>
      <div class="profile"><span class="avatar a">SC</span><div class="profile-info"><strong>Sarah Chen</strong><span>Admin</span></div><svg class="icon" style="color:#aaa;width:15px"><use href="#down"/></svg></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="breadcrumb"><span>Workspace</span><svg class="icon"><use href="#chevron"/></svg><strong>Design team</strong></div>
      <div class="top-actions">
        <label class="search-wrap"><svg class="icon"><use href="#search"/></svg><input id="search" type="search" placeholder="Search tasks..." aria-label="Search tasks"></label>
        <button class="top-icon" data-notice="You're all caught up!" aria-label="Notifications"><svg class="icon"><use href="#bell"/></svg><span class="notification-dot"></span></button>
        <span class="avatar a" title="Sarah Chen">SC</span>
      </div>
    </header>
    <section class="content">
      <div class="eyebrow"><span></span> TEAM WORKSPACE</div>
      <div class="heading-row">
        <div><h1>Design team</h1><p class="subtitle">A little space for our big ideas. ✨</p></div>
        <div class="heading-actions">
          <div class="avatar-stack" aria-label="Team members"><span class="avatar a" title="Sarah Chen">SC</span><span class="avatar b" title="Alex Morgan">AM</span><span class="avatar c" title="Maya Patel">MP</span><span class="avatar d" title="Jordan Lee">JL</span><span class="avatar more">+1</span></div>
          <div class="divider"></div>
          <button class="btn primary" id="newTask"><svg class="icon"><use href="#plus"/></svg> New task</button>
        </div>
      </div>
      <div class="tabs-row">
        <div class="tabs"><button class="tab active"><svg class="icon"><use href="#board"/></svg> Board</button><button class="tab" data-notice="List view is coming soon"><svg class="icon"><use href="#list"/></svg> List</button><button class="tab" data-notice="Calendar view is coming soon"><svg class="icon"><use href="#calendar"/></svg> Calendar</button></div>
        <div class="board-tools"><button class="tool" id="filterBtn" title="Show my tasks"><svg class="icon"><use href="#filter"/></svg><span class="tool-label">My tasks</span></button><button class="tool" id="sortBtn" title="Sort by title"><svg class="icon"><use href="#sliders"/></svg><span class="tool-label">Sort</span></button></div>
      </div>
      <div class="board" id="board"></div>
    </section>
  </main>
</div>
<dialog id="taskDialog">
  <form class="modal" id="taskForm">
    <div class="modal-head"><h2>New task</h2><button type="button" class="icon-button" id="closeDialog" aria-label="Close"><svg class="icon"><use href="#close"/></svg></button></div>
    <div class="field"><label for="taskTitle">Task name</label><input id="taskTitle" maxlength="80" placeholder="What needs to be done?" required></div>
    <div class="field"><label for="taskDescription">Description</label><textarea id="taskDescription" maxlength="200" placeholder="Add a little more detail..."></textarea></div>
    <div class="field"><label for="taskTag">Category</label><select id="taskTag"><option>Product</option><option>Branding</option><option>Research</option><option>Marketing</option></select></div>
    <div class="field"><label for="taskStatus">Status</label><select id="taskStatus"><option value="backlog">Backlog</option><option value="todo">To do</option><option value="progress">In progress</option><option value="done">Done</option></select></div>
    <div class="modal-actions"><button type="button" class="btn" id="cancelDialog">Cancel</button><button class="btn primary" type="submit">Create task</button></div>
  </form>
</dialog>
<script>
const columns=[
  {id:'backlog',title:'Backlog',color:'#b6b7c1'},
  {id:'todo',title:'To do',color:'#dda765'},
  {id:'progress',title:'In progress',color:'#937cdd'},
  {id:'done',title:'Done',color:'#79bca4'}
];
const people={SC:['Sarah Chen','a'],AM:['Alex Morgan','b'],MP:['Maya Patel','c'],JL:['Jordan Lee','d'],NK:['Noah Kim','e']};
const initial=[
  {id:'1',status:'backlog',tag:'Research',title:'Competitor analysis',description:'Explore what others are doing in the space.',comments:3,files:2,people:['MP','AM']},
  {id:'2',status:'backlog',tag:'Product',title:'Mobile app explorations',description:'Early ideas for the mobile experience.',comments:2,files:0,people:['JL']},
  {id:'3',status:'backlog',tag:'Branding',title:'Illustration style guide',description:'Define a visual direction for illustrations.',comments:0,files:1,people:['SC','MP']},
  {id:'4',status:'todo',tag:'Product',title:'Design system audit',description:'Review components and identify gaps.',comments:4,files:2,people:['SC','AM']},
  {id:'5',status:'todo',tag:'Marketing',title:'Social media templates',description:'Create templates for our upcoming launch.',comments:2,files:3,people:['JL','NK']},
  {id:'6',status:'todo',tag:'Research',title:'User interview plan',description:'Put together questions for the next round.',comments:1,files:0,people:['MP']},
  {id:'7',status:'progress',tag:'Product',title:'Dashboard redesign',description:'Make the overview feel clear and intuitive.',comments:8,files:4,people:['SC','AM','MP']},
  {id:'8',status:'progress',tag:'Branding',title:'Brand identity refresh',description:'A fresh look for the next chapter.',comments:5,files:3,people:['SC','JL']},
  {id:'9',status:'progress',tag:'Product',title:'Onboarding flow',description:'Help new users feel right at home.',comments:3,files:1,people:['AM','NK']},
  {id:'10',status:'done',tag:'Branding',title:'Color palette update',description:'A little more color, a lot more personality.',comments:4,files:2,people:['SC','MP']},
  {id:'11',status:'done',tag:'Marketing',title:'Launch moodboard',description:'Gather inspiration for launch visuals.',comments:2,files:5,people:['JL','NK']}
];
let tasks;
try { const saved=JSON.parse(localStorage.getItem('forma-tasks')); tasks=Array.isArray(saved)?saved:initial; } catch(e){tasks=initial}
let mine=false, sorted=false, dragged=null;
const board=document.getElementById('board');
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<svg class="icon"><use href="#${name}"></use></svg>`;
function save(){try{localStorage.setItem('forma-tasks',JSON.stringify(tasks))}catch(e){}}
function render(){
  const query=document.getElementById('search').value.trim().toLowerCase();
  board.innerHTML=columns.map(col=>{
    let items=tasks.filter(t=>t.status===col.id&&(!mine||(t.people||[]).includes('SC'))&&(!query||`${t.title} ${t.description} ${t.tag}`.toLowerCase().includes(query)));
    if(sorted) items=[...items].sort((a,b)=>a.title.localeCompare(b.title));
    return `<section class="column" aria-label="${col.title}">
      <div class="column-head"><span class="status-dot" style="--dot:${col.color}"></span><span class="column-title">${col.title}</span><span class="column-count">${items.length}</span><div class="column-actions"><button class="icon-button add-column-task" data-status="${col.id}" aria-label="Add task to ${col.title}">${icon('plus')}</button></div></div>
      <div class="card-list" data-status="${col.id}">${items.map(t=>`<article class="card" draggable="true" data-id="${escapeHTML(t.id)}">
        <div class="card-top"><span class="tag ${escapeHTML(t.tag.toLowerCase())}">${escapeHTML(t.tag)}</span><button class="icon-button card-menu delete-task" data-id="${escapeHTML(t.id)}" aria-label="Delete ${escapeHTML(t.title)}" title="Delete task">${icon('dots')}</button></div>
        <h3>${escapeHTML(t.title)}</h3>${t.description?`<p>${escapeHTML(t.description)}</p>`:''}
        <div class="card-footer"><div class="card-meta">${t.comments?`<span>${icon('message')}${t.comments}</span>`:''}${t.files?`<span>${icon('clip')}${t.files}</span>`:''}</div><div class="card-avatars">${(t.people||[]).map(p=>people[p]?`<span class="avatar ${people[p][1]}" title="${people[p][0]}">${p}</span>`:'').join('')}</div></div>
      </article>`).join('')}${items.length?'':`<div class="empty">${query||mine?'No matching tasks':'Drop tasks here'}</div>`}</div>
      <button class="add-card add-column-task" data-status="${col.id}">${icon('plus')} Add task</button>
    </section>`;
  }).join('');
}
function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
const dialog=document.getElementById('taskDialog'), form=document.getElementById('taskForm');
function openDialog(status='todo'){form.reset();document.getElementById('taskStatus').value=status;dialog.showModal();setTimeout(()=>document.getElementById('taskTitle').focus(),20)}
document.getElementById('newTask').onclick=()=>openDialog();
document.getElementById('closeDialog').onclick=()=>dialog.close();
document.getElementById('cancelDialog').onclick=()=>dialog.close();
form.addEventListener('submit',e=>{e.preventDefault();const title=document.getElementById('taskTitle').value.trim();if(!title)return;tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title,description:document.getElementById('taskDescription').value.trim(),tag:document.getElementById('taskTag').value,status:document.getElementById('taskStatus').value,comments:0,files:0,people:['SC']});save();render();dialog.close();toast('Task created')});
board.addEventListener('click',e=>{const add=e.target.closest('.add-column-task');if(add)openDialog(add.dataset.status);const del=e.target.closest('.delete-task');if(del){const task=tasks.find(t=>t.id===del.dataset.id);if(task&&confirm(`Delete "${task.title}"?`)){tasks=tasks.filter(t=>t.id!==task.id);save();render();toast('Task deleted')}}});
board.addEventListener('dragstart',e=>{const card=e.target.closest('.card');if(!card)return;dragged=card.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragged);setTimeout(()=>card.classList.add('dragging'),0)});
board.addEventListener('dragend',()=>{dragged=null;document.querySelectorAll('.dragging,.drag-over').forEach(el=>el.classList.remove('dragging','drag-over'))});
board.addEventListener('dragover',e=>{const list=e.target.closest('.card-list');if(list){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));list.classList.add('drag-over')}});
board.addEventListener('dragleave',e=>{const list=e.target.closest('.card-list');if(list&&!list.contains(e.relatedTarget))list.classList.remove('drag-over')});
board.addEventListener('drop',e=>{const list=e.target.closest('.card-list');if(!list)return;e.preventDefault();const task=tasks.find(t=>t.id===(dragged||e.dataTransfer.getData('text/plain')));if(task){task.status=list.dataset.status;save();render();toast('Task moved to '+columns.find(c=>c.id===task.status).title)}});
document.getElementById('search').addEventListener('input',render);
document.getElementById('filterBtn').onclick=function(){mine=!mine;this.classList.toggle('active',mine);render()};
document.getElementById('sortBtn').onclick=function(){sorted=!sorted;this.classList.toggle('active',sorted);render()};
document.querySelectorAll('[data-notice]').forEach(el=>el.addEventListener('click',()=>{if(el.id==='invite'&&navigator.clipboard){navigator.clipboard.writeText(location.href).then(()=>toast('Invite link copied to clipboard')).catch(()=>toast('Could not copy link'));return}toast(el.dataset.notice)}));
render();
</script>
</body>
</html>
