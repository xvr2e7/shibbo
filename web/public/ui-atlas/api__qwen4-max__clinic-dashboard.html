<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Willow Lane Clinic — Front Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f5f1;
    --panel:#ffffff;
    --ink:#182420;
    --ink-soft:#5b6b64;
    --ink-faint:#8a978f;
    --line:#e2e8e2;
    --line-soft:#edf1ec;
    --teal:#0e7569;
    --teal-deep:#0a5c53;
    --teal-soft:#e0efec;
    --amber:#a16207;
    --amber-soft:#fdf3dc;
    --rust:#b3401f;
    --rust-soft:#fbe9e2;
    --green:#2f7d43;
    --green-soft:#e4f2e6;
    --blue:#3b5f8a;
    --blue-soft:#e7eef6;
    --radius:14px;
    --shadow:0 1px 2px rgba(24,36,32,.05), 0 8px 24px -12px rgba(24,36,32,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(14,117,105,.07), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-size:14px;
    line-height:1.45;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    padding:18px 28px;
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand-mark{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:linear-gradient(140deg,var(--teal),var(--teal-deep));
    display:grid;place-items:center;color:#fff;
    box-shadow:0 4px 12px -4px rgba(14,117,105,.5);
  }
  .brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:19px;letter-spacing:.2px}
  .brand small{display:block;font-family:'Inter';font-weight:500;font-size:11px;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
  .topbar-meta{margin-left:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .date-chip{font-size:13px;color:var(--ink-soft);font-weight:500}
  .clock{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;
    background:var(--ink);color:#e9f3ef;padding:7px 14px;border-radius:9px;
    letter-spacing:.04em;display:flex;align-items:center;gap:8px;
  }
  .clock .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .btn{
    font-family:'Inter';font-weight:600;font-size:13px;border:none;cursor:pointer;
    border-radius:9px;padding:9px 16px;transition:all .15s ease;
  }
  .btn-primary{background:var(--teal);color:#fff;box-shadow:0 4px 12px -4px rgba(14,117,105,.45)}
  .btn-primary:hover{background:var(--teal-deep);transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--ink-faint);color:var(--ink)}
  .btn-xs{padding:5px 11px;font-size:12px;border-radius:7px}
  .btn-seat{background:var(--teal-soft);color:var(--teal-deep)}
  .btn-seat:hover{background:#cde5e0}
  .btn-danger-ghost{background:transparent;color:var(--rust);border:1px solid #ecc9bd}
  .btn-danger-ghost:hover{background:var(--rust-soft)}

  /* ---------- Layout ---------- */
  .wrap{max-width:1440px;margin:0 auto;padding:24px 28px 60px}

  /* ---------- KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
  .kpi{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kpi-accent,var(--teal))}
  .kpi .label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
  .kpi .value{font-family:'Fraunces',serif;font-size:34px;font-weight:600;line-height:1.15;margin-top:4px}
  .kpi .value small{font-size:17px;color:var(--ink-faint);font-weight:500}
  .kpi .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .kpi.warn .value{color:var(--rust)}

  /* ---------- Main grid ---------- */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .panel-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
  .panel-head h2{font-family:'Fraunces',serif;font-size:17px;font-weight:600}
  .panel-head .count{font-size:12px;font-weight:600;color:var(--ink-faint);background:var(--line-soft);padding:2px 9px;border-radius:99px}

  /* ---------- Schedule ---------- */
  .search{
    margin-left:auto;display:flex;align-items:center;gap:7px;
    border:1px solid var(--line);border-radius:9px;padding:6px 11px;background:#fbfcfa;min-width:200px;
  }
  .search input{border:none;outline:none;background:transparent;font-family:'Inter';font-size:13px;width:100%;color:var(--ink)}
  .search svg{flex:none;color:var(--ink-faint)}
  .filters{display:flex;gap:7px;padding:12px 20px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
  .chip{
    font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);transition:all .13s;
  }
  .chip:hover{border-color:var(--ink-faint)}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .n{opacity:.6;font-weight:500;margin-left:3px}

  .sched-head,.row{
    display:grid;
    grid-template-columns:78px minmax(150px,1.5fr) minmax(110px,1fr) 118px 86px 104px 118px;
    gap:10px;align-items:center;padding:10px 20px;
  }
  .sched-head{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);border-bottom:1px solid var(--line-soft);padding-top:12px;padding-bottom:8px}
  .rows{max-height:640px;overflow-y:auto}
  .rows::-webkit-scrollbar{width:8px}
  .rows::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  .row{border-bottom:1px solid var(--line-soft);transition:background .12s;position:relative}
  .row:last-child{border-bottom:none}
  .row:hover{background:#fafcf9}
  .row.is-live{background:linear-gradient(90deg,rgba(14,117,105,.05),transparent 70%)}
  .row.is-live::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal)}
  .row.is-noshow{opacity:.85}
  .row.is-done{opacity:.62}
  .row .time{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  .row .time .dur{display:block;font-size:10.5px;font-weight:400;color:var(--ink-faint)}
  .pt{display:flex;align-items:center;gap:10px;min-width:0}
  .avatar{
    width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:11px;font-weight:700;color:#fff;letter-spacing:.02em;
  }
  .pt .name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pt .meta{font-size:11px;color:var(--ink-faint)}
  .prov{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .type{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .room-tag{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:var(--teal-deep);background:var(--teal-soft);padding:3px 8px;border-radius:6px;display:inline-block}
  .room-tag.none{color:var(--ink-faint);background:var(--line-soft)}
  .pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.completed{background:var(--green-soft);color:var(--green)}
  .pill.in-room{background:var(--teal-soft);color:var(--teal-deep)}
  .pill.in-room::before{animation:pulse 1.6s infinite}
  .pill.waiting{background:var(--amber-soft);color:var(--amber)}
  .pill.upcoming{background:var(--blue-soft);color:var(--blue)}
  .pill.no-show{background:var(--rust-soft);color:var(--rust)}
  .pill.rebooked{background:var(--line-soft);color:var(--ink-faint)}
  .actions{display:flex;gap:6px;justify-content:flex-end}
  .empty{padding:44px 20px;text-align:center;color:var(--ink-faint);font-size:13px}
  .empty strong{display:block;font-family:'Fraunces',serif;font-size:16px;color:var(--ink-soft);margin-bottom:4px}

  /* ---------- Right column ---------- */
  .side{display:flex;flex-direction:column;gap:18px}
  .rooms-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
  .room{
    border:1px solid var(--line);border-radius:11px;padding:12px;min-height:118px;
    display:flex;flex-direction:column;gap:6px;transition:border-color .15s;position:relative;
  }
  .room.occupied{border-color:#bcd9d3;background:linear-gradient(160deg,#f4faf8,#fff)}
  .room.cleaning{border-color:#ecd9a8;background:linear-gradient(160deg,#fdf9ee,#fff)}
  .room.available{border-style:dashed;background:#fbfcfa}
  .room-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .room-name{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
  .room-state{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px}
  .occupied .room-state{background:var(--teal-soft);color:var(--teal-deep)}
  .cleaning .room-state{background:var(--amber-soft);color:var(--amber)}
  .available .room-state{background:var(--line-soft);color:var(--ink-faint)}
  .room-patient{font-weight:600;font-size:12.5px;line-height:1.3}
  .room-prov{font-size:11px;color:var(--ink-faint)}
  .room-timer{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--teal-deep);margin-top:auto}
  .cleaning .room-timer{color:var(--amber)}
  .bar{height:4px;border-radius:99px;background:var(--line-soft);overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--teal);transition:width 1s linear}
  .cleaning .bar i{background:#d9a520}
  .room .ready-note{font-size:11.5px;color:var(--ink-faint);margin-top:auto}
  .room .btn{margin-top:auto;align-self:flex-start}

  /* ---------- No-shows ---------- */
  .noshow-list{padding:6px 0}
  .ns{
    display:flex;align-items:center;gap:11px;padding:12px 18px;border-bottom:1px solid var(--line-soft);
  }
  .ns:last-child{border-bottom:none}
  .ns .time{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:var(--rust);flex:none;width:58px}
  .ns .info{min-width:0;flex:1}
  .ns .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ns .meta{font-size:11px;color:var(--ink-faint)}
  .ns .attempts{font-size:10px;font-weight:700;color:var(--amber);background:var(--amber-soft);padding:2px 7px;border-radius:99px;flex:none}
  .ns-actions{display:flex;gap:5px;flex:none}
  .ns-empty{padding:28px 18px;text-align:center;color:var(--ink-faint);font-size:12.5px}
  .ns-empty strong{display:block;color:var(--green);font-size:13px;margin-bottom:2px}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(24,36,32,.45);backdrop-filter:blur(3px);
    display:none;place-items:center;z-index:100;padding:20px;
  }
  .overlay.open{display:grid}
  .modal{
    background:#fff;border-radius:16px;width:100%;max-width:420px;padding:26px;
    box-shadow:0 24px 60px -12px rgba(24,36,32,.4);animation:pop .18s ease;
  }
  @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal h3{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:4px}
  .modal p{font-size:12.5px;color:var(--ink-faint);margin-bottom:18px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px}
  .field input,.field select{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;
    font-family:'Inter';font-size:13.5px;color:var(--ink);background:#fbfcfa;outline:none;
  }
  .field input:focus,.field select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,117,105,.12)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:#eef5f1;padding:11px 20px;border-radius:11px;font-size:13px;font-weight:500;
    box-shadow:0 12px 32px -8px rgba(24,36,32,.5);transition:transform .25s cubic-bezier(.2,.9,.3,1.2);z-index:200;
    display:flex;align-items:center;gap:9px;max-width:90vw;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast .tick{color:#4ade80;font-weight:700}

  /* ---------- Responsive ---------- */
  @media (max-width:1180px){
    .grid{grid-template-columns:1fr}
    .side{flex-direction:row;flex-wrap:wrap}
    .side .panel{flex:1 1 340px}
    .kpis{grid-template-columns:repeat(3,1fr)}
  }
  @media (max-width:820px){
    .sched-head{display:none}
    .row{grid-template-columns:66px 1.4fr 100px 110px;grid-template-areas:"time pt status actions" "time prov type room";row-gap:4px}
    .row .time{grid-area:time}.row .pt{grid-area:pt}.row .prov{grid-area:prov}
    .row .type{grid-area:type}.row .roomcell{grid-area:room}.row .statuscell{grid-area:status}.row .actions{grid-area:actions}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .wrap{padding:18px 14px 50px}
    .topbar{padding:14px}
    .search{min-width:140px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <div>
      <h1>Willow Lane Clinic</h1>
      <small>Front Desk Dashboard</small>
    </div>
  </div>
  <div class="topbar-meta">
    <span class="date-chip" id="dateChip"></span>
    <span class="clock"><span class="dot"></span><span id="clock">--:--:--</span></span>
    <button class="btn btn-primary" id="newApptBtn">+ New appointment</button>
  </div>
</header>

<div class="wrap">

  <!-- KPIs -->
  <section class="kpis" id="kpis"></section>

  <div class="grid">

    <!-- Schedule -->
    <section class="panel">
      <div class="panel-head">
        <h2>Today’s schedule</h2>
        <span class="count" id="schedCount"></span>
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="text" id="searchInput" placeholder="Search patient or provider…">
        </div>
      </div>
      <div class="filters" id="filters"></div>
      <div class="sched-head">
        <span>Time</span><span>Patient</span><span>Provider</span><span>Visit</span><span>Room</span><span>Status</span><span style="text-align:right">Action</span>
      </div>
      <div class="rows" id="rows"></div>
    </section>

    <!-- Side column -->
    <div class="side">

      <section class="panel">
        <div class="panel-head">
          <h2>Rooms</h2>
          <span class="count" id="roomCount"></span>
        </div>
        <div class="rooms-grid" id="roomsGrid"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>No-shows</h2>
          <span class="count" id="nsCount"></span>
        </div>
        <div class="noshow-list" id="nsList"></div>
      </section>

    </div>
  </div>
</div>

<!-- New appointment modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>New appointment</h3>
    <p>Adds a visit to today’s schedule as <strong>Upcoming</strong>.</p>
    <form id="apptForm">
      <div class="field">
        <label for="fName">Patient name</label>
        <input id="fName" required placeholder="e.g. Jordan Avery" autocomplete="off">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fProv">Provider</label>
          <select id="fProv"></select>
        </div>
        <div class="field">
          <label for="fType">Visit type</label>
          <select id="fType">
            <option>Follow-up</option><option>New patient</option><option>Annual physical</option>
            <option>Lab review</option><option>Vaccination</option><option>Urgent consult</option>
            <option>Rx review</option><option>Skin check</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fTime">Start time</label>
          <input id="fTime" type="time" required>
        </div>
        <div class="field">
          <label for="fDur">Duration</label>
          <select id="fDur"><option value="20">20 min</option><option value="30" selected>30 min</option><option value="40">40 min</option><option value="45">45 min</option></select>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Add to schedule</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"><span class="tick">✓</span><span id="toastMsg"></span></div>

<script>
(function(){
  'use strict';
  const NOW = Date.now();
  const MIN = 60000;

  /* ---------- Seed data (times relative to load so the board is always "live") ---------- */
  const providers = ['Dr. Okafor','Dr. Reyes','Dr. Lindqvist','NP Chen','Dr. Haddad'];
  const rooms = [
    {id:'e1', name:'Exam 1'}, {id:'e2', name:'Exam 2'}, {id:'e3', name:'Exam 3'},
    {id:'co', name:'Consult'}, {id:'pr', name:'Procedure'}, {id:'mv', name:'Movement'}
  ];
  const cleaning = { co: NOW + 6*MIN };   // rooms mid-turnover

  let uid = 0;
  function A(offset, dur, patient, provider, type, status, room, attempts){
    const start = NOW + offset*MIN;
    return { id:++uid, start, dur, endsAt:start + dur*MIN, patient, provider, type,
             status, room:room||null, attempts:attempts||0 };
  }
  let appts = [
    A(-195,20,'Marcus Bell','Dr. Okafor','Follow-up','completed'),
    A(-180,30,'Ava Thompson','NP Chen','Annual physical','completed'),
    A(-165,20,'Jonah Price','Dr. Reyes','Vaccination','completed'),
    A(-150,40,'Priya Nair','Dr. Lindqvist','Skin check','completed'),
    A(-135,20,'Sam Whitfield','Dr. Okafor','Lab review','completed'),
    A(-120,30,'Elena Vasquez','Dr. Haddad','Physio intake','completed'),
    A(-105,20,'Theo Marsh','NP Chen','Rx refill','completed'),
    A(-90,30,'Grace Osei','Dr. Reyes','Well-child','completed'),
    A(-75,20,'Dylan Frost','Dr. Okafor','Follow-up','no-show',null,2),
    A(-45,30,'Rita Calloway','Dr. Lindqvist','Mole mapping','no-show',null,1),
    A(-25,45,'Carl Jensen','Dr. Lindqvist','Biopsy','in-room','pr'),
    A(-20,20,'Owen Beck','NP Chen','Blood pressure','no-show',null,0),
    A(-12,30,'Maya Sørensen','Dr. Okafor','Urgent consult','in-room','e1'),
    A(-10,20,'Fatima Al-Rashid','NP Chen','Sore throat','waiting'),
    A(-8,40,'Leo Fitzgerald','Dr. Haddad','Physio session','in-room','mv'),
    A(-5,25,'Nina Petrova','Dr. Reyes','Ear infection','in-room','e2'),
    A(-3,30,'Ben Kowalski','Dr. Okafor','New patient','waiting'),
    A(15,20,'Isla Murray','Dr. Reyes','Vaccination','upcoming'),
    A(30,30,'Victor Huang','Dr. Okafor','Follow-up','upcoming'),
    A(45,20,'Dana Weiss','NP Chen','Lab review','upcoming'),
    A(60,40,'Amara Diallo','Dr. Lindqvist','Skin check','upcoming'),
    A(80,30,'Peter Novak','Dr. Haddad','Physio follow-up','upcoming'),
    A(100,20,'June Castillo','Dr. Reyes','Well-child','upcoming'),
    A(125,30,'Rosa Delgado','NP Chen','Annual physical','upcoming'),
    A(150,20,'Kim Yoon','Dr. Okafor','Rx review','upcoming')
  ];

  /* ---------- State ---------- */
  let filter = 'all';
  let query = '';

  /* ---------- Helpers ---------- */
  const $ = s => document.querySelector(s);
  const fmtTime = ts => new Date(ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  const initials = n => n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const hue = n => { let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))%360; return h; };
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const roomName = id => (rooms.find(r=>r.id===id)||{}).name || '—';
  const statusLabel = {'completed':'Completed','in-room':'In room','waiting':'Waiting','upcoming':'Upcoming','no-show':'No-show','rebooked':'Rebooked'};

  let toastTimer;
  function toast(msg){
    $('#toastMsg').textContent = msg;
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> $('#toast').classList.remove('show'), 2600);
  }

  function roomState(id){
    const occ = appts.find(a => a.status==='in-room' && a.room===id);
    if(occ) return {state:'occupied', appt:occ};
    if(cleaning[id] && cleaning[id] > Date.now()) return {state:'cleaning', until:cleaning[id]};
    return {state:'available'};
  }

  /* ---------- KPIs ---------- */
  function renderKPIs(){
    const total = appts.length;
    const done = appts.filter(a=>a.status==='completed').length;
    const inClinic = appts.filter(a=>a.status==='waiting'||a.status==='in-room').length;
    const waiting = appts.filter(a=>a.status==='waiting').length;
    const ns = appts.filter(a=>a.status==='no-show'||a.status==='rebooked').length;
    const used = rooms.filter(r=>roomState(r.id).state==='occupied').length;
    const cards = [
      {label:'Appointments today', value:total, sub:`${appts.filter(a=>a.status==='upcoming').length} still upcoming`, accent:'var(--blue)'},
      {label:'Completed', value:done, sub:`${Math.round(done/total*100)}% of the day`, accent:'var(--green)'},
      {label:'In clinic now', value:inClinic, sub:`${waiting} waiting · ${inClinic-waiting} in room`, accent:'var(--teal)'},
      {label:'No-shows', value:ns, sub:`${appts.filter(a=>a.status==='no-show').length} awaiting follow-up`, accent:'var(--rust)', warn:ns>0},
      {label:'Rooms in use', value:`${used}<small> / ${rooms.length}</small>`, sub:`${rooms.filter(r=>roomState(r.id).state==='cleaning').length} in turnover`, accent:'var(--amber)'}
    ];
    $('#kpis').innerHTML = cards.map(c=>`
      <div class="kpi ${c.warn?'warn':''}" style="--kpi-accent:${c.accent}">
        <div class="label">${c.label}</div>
        <div class="value">${c.value}</div>
        <div class="sub">${c.sub}</div>
      </div>`).join('');
  }

  /* ---------- Filters ---------- */
  const filterDefs = [
    ['all','All'],['waiting','Waiting'],['in-room','In room'],['upcoming','Upcoming'],
    ['completed','Completed'],['no-show','No-shows']
  ];
  function renderFilters(){
    $('#filters').innerHTML = filterDefs.map(([key,label])=>{
      const n = key==='all' ? appts.length
              : key==='no-show' ? appts.filter(a=>a.status==='no-show'||a.status==='rebooked').length
              : appts.filter(a=>a.status===key).length;
      return `<button class="chip ${filter===key?'active':''}" data-filter="${key}">${label}<span class="n">${n}</span></button>`;
    }).join('');
  }
  $('#filters').addEventListener('click', e=>{
    const b = e.target.closest('[data-filter]');
    if(!b) return;
    filter = b.dataset.filter;
    renderFilters(); renderRows();
  });
  $('#searchInput').addEventListener('input', e=>{ query = e.target.value.trim().toLowerCase(); renderRows(); });

  /* ---------- Schedule rows ---------- */
  function actionButtons(a){
    switch(a.status){
      case 'upcoming': return `<button class="btn btn-xs btn-seat" data-act="checkin" data-id="${a.id}">Check in</button>`;
      case 'waiting':  return `<button class="btn btn-xs btn-seat" data-act="seat" data-id="${a.id}">Seat</button>
                               <button class="btn btn-xs btn-danger-ghost" data-act="noshow" data-id="${a.id}" title="Mark as no-show">✕</button>`;
      case 'in-room':  return `<button class="btn btn-xs btn-ghost" data-act="complete" data-id="${a.id}">Complete</button>`;
      case 'no-show':  return `<button class="btn btn-xs btn-danger-ghost" data-act="rebook" data-id="${a.id}">Rebook</button>`;
      default: return `<span style="color:var(--ink-faint);font-size:12px">—</span>`;
    }
  }
  function renderRows(){
    const list = appts
      .filter(a=>{
        if(filter==='no-show') return a.status==='no-show'||a.status==='rebooked';
        if(filter!=='all' && a.status!==filter) return false;
        return true;
      })
      .filter(a=> !query || a.patient.toLowerCase().includes(query) || a.provider.toLowerCase().includes(query))
      .sort((a,b)=>a.start-b.start);

    $('#schedCount').textContent = `${list.length} visit${list.length===1?'':'s'}`;

    if(!list.length){
      $('#rows').innerHTML = `<div class="empty"><strong>Nothing here</strong>No appointments match this view.</div>`;
      return;
    }
    $('#rows').innerHTML = list.map(a=>{
      const cls = a.status==='in-room' ? 'is-live' : a.status==='no-show' ? 'is-noshow' : a.status==='completed' ? 'is-done' : '';
      const h = hue(a.patient);
      return `
      <div class="row ${cls}">
        <div class="time">${fmtTime(a.start)}<span class="dur">${a.dur} min</span></div>
        <div class="pt">
          <div class="avatar" style="background:hsl(${h},38%,46%)">${initials(a.patient)}</div>
          <div style="min-width:0"><div class="name">${esc(a.patient)}</div><div class="meta">${esc(a.type)}</div></div>
        </div>
        <div class="prov">${esc(a.provider)}</div>
        <div class="type">${esc(a.type)}</div>
        <div class="roomcell"><span class="room-tag ${a.room?'':'none'}">${a.room?roomName(a.room):'—'}</span></div>
        <div class="statuscell"><span class="pill ${a.status}">${statusLabel[a.status]}</span></div>
        <div class="actions">${actionButtons(a)}</div>
      </div>`;
    }).join('');
  }

  $('#rows').addEventListener('click', e=>{
    const b = e.target.closest('[data-act]');
    if(!b) return;
    const a = appts.find(x=>x.id===+b.dataset.id);
    if(!a) return;
    const act = b.dataset.act;
    if(act==='checkin'){
      a.status='waiting';
      toast(`${a.patient} checked in — added to the waiting list.`);
    } else if(act==='seat'){
      const free = rooms.find(r=>roomState(r.id).state==='available');
      if(!free){ toast('No rooms available — complete a visit or finish turnover first.'); return; }
      a.status='in-room'; a.room=free.id;
      a.endsAt = Date.now() + a.dur*MIN;
      toast(`${a.patient} seated in ${free.name}.`);
    } else if(act==='complete'){
      const rid = a.room;
      a.status='completed'; a.room=null;
      if(rid) cleaning[rid] = Date.now() + 6*MIN;
      toast(`Visit completed — ${rid?roomName(rid)+' flagged for turnover.':'well done.'}`);
    } else if(act==='noshow'){
      a.status='no-show'; a.attempts=0;
      toast(`${a.patient} marked as a no-show.`);
    } else if(act==='rebook'){
      a.status='rebooked';
      toast(`Rebook request sent to ${a.patient}.`);
    }
    renderAll();
  });

  /* ---------- Rooms ---------- */
  function renderRooms(){
    const used = rooms.filter(r=>roomState(r.id).state==='occupied').length;
    $('#roomCount').textContent = `${used} of ${rooms.length} in use`;
    $('#roomsGrid').innerHTML = rooms.map(r=>{
      const s = roomState(r.id);
      if(s.state==='occupied'){
        const a = s.appt;
        return `<div class="room occupied">
          <div class="room-top"><span class="room-name">${r.name}</span><span class="room-state">In use</span></div>
          <div class="room-patient">${esc(a.patient)}</div>
          <div class="room-prov">${esc(a.provider)} · ${esc(a.type)}</div>
          <div class="room-timer" data-ends="${a.endsAt}" data-dur="${a.dur}"></div>
          <div class="bar"><i data-bar-ends="${a.endsAt}" data-dur="${a.dur}"></i></div>
        </div>`;
      }
      if(s.state==='cleaning'){
        return `<div class="room cleaning">
          <div class="room-top"><span class="room-name">${r.name}</span><span class="room-state">Turnover</span></div>
          <div class="room-prov">Cleaning &amp; restocking</div>
          <div class="room-timer" data-ends="${s.until}" data-dur="6"></div>
          <div class="bar"><i data-bar-ends="${s.until}" data-dur="6"></i></div>
          <button class="btn btn-xs btn-ghost" data-clean="${r.id}" style="margin-top:8px">Mark ready</button>
        </div>`;
      }
      return `<div class="room available">
        <div class="room-top"><span class="room-name">${r.name}</span><span class="room-state">Open</span></div>
        <div class="ready-note">Ready for the next patient.</div>
      </div>`;
    }).join('');
    tickTimers();
  }
  $('#roomsGrid').addEventListener('click', e=>{
    const b = e.target.closest('[data-clean]');
    if(!b) return;
    delete cleaning[b.dataset.clean];
    toast(`${roomName(b.dataset.clean)} is ready.`);
    renderAll();
  });

  /* ---------- No-shows ---------- */
  function renderNoShows(){
    const list = appts.filter(a=>a.status==='no-show').sort((a,b)=>a.start-b.start);
    $('#nsCount').textContent = `${list.length} to follow up`;
    if(!list.length){
      $('#nsList').innerHTML = `<div class="ns-empty"><strong>All clear ✓</strong>No outstanding no-shows. Nice work.</div>`;
      return;
    }
    $('#nsList').innerHTML = list.map(a=>`
      <div class="ns">
        <span class="time">${fmtTime(a.start)}</span>
        <div class="info">
          <div class="name">${esc(a.patient)}</div>
          <div class="meta">${esc(a.provider)} · ${esc(a.type)}</div>
        </div>
        <span class="attempts">${a.attempts} call${a.attempts===1?'':'s'}</span>
        <div class="ns-actions">
          <button class="btn btn-xs btn-ghost" data-call="${a.id}" title="Log a call attempt">Call</button>
          <button class="btn btn-xs btn-danger-ghost" data-rebook="${a.id}">Rebook</button>
        </div>
      </div>`).join('');
  }
  $('#nsList').addEventListener('click', e=>{
    const call = e.target.closest('[data-call]');
    const rebook = e.target.closest('[data-rebook]');
    if(call){
      const a = appts.find(x=>x.id===+call.dataset.call);
      a.attempts++;
      toast(`Call attempt logged for ${a.patient} (${a.attempts} total).`);
      renderAll();
    } else if(rebook){
      const a = appts.find(x=>x.id===+rebook.dataset.rebook);
      a.status='rebooked';
      toast(`Rebook request sent to ${a.patient}.`);
      renderAll();
    }
  });

  /* ---------- Timers & clock ---------- */
  function tickTimers(){
    const now = Date.now();
    document.querySelectorAll('[data-ends]').forEach(el=>{
      const left = Math.max(0, +el.dataset.ends - now);
      const m = Math.ceil(left/MIN);
      el.textContent = left<=0 ? 'Wrapping up…' : `${m} min left`;
    });
    document.querySelectorAll('[data-bar-ends]').forEach(el=>{
      const total = (+el.dataset.dur)*MIN;
      const left = Math.max(0, +el.dataset.barEnds - now);
      el.style.width = Math.min(100, Math.max(3, (1-left/total)*100)) + '%';
    });
  }
  function tick(){
    const d = new Date();
    $('#clock').textContent = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    let changed = false;
    for(const id in cleaning){
      if(cleaning[id] <= Date.now()){ delete cleaning[id]; changed = true; }
    }
    if(changed) renderAll(); else tickTimers();
  }

  /* ---------- Modal ---------- */
  const overlay = $('#overlay');
  $('#fProv').innerHTML = providers.map(p=>`<option>${p}</option>`).join('');
  $('#newApptBtn').addEventListener('click', ()=>{
    const t = new Date(Date.now()+30*MIN);
    $('#fTime').value = String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    $('#fName').value = '';
    overlay.classList.add('open');
    setTimeout(()=>$('#fName').focus(), 50);
  });
  $('#cancelBtn').addEventListener('click', ()=>overlay.classList.remove('open'));
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.classList.remove('open'); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') overlay.classList.remove('open'); });
  $('#apptForm').addEventListener('submit', e=>{
    e.preventDefault();
    const [h,m] = $('#fTime').value.split(':').map(Number);
    const start = new Date(); start.setHours(h,m,0,0);
    const dur = +$('#fDur').value;
    const name = $('#fName').value.trim();
    appts.push({ id:++uid, start:start.getTime(), dur, endsAt:start.getTime()+dur*MIN,
      patient:name, provider:$('#fProv').value, type:$('#fType').value,
      status: start.getTime() < Date.now() ? 'waiting' : 'upcoming', room:null, attempts:0 });
    overlay.classList.remove('open');
    toast(`${name} added at ${fmtTime(start.getTime())}.`);
    renderAll();
  });

  /* ---------- Boot ---------- */
  function renderAll(){ renderKPIs(); renderFilters(); renderRows(); renderRooms(); renderNoShows(); }
  $('#dateChip').textContent = new Date().toLocaleDateString([], {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  renderAll();
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
