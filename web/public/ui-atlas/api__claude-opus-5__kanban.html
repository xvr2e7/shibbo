<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio North — Design Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f1f3f7;
    --bg-grad: radial-gradient(1200px 600px at 10% -10%, #e8ecff 0%, transparent 60%), radial-gradient(900px 500px at 100% 0%, #ffe9f3 0%, transparent 55%);
    --surface: #ffffff;
    --surface-2: #f7f8fb;
    --card: #ffffff;
    --text: #1b1f2a;
    --text-soft: #6b7280;
    --text-faint: #9aa1ad;
    --border: #e6e8ee;
    --border-strong: #d6d9e2;
    --shadow: 0 1px 2px rgba(18,22,33,.06), 0 4px 12px rgba(18,22,33,.05);
    --shadow-lg: 0 12px 40px rgba(18,22,33,.18);
    --accent: #5b5bd6;
    --accent-soft: #ececff;
    --danger: #d9435e;
  }
  html[data-theme="dark"]{
    --bg: #11131a;
    --bg-grad: radial-gradient(1100px 600px at 5% -10%, #1d2140 0%, transparent 60%), radial-gradient(900px 500px at 100% 0%, #2a1b2c 0%, transparent 55%);
    --surface: #171a23;
    --surface-2: #1c202b;
    --card: #1f2430;
    --text: #e8eaf0;
    --text-soft: #9ba3b4;
    --text-faint: #767e8e;
    --border: #272c39;
    --border-strong: #333a4a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
    --shadow-lg: 0 18px 50px rgba(0,0,0,.55);
    --accent: #8f8fff;
    --accent-soft: #272a52;
    --danger: #f2708a;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:var(--text);
    background-color:var(--bg);
    background-image:var(--bg-grad);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }

  /* ---------- Header ---------- */
  header{
    padding:18px 26px 14px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    border-bottom:1px solid var(--border);
    background:color-mix(in srgb, var(--surface) 72%, transparent);
    backdrop-filter:blur(12px);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:linear-gradient(140deg,#6f6fe8,#b06ae6 60%,#ff8bb0);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;
    box-shadow:0 6px 16px rgba(111,111,232,.35);
  }
  .brand h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--text-soft)}
  .spacer{flex:1 1 auto}

  .team{display:flex;align-items:center}
  .team .avatar{margin-left:-8px;border:2px solid var(--surface);}
  .team .avatar:first-child{margin-left:0}
  .avatar{
    width:28px;height:28px;border-radius:50%;flex:none;
    display:grid;place-items:center;font-size:10.5px;font-weight:650;color:#fff;
    letter-spacing:.02em;
  }
  .avatar.lg{width:34px;height:34px;font-size:12px}

  .search{
    position:relative;display:flex;align-items:center;
  }
  .search svg{position:absolute;left:10px;width:15px;height:15px;stroke:var(--text-faint);fill:none;stroke-width:2}
  input[type="search"]{
    font:inherit;font-size:13px;color:var(--text);
    padding:8px 12px 8px 31px;width:200px;
    border-radius:9px;border:1px solid var(--border-strong);
    background:var(--surface);outline:none;transition:.15s;
  }
  input[type="search"]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}

  button{font:inherit;cursor:pointer}
  .btn{
    border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
    padding:8px 13px;border-radius:9px;font-size:13px;font-weight:550;
    display:inline-flex;align-items:center;gap:7px;transition:.15s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
  .btn.primary:hover{filter:brightness(1.07);color:#fff}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--text-soft)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--text)}
  .btn.icon{padding:8px;width:34px;justify-content:center}

  .progress-wrap{display:flex;flex-direction:column;gap:5px;min-width:140px}
  .progress-wrap span{font-size:11px;color:var(--text-soft);font-weight:550;letter-spacing:.02em}
  .bar{height:5px;border-radius:99px;background:var(--border);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4ec19a,#36a97f);transition:width .4s ease}

  /* ---------- Board ---------- */
  .board{
    flex:1;display:flex;gap:16px;align-items:flex-start;
    padding:22px 26px 34px;overflow-x:auto;
  }
  .col{
    width:296px;flex:none;display:flex;flex-direction:column;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    box-shadow:var(--shadow);max-height:calc(100vh - 150px);
  }
  .col.drag-over{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
  .col-head{
    display:flex;align-items:center;gap:8px;padding:13px 14px 11px;
  }
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .col-head h2{margin:0;font-size:13px;font-weight:650;letter-spacing:.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .count{
    font-size:11px;font-weight:650;color:var(--text-soft);
    background:var(--surface-2);border:1px solid var(--border);
    padding:1px 7px;border-radius:99px;
  }
  .count.over{color:#fff;background:var(--danger);border-color:transparent}
  .cards{
    display:flex;flex-direction:column;gap:9px;
    padding:2px 11px 11px;overflow-y:auto;min-height:14px;flex:1;
    scrollbar-width:thin;
  }
  .cards::-webkit-scrollbar{width:8px}
  .cards::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:2px solid var(--surface)}
  .col-foot{padding:0 11px 11px}
  .add-card{
    width:100%;text-align:left;border:1px dashed var(--border-strong);background:transparent;
    color:var(--text-soft);padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:550;transition:.15s;
  }
  .add-card:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:11px;
    padding:11px 12px 10px;box-shadow:var(--shadow);cursor:grab;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s;
    outline:none;
  }
  .card:hover{transform:translateY(-1px);border-color:var(--border-strong);box-shadow:0 2px 4px rgba(18,22,33,.07),0 10px 22px rgba(18,22,33,.09)}
  .card:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  .card.dragging{opacity:.55;transform:rotate(1.5deg) scale(.99);cursor:grabbing}
  .card .labels{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
  .chip{
    font-size:10.5px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;
    padding:3px 7px;border-radius:6px;white-space:nowrap;
  }
  .card h3{margin:0;font-size:13.5px;font-weight:600;line-height:1.38;letter-spacing:-.005em}
  .card p.desc{margin:5px 0 0;font-size:12px;line-height:1.45;color:var(--text-soft);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .cover{height:5px;border-radius:99px;margin-bottom:9px}
  .meta{display:flex;align-items:center;gap:9px;margin-top:10px}
  .meta .right{margin-left:auto;display:flex;align-items:center;gap:9px}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:550;color:var(--text-soft)}
  .pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .pill.due{padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border)}
  .pill.due.soon{color:#b4690e;background:#fff5e5;border-color:#f6dcb0}
  .pill.due.over{color:#fff;background:var(--danger);border-color:transparent}
  html[data-theme="dark"] .pill.due.soon{background:#3a2c14;border-color:#584river}
  html[data-theme="dark"] .pill.due.soon{background:#392b14;border-color:#584a28;color:#f0bc6e}
  .prio{width:6px;height:6px;border-radius:50%;flex:none}
  .empty{
    text-align:center;font-size:12px;color:var(--text-faint);padding:16px 8px;
    border:1px dashed var(--border);border-radius:10px;
  }

  /* inline composer */
  .composer{background:var(--card);border:1px solid var(--accent);border-radius:11px;padding:9px;box-shadow:var(--shadow)}
  .composer textarea{
    width:100%;border:none;outline:none;resize:none;background:transparent;color:var(--text);
    font:inherit;font-size:13.5px;line-height:1.4;min-height:46px;
  }
  .composer .row{display:flex;gap:7px;align-items:center;margin-top:5px}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(14,16,24,.45);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .overlay.open{display:flex}
  .modal{
    width:min(560px,100%);background:var(--surface);border:1px solid var(--border);
    border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;
    animation:pop .18s ease-out;max-height:90vh;display:flex;flex-direction:column;
  }
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
  .modal header{position:static;padding:15px 18px;background:transparent;backdrop-filter:none}
  .modal header h2{margin:0;font-size:15px;font-weight:650;flex:1}
  .modal .body{padding:4px 18px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
  label.field{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:650;
    letter-spacing:.04em;text-transform:uppercase;color:var(--text-faint)}
  .field input,.field textarea,.field select{
    font:inherit;font-size:13.5px;color:var(--text);background:var(--surface-2);
    border:1px solid var(--border-strong);border-radius:9px;padding:9px 11px;outline:none;transition:.15s;
    font-weight:400;letter-spacing:normal;text-transform:none;
  }
  .field textarea{resize:vertical;min-height:76px;line-height:1.5}
  .field input:focus,.field textarea:focus,.field select:focus{
    border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent);background:var(--surface)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .toggles{display:flex;flex-wrap:wrap;gap:6px}
  .toggle{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:7px;
    padding:4px 9px;font-size:11px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;color:var(--text-soft)}
  .toggle[aria-pressed="true"]{color:#fff;border-color:transparent}
  .modal footer{display:flex;gap:8px;padding:13px 18px;border-top:1px solid var(--border);background:var(--surface-2)}
  .modal footer .spacer{flex:1}
  .link-danger{border:none;background:none;color:var(--danger);font-size:12.5px;font-weight:600;padding:8px 4px}
  .link-danger:hover{text-decoration:underline}

  .hint{font-size:11.5px;color:var(--text-faint);padding:0 26px 20px}
  kbd{font-family:inherit;font-size:10.5px;background:var(--surface);border:1px solid var(--border-strong);
    border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--text-soft)}
  @media (max-width:720px){
    header{padding:14px}
    .board{padding:16px 14px 30px}
    .progress-wrap{display:none}
    input[type="search"]{width:140px}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">SN</div>
    <div>
      <h1>Studio North · Design Board</h1>
      <p id="sub">Sprint 14 — Mobile onboarding refresh</p>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="progress-wrap">
    <span id="progressLabel">0 of 0 shipped</span>
    <div class="bar"><i id="progressBar" style="width:0%"></i></div>
  </div>

  <div class="team" id="team" title="Team"></div>

  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
    <input type="search" id="search" placeholder="Filter tasks…" aria-label="Filter tasks">
  </div>

  <button class="btn icon ghost" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
  <button class="btn ghost" id="resetBtn" title="Restore the sample board">Reset</button>
  <button class="btn primary" id="newBtn">+ New task</button>
</header>

<main class="board" id="board"></main>
<p class="hint">Drag cards between columns · <kbd>Enter</kbd> to edit a focused card · <kbd>Ctrl</kbd>+<kbd>←</kbd>/<kbd>→</kbd> to move it · Everything saves to this browser.</p>

<!-- ------- Modal ------- -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header>
      <h2 id="modalTitle">Edit task</h2>
      <button class="btn icon ghost" id="closeBtn" aria-label="Close">✕</button>
    </header>
    <div class="body">
      <label class="field">Title
        <input type="text" id="fTitle" placeholder="e.g. Redesign empty states" autocomplete="off">
      </label>
      <label class="field">Notes
        <textarea id="fDesc" placeholder="Context, acceptance criteria, links…"></textarea>
      </label>
      <div class="field">Labels
        <div class="toggles" id="fLabels"></div>
      </div>
      <div class="grid2">
        <label class="field">Assignee
          <select id="fAssignee"></select>
        </label>
        <label class="field">Column
          <select id="fCol"></select>
        </label>
        <label class="field">Due date
          <input type="date" id="fDue">
        </label>
        <label class="field">Priority
          <select id="fPrio">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>
      </div>
    </div>
    <footer>
      <button class="link-danger" id="deleteBtn">Delete task</button>
      <div class="spacer"></div>
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save task</button>
    </footer>
  </div>
</div>

<script>
/* ---------------- Data ---------------- */
const MEMBERS = [
  {id:'ar', name:'Ana Reyes',      initials:'AR', color:'#6f6fe8'},
  {id:'km', name:'Kai Moreau',     initials:'KM', color:'#e0708f'},
  {id:'jt', name:'Jonah Tveit',    initials:'JT', color:'#2fa58a'},
  {id:'lo', name:'Lena Okafor',    initials:'LO', color:'#e09244'},
  {id:'sd', name:'Sam Drury',      initials:'SD', color:'#7a79a8'}
];
const LABELS = {
  ui:        {name:'UI',        bg:'#ececff', fg:'#4a4ac0', dark:'#33336b'},
  ux:        {name:'UX',        bg:'#e4f6ef', fg:'#1d7a5e', dark:'#17453a'},
  research:  {name:'Research',  bg:'#fff1e3', fg:'#a8651b', dark:'#4a3418'},
  copy:      {name:'Copy',      bg:'#fdeaf2', fg:'#b03a68', dark:'#4d2237'},
  handoff:   {name:'Handoff',   bg:'#e9f1ff', fg:'#2d62b8', dark:'#1f3559'},
  system:    {name:'System',    bg:'#f0ecfb', fg:'#6a4bb5', dark:'#352a52'}
};
const PRIO = {high:'#e04f6b', medium:'#e0a23c', low:'#8d95a5'};

const DEFAULT_COLUMNS = [
  {id:'ideas',    title:'Ideas & Requests', color:'#9aa1ad', wip:0},
  {id:'todo',     title:'Up Next',          color:'#6f6fe8', wip:0},
  {id:'doing',    title:'In Progress',      color:'#e09244', wip:3},
  {id:'review',   title:'Design Review',    color:'#b06ae6', wip:3},
  {id:'done',     title:'Shipped',          color:'#2fa58a', wip:0}
];

const d = (off)=>{const t=new Date();t.setDate(t.getDate()+off);return t.toISOString().slice(0,10);};

const DEFAULT_TASKS = [
  {id:'t1', col:'ideas', title:'Explore dark mode palette', desc:'Audit contrast on the 4 core screens before committing to tokens.', labels:['system','ui'], assignee:'sd', due:'', prio:'low', comments:2, links:1},
  {id:'t2', col:'ideas', title:'Illustration style refresh', desc:'Three directions for the marketing team to react to.', labels:['ui'], assignee:'km', due:'', prio:'low', comments:0, links:3},
  {id:'t3', col:'todo', title:'Onboarding flow — wireframes v2', desc:'Fold in the drop-off data from the analytics review.', labels:['ux','research'], assignee:'ar', due:d(4), prio:'high', comments:5, links:2},
  {id:'t4', col:'todo', title:'Empty states for Projects', desc:'Needs copy pairing with Lena.', labels:['ui','copy'], assignee:'lo', due:d(7), prio:'medium', comments:1, links:0},
  {id:'t5', col:'doing', title:'Mobile nav prototype', desc:'Interactive Figma prototype for Thursday usability session.', labels:['ux','ui'], assignee:'km', due:d(1), prio:'high', comments:8, links:4},
  {id:'t6', col:'doing', title:'Component library: form inputs', desc:'Variants, focus rings, error states, and docs page.', labels:['system'], assignee:'jt', due:d(5), prio:'medium', comments:3, links:1},
  {id:'t7', col:'review', title:'Pricing page hero', desc:'Second round after stakeholder notes — tighter headline.', labels:['ui','copy'], assignee:'lo', due:d(-1), prio:'high', comments:6, links:2},
  {id:'t8', col:'review', title:'Usability test synthesis', desc:'5 sessions clustered into themes; recommendations attached.', labels:['research'], assignee:'ar', due:d(2), prio:'medium', comments:4, links:5},
  {id:'t9', col:'done', title:'Icon set 2.0 handoff', desc:'Exported, named, and pushed to the shared library.', labels:['handoff','system'], assignee:'jt', due:d(-6), prio:'low', comments:2, links:1},
  {id:'t10', col:'done', title:'Settings IA restructure', desc:'Signed off by engineering on Monday.', labels:['ux'], assignee:'sd', due:d(-9), prio:'medium', comments:7, links:0}
];

/* ---------------- State ---------------- */
const KEY = 'studio-north-board-v1';
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); if(p && p.tasks) return p; }
  }catch(e){}
  return {columns: structuredClone(DEFAULT_COLUMNS), tasks: structuredClone(DEFAULT_TASKS)};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const board = document.getElementById('board');
const searchEl = document.getElementById('search');
let query = '';
let composerCol = null;

/* ---------------- Helpers ---------------- */
const member = id => MEMBERS.find(m=>m.id===id);
const isDark = () => document.documentElement.dataset.theme === 'dark';
function fmtDate(iso){
  const dt = new Date(iso+'T00:00:00');
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function dueClass(iso, col){
  if(!iso || col==='done') return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const dt = new Date(iso+'T00:00:00');
  const days = Math.round((dt-today)/86400000);
  if(days < 0) return 'over';
  if(days <= 2) return 'soon';
  return '';
}
function matches(t){
  if(!query) return true;
  const q = query.toLowerCase();
  const m = member(t.assignee);
  return (t.title+' '+(t.desc||'')+' '+t.labels.map(l=>LABELS[l]?.name||'').join(' ')+' '+(m?m.name:'')).toLowerCase().includes(q);
}
const uid = () => 't'+Math.random().toString(36).slice(2,9);

/* ---------------- Render ---------------- */
function render(){
  board.innerHTML = '';
  state.columns.forEach(col=>{
    const tasks = state.tasks.filter(t=>t.col===col.id);
    const visible = tasks.filter(matches);

    const el = document.createElement('section');
    el.className = 'col';
    el.dataset.col = col.id;

    const head = document.createElement('div');
    head.className = 'col-head';
    const over = col.wip && tasks.length > col.wip;
    head.innerHTML = `<span class="dot" style="background:${col.color}"></span>
      <h2>${col.title}</h2>
      <span class="count ${over?'over':''}" title="${col.wip?('WIP limit '+col.wip):'tasks'}">${tasks.length}${col.wip?' / '+col.wip:''}</span>`;
    el.appendChild(head);

    const list = document.createElement('div');
    list.className = 'cards';
    list.dataset.col = col.id;
    visible.forEach(t=>list.appendChild(cardEl(t)));
    if(!visible.length){
      const e = document.createElement('div');
      e.className='empty';
      e.textContent = query ? 'No matches' : 'Drop a card here';
      list.appendChild(e);
    }
    el.appendChild(list);

    const foot = document.createElement('div');
    foot.className = 'col-foot';
    if(composerCol === col.id){
      foot.appendChild(composerEl(col.id));
    }else{
      const add = document.createElement('button');
      add.className = 'add-card';
      add.textContent = '+ Add a card';
      add.onclick = ()=>{ composerCol = col.id; render(); };
      foot.appendChild(add);
    }
    el.appendChild(foot);

    wireDrop(list, el);
    board.appendChild(el);
  });

  // progress + team
  const done = state.tasks.filter(t=>t.col==='done').length;
  const total = state.tasks.length || 1;
  document.getElementById('progressBar').style.width = Math.round(done/total*100)+'%';
  document.getElementById('progressLabel').textContent = `${done} of ${state.tasks.length} shipped`;

  const team = document.getElementById('team');
  team.innerHTML = '';
  MEMBERS.forEach(m=>{
    const a = document.createElement('div');
    a.className='avatar'; a.style.background=m.color; a.textContent=m.initials; a.title=m.name;
    team.appendChild(a);
  });
  save();
}

function cardEl(t){
  const el = document.createElement('article');
  el.className = 'card';
  el.draggable = true;
  el.tabIndex = 0;
  el.dataset.id = t.id;

  const m = member(t.assignee);
  const dc = dueClass(t.due, t.col);
  const labels = t.labels.map(k=>{
    const L = LABELS[k]; if(!L) return '';
    const bg = isDark() ? L.dark : L.bg;
    const fg = isDark() ? '#fff' : L.fg;
    return `<span class="chip" style="background:${bg};color:${fg}">${L.name}</span>`;
  }).join('');

  el.innerHTML = `
    ${labels?`<div class="labels">${labels}</div>`:''}
    <h3>${escapeHtml(t.title)}</h3>
    ${t.desc?`<p class="desc">${escapeHtml(t.desc)}</p>`:''}
    <div class="meta">
      ${m?`<div class="avatar" style="background:${m.color}" title="${m.name}">${m.initials}</div>`:''}
      ${t.due?`<span class="pill due ${dc}"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>${fmtDate(t.due)}</span>`:''}
      <div class="right">
        ${t.comments?`<span class="pill"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.3A8 8 0 1 1 21 12z"/></svg>${t.comments}</span>`:''}
        ${t.links?`<span class="pill"><svg viewBox="0 0 24 24"><path d="M10 13a4 4 0 0 0 5.7.4l2.6-2.6A4 4 0 1 0 12.6 5l-1.5 1.5"/><path d="M14 11a4 4 0 0 0-5.7-.4L5.7 13.2A4 4 0 1 0 11.4 19l1.5-1.5"/></svg>${t.links}</span>`:''}
        <span class="prio" style="background:${PRIO[t.prio]||PRIO.low}" title="${t.prio} priority"></span>
      </div>
    </div>`;

  el.addEventListener('dragstart', e=>{
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', t.id); }catch(_){}
  });
  el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); commitDom(); });
  el.addEventListener('click', ()=>openModal(t.id));
  el.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); openModal(t.id); }
    if(e.key===' '){ e.preventDefault(); openModal(t.id); }
    if((e.ctrlKey||e.metaKey) && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
      e.preventDefault(); moveWithKeys(t.id, e.key);
    }
  });
  return el;
}

function composerEl(colId){
  const wrap = document.createElement('form');
  wrap.className = 'composer';
  wrap.innerHTML = `<textarea placeholder="What needs designing?" rows="2"></textarea>
    <div class="row"><button type="submit" class="btn primary">Add card</button>
    <button type="button" class="btn ghost" data-cancel>Cancel</button></div>`;
  const ta = wrap.querySelector('textarea');
  setTimeout(()=>ta.focus(),0);
  ta.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); wrap.requestSubmit(); }
    if(e.key==='Escape'){ composerCol=null; render(); }
  });
  wrap.querySelector('[data-cancel]').onclick = ()=>{ composerCol=null; render(); };
  wrap.onsubmit = e=>{
    e.preventDefault();
    const title = ta.value.trim();
    if(title){
      state.tasks.push({id:uid(), col:colId, title, desc:'', labels:[], assignee:MEMBERS[0].id, due:'', prio:'medium', comments:0, links:0});
    }
    composerCol = title ? colId : null;
    render();
  };
  return wrap;
}

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------------- Drag & drop ---------------- */
function wireDrop(list, colEl){
  const over = e=>{
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    colEl.classList.add('drag-over');
    const dragging = document.querySelector('.card.dragging');
    if(!dragging) return;
    const empty = list.querySelector('.empty'); if(empty) empty.remove();
    const after = afterElement(list, e.clientY);
    if(after == null) list.appendChild(dragging);
    else list.insertBefore(dragging, after);
  };
  list.addEventListener('dragover', over);
  colEl.addEventListener('dragover', over);
  colEl.addEventListener('dragleave', e=>{ if(!colEl.contains(e.relatedTarget)) colEl.classList.remove('drag-over'); });
  colEl.addEventListener('drop', e=>{ e.preventDefault(); colEl.classList.remove('drag-over'); commitDom(); });
}
function afterElement(list, y){
  const els = [...list.querySelectorAll('.card:not(.dragging)')];
  return els.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset) return {offset, element:child};
    return closest;
  },{offset:-Infinity, element:null}).element;
}
function commitDom(){
  const ordered = [];
  document.querySelectorAll('.cards').forEach(list=>{
    const colId = list.dataset.col;
    list.querySelectorAll('.card').forEach(c=>{
      const t = state.tasks.find(x=>x.id===c.dataset.id);
      if(t){ t.col = colId; ordered.push(t); }
    });
  });
  // keep tasks hidden by the filter in place
  const hidden = state.tasks.filter(t=>!ordered.includes(t));
  state.tasks = [...ordered, ...hidden];
  render();
}
function moveWithKeys(id, key){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  const idx = state.columns.findIndex(c=>c.id===t.col);
  if(key==='ArrowLeft' && idx>0) t.col = state.columns[idx-1].id;
  if(key==='ArrowRight' && idx<state.columns.length-1) t.col = state.columns[idx+1].id;
  if(key==='ArrowUp'||key==='ArrowDown'){
    const sibs = state.tasks.filter(x=>x.col===t.col);
    const i = sibs.indexOf(t);
    const j = key==='ArrowUp' ? i-1 : i+1;
    if(j>=0 && j<sibs.length){
      const a = state.tasks.indexOf(sibs[i]), b = state.tasks.indexOf(sibs[j]);
      [state.tasks[a], state.tasks[b]] = [state.tasks[b], state.tasks[a]];
    }
  }
  render();
  const el = board.querySelector(`.card[data-id="${id}"]`);
  if(el) el.focus();
}

/* ---------------- Modal ---------------- */
const overlay = document.getElementById('overlay');
const fTitle=document.getElementById('fTitle'), fDesc=document.getElementById('fDesc'),
      fAssignee=document.getElementById('fAssignee'), fCol=document.getElementById('fCol'),
      fDue=document.getElementById('fDue'), fPrio=document.getElementById('fPrio'),
      fLabels=document.getElementById('fLabels');
let editingId = null;

MEMBERS.forEach(m=>{ const o=document.createElement('option'); o.value=m.id; o.textContent=m.name; fAssignee.appendChild(o); });
Object.entries(LABELS).forEach(([k,L])=>{
  const b=document.createElement('button');
  b.type='button'; b.className='toggle'; b.dataset.label=k; b.textContent=L.name; b.setAttribute('aria-pressed','false');
  b.onclick=()=>{
    const on = b.getAttribute('aria-pressed')==='true';
    b.setAttribute('aria-pressed', String(!on));
    paintToggle(b);
  };
  fLabels.appendChild(b);
});
function paintToggle(b){
  const L = LABELS[b.dataset.label];
  if(b.getAttribute('aria-pressed')==='true'){
    b.style.background = isDark()? L.dark : L.fg;
    b.style.color = '#fff';
  }else{ b.style.background=''; b.style.color=''; }
}
function refreshColOptions(){
  fCol.innerHTML='';
  state.columns.forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=c.title; fCol.appendChild(o); });
}

function openModal(id){
  refreshColOptions();
  editingId = id;
  const t = id ? state.tasks.find(x=>x.id===id) : null;
  document.getElementById('modalTitle').textContent = t ? 'Edit task' : 'New task';
  document.getElementById('deleteBtn').style.display = t ? '' : 'none';
  fTitle.value = t?.title || '';
  fDesc.value = t?.desc || '';
  fAssignee.value = t?.assignee || MEMBERS[0].id;
  fCol.value = t?.col || state.columns[0].id;
  fDue.value = t?.due || '';
  fPrio.value = t?.prio || 'medium';
  [...fLabels.children].forEach(b=>{
    b.setAttribute('aria-pressed', String(!!t && t.labels.includes(b.dataset.label)));
    paintToggle(b);
  });
  overlay.classList.add('open');
  setTimeout(()=>fTitle.focus(),30);
}
function closeModal(){ overlay.classList.remove('open'); editingId=null; }

document.getElementById('saveBtn').onclick = ()=>{
  const title = fTitle.value.trim();
  if(!title){ fTitle.focus(); return; }
  const labels = [...fLabels.children].filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>b.dataset.label);
  if(editingId){
    const t = state.tasks.find(x=>x.id===editingId);
    Object.assign(t,{title, desc:fDesc.value.trim(), assignee:fAssignee.value, col:fCol.value, due:fDue.value, prio:fPrio.value, labels});
  }else{
    state.tasks.push({id:uid(), col:fCol.value, title, desc:fDesc.value.trim(), labels,
      assignee:fAssignee.value, due:fDue.value, prio:fPrio.value, comments:0, links:0});
  }
  closeModal(); render();
};
document.getElementById('deleteBtn').onclick = ()=>{
  if(editingId && confirm('Delete this task?')){
    state.tasks = state.tasks.filter(t=>t.id!==editingId);
    closeModal(); render();
  }
};
document.getElementById('cancelBtn').onclick = closeModal;
document.getElementById('closeBtn').onclick = closeModal;
overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && overlay.classList.contains('open')) closeModal();
  if(e.key==='n' && !overlay.classList.contains('open') && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
    openModal(null);
  }
});
document.getElementById('newBtn').onclick = ()=>openModal(null);

/* ---------------- Misc controls ---------------- */
searchEl.addEventListener('input', ()=>{ query = searchEl.value.trim(); render(); });
document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('Restore the sample board? Your changes will be lost.')){
    state = {columns: structuredClone(DEFAULT_COLUMNS), tasks: structuredClone(DEFAULT_TASKS)};
    render();
  }
};
const themeBtn = document.getElementById('themeBtn');
const savedTheme = localStorage.getItem(KEY+'-theme');
if(savedTheme) document.documentElement.dataset.theme = savedTheme;
themeBtn.onclick = ()=>{
  document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
  localStorage.setItem(KEY+'-theme', document.documentElement.dataset.theme);
  [...fLabels.children].forEach(paintToggle);
  render();
};

render();
</script>
</body>
