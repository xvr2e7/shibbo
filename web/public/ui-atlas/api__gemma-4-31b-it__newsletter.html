<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Grid | Weekly Urban Planning Insights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2d5a27;
            --primary-light: #eef5ee;
            --accent: #facc15;
            --text-dark: #1a1a1a;
            --text-muted: #4b5563;
            --bg: #fcfcfc;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Decorative background elements */
        .grid-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, #e5e7eb 1px, transparent 1px),
                linear-gradient(to bottom, #e5e7eb 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            opacity: 0.5;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--white);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid #e5e7eb;
            text-align: center;
        }

        .logo-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
            font-size: 0.875rem;
            padding: 4px 12px;
            border-radius: 100px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            line-height: 1.1;
            margin-bottom: 1rem;
            color: var(--text-dark);
        }

        h1 span {
            color: var(--primary);
        }

        p {
            color: var(--text-muted);
            font-size: 1.125rem;
            margin-bottom: 2.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="email"] {
            width: 100%;
            padding: 16px 20px;
            font-size: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="email"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        button {
            width: 100%;
            padding: 16px 20px;
            font-size: 1rem;
            font-weight: 600;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s active, background-color 0.2s ease;
        }

        button:hover {
            background-color: #234a1e;
        }

        button:active {
            transform: scale(0.98);
        }

        .footer-info {
            margin-top: 2rem;
            font-size: 0.875rem;
            color: #9ca3af;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .footer-info span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="grid-pattern"></div>

    <main class="container">
        <div class="logo-badge">Now Publishing</div>
        <h1>The <span>Grid</span></h1>
        <p>Join 12,000+ architects, planners, and citizens exploring the future of walkable, sustainable cities.</p>

        <form id="signup-form" class="form-group">
            <input type="email" placeholder="hello@citydweller.com" required>
            <button type="submit">Subscribe to the Newsletter</button>
        </form>

        <div class="footer-info">
            <span>✓ Weekly</span>
            <span>✓ Free</span>
            <span>✓ No Spam</span>
        </div>
    </main>

    <script>
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            const input = this.querySelector('input');
            
            btn.textContent = 'Adding you to the map...';
            btn.style.opacity = '0.7';
            btn.disabled = true;

            // Simulate API call
            setTimeout(() => {
                this.innerHTML = `
                    <div style="padding: 20px 0; animation: fadeIn 0.5s ease forwards;">
                        <h2 style="font-family: 'Outfit', sans-serif; color: var(--primary); margin-bottom: 10px;">You're on the list!</h2>
                        <p style="font-size: 1rem;">Check your inbox. We'll see you next Tuesday.</p>
                    </div>
                `;
            }, 1200);
        });
    </script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
