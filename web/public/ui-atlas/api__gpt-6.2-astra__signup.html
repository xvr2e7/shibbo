<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luma — Start learning</title>
<style>
:root{--ink:#271e36;--yellow:#ffdb69;--line:#e2dce6;--muted:#756c7f}*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:var(--ink);font-family:Arial,Helvetica,sans-serif}header,main,footer{width:min(1240px,91%);margin:auto}header{height:88px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;font-size:31px;font-weight:850;letter-spacing:-2px}.brand svg{width:37px;height:37px}.header-note,.eyebrow,.tag,.card-label,.poster-foot,footer{font:700 10px/1.4 "Courier New",monospace;letter-spacing:1.6px;text-transform:uppercase}.header-note{display:flex;align-items:center;gap:9px}.dot{width:8px;height:8px;background:#b8de9d;border:1px solid var(--ink);border-radius:50%}main{display:grid;grid-template-columns:1.06fr 1fr;border:1.5px solid var(--ink);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 4px 0 #271e3610}.poster{position:relative;isolation:isolate;overflow:hidden;background:#ac97d5;min-height:655px;padding:39px 38px}.poster:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23000' filter='url(%23n)' opacity='.6' d='M0 0h160v160H0z'/%3E%3C/svg%3E")}.tag{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;background:#e2d9ef;border:1px solid var(--ink);border-radius:20px;letter-spacing:1.1px}.tag b{font-size:14px;line-height:1}h1{font-size:clamp(54px,5.2vw,78px);line-height:.97;letter-spacing:-4.8px;margin:24px 0 0;font-weight:800}.art{position:absolute;width:100%;height:57%;left:0;bottom:29px}.poster-foot{position:absolute;bottom:19px;left:38px;right:38px;display:flex;justify-content:space-between;border-top:1px solid #49365880;padding-top:12px;font-size:9px}.form-panel{padding:40px clamp(28px,4vw,65px);display:flex;flex-direction:column;justify-content:center;border-left:1.5px solid var(--ink)}.eyebrow{color:#74618c;display:flex;align-items:center;gap:9px}.eyebrow:before{content:"";width:22px;height:2px;background:#9072b3}h2{font-size:clamp(32px,3.1vw,47px);letter-spacing:-2.2px;line-height:1.05;margin:14px 0 9px}.sub{font-size:14px;color:var(--muted);margin:0 0 28px;line-height:1.5}label{display:block;font-size:13px;font-weight:700;margin:0 0 8px}.field{margin-bottom:17px}.inputbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:#fdfcfe;padding:0 13px;gap:10px;height:47px}.inputbox:focus-within{outline:2px solid #a88ec9;outline-offset:1px}.inputbox svg{width:17px;height:17px;fill:none;stroke:#81778c;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}input,select{font:14px Arial,sans-serif;color:var(--ink);width:100%;min-width:0;border:0;outline:0;background:transparent;height:100%}input::placeholder{color:#938b99}.eye{background:none;border:0;padding:5px;display:flex;cursor:pointer}select{appearance:none;cursor:pointer}.cta{width:100%;background:var(--yellow);color:var(--ink);border:1.5px solid var(--ink);border-radius:8px;box-shadow:0 3px 0 var(--ink);font-size:15px;font-weight:750;padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:23px}.cta:hover{background:#ffe289}.cta:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}.switch{text-align:center;font-size:13px;color:var(--muted);margin:23px 0 0}.link{font:inherit;font-weight:bold;color:var(--ink);border:0;border-bottom:1px solid;padding:0;background:none;cursor:pointer}footer{display:flex;align-items:center;justify-content:space-between;padding:20px 2px;color:#847b89;font-size:9px;letter-spacing:1.1px}.message{font-size:14px;color:#534368;line-height:1.5}.message:empty{display:none}[hidden]{display:none!important}@media(min-width:1500px){header{height:110px}.poster{min-height:715px}}@media(max-width:900px){.poster{padding:30px 24px}h1{font-size:54px;letter-spacing:-3px}.poster-foot{left:24px;right:24px}}@media(max-width:700px){header{height:67px}.header-note{font-size:8px}main{display:block}.poster{min-height:185px;padding:22px}.tag{font-size:8px}h1{font-size:38px;margin-top:14px;letter-spacing:-2.4px}.art{width:45%;height:90%;bottom:0;left:auto;right:-3%}.poster-foot{display:none}.form-panel{border:0;border-top:1.5px solid var(--ink);padding:29px 24px}.sub{margin-bottom:22px}footer{font-size:8px}}
</style>
</head>
<body>
<header><div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 7Q4 3 9 3H31Q36 3 36 8V26Q36 31 31 31H18L8 38V31Q4 31 4 26Z" fill="#ffdb69" stroke="#271e36" stroke-width="2"/><path d="M12 15v4m8-8v12m8-9v5" stroke="#271e36" stroke-width="3.5" stroke-linecap="round"/></svg>luma</div><div class="header-note"><span class="dot"></span>Language learning club</div></header>
<main>
<section class="poster" aria-label="Luma field notes"><div class="tag"><b>✳</b> The language series</div><h1>Little words.<br>Big world.</h1>
<svg class="art" viewBox="0 0 550 380" role="img" aria-label="Illustrated language flashcards saying Bonjour and Hola, with a smiling globe and a yellow sun">
<g fill="none" stroke="#66547f" stroke-width="1.6" stroke-dasharray="5 6"><path d="M-30 287C65 244 36 367 137 332S289 228 364 281s124 43 213-37"/><path d="M42 108C10 41 152 28 215 48"/></g>
<g stroke="#30243b" stroke-width="2.4" stroke-linejoin="round">
<g transform="rotate(-12 206 174)"><rect x="69" y="67" width="248" height="217" rx="12" fill="#30243b"/><rect x="64" y="61" width="248" height="217" rx="12" fill="#fff4d5"/><path d="M79 97h218" stroke-width="1"/><g fill="#30243b" stroke="none" font-family="Courier New, monospace" font-weight="bold" font-size="10" letter-spacing="1"><text x="81" y="84">FR / 001</text><text x="243" y="84">FRENCH</text></g><g transform="translate(186 162)"><circle r="48" fill="#afcbea"/><path d="M-46-13q14 3 19-12l14 2 7-18 15-6q24 5 34 28l-18 2-10 17-17-5-8 12-17-4-12 14q-10-12-7-30zM8 14l16-6 16 8-13 17-2 10-19 3-5-17z" fill="#a1c98f" stroke-width="1.6"/><path d="M-15-5v7m24-7v7m-22 8q11 13 22-1" fill="none" stroke-width="3.4" stroke-linecap="round"/></g><text x="187" y="256" text-anchor="middle" font-size="43" font-weight="bold" font-family="Georgia,serif" fill="#30243b" stroke="none">Bonjour!</text></g>
<g transform="rotate(12 365 239)"><rect x="260" y="131" width="205" height="205" rx="12" fill="#30243b"/><rect x="255" y="125" width="205" height="205" rx="12" fill="#f39c7e"/><path d="M269 159h177" stroke-width="1"/><g fill="#30243b" stroke="none" font-family="Courier New, monospace" font-size="10" font-weight="bold" letter-spacing="1"><text x="270" y="147">ES / 002</text><text x="391" y="147">SPANISH</text></g><g transform="translate(355 216)"><path d="M0-43l8 14 14-9 1 17 17-1-7 15 14 8-16 7 6 16-17-2-2 17-13-10-10 14-6-16-16 6 2-17-17-2 10-13-13-11 17-5-4-17 16 4z" fill="#ffda60"/><path d="M-12-3q4-7 8 0m9 0q4-7 8 0m-20 10q8 8 15-1" fill="none" stroke-linecap="round"/></g><text x="357" y="305" text-anchor="middle" font-size="49" font-family="Georgia,serif" font-weight="bold" fill="#30243b" stroke="none">¡Hola!</text></g>
<path d="M420 44l4 18 17 5-17 5-4 18-5-18-17-5 17-5z" fill="#ffdb69"/><path d="M66 298l3 11 11 3-11 4-3 11-4-11-11-4 11-3z" fill="#fff4d5"/>
</g></svg>
<div class="poster-foot"><span>Fig. 01 — First words</span><span>✳ &nbsp; Luma field notes</span></div></section>
<section class="form-panel"><div class="eyebrow" id="kicker">Your first chapter</div><h2 id="title">Create an account</h2><p class="sub" id="subtitle">A new language starts with a little hello.</p>
<form id="signup">
<div class="field" id="namefield"><label for="name">Your name</label><div class="inputbox"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4 21v-2a8 6 0 0 1 16 0v2"/></svg><input id="name" autocomplete="given-name" placeholder="Enter your name" required></div></div>
<div class="field"><label for="email">Email address</label><div class="inputbox"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div></div>
<div class="field"><label for="password">Password</label><div class="inputbox"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required><button class="eye" type="button" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<div class="field" id="langfield"><label for="language">I want to learn</label><div class="inputbox"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><select id="language" required><option value="" disabled selected>Choose a language</option><option>Spanish</option><option>French</option><option>Italian</option><option>German</option><option>Japanese</option><option>Korean</option><option>Portuguese</option></select><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></div></div>
<button class="cta"><span id="action">Create my account</span><span aria-hidden="true">→</span></button></form>
<p class="message" role="status" id="message"></p><p class="switch"><span id="prompt">Already a member?</span> <button class="link" id="toggle">Log in</button></p></section></main>
<footer><span>© 2026 Luma</span><span>Made for curious minds ✳</span></footer>
<script>
const $=id=>document.getElementById(id);let login=false;
document.querySelector('.eye').onclick=function(){const p=$('password');p.type=p.type==='password'?'text':'password';this.setAttribute('aria-label',p.type==='password'?'Show password':'Hide password')};
$('toggle').onclick=()=>{login=!login;$('namefield').hidden=$('langfield').hidden=login;$('name').disabled=$('language').disabled=login;$('title').textContent=login?'Welcome back':'Create an account';$('subtitle').textContent=login?'Pick up where you left off.':'A new language starts with a little hello.';$('action').textContent=login?'Log in':'Create my account';$('toggle').textContent=login?'Sign up':'Log in';$('prompt').textContent=login?'New to Luma?':'Already a member?';$('password').autocomplete=login?'current-password':'new-password';$('message').textContent=''};
$('signup').onsubmit=e=>{e.preventDefault();$('message').textContent=login?'This is a preview. Live login is not connected.':'Thanks, '+$('name').value.trim()+'! You chose '+$('language').value+'. This preview does not create a live account.'};
</script></body></html>
