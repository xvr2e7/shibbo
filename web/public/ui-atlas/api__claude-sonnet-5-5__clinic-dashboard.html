<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Street Family Clinic · Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f2ee; --card:#fff; --ink:#1c2927; --ink2:#55645f; --ink3:#8a9792;
    --line:#e6e4dd; --line2:#efede7;
    --teal:#0f766e; --teal-bg:#e3f2ef;
    --blue:#2563eb; --blue-bg:#e6eefc;
    --amber:#b45309; --amber-bg:#fdf1dc;
    --red:#c2410c; --red-bg:#fde8df;
    --green:#4d7c0f; --green-bg:#eaf3da;
    --gray-bg:#efeeea;
    --radius:14px;
    --serif:'Fraunces',Georgia,serif;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .wrap{max-width:1360px;margin:0 auto;padding:22px 24px 48px}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:11px;background:var(--teal);display:grid;place-items:center}
  .logo svg{width:22px;height:22px}
  .brand h1{font-family:var(--serif);font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em}
  .brand p{margin:0;color:var(--ink2);font-size:13px}
  .head-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .clock{text-align:right;line-height:1.2}
  .clock b{font-family:var(--serif);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .clock b small{font-size:13px;color:var(--ink2);font-family:var(--sans);font-weight:500;margin-left:2px}
  .clock span{display:block;color:var(--ink2);font-size:12.5px}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s}
  .btn:hover{background:#faf9f6;border-color:#d8d5cb}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn.primary:hover{background:#0c6862}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px 14px}
  .stat .lbl{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12.5px;font-weight:500}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  .stat .val{font-family:var(--serif);font-size:34px;font-weight:500;line-height:1.1;margin:6px 0 2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat .val small{font-size:17px;color:var(--ink3);font-weight:500}
  .stat .sub{color:var(--ink2);font-size:12.5px}
  .stat .sub em{font-style:normal;font-weight:600}

  /* layout */
  .grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
  .col{display:flex;flex-direction:column;gap:18px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;flex-wrap:wrap}
  .card-h h2{font-family:var(--serif);font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
  .card-h .meta{color:var(--ink2);font-size:12.5px}

  /* toolbar */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:0 18px 14px;align-items:center}
  .seg{display:flex;background:var(--gray-bg);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;padding:5px 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
  .seg button .n{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .seg button[aria-pressed=true] .n{color:var(--teal)}
  .toolbar .sp{flex:1}
  .field{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:13px;min-width:0}
  input.field{width:150px}

  /* schedule */
  .sched{border-top:1px solid var(--line2)}
  .row{display:grid;grid-template-columns:78px minmax(0,1.5fr) minmax(0,1fr) 84px 96px 112px;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line2);position:relative}
  .row:last-child{border-bottom:0}
  .row:hover{background:#fcfbf9}
  .row .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
  .row .t small{display:block;color:var(--ink3);font-weight:400;font-size:11.5px}
  .row .who b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .who span{color:var(--ink2);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prov{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px;min-width:0}
  .prov i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:600;color:#fff;flex:none}
  .prov span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .room{color:var(--ink2);font-size:13px}
  .act{display:flex;gap:6px;justify-content:flex-end}
  .mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
  .mini:hover{border-color:#cfcbbf;background:#faf9f6}
  .mini.go{background:var(--teal-bg);border-color:#c3e2dc;color:var(--teal)}
  .mini.go:hover{background:#d3ebe6}
  .mini.ghost{padding:4px 8px;color:var(--red)}
  .row.dim .who b,.row.dim .t{color:var(--ink2);font-weight:500}
  .row.dim .who b.strike{text-decoration:line-through;text-decoration-color:var(--ink3)}
  .row.hl{background:#f8fbfa}
  .row.hl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
  .row.wait::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#d97706}

  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:500;white-space:nowrap;justify-self:start}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .p-done{background:var(--green-bg);color:var(--green)}
  .p-room{background:var(--blue-bg);color:var(--blue)}
  .p-wait{background:var(--amber-bg);color:var(--amber)}
  .p-sched{background:var(--gray-bg);color:var(--ink2)}
  .p-late{background:var(--amber-bg);color:var(--amber)}
  .p-no{background:var(--red-bg);color:var(--red)}
  .p-canc{background:var(--gray-bg);color:var(--ink3)}
  .p-room::before{animation:pulse 1.8s infinite}
  @keyframes pulse{50%{opacity:.3}}

  .now{display:flex;align-items:center;gap:8px;padding:0 18px;height:20px;background:#fff;position:relative;z-index:1}
  .now::after{content:"";flex:1;height:1px;background:var(--red)}
  .now span{background:var(--red);color:#fff;border-radius:6px;font-size:11px;font-weight:600;padding:1px 8px;font-variant-numeric:tabular-nums;order:-1}
  .empty{padding:36px 18px;text-align:center;color:var(--ink2)}

  /* rooms */
  .rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 18px 16px}
  .rm{border:1px solid var(--line);border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:6px;min-height:128px;background:#fff}
  .rm-top{display:flex;justify-content:space-between;align-items:center}
  .rm-top b{font-weight:600}
  .tag{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;letter-spacing:.01em}
  .rm.occ{background:linear-gradient(#f4f8ff,#fff);border-color:#cfdcf7}
  .rm.occ .tag{background:var(--blue-bg);color:var(--blue)}
  .rm.cln{background:linear-gradient(#fffaf0,#fff);border-color:#f0dcb4}
  .rm.cln .tag{background:var(--amber-bg);color:var(--amber)}
  .rm.free .tag{background:var(--green-bg);color:var(--green)}
  .rm .pt{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rm .sm{color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:5px;background:var(--gray-bg);border-radius:9px;overflow:hidden;margin-top:auto}
  .bar i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .5s}
  .bar.over i{background:#d97706}
  .rm .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .rm .next{margin-top:auto;font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rm .next b{font-weight:600;color:var(--ink)}
  .rm .idle{color:var(--ink3);font-size:13px}

  .waiting{border-top:1px solid var(--line2);padding:12px 18px 14px}
  .waiting h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
  .wl{display:flex;justify-content:space-between;align-items:center;padding:5px 0;gap:10px}
  .wl span{color:var(--ink2);font-size:12.5px}
  .wl em{font-style:normal;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--gray-bg);font-variant-numeric:tabular-nums;white-space:nowrap}
  .wl em.long{background:var(--amber-bg);color:var(--amber)}

  /* no-shows */
  .ns-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 18px;border-top:1px solid var(--line2);align-items:center}
  .ns-item b{font-weight:600;display:block}
  .ns-item span.d{color:var(--ink2);font-size:12.5px}
  .ns-item .state{font-size:12px;font-weight:600;color:var(--green);margin-top:2px;display:block}
  .ns-empty{padding:18px;color:var(--ink2);border-top:1px solid var(--line2)}
  .trend{border-top:1px solid var(--line2);padding:14px 18px 16px;background:#fbfaf8}
  .trend-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .trend-h b{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .trend-h span{font-size:12px;color:var(--ink2)}
  .bars{display:flex;align-items:flex-end;gap:8px;height:84px}
  .bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
  .bc i{display:block;width:100%;max-width:34px;background:#d8e4e1;border-radius:6px 6px 3px 3px;min-height:3px}
  .bc.today i{background:var(--red)}
  .bc small{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .bc small.dl{color:var(--ink3)}
  .bc.today small{color:var(--red);font-weight:600}

  /* toast */
  #toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:1100px){
    .grid{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:760px){
    .wrap{padding:16px 14px 40px}
    .row{grid-template-columns:64px 1fr auto;grid-template-areas:"t who pill" "t prov act";row-gap:6px}
    .row .t{grid-area:t;align-self:start}
    .row .who{grid-area:who}
    .row .pill{grid-area:pill}
    .row .prov{grid-area:prov}
    .row .room{display:none}
    .row .act{grid-area:act}
    .rooms{grid-template-columns:1fr 1fr}
    input.field{width:100%}
    .toolbar .sp{display:none}
  }
  @media (max-width:480px){
    .stat .val{font-size:28px}
    .rooms{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div>
        <h1>Harbor Street Family Clinic</h1>
        <p>Front desk · today's overview</p>
      </div>
    </div>
    <div class="head-right">
      <div class="clock" aria-live="off">
        <b id="clock">–</b>
        <span id="date">–</span>
      </div>
      <button class="btn primary" id="walkin">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Walk-in
      </button>
    </div>
  </header>

  <section class="stats" id="stats" aria-label="Summary"></section>

  <div class="grid">
    <main class="col">
      <section class="card" aria-labelledby="sch-h">
        <div class="card-h">
          <h2 id="sch-h">Today's schedule</h2>
          <span class="meta" id="sch-meta"></span>
        </div>
        <div class="toolbar">
          <div class="seg" id="filters" role="group" aria-label="Filter by status"></div>
          <span class="sp"></span>
          <select class="field" id="provSel" aria-label="Filter by provider"></select>
          <input class="field" id="q" type="search" placeholder="Search patient…" aria-label="Search patient">
        </div>
        <div class="sched" id="sched"></div>
      </section>
    </main>

    <aside class="col">
      <section class="card" aria-labelledby="rm-h">
        <div class="card-h">
          <h2 id="rm-h">Rooms</h2>
          <span class="meta" id="rm-meta"></span>
        </div>
        <div class="rooms" id="rooms"></div>
        <div class="waiting" id="waiting"></div>
      </section>

      <section class="card" aria-labelledby="ns-h">
        <div class="card-h">
          <h2 id="ns-h">No-shows</h2>
          <span class="meta" id="ns-meta"></span>
        </div>
        <div id="noshows"></div>
        <div class="trend" id="trend"></div>
      </section>
    </aside>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  /* ---------- data ---------- */
  const PROVIDERS = {
    okafor:{name:'Dr. Okafor',   ini:'AO', color:'#0f766e'},
    brandt:{name:'Dr. Brandt',   ini:'LB', color:'#2563eb'},
    mehta: {name:'Dr. Mehta',    ini:'SM', color:'#9333ea'},
    reyes: {name:'N. Reyes, NP', ini:'NR', color:'#c2410c'},
    kim:   {name:'H. Kim, RN',   ini:'HK', color:'#ca8a04'}
  };
  const ROOMS = ['Exam 1','Exam 2','Exam 3','Exam 4','Procedure','Consult'];
  const T = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };

  let nextId = 1;
  const A = (time,dur,name,age,type,prov,room,status,x={}) => ({
    id:nextId++, start:T(time), dur, name, age, type, prov, room, status,
    checkedIn:null, startedAt:null, endedAt:null, contact:null, phone:null, ...x
  });
  const appts = [
    A('8:00',30,'Margaret Hill',67,'Annual physical','okafor','Exam 1','completed',{endedAt:T('8:34')}),
    A('8:15',20,'Dev Patel',34,'Follow-up','brandt','Exam 2','completed',{endedAt:T('8:38')}),
    A('8:30',15,'Sofia Marino',5,'Vaccination','kim','Exam 4','completed',{endedAt:T('8:47')}),
    A('8:30',30,'Jonas Weber',9,'Well-child check','mehta','Exam 3','completed',{endedAt:T('9:02')}),
    A('8:45',20,'Tom Whitaker',52,'Blood pressure check','reyes','Exam 3','noshow',{phone:'(555) 010-0142'}),
    A('9:00',30,'Lena Fischer',41,'Migraine consult','okafor','Exam 1','completed',{endedAt:T('9:36')}),
    A('9:15',30,'Marcus Reed',29,'Sprained ankle','brandt','Exam 2','completed',{endedAt:T('9:49')}),
    A('9:30',45,'Priya Raman',38,'Prenatal visit','reyes','Consult','completed',{endedAt:T('10:14')}),
    A('9:30',20,'Greg Palmer',46,'Rash follow-up','brandt','Exam 2','noshow',{phone:'(555) 010-0187'}),
    A('9:45',30,'Isla Grant',22,'Contraception consult','mehta',null,'cancelled'),
    A('10:00',30,'Colin Doyle',71,'Diabetes review','okafor','Exam 1','completed',{endedAt:T('10:37')}),
    A('10:00',30,'Aisha Bello',8,'Ear infection','mehta','Exam 3','completed',{endedAt:T('10:28')}),
    A('10:15',30,'James Ortega',45,'Lower back pain','brandt','Exam 2','inprogress',{startedAt:T('10:17')}),
    A('10:15',45,'Nora Lindqvist',59,'Mole removal','reyes','Procedure','inprogress',{startedAt:T('10:20')}),
    A('10:30',30,'Ben Carter',12,'Sports physical','mehta','Exam 3','inprogress',{startedAt:T('10:31')}),
    A('10:30',15,'Rosa Alvarez',48,'Lab draw','kim','Exam 4','inprogress',{startedAt:T('10:33')}),
    A('10:45',20,'Walt Greeley',76,'Blood pressure review','okafor','Exam 1','checkedin',{checkedIn:T('10:39')}),
    A('10:45',15,'Eleni Papas',33,'Flu shot','kim','Exam 4','checkedin',{checkedIn:T('10:38')}),
    A('11:00',30,'Omar Haddad',36,'Skin rash','brandt','Exam 2','scheduled'),
    A('11:00',30,'Felix Wagner',44,'Chest cold','mehta','Exam 3','scheduled'),
    A('11:15',30,'Grace Liu',62,'Medication review','okafor','Exam 1','scheduled'),
    A('11:15',15,'Samuel Ortiz',61,'Lab draw','kim','Exam 4','scheduled'),
    A('11:30',30,'Ian Mackenzie',27,'Telehealth follow-up','reyes','Telehealth','scheduled'),
    A('11:30',30,'Hannah Cole',55,'New patient consult','brandt','Consult','scheduled'),
    A('13:00',30,'Dorothy Banks',80,'Medication review','okafor','Exam 1','scheduled'),
    A('13:15',30,'Yuki Tanaka',31,'Pap smear','reyes','Consult','scheduled'),
    A('13:45',15,'Marta Ruiz',57,'Flu shot','kim','Exam 4','scheduled'),
    A('14:00',30,'Carlos Mendez',39,'Knee pain','brandt','Exam 2','scheduled'),
    A('14:15',30,'Mia Johansson',3,'Well-child check','mehta','Exam 3','scheduled'),
    A('14:30',30,'Peter Novak',58,'Cholesterol review','okafor','Exam 1','scheduled'),
    A('15:00',30,'Zara Ahmed',26,'Contraception consult','reyes','Consult','scheduled'),
    A('15:15',15,'Leon Bishop',64,'B12 injection','kim','Exam 4','scheduled'),
    A('15:30',30,'Leo Bennett',49,'Post-op check','brandt','Exam 2','scheduled'),
    A('16:00',40,'Ruth Adler',69,'Annual physical','okafor','Exam 1','scheduled')
  ];

  const pastRates = [5,8,4,6,9,5]; // previous clinic days, % no-show
  const CLEAN_MIN = 10;

  /* ---------- time (demo clock starts at 10:42 AM) ---------- */
  const t0 = Date.now(), base = T('10:42')*60;
  const nowSec = () => base + (Date.now()-t0)/1000;
  const nowMin = () => nowSec()/60;
  const f12 = m => { m=Math.floor(m); const h=Math.floor(m/60)%24, mm=m%60; return ((h+11)%12+1)+':'+String(mm).padStart(2,'0'); };
  const ap = m => (Math.floor(m/60)%24)>=12 ? 'PM':'AM';
  const fFull = m => f12(m)+' '+ap(m);

  /* ---------- helpers ---------- */
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let filter='all', provFilter='all', query='';

  const isLate = a => a.status==='scheduled' && nowMin() > a.start+10;
  const roomOccupant = r => appts.find(a=>a.room===r && a.status==='inprogress');
  function roomState(r){
    if (roomOccupant(r)) return 'occupied';
    const ended = Math.max(0,...appts.filter(a=>a.room===r&&a.status==='completed'&&a.endedAt).map(a=>a.endedAt));
    if (ended && nowMin()-ended < CLEAN_MIN) return 'cleaning';
    return 'free';
  }
  const cleanLeft = r => {
    const ended = Math.max(0,...appts.filter(a=>a.room===r&&a.status==='completed'&&a.endedAt).map(a=>a.endedAt));
    return Math.max(1,Math.ceil(ended+CLEAN_MIN-nowMin()));
  };
  const nextFor = r => appts.filter(a=>a.room===r&&(a.status==='checkedin'||a.status==='scheduled')).sort((a,b)=>a.start-b.start||(a.status==='checkedin'?-1:1))[0];

  let toastT;
  function toast(msg){
    const el=$('toast'); el.textContent=msg; el.classList.add('show');
    clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600);
  }

  /* ---------- renderers ---------- */
  function renderStats(){
    const n = nowMin();
    const live = appts.filter(a=>a.status!=='cancelled');
    const done = appts.filter(a=>a.status==='completed').length;
    const inRoom = appts.filter(a=>a.status==='inprogress').length;
    const waiting = appts.filter(a=>a.status==='checkedin');
    const ns = appts.filter(a=>a.status==='noshow').length;
    const due = live.filter(a=>a.start<=n).length || 1;
    const rate = ns/due*100;
    const longest = waiting.length ? Math.max(...waiting.map(a=>Math.floor(n-a.checkedIn))) : 0;
    const used = ROOMS.filter(r=>roomState(r)==='occupied').length;
    const cleaning = ROOMS.filter(r=>roomState(r)==='cleaning').length;
    const remaining = live.length-done-inRoom-waiting.length-ns;
    $('stats').innerHTML = `
      <div class="stat"><div class="lbl"><span class="dot" style="background:var(--teal)"></span>Appointments today</div>
        <div class="val">${live.length}</div>
        <div class="sub"><em>${done}</em> completed · <em>${remaining}</em> still to come</div></div>
      <div class="stat"><div class="lbl"><span class="dot" style="background:#d97706"></span>In waiting room</div>
        <div class="val">${waiting.length}</div>
        <div class="sub">${waiting.length?`Longest wait <em>${longest} min</em>`:'No one waiting'}</div></div>
      <div class="stat"><div class="lbl"><span class="dot" style="background:var(--red)"></span>No-shows</div>
        <div class="val">${ns} <small>${rate.toFixed(0)}%</small></div>
        <div class="sub">of ${due} due so far · clinic avg <em>6%</em></div></div>
      <div class="stat"><div class="lbl"><span class="dot" style="background:var(--blue)"></span>Rooms in use</div>
        <div class="val">${used}<small> / ${ROOMS.length}</small></div>
        <div class="sub">${cleaning?`<em>${cleaning}</em> turning over · `:''}<em>${ROOMS.length-used-cleaning}</em> ready</div></div>`;
  }

  function renderFilters(){
    const counts = {
      all: appts.length,
      upcoming: appts.filter(a=>a.status==='scheduled').length,
      clinic: appts.filter(a=>a.status==='checkedin'||a.status==='inprogress').length,
      done: appts.filter(a=>a.status==='completed').length,
      noshow: appts.filter(a=>a.status==='noshow').length
    };
    const labels = {all:'All',upcoming:'Upcoming',clinic:'In clinic',done:'Done',noshow:'No-show'};
    $('filters').innerHTML = Object.keys(labels).map(k=>
      `<button data-f="${k}" aria-pressed="${filter===k}">${labels[k]} <span class="n">${counts[k]}</span></button>`).join('');
  }

  const matchFilter = a => ({
    all:true,
    upcoming:a.status==='scheduled',
    clinic:a.status==='checkedin'||a.status==='inprogress',
    done:a.status==='completed',
    noshow:a.status==='noshow'
  })[filter];

  function pill(a){
    if (a.status==='completed') return '<span class="pill p-done">Completed</span>';
    if (a.status==='inprogress') return '<span class="pill p-room">In room</span>';
    if (a.status==='checkedin') return '<span class="pill p-wait">Waiting</span>';
    if (a.status==='noshow') return '<span class="pill p-no">No-show</span>';
    if (a.status==='cancelled') return '<span class="pill p-canc">Cancelled</span>';
    return isLate(a) ? '<span class="pill p-late">Running late</span>' : '<span class="pill p-sched">Scheduled</span>';
  }
  function actions(a){
    if (a.status==='scheduled') return `<button class="mini go" data-a="checkin" data-id="${a.id}">Check in</button>`+
      (isLate(a)?`<button class="mini ghost" data-a="noshow" data-id="${a.id}" title="Mark as no-show">No-show</button>`:'');
    if (a.status==='checkedin') return `<button class="mini go" data-a="start" data-id="${a.id}">Start visit</button>`;
    if (a.status==='inprogress') return `<button class="mini go" data-a="complete" data-id="${a.id}">Complete</button>`;
    if (a.status==='noshow') return `<button class="mini" data-a="restore" data-id="${a.id}">Undo</button>`;
    return '';
  }

  function renderSchedule(){
    const n = nowMin();
    const list = appts.filter(a=>matchFilter(a) &&
      (provFilter==='all'||a.prov===provFilter) &&
      (!query || a.name.toLowerCase().includes(query)))
      .sort((a,b)=>a.start-b.start||a.id-b.id);

    $('sch-meta').textContent = `${list.length} shown`;
    if (!list.length){ $('sched').innerHTML='<div class="empty">No appointments match these filters.</div>'; return; }

    let html='', placed=false;
    const nowRow = `<div class="now" aria-label="Current time"><span>Now · ${fFull(n)}</span></div>`;
    list.forEach(a=>{
      if(!placed && a.start>n){ html+=nowRow; placed=true; }
      const p = PROVIDERS[a.prov];
      const dim = a.status==='completed'||a.status==='noshow'||a.status==='cancelled';
      const cls = ['row', dim?'dim':'', a.status==='inprogress'?'hl':'', a.status==='checkedin'?'wait':''].join(' ');
      html += `<div class="${cls}">
        <div class="t">${f12(a.start)}<small>${ap(a.start)} · ${a.dur} min</small></div>
        <div class="who"><b class="${a.status==='cancelled'?'strike':''}">${esc(a.name)}</b><span>${a.age} yrs · ${esc(a.type)}</span></div>
        <div class="prov"><i style="background:${p.color}">${p.ini}</i><span>${p.name}</span></div>
        <div class="room">${a.room?esc(a.room):'—'}</div>
        ${pill(a)}
        <div class="act">${actions(a)}</div>
      </div>`;
    });
    if(!placed && filter!=='done' && filter!=='noshow') html+=nowRow;
    $('sched').innerHTML = html;
  }

  function renderRooms(){
    const n = nowMin();
    let used=0;
    $('rooms').innerHTML = ROOMS.map(r=>{
      const st = roomState(r), nx = nextFor(r);
      const nextLine = nx ? `<div class="next">Next: <b>${esc(nx.name.split(' ')[0])} ${esc(nx.name.split(' ').slice(-1)[0][0])}.</b> · ${f12(nx.start)} ${ap(nx.start)}${nx.status==='checkedin'?' · waiting':''}</div>` : `<div class="next">Nothing else booked</div>`;
      if (st==='occupied'){
        used++;
        const o = roomOccupant(r), el = Math.floor(n-o.startedAt), pct = Math.min(100,(n-o.startedAt)/o.dur*100), over = n-o.startedAt>o.dur;
        return `<div class="rm occ"><div class="rm-top"><b>${r}</b><span class="tag">In use</span></div>
          <div><div class="pt">${esc(o.name)}</div><div class="sm">${esc(o.type)} · ${PROVIDERS[o.prov].name}</div></div>
          <div class="bar ${over?'over':''}"><i style="width:${pct}%"></i></div>
          <div class="foot"><span>${el} min in</span><span>${over?`${Math.floor(n-o.startedAt-o.dur)} min over`:`~${Math.max(1,Math.ceil(o.dur-(n-o.startedAt)))} min left`}</span></div></div>`;
      }
      if (st==='cleaning') return `<div class="rm cln"><div class="rm-top"><b>${r}</b><span class="tag">Turnover</span></div>
          <div class="idle">Cleaning · ready in ~${cleanLeft(r)} min</div>${nextLine}</div>`;
      return `<div class="rm free"><div class="rm-top"><b>${r}</b><span class="tag">Ready</span></div>
          <div class="idle">Available now</div>${nextLine}</div>`;
    }).join('');
    $('rm-meta').textContent = `${used} of ${ROOMS.length} in use`;

    const w = appts.filter(a=>a.status==='checkedin').sort((a,b)=>a.checkedIn-b.checkedIn);
    $('waiting').innerHTML = `<h3>Waiting room · ${w.length}</h3>` + (w.length ? w.map(a=>{
      const m = Math.floor(n-a.checkedIn);
      return `<div class="wl"><div><b style="font-weight:500">${esc(a.name)}</b> <span>→ ${a.room||'Telehealth'} · ${PROVIDERS[a.prov].name}</span></div><em class="${m>=10?'long':''}">${m} min</em></div>`;
    }).join('') : '<div class="wl"><span>Nobody is waiting.</span></div>');
  }

  function renderNoShows(){
    const ns = appts.filter(a=>a.status==='noshow').sort((a,b)=>a.start-b.start);
    $('ns-meta').textContent = ns.length ? `${ns.length} today` : 'None today';
    $('noshows').innerHTML = ns.length ? ns.map(a=>`
      <div class="ns-item">
        <div><b>${esc(a.name)}</b>
          <span class="d">${fFull(a.start)} · ${esc(a.type)} · ${PROVIDERS[a.prov].name}</span>
          ${a.contact==='called'?'<span class="state" style="color:var(--amber)">Called · left voicemail</span>':''}
          ${a.contact==='rebooked'?'<span class="state">Rebooked · Thu 9:15 AM</span>':''}
        </div>
        <div class="act">
          ${a.contact==='rebooked'?'':`<button class="mini" data-a="call" data-id="${a.id}" title="${a.phone||''}">${a.contact==='called'?'Called ✓':'Call'}</button><button class="mini go" data-a="rebook" data-id="${a.id}">Rebook</button>`}
        </div>
      </div>`).join('') : '<div class="ns-empty">Everyone due so far has arrived.</div>';

    // trend
    const n = nowMin();
    const live = appts.filter(a=>a.status!=='cancelled'&&a.start<=n).length||1;
    const todayRate = Math.round(appts.filter(a=>a.status==='noshow').length/live*100);
    const labels=[]; const d=new Date();
    let c=0; const cur=new Date(d);
    while(labels.length<6){ cur.setDate(cur.getDate()-1); const w=cur.getDay(); if(w!==0&&w!==6) labels.unshift(cur.toLocaleDateString('en-US',{weekday:'short'})); if(++c>20)break; }
    const vals=[...pastRates,todayRate], lbls=[...labels,'Today'];
    const max=Math.max(...vals,12);
    $('trend').innerHTML = `<div class="trend-h"><b>No-show rate · last 7 days</b><span>30-day avg 6%</span></div>
      <div class="bars">${vals.map((v,i)=>`<div class="bc ${i===6?'today':''}"><small>${v}%</small><i style="height:${Math.max(4,v/max*58)}px"></i><small class="dl">${lbls[i]}</small></div>`).join('')}</div>`;
  }

  function renderAll(){ renderStats(); renderFilters(); renderSchedule(); renderRooms(); renderNoShows(); }

  /* ---------- actions ---------- */
  function act(kind,id){
    const a = appts.find(x=>x.id===id); if(!a) return;
    const n = nowMin();
    if (kind==='checkin'){ a.status='checkedin'; a.checkedIn=n; toast(`${a.name} checked in`); }
    else if (kind==='start'){
      if (a.room && ROOMS.includes(a.room) && roomState(a.room)==='occupied'){ toast(`${a.room} is still occupied`); return; }
      a.status='inprogress'; a.startedAt=n; toast(`${a.name} is in ${a.room||'telehealth'}`);
    }
    else if (kind==='complete'){ a.status='completed'; a.endedAt=n; toast(`Visit complete${a.room&&ROOMS.includes(a.room)?` · ${a.room} turning over`:''}`); }
    else if (kind==='noshow'){ a.status='noshow'; toast(`${a.name} marked as no-show`); }
    else if (kind==='restore'){ a.status='scheduled'; a.contact=null; toast('No-show undone'); }
    else if (kind==='call'){ a.contact='called'; toast(`Calling ${a.phone||a.name}…`); }
    else if (kind==='rebook'){ a.contact='rebooked'; toast(`${a.name} rebooked for Thu 9:15 AM`); }
    renderAll();
  }
  document.addEventListener('click',e=>{
    const b = e.target.closest('[data-a]'); if(b){ act(b.dataset.a,+b.dataset.id); return; }
    const f = e.target.closest('[data-f]'); if(f){ filter=f.dataset.f; renderFilters(); renderSchedule(); }
  });

  $('provSel').innerHTML = '<option value="all">All providers</option>' + Object.entries(PROVIDERS).map(([k,p])=>`<option value="${k}">${p.name}</option>`).join('');
  $('provSel').addEventListener('change',e=>{ provFilter=e.target.value; renderSchedule(); });
  $('q').addEventListener('input',e=>{ query=e.target.value.trim().toLowerCase(); renderSchedule(); });

  const walkins = [['Alma Reyes',42,'Sore throat'],['Theo Grant',7,'Fever'],['Bill Hart',63,'Dizziness'],['Nina Voss',30,'Eye irritation']];
  let wi=0;
  $('walkin').addEventListener('click',()=>{
    const w = walkins[wi++%walkins.length];
    const free = ROOMS.filter(r=>r.startsWith('Exam')||r==='Consult').find(r=>roomState(r)!=='occupied' && !appts.some(a=>a.room===r&&a.status==='checkedin'));
    const provs = Object.keys(PROVIDERS).filter(p=>p!=='kim');
    const n = nowMin();
    appts.push({id:nextId++,start:Math.floor(n),dur:20,name:w[0],age:w[1],type:'Walk-in · '+w[2],prov:provs[wi%provs.length],room:free||'Exam 2',status:'checkedin',checkedIn:n,startedAt:null,endedAt:null,contact:null,phone:null});
    toast(`${w[0]} added to the waiting room`);
    renderAll();
  });

  /* ---------- clock ---------- */
  const dateStr = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  $('date').textContent = dateStr;
  let lastMin=-1;
  function tick(){
    const s = nowSec(), m = Math.floor(s/60), sec = Math.floor(s%60);
    $('clock').innerHTML = `${f12(m)}:${String(sec).padStart(2,'0')}<small>${ap(m)}</small>`;
    if (m!==lastMin){ lastMin=m; renderAll(); }
  }
  tick(); setInterval(tick,1000);
})();
</script>
</body>
</html>
