<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today · Maple Grove Family Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f8; --panel:#fff; --ink:#18212b; --ink-2:#4a5866; --ink-3:#7c8895;
    --line:#e3e8ed; --line-2:#eef1f4;
    --teal:#0f766e; --teal-50:#e6f4f2; --teal-100:#c8e8e3;
    --blue:#2563eb; --blue-50:#eaf1fe;
    --amber:#b45309; --amber-50:#fdf3e2;
    --red:#c2362f; --red-50:#fdecea;
    --violet:#6d43c9; --violet-50:#f1ecfc;
    --gray-50:#f1f3f5;
    --radius:12px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

  /* Header */
  header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .bar{max-width:1440px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
  .logo{width:32px;height:32px;border-radius:9px;background:var(--teal);display:grid;place-items:center}
  .brand small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
  .date{margin-left:auto;text-align:right}
  .date .d{font-weight:600}
  .date .t{color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}
  .demo{font-size:11px;font-weight:600;background:var(--amber-50);color:var(--amber);padding:3px 8px;border-radius:99px;display:none}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--teal-50);color:var(--teal);display:grid;place-items:center;font-weight:600;font-size:13px}

  main{max-width:1440px;margin:0 auto;padding:20px 24px 40px}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .lbl{color:var(--ink-3);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
  .kpi .val{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .kpi .val span{font-size:14px;color:var(--ink-3);font-weight:500;margin-left:2px}
  .kpi .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .meter{height:5px;background:var(--line-2);border-radius:99px;margin-top:8px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}

  .grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .ph h2{font-size:15px;margin:0;font-weight:600}
  .ph .count{color:var(--ink-3);font-weight:500;font-size:13px}
  .ph .right{margin-left:auto;display:flex;gap:8px;align-items:center}

  /* Filters */
  .filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .pd{width:8px;height:8px;border-radius:50%}
  .search{margin-left:auto;position:relative}
  .search input{border:1px solid var(--line);border-radius:8px;padding:6px 10px 6px 30px;font:inherit;font-size:13px;width:200px;background:#fff}
  .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
  select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;background:#fff;color:var(--ink-2)}

  /* Schedule */
  .sched{list-style:none;margin:0;padding:0}
  .row{display:grid;grid-template-columns:78px 4px minmax(0,1.6fr) minmax(0,1fr) 92px 118px 132px;gap:14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-2);transition:background .15s}
  .row:hover{background:#fafbfc}
  .row.done{color:var(--ink-3)}
  .row.done .pname{color:var(--ink-2)}
  .time{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
  .time small{display:block;color:var(--ink-3);font-weight:400;font-size:11.5px}
  .stripe{width:4px;height:34px;border-radius:4px}
  .pname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pmeta{color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
  .tag.late{background:var(--red-50);color:var(--red)}
  .tag.new{background:var(--blue-50);color:var(--blue)}
  .prov{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .room{font-size:13px;color:var(--ink-2)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .s-scheduled{background:var(--gray-50);color:var(--ink-2)}
  .s-checked-in{background:var(--amber-50);color:var(--amber)}
  .s-in-room{background:var(--blue-50);color:var(--blue)}
  .s-completed{background:var(--teal-50);color:var(--teal)}
  .s-no-show{background:var(--red-50);color:var(--red)}
  .acts{display:flex;gap:6px;justify-content:flex-end}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
  .btn:hover{background:var(--gray-50)}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn.primary:hover{background:#0c625b}
  .btn.ghost{border-color:transparent;color:var(--ink-3);padding:5px 7px}
  .btn.ghost:hover{color:var(--red);background:var(--red-50)}
  .btn.sm{padding:4px 8px;font-size:12px}
  .nowline{display:flex;align-items:center;gap:10px;padding:0 16px;height:0;position:relative;z-index:1}
  .nowline span{background:var(--red);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;transform:translateY(-50%);font-variant-numeric:tabular-nums}
  .nowline::after{content:"";flex:1;height:2px;background:var(--red);transform:translateY(-50%);opacity:.7}
  .empty{padding:40px 16px;text-align:center;color:var(--ink-3)}

  /* Rooms */
  .rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
  .rc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:86px;position:relative;background:#fff;text-align:left;width:100%;color:inherit}
  .rc .rn{font-size:12px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.04em}
  .rc .rp{font-weight:600;margin-top:6px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rc .rs{font-size:12px;color:var(--ink-3);margin-top:1px}
  .rc.occupied{background:var(--blue-50);border-color:#cfdcfb}
  .rc.occupied .rn{color:var(--blue)}
  .rc.cleaning{background:var(--violet-50);border-color:#ddd0f6;cursor:pointer}
  .rc.cleaning .rn{color:var(--violet)}
  .rc.cleaning:hover{border-color:var(--violet)}
  .rc.available .rp{color:var(--teal)}
  .rc.over{border-color:#f2b8b3;background:var(--red-50)}
  .rc.over .rn{color:var(--red)}
  .elapsed{position:absolute;top:9px;right:10px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .bar2{height:4px;border-radius:99px;background:rgba(37,99,235,.15);margin-top:8px;overflow:hidden}
  .bar2 i{display:block;height:100%;background:var(--blue)}
  .rc.over .bar2{background:rgba(194,54,47,.15)} .rc.over .bar2 i{background:var(--red)}
  .legend{display:flex;gap:14px;padding:0 14px 14px;font-size:12px;color:var(--ink-3)}
  .legend span{display:flex;align-items:center;gap:5px}

  /* No-shows */
  .ns{list-style:none;margin:0;padding:4px 0}
  .ns li{padding:11px 16px;border-bottom:1px solid var(--line-2);display:grid;grid-template-columns:1fr auto;gap:4px 10px}
  .ns li:last-child{border-bottom:0}
  .ns .n{font-weight:600}
  .ns .m{font-size:12.5px;color:var(--ink-3);grid-column:1}
  .ns .a{grid-column:2;grid-row:1/3;display:flex;gap:6px;align-items:center}
  .ns .state{font-size:11.5px;font-weight:600;color:var(--teal);grid-column:1}
  .nsrate{display:flex;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
  .nsrate b{display:block;color:var(--ink);font-size:16px}
  .side{display:flex;flex-direction:column;gap:20px}

  /* Toast */
  .toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50}
  .toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;gap:12px;align-items:center;animation:in .2s ease}
  .toast button{background:none;border:0;color:#7dd3c8;font-weight:600;padding:0}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}

  @media (max-width:1180px){
    .grid{grid-template-columns:1fr}
    .side{display:grid;grid-template-columns:1fr 1fr}
  }
  @media (max-width:860px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .side{grid-template-columns:1fr}
    .row{grid-template-columns:64px 4px 1fr auto;row-gap:6px}
    .row .prov,.row .room{display:none}
    .row .st{grid-column:3}
    .row .acts{grid-column:4;grid-row:1/3}
    .search{margin-left:0;width:100%} .search input{width:100%}
    .bar{padding:12px 16px} main{padding:16px}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div>Maple Grove Family Clinic<small>Front desk · Today's operations</small></div>
    </div>
    <span class="demo" id="demo" title="Outside clinic hours — showing a simulated mid-morning">Demo time</span>
    <div class="date"><div class="d" id="dateLbl"></div><div class="t" id="timeLbl"></div></div>
    <div class="avatar" title="Signed in as Jordan (Front desk)">JM</div>
  </div>
</header>

<main>
  <section class="kpis" aria-label="Summary">
    <div class="kpi"><div class="lbl">Appointments today</div><div class="val" id="kTotal">0</div><div class="sub" id="kTotalSub"></div></div>
    <div class="kpi"><div class="lbl"><span class="dot" style="background:var(--teal)"></span>Completed</div><div class="val" id="kDone">0</div><div class="meter"><i id="kDoneBar" style="width:0"></i></div></div>
    <div class="kpi"><div class="lbl"><span class="dot" style="background:var(--amber)"></span>In waiting room</div><div class="val" id="kWait">0</div><div class="sub" id="kWaitSub"></div></div>
    <div class="kpi"><div class="lbl"><span class="dot" style="background:var(--red)"></span>No-shows</div><div class="val" id="kNs">0</div><div class="sub" id="kNsSub"></div></div>
    <div class="kpi"><div class="lbl"><span class="dot" style="background:var(--blue)"></span>Rooms in use</div><div class="val" id="kRooms">0</div><div class="meter"><i id="kRoomBar" style="width:0;background:var(--blue)"></i></div></div>
  </section>

  <div class="grid">
    <section class="panel" aria-labelledby="schedH">
      <div class="ph">
        <h2 id="schedH">Today's schedule</h2><span class="count" id="schedCount"></span>
        <div class="right">
          <select id="statusSel" aria-label="Filter by status">
            <option value="all">All statuses</option>
            <option value="active">Upcoming &amp; active</option>
            <option value="scheduled">Scheduled</option>
            <option value="checked-in">Checked in</option>
            <option value="in-room">In room</option>
            <option value="completed">Completed</option>
            <option value="no-show">No-show</option>
          </select>
        </div>
      </div>
      <div class="filters" id="provFilters" role="group" aria-label="Filter by provider">
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search patient or visit type" aria-label="Search patients">
        </div>
      </div>
      <ul class="sched" id="sched"></ul>
    </section>

    <div class="side">
      <section class="panel" aria-labelledby="roomsH">
        <div class="ph"><h2 id="roomsH">Rooms</h2><span class="count" id="roomsCount"></span></div>
        <div class="rooms" id="rooms"></div>
        <div class="legend">
          <span><i class="dot" style="background:var(--blue)"></i>Occupied</span>
          <span><i class="dot" style="background:var(--violet)"></i>Turnover</span>
          <span><i class="dot" style="background:var(--teal)"></i>Ready</span>
          <span><i class="dot" style="background:var(--red)"></i>Over time</span>
        </div>
      </section>

      <section class="panel" aria-labelledby="nsH">
        <div class="ph"><h2 id="nsH">No-shows</h2><span class="count" id="nsCount"></span></div>
        <div class="nsrate">
          <div><b id="nsRate">0%</b>Rate so far</div>
          <div><b id="nsOpen">0</b>Need follow-up</div>
          <div><b id="nsLost">0 min</b>Unused time</div>
        </div>
        <ul class="ns" id="nsList"></ul>
      </section>
    </div>
  </div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* ---------- Clock (real if within hours, otherwise simulated 10:45) ---------- */
const realStart = Date.now();
const d0 = new Date();
const realMin = d0.getHours()*60 + d0.getMinutes() + d0.getSeconds()/60;
const OPEN = 8*60, CLOSE = 17*60;
const demo = realMin < OPEN || realMin > CLOSE - 15;
const baseMin = demo ? 10*60 + 45 : realMin;
if (demo) document.getElementById('demo').style.display = 'inline-block';
const nowMin = () => baseMin + (Date.now() - realStart) / 60000;

const toMin = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
const fmt = m => { m = Math.floor(m); let h = Math.floor(m/60), mm = String(m%60).padStart(2,'0'); const ap = h>=12?'PM':'AM'; h = h%12||12; return `${h}:${mm} ${ap}`; };

/* ---------- Data ---------- */
const providers = {
  OK:{name:'Dr. Amara Okafor', short:'Dr. Okafor', role:'Family Medicine', color:'#0f766e'},
  CH:{name:'Dr. Liam Chen', short:'Dr. Chen', role:'Pediatrics', color:'#2563eb'},
  RE:{name:'Sofia Reyes, NP', short:'NP Reyes', role:'Nurse Practitioner', color:'#c26a12'},
  LB:{name:'Lab / Nursing', short:'Nursing', role:'Labs & vaccines', color:'#6d43c9'}
};
const roomDefs = [
  {id:'E1',name:'Exam 1'},{id:'E2',name:'Exam 2'},{id:'E3',name:'Exam 3'},{id:'E4',name:'Exam 4'},
  {id:'E5',name:'Exam 5'},{id:'E6',name:'Exam 6'},{id:'PR',name:'Procedure'},{id:'LB',name:'Lab draw'}
];
const raw = [
  ['08:00',20,'Margaret Holloway',71,'Diabetes follow-up','OK','E1',0,'(555) 201-3344'],
  ['08:00',15,'Ethan Park',6,'Well-child visit','CH','E3',0,'(555) 410-2290'],
  ['08:15',10,'Priya Natarajan',34,'Fasting blood draw','LB','LB',0,'(555) 388-1022'],
  ['08:30',30,'Daniel Kowalski',52,'Annual physical','RE','E5',1,'(555) 732-0198'],
  ['08:30',20,'Grace Liu',3,'Ear infection recheck','CH','E4',0,'(555) 642-7710'],
  ['08:45',20,'Robert Haines',64,'Hypertension review','OK','E2',0,'(555) 219-4456'],
  ['09:00',15,'Aaliyah Brooks',27,'Contraception consult','RE','E6',0,'(555) 803-6612'],
  ['09:15',20,'Noah Williams',9,'Asthma check','CH','E3',1,'(555) 517-3380'],
  ['09:30',30,'Helen Marsh',58,'Mole removal','OK','PR',0,'(555) 120-9987'],
  ['09:30',10,'Marcus Bell',41,'Flu vaccine','LB','LB',0,'(555) 377-4021'],
  ['09:45',20,'Sara Lindqvist',45,'Back pain','RE','E5',0,'(555) 996-1205'],
  ['10:00',20,'Oliver Grant',2,'Vaccines (18 mo)','CH','E4',0,'(555) 248-6650',1],
  ['10:15',20,'Fatima Yusuf',38,'Thyroid follow-up','OK','E1',1,'(555) 664-0031'],
  ['10:30',30,'James O\'Connor',67,'Medicare wellness','RE','E6',0,'(555) 155-8842'],
  ['10:30',20,'Chloe Martin',12,'Sports physical','CH','E3',0,'(555) 731-5590'],
  ['10:40',20,'Victor Alvarez',49,'Lab results review','OK','E2',0,'(555) 402-7763'],
  ['11:00',15,'Isabella Rossi',30,'Prenatal labs','LB','LB',0,'(555) 380-2214'],
  ['11:00',30,'Thomas Reed',55,'New patient visit','OK','E1',0,'(555) 590-4410',1],
  ['11:15',20,'Mia Thompson',7,'Rash','CH','E4',0,'(555) 873-1196'],
  ['11:30',20,'Kevin Osei',36,'Anxiety follow-up','RE','E5',0,'(555) 332-8075'],
  ['13:00',20,'Linda Carver',62,'Cholesterol review','OK','E2',0,'(555) 704-5531'],
  ['13:00',15,'Lucas Moreau',4,'Fever','CH','E3',0,'(555) 468-2290'],
  ['13:30',30,'Angela Duarte',44,'Annual physical','RE','E6',0,'(555) 211-6804'],
  ['13:45',30,'Samuel Fischer',59,'Joint injection','OK','PR',0,'(555) 991-3027'],
  ['14:00',20,'Zoe Campbell',15,'Acne consult','CH','E4',0,'(555) 650-1148'],
  ['14:30',20,'Henry Nakamura',73,'Medication review','OK','E1',0,'(555) 847-9302'],
  ['14:30',10,'Rachel Stein',29,'TB test read','LB','LB',0,'(555) 320-5517'],
  ['15:00',20,'David Mensah',40,'Sinus infection','RE','E5',0,'(555) 788-6650'],
  ['15:30',20,'Ava Patel',10,'ADHD follow-up','CH','E3',0,'(555) 563-4492'],
  ['16:00',30,'George Whitfield',68,'COPD review','OK','E2',0,'(555) 402-0089'],
  ['16:30',20,'Nina Kowalczyk',33,'Post-op check','RE','E6',0,'(555) 219-7732']
];
const now0 = nowMin();
// Shift the "late" example near current time so the demo always shows one
const appts = raw.map((r,i)=>({id:i,start:toMin(r[0]),dur:r[1],name:r[2],age:r[3],type:r[4],prov:r[5],pref:r[6],flagNs:!!r[7],phone:r[8],isNew:!!r[9],room:null,roomedAt:null,status:'scheduled',followUp:null}));

const rooms = roomDefs.map(r=>({...r,status:'available',appt:null,since:null}));
const roomById = id => rooms.find(r=>r.id===id);

// Initial status derivation
appts.forEach(a=>{
  const end = a.start + a.dur;
  if (a.flagNs && a.start < now0 - 10) a.status = 'no-show';
  else if (end <= now0) a.status = 'completed';
  else if (a.start <= now0) {
    const r = roomById(a.pref);
    if (r.status==='available'){ a.status='in-room'; a.room=r.id; a.roomedAt=a.start+2; r.status='occupied'; r.appt=a.id; r.since=a.roomedAt; }
    else a.status='checked-in';
  }
  else if (a.start - now0 <= 20 && a.id % 3 !== 0) a.status = 'checked-in';
});
// Recently vacated rooms are in turnover
appts.filter(a=>a.status==='completed' && now0-(a.start+a.dur) < 8).forEach(a=>{
  const r = roomById(a.pref); if (r.status==='available'){ r.status='cleaning'; r.since=a.start+a.dur; a.room=r.id; }
});
appts.filter(a=>a.status==='completed').forEach(a=>a.room = a.room || a.pref);
// One patient running a bit over
const firstIn = appts.find(a=>a.status==='in-room'); if (firstIn){ firstIn.roomedAt -= firstIn.dur*0.6; roomById(firstIn.room).since = firstIn.roomedAt; }

/* ---------- State / filters ---------- */
let provFilter = 'all', statusFilter = 'active', query = '';
document.getElementById('statusSel').value = statusFilter;

const provWrap = document.getElementById('provFilters');
const allChip = mkChip('all','All providers',null);
provWrap.prepend(allChip);
let last = allChip;
Object.entries(providers).forEach(([k,p])=>{ const c = mkChip(k,p.short,p.color); last.after(c); last=c; });
function mkChip(key,label,color){
  const b = document.createElement('button'); b.className='chip'; b.dataset.k=key;
  b.setAttribute('aria-pressed', key===provFilter);
  b.innerHTML = (color?`<span class="pd" style="background:${color}"></span>`:'') + label;
  b.onclick = ()=>{ provFilter=key; provWrap.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===key)); renderSchedule(); };
  return b;
}
document.getElementById('statusSel').onchange = e=>{ statusFilter=e.target.value; renderSchedule(); };
document.getElementById('q').oninput = e=>{ query=e.target.value.trim().toLowerCase(); renderSchedule(); };

/* ---------- Actions ---------- */
const statusLabel = {'scheduled':'Scheduled','checked-in':'Checked in','in-room':'In room','completed':'Completed','no-show':'No-show'};
const esc = s => s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function act(id, action){
  const a = appts[id], prev = JSON.parse(JSON.stringify({a, rooms}));
  const n = nowMin();
  if (action==='checkin'){ a.status='checked-in'; toast(`${a.name} checked in`, prev); }
  else if (action==='room'){
    let r = roomById(a.pref);
    if (r.status!=='available') r = rooms.find(x=>x.status==='available' && x.id!=='LB' && x.id!=='PR') || rooms.find(x=>x.status==='available');
    if (!r){ toast('No rooms ready — mark a room ready first'); return; }
    a.status='in-room'; a.room=r.id; a.roomedAt=n; r.status='occupied'; r.appt=a.id; r.since=n;
    toast(`${a.name} roomed in ${r.name}`, prev);
  }
  else if (action==='complete'){
    const r = roomById(a.room); a.status='completed';
    if (r){ r.status='cleaning'; r.appt=null; r.since=n; }
    toast(`Visit completed · ${r?r.name:'room'} needs turnover`, prev);
  }
  else if (action==='noshow'){ a.status='no-show'; a.followUp=null; toast(`${a.name} marked as no-show`, prev); }
  else if (action==='undo-ns'){ a.status='scheduled'; a.followUp=null; toast(`No-show cleared for ${a.name}`, prev); }
  else if (action==='called'){ a.followUp='Left voicemail'; toast(`Logged call to ${a.name}`, prev); }
  else if (action==='resched'){ a.followUp='Rescheduled'; toast(`${a.name} flagged for rescheduling`, prev); }
  render();
}
function roomReady(id){
  const r = roomById(id), prev = JSON.parse(JSON.stringify({a:null, rooms}));
  r.status='available'; r.since=null; toast(`${r.name} is ready`, prev); render();
}

/* ---------- Render ---------- */
function render(){ renderKpis(); renderSchedule(); renderRooms(); renderNoShows(); }

function renderKpis(){
  const n = nowMin(), total = appts.length;
  const done = appts.filter(a=>a.status==='completed').length;
  const waiting = appts.filter(a=>a.status==='checked-in');
  const ns = appts.filter(a=>a.status==='no-show').length;
  const due = appts.filter(a=>a.start < n).length || 1;
  const inUse = rooms.filter(r=>r.status==='occupied').length;
  const remaining = appts.filter(a=>['scheduled','checked-in'].includes(a.status)).length;
  set('kTotal', total); set('kTotalSub', `${remaining} still to be seen`);
  set('kDone', done); document.getElementById('kDoneBar').style.width = (done/total*100)+'%';
  set('kWait', waiting.length);
  const longest = waiting.length ? Math.max(...waiting.map(a=>Math.max(0,n-a.start))) : 0;
  set('kWaitSub', waiting.length ? (longest>0 ? `Longest past appt time: ${Math.round(longest)} min` : 'All arrived early') : 'Waiting room empty');
  set('kNs', ns); set('kNsSub', `${Math.round(ns/due*100)}% of visits due so far`);
  document.getElementById('kRooms').innerHTML = `${inUse}<span>/ ${rooms.length}</span>`;
  document.getElementById('kRoomBar').style.width = (inUse/rooms.length*100)+'%';
}
const set = (id,v)=>document.getElementById(id).textContent=v;

function renderSchedule(){
  const n = nowMin();
  const list = appts.filter(a=>{
    if (provFilter!=='all' && a.prov!==provFilter) return false;
    if (statusFilter==='active' && !['scheduled','checked-in','in-room'].includes(a.status)) return false;
    if (!['all','active'].includes(statusFilter) && a.status!==statusFilter) return false;
    if (query && !(a.name.toLowerCase().includes(query) || a.type.toLowerCase().includes(query))) return false;
    return true;
  }).sort((x,y)=>x.start-y.start || x.id-y.id);

  set('schedCount', `${list.length} of ${appts.length}`);
  const ul = document.getElementById('sched');
  if (!list.length){ ul.innerHTML = `<li class="empty">No appointments match these filters.</li>`; return; }

  let html = '', nowPlaced = false;
  list.forEach(a=>{
    if (!nowPlaced && a.start > n){ html += nowLine(n); nowPlaced = true; }
    const p = providers[a.prov];
    const late = a.status==='scheduled' && n - a.start > 5;
    const room = a.room ? roomById(a.room).name : (a.status==='no-show' ? '—' : `<span style="color:var(--ink-3)">${roomById(a.pref).name}</span>`);
    let acts = '';
    if (a.status==='scheduled') acts = `<button class="btn ${late?'':'primary'}" data-a="checkin" data-id="${a.id}">Check in</button><button class="btn ghost" data-a="noshow" data-id="${a.id}" title="Mark no-show" aria-label="Mark ${esc(a.name)} as no-show">✕</button>`;
    else if (a.status==='checked-in') acts = `<button class="btn primary" data-a="room" data-id="${a.id}">Room patient</button>`;
    else if (a.status==='in-room') acts = `<button class="btn" data-a="complete" data-id="${a.id}">Complete</button>`;
    else if (a.status==='no-show') acts = `<button class="btn sm" data-a="undo-ns" data-id="${a.id}">Undo</button>`;
    html += `<li class="row ${['completed','no-show'].includes(a.status)?'done':''}">
      <div class="time">${fmt(a.start)}<small>${a.dur} min</small></div>
      <div class="stripe" style="background:${p.color}"></div>
      <div style="min-width:0"><div class="pname">${esc(a.name)}${late?'<span class="tag late">LATE</span>':''}${a.isNew?'<span class="tag new">NEW</span>':''}</div>
        <div class="pmeta">${esc(a.type)} · ${a.age} yrs</div></div>
      <div class="prov">${p.short}</div>
      <div class="room">${room}</div>
      <div class="st"><span class="pill s-${a.status}">${statusLabel[a.status]}</span></div>
      <div class="acts">${acts}</div>
    </li>`;
  });
  if (!nowPlaced && n < CLOSE) html += nowLine(n);
  ul.innerHTML = html;
}
const nowLine = n => `<li class="nowline" aria-label="Current time ${fmt(n)}"><span>${fmt(n)}</span></li>`;

function renderRooms(){
  const n = nowMin();
  const inUse = rooms.filter(r=>r.status==='occupied').length;
  set('roomsCount', `${inUse} in use · ${rooms.filter(r=>r.status==='available').length} ready`);
  document.getElementById('rooms').innerHTML = rooms.map(r=>{
    if (r.status==='occupied'){
      const a = appts[r.appt], el = Math.max(0, n - r.since), over = el > a.dur;
      const pct = Math.min(100, el/a.dur*100);
      return `<div class="rc occupied ${over?'over':''}">
        <div class="rn">${r.name}</div><div class="elapsed" style="color:${over?'var(--red)':'var(--blue)'}">${Math.floor(el)}m / ${a.dur}m</div>
        <div class="rp">${esc(a.name)}</div><div class="rs">${providers[a.prov].short} · ${esc(a.type)}</div>
        <div class="bar2"><i style="width:${pct}%"></i></div></div>`;
    }
    if (r.status==='cleaning'){
      return `<button class="rc cleaning" data-room="${r.id}" aria-label="${r.name} in turnover. Mark ready">
        <div class="rn">${r.name}</div><div class="elapsed" style="color:var(--violet)">${Math.floor(Math.max(0,n-r.since))}m</div>
        <div class="rp">Turnover</div><div class="rs">Click to mark ready</div></button>`;
    }
    const next = appts.filter(a=>a.pref===r.id && ['scheduled','checked-in'].includes(a.status)).sort((x,y)=>x.start-y.start)[0];
    return `<div class="rc available"><div class="rn">${r.name}</div><div class="rp">Ready</div>
      <div class="rs">${next?`Next: ${fmt(next.start)} · ${esc(next.name.split(' ')[0])}`:'Nothing else booked'}</div></div>`;
  }).join('');
}

function renderNoShows(){
  const n = nowMin();
  const ns = appts.filter(a=>a.status==='no-show').sort((x,y)=>y.start-x.start);
  const due = appts.filter(a=>a.start < n).length || 1;
  set('nsCount', ns.length ? `${ns.length} today` : '');
  set('nsRate', Math.round(ns.length/due*100)+'%');
  set('nsOpen', ns.filter(a=>a.followUp!=='Rescheduled').length);
  set('nsLost', ns.reduce((s,a)=>s+a.dur,0)+' min');
  const ul = document.getElementById('nsList');
  if (!ns.length){ ul.innerHTML = `<li class="empty" style="display:block">No no-shows today 🎉</li>`; return; }
  ul.innerHTML = ns.map(a=>`<li>
    <div class="n">${esc(a.name)}</div>
    <div class="a">
      ${a.followUp==='Rescheduled' ? '' : `<button class="btn sm" data-a="called" data-id="${a.id}" title="${a.phone}">Call</button><button class="btn sm primary" data-a="resched" data-id="${a.id}">Reschedule</button>`}
    </div>
    <div class="m">${fmt(a.start)} · ${providers[a.prov].short} · ${esc(a.type)}</div>
    <div class="m">${a.phone}</div>
    ${a.followUp?`<div class="state">✓ ${a.followUp}</div>`:''}
  </li>`).join('');
}

/* ---------- Events ---------- */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if (b) return act(+b.dataset.id, b.dataset.a);
  const r = e.target.closest('[data-room]'); if (r) return roomReady(r.dataset.room);
});

/* ---------- Toasts with undo ---------- */
function toast(msg, snapshot){
  const t = document.createElement('div'); t.className='toast';
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (snapshot){
    const u = document.createElement('button'); u.textContent='Undo';
    u.onclick = ()=>{
      if (snapshot.a) Object.assign(appts[snapshot.a.id], snapshot.a);
      snapshot.rooms.forEach((r,i)=>Object.assign(rooms[i], r));
      t.remove(); render();
    };
    t.appendChild(u);
  }
  const box = document.getElementById('toasts'); box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(()=>t.remove(), 5000);
}

/* ---------- Clock ---------- */
function tick(){
  const d = new Date();
  set('dateLbl', d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}));
  set('timeLbl', fmt(nowMin()) + (demo ? ' (simulated)' : ''));
}
tick(); render();
setInterval(()=>{ tick(); renderKpis(); renderRooms(); }, 15000);
setInterval(renderSchedule, 60000);
</script>
</body>
</html>
