# Release dates are year-month. verified: false means sources disagree or none was official.
families:
  gpt: {name: GPT, maker: OpenAI}
  claude: {name: Claude, maker: Anthropic}
  gemini: {name: Gemini, maker: Google}

models:
  - {id: gpt-4.1, family: gpt, name: GPT-4.1, released: 2025-04, verified: true, graphite: gpt41}
  - {id: gpt-5, family: gpt, name: GPT-5, released: 2025-08, verified: true, graphite: gpt5}
  - {id: gpt-5.6-sol, family: gpt, name: GPT-5.6 Sol, released: 2026-08, verified: false, graphite: gpt-5-6-sol}
  - {id: gpt-6-astra, family: gpt, name: GPT-6 Astra, released: 2026-09, verified: false, graphite: gpt-6-astra}
  - {id: claude-opus-4, family: claude, name: Claude Opus 4, released: 2025-05, verified: true, graphite: claude-opus-4-20250514}
  - {id: claude-opus-4.6, family: claude, name: Claude Opus 4.6, released: 2026-02, verified: false, graphite: claude-opus-4-6}
  - {id: claude-opus-5, family: claude, name: Claude Opus 5, released: 2026-07, verified: false, graphite: claude-opus-5}
  - {id: gemini-2.5-pro, family: gemini, name: Gemini 2.5 Pro, released: 2025-06, verified: true, graphite: gemini-2-5-pro}
  - {id: gemini-3.1-pro, family: gemini, name: Gemini 3.1 Pro, released: 2026-02, verified: false, graphite: gemini-3-1-pro-preview}

# Model ids a harness might report, mapped to the nearest measured model.
aliases:
  claude-opus-5-5: claude-opus-5
  claude-sonnet-5-5: claude-opus-5
  claude-haiku-5-5: claude-opus-5
  claude-fable-5-1: claude-opus-5
  claude-opus-4-6: claude-opus-4.6
  claude-opus-4-20250514: claude-opus-4
  gpt-6: gpt-6-astra
  gpt-5.6: gpt-5.6-sol
  gemini-3.1-pro-preview: gemini-3.1-pro

# Corpus-level evidence from before per-model measurements existed.
eras:
  - id: chatgpt-pubmed-2024
    label: ChatGPT era, PubMed abstracts
    period: 2024
    source: kobak-2025
    note: At least 13.5% of 2024 PubMed abstracts were processed with an LLM.
    words:
      - {term: delves, ratio: 28.0}
      - {term: underscores, ratio: 10.9}
      - {term: showcasing, ratio: 10.2}
