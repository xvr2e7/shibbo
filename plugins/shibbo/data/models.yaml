# Release dates are year-month, from official announcements or API changelogs (see data/chronology-releases.yaml for the exact days).
# source: graphite (Graphite's AI Tells, ~10,000 matched articles) or shibbo-api (shibbo's own run through the maker's API,
# a few hundred held-out Graphite topics; run: measure/runs/<run>/matched.jsonl, articles: how many it measured).
families:
  gpt: {name: GPT, maker: OpenAI}
  claude: {name: Claude, maker: Anthropic}
  gemini: {name: Gemini, maker: Google}
  gemma: {name: Gemma, maker: Google}
  deepseek: {name: DeepSeek, maker: DeepSeek}
  mistral: {name: Mistral, maker: Mistral AI}
  glm: {name: GLM, maker: Z.ai}
  grok: {name: Grok, maker: xAI}
  meta: {name: Meta, maker: Meta}
  qwen: {name: Qwen, maker: Alibaba}
  minimax: {name: MiniMax, maker: MiniMax}
  mimo: {name: MiMo, maker: Xiaomi}
  nemotron: {name: Nemotron, maker: Nvidia}

