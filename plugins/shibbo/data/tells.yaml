# shibbo registry. See SCHEMA.md.
# Patterns are JavaScript regex source. Default flags: "i". Patterns run on prose with code stripped.
# measure.graphite lists exact terms from Graphite's AI Tells data; the build attaches per-model rates.

# ═════════════ prose · lexical ═════════════

- id: delve
  name: '"delve" and kin'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 2
  what: The first famous tell. "Delve into", "delves", "delving".
  detect: {method: regex, pattern: '\bdelv(?:e|es|ed|ing)\b'}
  measure: {graphite: [delve, delves, delving, delve into], graphite_feature: layer5__llm_delve_per1k}
  era: {first_seen: 2023, peak: 2024}
  status: fading
  substitutes: ['"dive into"', '"explore"', '"unpack"']
  fix: Say what you will do ("look at", "compare", "list").
  examples: {bad: "Let's delve into the data.", good: "Here's what the data shows."}
  confidence: high
  sources: [kobak-2025, coling-2025-delve, annotator-2026, graphite-2026]

- id: tapestry
  name: '"tapestry", "testament to", "realm"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 2
  what: Ornate nouns used as filler metaphors.
  detect: {method: regex, pattern: '\b(?:rich |intricate |vibrant )?tapestry\b|\ba testament to\b|\brealm of\b|\btreasure trove\b|\bbeacon of\b|\bsymphony of\b'}
  measure: {graphite: [tapestry, a testament to, testament, realm, treasure trove, beacon], graphite_feature: layer5__llm_tapestry_per1k}
  era: {first_seen: 2023, peak: 2024}
  status: fading
  substitutes: ['"mosaic"', '"fabric of"', '"ecosystem"']
  fix: Name the things the metaphor stands in for.
  examples: {bad: "a rich tapestry of cultures", good: "Greek, Turkish and Armenian families on one street"}
  confidence: high
  sources: [graphite-2026, wikipedia-signs]

- id: landscape
  name: '"landscape", "ever-evolving", "in today''s world"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 2
  what: Openers that place the topic in a vague, shifting world.
  detect: {method: regex, pattern: '\bin today(?:''|’)s (?:fast-paced |digital |ever-changing |modern )?(?:world|landscape|age|era)\b|\bever-(?:evolving|changing) (?:landscape|world)\b|\b(?:digital|competitive|business) landscape\b'}
  measure: {graphite: ["in today's", landscape, ever evolving], graphite_feature: layer5__llm_landscape_per1k}
  era: {first_seen: 2023, peak: 2024}
  status: fading
  fix: Start with the specific fact.
  examples: {bad: "In today's fast-paced digital landscape, teams need speed.", good: "Our deploys take 40 minutes."}
  confidence: high
  sources: [graphite-2026, wikipedia-signs]

- id: showcase-underscore
  name: '"underscores", "showcasing", "pivotal", "crucial"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 2
  what: Academic-sounding verbs and adjectives of emphasis.
  detect: {method: regex, pattern: '\b(?:showcas(?:e|es|ed|ing)|underscor(?:e|es|ed|ing)|pivotal|crucial(?:ly)?|intricate|meticulous(?:ly)?|commendable)\b', density: {count: 2, per: 300}}
  measure: {graphite: [underscores, showcase, showcasing, pivotal, crucial, intricate, meticulous], graphite_feature: layer5__llm_crucial_per1k}
  era: {first_seen: 2023, peak: 2024}
  status: fading
  fix: Cut the emphasis word and state the fact.
  examples: {bad: "This underscores the pivotal role of caching.", good: "Caching cut p95 latency from 800ms to 90ms."}
  confidence: high
  sources: [kobak-2025, graphite-2026]

- id: important-to-note
  name: '"It''s important to note", "It''s worth noting"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 2
  what: Throat-clearing before a point.
  detect: {method: regex, pattern: '\bit(?:''|’)?s (?:important|worth|crucial|essential) (?:to note|noting|to remember|mentioning|to understand)\b|\bit is (?:important|worth|crucial|essential) (?:to note|noting|to remember|mentioning|to understand)\b'}
  measure: {graphite: [important to note, it is worth, worth noting]}
  era: {first_seen: 2022, peak: 2024}
  status: steady
  substitutes: ['"Notably,"', '"Keep in mind"']
  fix: Delete the preamble. The point stands without it.
  examples: {bad: "It's important to note that the API has a rate limit.", good: "The API allows 100 calls a minute."}
  confidence: high
  sources: [graphite-2026, wikipedia-signs, slop-guard]

- id: ai-self-reference
  name: '"As an AI language model"'
  domain: chat
  group: disclaimers
  kind: behavioral
  severity: 3
  what: Model names itself to hedge or refuse.
  detect: {method: regex, pattern: '\bas an ai(?: language model| assistant)?\b|\bmy (?:training data|knowledge cutoff)\b'}
  era: {first_seen: 2022, peak: 2023}
  status: retired
  fix: Drop it. Answer, or say plainly what you can't do.
  examples: {bad: "As an AI language model, I don't have personal opinions, but...", good: "Most reviewers prefer the second draft."}
  confidence: high
  sources: [wikipedia-signs]

- id: marketing-verbs
  name: '"streamline", "unlock", "elevate", "leverage", "foster"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 2
  what: Pitch-deck verbs where nobody is pitching.
  detect: {method: regex, pattern: '\b(?:streamlin(?:e|es|ed|ing)|unlock(?:s|ed|ing)?|elevat(?:e|es|ed|ing)|leverag(?:e|es|ed|ing)|empower(?:s|ed|ing)?|supercharg(?:e|es|ed|ing)|foster(?:s|ed|ing)?|harness(?:es|ed|ing)? the power|seamless(?:ly)?|game[- ]changer)\b'}
  measure: {graphite: [leverage, leveraging, unlock, unlocking, foster, fostering, seamless, game changer, streamline]}
  era: {first_seen: 2023, peak: 2025}
  status: fading
  fix: Use the plain verb ("use", "speed up", "let you", "help").
  examples: {bad: "Our new dashboard empowers teams to unlock insights and elevate their workflow.", good: "The dashboard shows which tests fail most often."}
  confidence: high
  sources: [graphite-2026, avoid-ai-writing]

- id: robust-holistic
  name: '"robust", "holistic", "nuanced", "comprehensive"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Abstract quality adjectives that sound careful and say little.
  detect: {method: regex, pattern: '\b(?:robust|holistic|nuanced|comprehensive|multifaceted|cutting-edge|state-of-the-art|transformative)\b', density: {count: 2, per: 300}}
  measure: {graphite: [robust, holistic, nuanced, comprehensive, multifaceted, transformative]}
  status: steady
  fix: Name the property ("handles 10k req/s", "covers all 50 states").
  examples: {bad: "We built a robust, holistic, scalable framework for data quality.", good: "We check every row for nulls and bad dates before it loads."}
  confidence: medium
  sources: [graphite-2026, avoid-ai-writing]

- id: journey-embark
  name: '"journey", "embark", "navigate", "bustling", "nestled"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Travel and scenery words used for things that are not trips or places.
  detect: {method: regex, pattern: '\bembark(?:s|ed|ing)? on\b|\bnavigat(?:e|es|ing) (?:the|these|this) (?:complexities|challenges|world|landscape)\b|\bbustling\b|\bnestled\b|\byour \w+ journey\b'}
  measure: {graphite: [journey, embark, navigate, navigating, bustling, nestled]}
  era: {first_seen: 2023, peak: 2024}
  status: fading
  fix: Name the task or the place.
  examples: {bad: "Embark on a journey through the landscape of modern databases.", good: "This post compares Postgres and SQLite for small apps."}
  confidence: medium
  sources: [graphite-2026, wikipedia-signs]

- id: genuinely
  name: '"genuinely", "a genuine", "is a genuinely"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 2
  what: Sincerity markers. The current Claude tell, the way "delve" was GPT's.
  detect: {method: regex, pattern: '\bgenuine(?:ly)?\b', density: {count: 2, per: 400}}
  measure: {graphite: [genuinely, is genuinely, a genuinely, is a genuinely, is a genuine, genuinely useful, and genuinely]}
  era: {first_seen: 2025, peak: unknown}
  status: rising
  fix: Delete it. If the claim needs it to be believed, add evidence instead.
  examples: {bad: "This is a genuinely useful tool.", good: "This tool saved us a day per release."}
  confidence: high
  sources: [graphite-2026]

- id: x-matters
  name: '"That distinction matters", "Why X matters"'
  domain: prose
  group: phrasing
  kind: structural
  severity: 2
  what: Announces that something is important instead of showing the stakes.
  detect: {method: regex, pattern: '\b(?:this|that|the) (?:distinction|difference|choice|detail|nuance|combination) matters\b|\bwhich matters\b|\bmatters (?:enormously|more than|because)\b|\bwhy (?:the|this|it) \w+ matters\b|\balso matters\b'}
  measure: {graphite: [that distinction matters, this distinction matters, the distinction matters, distinction matters, which matters, matters enormously, also matters, why the _ matters, this _ matters, matters because]}
  era: {first_seen: 2025, peak: unknown}
  status: rising
  substitutes: ['"the key point"', '"this is why"']
  fix: Show what goes wrong without it. Readers will see that it matters.
  examples: {bad: "Why this matters: speed matters more than ever.", good: "A one-second delay cut sign-ups by 7% in our test."}
  confidence: high
  sources: [graphite-2026]

- id: practical-takeaway
  name: '"The practical takeaway", "In practice", "trade-off is"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Signposts that label the next sentence as the useful part.
  detect: {method: regex, pattern: '\bthe (?:practical|key|real|main) takeaway\b|\bthe trade-?off is\b|\btaken together\b|\bjust as importantly\b|\bearns its (?:place|keep)\b'}
  measure: {graphite: [the practical takeaway, trade off is, taken together these, taken together the, just as importantly, earns its, practical _ is]}
  era: {first_seen: 2026, peak: unknown}
  status: rising
  fix: Drop the label and give the takeaway.
  examples: {bad: "The key takeaway? Practical tip: always back up first.", good: "Back up first."}
  confidence: high
  sources: [graphite-2026]

- id: intensifiers
  name: '"incredibly", "absolutely", "massive", "profound"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Adverbs and adjectives that add force but no information.
  detect: {method: regex, pattern: '\b(?:incredibly|absolutely|truly|exactly|precisely|massive(?:ly)?|profound(?:ly)?|highly effective)\b', density: {count: 3, per: 500}}
  measure: {graphite: [incredibly, absolutely, it is incredibly, is absolutely essential, a massive role, is a massive, is a profound, a highly effective]}
  era: {first_seen: 2025, peak: unknown}
  status: rising
  fix: Delete the intensifier. If the sentence goes flat, it needs a number or example.
  examples: {bad: "This is truly an incredibly powerful and remarkably simple tool.", good: "It does one thing well: it renames files in bulk."}
  confidence: high
  sources: [graphite-2026]

- id: formal-transitions
  name: '"Furthermore", "Additionally", "Moreover"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Essay connectors opening sentence after sentence.
  detect: {method: regex, flags: "gm", pattern: '(?:^|[.!?]\s+)(?:Furthermore|Additionally|Moreover|In addition|Consequently|Ultimately|Notably),', density: {count: 2, per: 300}}
  measure: {graphite: [furthermore, additionally, moreover, ultimately, ultimately this]}
  status: rising
  fix: Drop the connector, or use "and", "also", "so".
  examples: {bad: "Furthermore, the tool is fast. Moreover, it is free. Additionally, it is open source.", good: "It's fast, free and open source."}
  confidence: high
  sources: [graphite-2026]

- id: superlative-framing
  name: '"the single most", "the most consequential"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 2
  what: Emphatic rankings nobody asked for.
  detect: {method: regex, pattern: '\bthe single (?:most|biggest|best|greatest)\b|\barguably the (?:most|best)\b|\bevery single\b|\bthe most consequential\b'}
  measure: {graphite: [single most, the most consequential, arguably the most, every single]}
  era: {first_seen: 2025, peak: unknown}
  status: rising
  fix: Drop the ranking, or back it with the comparison.
  examples: {bad: "This is one of the most important decisions you will ever make.", good: "This choice sets your hosting bill for the next year."}
  confidence: high
  sources: [graphite-2026]

- id: particular-kind
  name: '"a particular kind of", "exactly the kind of"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Gestures at a category without naming it.
  detect: {method: regex, pattern: '\b(?:a|this|that) particular kind of\b|\bexactly the kind of\b'}
  measure: {graphite: [particular kind of, a particular kind, exactly the kind]}
  status: rising
  fix: Name the kind.
  examples: {bad: "It has a particular kind of charm, a certain quality that's hard to name.", good: "It has hand-cut type and wide margins."}
  confidence: high
  sources: [graphite-2026]

- id: soft-hedging
  name: '"may provide", "not necessarily", "not automatically"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Stacked hedges that leave no claim standing.
  detect: {method: regex, pattern: '\b(?:may|might|could) (?:potentially|possibly)\b|\bnot necessarily\b|\b(?:does|should|will) not automatically\b|\bmay (?:provide|help|offer)\b|\bcan sometimes feel\b'}
  measure: {graphite_feature: layer5__hedge_stack_mean_per_sent, graphite: [not necessarily, is not automatically, does not automatically, should not automatically, not automatically mean, can sometimes feel]}
  status: peaking
  fix: Commit, or say what the doubt is and why.
  examples: {bad: "This approach may potentially help some teams, though results are not necessarily guaranteed.", good: "This cut build time for two of our three teams. The third saw no change."}
  confidence: high
  sources: [graphite-2026]

- id: guide-signpost
  name: '"This comprehensive guide will walk you through"'
  label: '"This comprehensive guide"'
  domain: prose
  group: phrasing
  kind: structural
  severity: 3
  what: The article describes itself before saying anything.
  detect: {method: regex, pattern: '\bthis (?:comprehensive |practical |complete |ultimate )?(?:guide|article|post) (?:will )?(?:walks?|takes?|explores?|covers?|dives?)\b|\blet(?:''|’)?s (?:explore|dive in|take a closer look)\b|\blet us explore\b|\bin this (?:article|guide|post),? we(?:''|’)?(?:ll| will)\b|\bbefore diving into\b'}
  measure: {graphite: [this guide walks, guide walks through, this comprehensive guide, comprehensive guide will, let us explore, guide will walk, guide we will, before diving into, a practical guide, this guide _ through]}
  era: {first_seen: 2023, peak: unknown}
  status: steady
  fix: Cut the paragraph. Start with the first real point.
  examples: {bad: "In this comprehensive guide, we'll explore everything you need to know about caching.", good: "Cache the rendered page, not the database rows. Here is why."}
  confidence: high
  sources: [graphite-2026, wikipedia-signs]

- id: whether-you-are
  name: '"Whether you''re a beginner or an expert"'
  domain: prose
  group: phrasing
  kind: structural
  severity: 2
  what: Addresses every possible reader at once.
  detect: {method: regex, pattern: '\bwhether you(?:''|’)?re\b|\bwhether you are\b|\byou(?:''|’)?ve likely\b|\byou have likely\b|\bif you(?:''|’)?re searching\b|\byou are searching\b'}
  measure: {graphite: [whether you are _ a, and _ whether you are, whether you are _ for, you have likely, you are searching]}
  status: steady
  fix: Write for one reader.
  examples: {bad: "Whether you're a seasoned developer or just starting out, this tool has something for you.", good: "This is for backend developers who already run Postgres."}
  confidence: high
  sources: [graphite-2026]

- id: at-its-core
  name: '"At its core", "At the heart of"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: A promise of depth before a plain statement.
  detect: {method: regex, pattern: '\bat (?:its|their|the) (?:core|heart)\b|\bheart of (?:this|the matter)\b|\blies in its\b|\bvalue lies in\b'}
  measure: {graphite: [at its core, heart of this, at the _ of this _ is, lies in its, value lies in]}
  status: steady
  fix: State the core thing.
  examples: {bad: "At its core, the value lies in its simplicity.", good: "It has one setting: the port."}
  confidence: high
  sources: [graphite-2026]

# ═════════════ prose · structural ═════════════

- id: contrastive-negation
  name: '"It''s not X, it''s Y" / "not just X, but Y"'
  domain: prose
  group: phrasing
  kind: structural
  severity: 3
  what: Sets up a claim nobody made, then knocks it down.
  detect:
    method: regex
    pattern: '\b(?:(?:is|are|was|were)n(?:''|’)?t|(?:is|are|was|were|it(?:''|’)?s|that(?:''|’)?s|they(?:''|’)?re) not)\b(?: (?:just|only|merely|simply|about))? [^.;:\n,]{1,50}(?:[;:—–]|,)\s*(?:it|they|this|that)(?:\s+(?:is|are|was|were)\b|(?:''|’)(?:s|re)\b)|\bit(?:(?:''|’)s| is) not\b[^.\n]{1,50}\.\s+it(?:(?:''|’)s| is)\b'
    judge: Does the text deny a claim no one made in order to assert another?
  measure: {graphite: [not a _ it is, is not a _ it is, not just a _ it is, not just a _ it, not a _ it is a, just a _ it is, not just _ they, is not merely, not simply a, is not simply, not as a _ but as]}
  era: {first_seen: 2024, peak: unknown}
  status: rising
  substitutes: [less-x-more-y, corrective-rather-than]
  fix: State the real claim. Keep a contrast only when someone holds the other view.
  examples: {bad: "This isn't a tool, it's a philosophy.", good: "The tool enforces one rule: every commit runs the tests."}
  false_positives: Real rebuttals.
  confidence: high
  sources: [graphite-2026, antislop-2025, slop-guard]

- id: less-x-more-y
  name: '"less like X and more like Y"'
  domain: prose
  group: phrasing
  kind: structural
  severity: 3
  what: The softer cousin of contrastive negation. Rises when that one is suppressed.
  detect: {method: regex, pattern: '\bless (?:like |about |of )?(?:a |an |the )?[\w-]+(?: [\w-]+)?,? (?:and |but )?more (?:like |about |of )'}
  measure: {graphite: [less like a _ and more like, less like a _ and, less like a _ and more]}
  era: {first_seen: 2025, peak: unknown}
  status: rising
  fix: Describe Y on its own terms.
  examples: {bad: "It feels less like a library and more like a language.", good: "It ships its own syntax and compiler."}
  confidence: high
  sources: [graphite-2026]

- id: corrective-rather-than
  name: '"rather than treating", "not simply whether"'
  domain: prose
  group: phrasing
  kind: structural
  severity: 2
  what: Corrective framing. Defines a view by the wrong view it replaces. GPT's form of contrastive negation.
  detect: {method: regex, pattern: '\brather than (?:treating|presenting|assuming|relying|focusing|merely|simply)\b|\binstead of (?:treating|assuming)\b|\bnot simply (?:whether|to|a|about)\b|\bwas not simply\b|\bthan relying (?:only|entirely|solely)\b|\bis a [\w-]+ rather than a\b'}
  measure: {graphite: [rather than treating, rather than presenting, rather than assume, rather than merely, than treating, than relying only, than assuming that, not simply whether, not simply to, was not simply, is a _ rather than a, rather than]}
  era: {first_seen: 2025, peak: unknown}
  status: rising
  substitutes: [contrastive-negation]
  fix: Say what to do. Skip the straw version.
  examples: {bad: "Rather than treating errors as failures, the team sees them as signals.", good: "The team logs each error and reviews the top five every Monday."}
  confidence: high
  sources: [graphite-2026]

- id: triads
  name: Rule of three
  domain: prose
  group: structure
  kind: structural
  severity: 1
  what: Lists of three by reflex, whether single words, phrases or parallel clauses, often with rising rhythm.
  detect:
    method: stat
    fn: triads
    density: {count: 3, per: 300}
    judge: Are three-item lists used where one or two items would carry the point?
  era: {first_seen: 2023, peak: 2025}
  status: peaking
  substitutes: ['pairs', 'four-item lists']
  fix: Keep the strongest item. Use three only when there are three things.
  examples: {bad: "It records each tell, measures which models over-use it, and checks your work against the list.", good: "It measures which models over-use each tell."}
  confidence: medium
  sources: [wikipedia-signs, slop-guard, avoid-ai-writing]

- id: em-dash-density
  name: Em dash overuse
  domain: prose
  group: punctuation
  kind: lexical
  severity: 1
  what: Em dashes as the all-purpose joint. A real tell in 2025 that most newer models have dropped.
  detect: {method: stat, fn: emdash, density: {count: 1, per: 150}}
  measure: {graphite_feature: layer1__punct_emdash_per1k}
  era: {first_seen: 2024, peak: 2025}
  status: fading
  substitutes: [colon-reveal, '"semicolon chains"', '"parenthetical asides"']
  fix: Use a period or comma. Keep a dash when you truly break off a thought.
  false_positives: >-
    People use plenty of em dashes too: 3.1 per 1,000 words in Graphite's human articles. GPT-4.1 and GPT-5 ran at
    about 2.2 times that. GPT-5.6 Sol, GPT-6 Astra, Claude Opus 4 and 4.6, and both Gemini models now use far fewer
    than people; Claude Opus 5 sits near the human rate. Flag heavy density only.
  confidence: medium
  sources: [graphite-2026, slop-guard]

- id: colon-reveal
  name: '"Here''s the thing:", "The kicker?"'
  domain: prose
  group: punctuation
  kind: structural
  severity: 2
  what: A staged pause before a punchline. Often fills in for banned em dashes.
  detect: {method: regex, pattern: '\bhere(?:''|’)?s the (?:thing|kicker|catch|twist|deal|truth)\b|\bthe (?:kicker|catch|result|answer|twist|truth)\?|\bthe best part\?|\bspoiler:'}
  era: {first_seen: 2024, peak: 2025}
  status: peaking
  fix: Just say it.
  examples: {bad: "Here's the kicker: it costs nothing.", good: "It costs nothing."}
  confidence: medium
  sources: [slop-guard]

- id: stops-being
  name: '"X stops being Y and starts being Z"'
  domain: prose
  group: phrasing
  kind: structural
  severity: 2
  what: Turning-point drama for an ordinary change.
  detect: {method: regex, pattern: '\bstops? being\b[^.\n]{1,60}\b(?:starts?|becomes?)\b|\bstops? being\b'}
  measure: {graphite: [stops being]}
  status: rising
  fix: Describe the change and when it happens.
  examples: {bad: "Testing stops being a chore and becomes a habit.", good: "After the change, most of us ran the tests before each push."}
  confidence: medium
  sources: [graphite-2026]

- id: pithy-closer
  name: One-line punchline paragraph
  domain: prose
  group: closers
  kind: structural
  severity: 1
  what: A short, quotable last line that restates the point ("And that changes everything.").
  detect:
    method: stat
    fn: pithy_closer
    judge: Does a section end on a short standalone sentence whose only job is to sound conclusive?
  era: {first_seen: 2024, peak: 2025}
  status: peaking
  fix: End on the last piece of information.
  confidence: medium
  sources: [slop-guard]

- id: formulaic-close
  name: '"In conclusion", summary recap'
  domain: prose
  group: closers
  kind: structural
  severity: 2
  what: A closing paragraph that repeats what was just said.
  detect: {method: regex, flags: "gim", pattern: '^(?:in conclusion|in summary|to sum up|to summarize|all in all|overall),|\bin conclusion\b'}
  measure: {graphite: [in conclusion, ultimately], graphite_feature: layer5__selfref_last_mirrors_first}
  era: {first_seen: 2022, peak: 2024}
  status: fading
  fix: Cut the recap.
  examples: {bad: "In conclusion, caching is a powerful tool that can greatly improve performance.", good: "Next week we try the same cache on search."}
  confidence: high
  sources: [graphite-2026, wikipedia-signs]

- id: uniform-rhythm
  name: Flat sentence rhythm
  domain: prose
  group: structure
  kind: structural
  severity: 0
  what: Sentence after sentence of the same length. Reported as advice only; it does not separate model text from human text.
  detect: {method: stat, fn: rhythm}
  measure: {graphite_feature: layer1__sent_len_std}
  status: steady
  fix: Mix lengths. Let a long sentence run when the thought needs it.
  false_positives: >-
    On 1,500 train topics, document-level variation (CV) had a human median of 0.51. GPT-5.6 Sol and GPT-6 Astra sit near 0.42,
    but Claude Opus 5 sits at 0.54, above people. Corporate human prose is often just as flat. Advisory only.
  confidence: low
  sources: [graphite-2026, slop-guard]

- id: contraction-avoidance
  name: No contractions
  domain: prose
  group: vocabulary
  kind: structural
  severity: 1
  what: '"It is", "do not", "you are" everywhere. Claude Opus 4.6, Gemini 3.1 and GPT-5.6 Sol nearly stopped contracting.'
  detect: {method: stat, fn: contractions}
  measure: {graphite_absent: ["it's", "don't", "isn't", "here's"]}
  era: {first_seen: 2026, peak: unknown}
  status: rising
  fix: Contract where you would in speech.
  false_positives: Formal registers (legal, academic) that avoid contractions on purpose.
  confidence: high
  sources: [graphite-2026]

- id: significance-inflation
  name: '"plays a pivotal role", "marks a turning point"'
  domain: prose
  group: phrasing
  kind: structural
  severity: 2
  what: Claims that something matters a great deal, with no evidence.
  detect: {method: regex, pattern: '\bplays? an? (?:pivotal|crucial|key|vital|massive|significant|central) role\b|\bmarks? a (?:turning point|new era|pivotal moment)\b|\bcannot be overstated\b|\bstands as an?\b|\bserves as a (?:testament|reminder|beacon)\b'}
  measure: {graphite: [a massive role, massive role in, stands as a, plays _ role]}
  era: {first_seen: 2023, peak: 2024}
  status: steady
  fix: Show the effect. Readers will judge the size.
  examples: {bad: "This release marks a pivotal moment and plays a crucial role in our journey.", good: "This release halves cold-start time."}
  confidence: high
  sources: [graphite-2026, wikipedia-signs]

- id: vague-authority
  name: '"Experts say", "Studies show"'
  domain: prose
  group: phrasing
  kind: structural
  severity: 2
  what: Appeals to unnamed authority.
  detect: {method: regex, pattern: '\b(?:experts|researchers|studies|research|many people|critics) (?:say|show|suggest|agree|note|argue)s?\b'}
  status: steady
  fix: Cite the source or drop the claim.
  examples: {bad: "Experts say remote work boosts output.", good: "A 2024 Stanford study of 1,600 staff found no drop in output."}
  confidence: high
  sources: [wikipedia-signs, slop-guard]

# ═════════════ chat · behavioral ═════════════

- id: sycophantic-opener
  name: '"Great question!", "You''re absolutely right!"'
  domain: chat
  group: openers
  kind: behavioral
  severity: 3
  what: Praise or agreement before the answer.
  detect: {method: regex, flags: "gim", pattern: '^\s*(?:great|excellent|fantastic|good|what a great) (?:question|point|idea|catch)\b|^\s*you(?:''|’)?re (?:absolutely|totally|completely|so) right\b|^\s*(?:certainly|absolutely|of course)!'}
  measure: {graphite_feature: layer5__syco_opener_rate}
  era: {first_seen: 2023, peak: 2025}
  status: fading
  substitutes: ['"Good catch."', '"Fair point."']
  fix: Start with the answer.
  examples: {bad: "Great question! You're absolutely right to ask about this.", good: "Yes. Set the timeout to 30 seconds."}
  confidence: high
  sources: [wikipedia-signs]

- id: offer-closer
  name: '"Let me know if you''d like me to..."'
  domain: chat
  group: closers
  kind: behavioral
  severity: 1
  what: A menu of follow-ups tacked onto every reply.
  detect: {method: regex, pattern: '\blet me know if you(?:''|’)?d like\b|\bwould you like me to\b|\bi hope this helps\b|\bfeel free to (?:ask|reach out|let me know)\b|\bhappy to help\b'}
  status: steady
  fix: Offer a next step only when there is an obvious one.
  examples: {bad: "I hope this helps! Let me know if you'd like me to expand on any section.", good: "Run the migration before you deploy."}
  confidence: medium
  sources: [wikipedia-signs]

- id: header-bullet-everything
  name: Headers and bullets for a short answer
  domain: prose
  group: formatting
  kind: structural
  severity: 1
  what: Bold labels, nested bullets and section headers around a few sentences.
  detect: {method: stat, fn: bold_label_blocks}
  era: {first_seen: 2023, peak: 2024}
  status: steady
  fix: Write a paragraph when the content is a paragraph.
  confidence: medium
  sources: [slop-guard]

# ═════════════ code ═════════════

- id: narrating-comments
  name: Comments that restate the code
  domain: code
  group: comments
  kind: structural
  severity: 1
  what: '"# Increment counter" over i += 1. "# Step 1:" scaffolding left in.'
  detect:
    method: regex
    flags: "gim"
    pattern: '^\s*(?:#|//)\s*step \d+\s*[:.]|^\s*(?:#|//)\s*(?:initialize|increment|return|loop through|iterate over|call|define|create|import|set) (?:the )?\w+\s*$'
    judge: Does the comment say anything the next line doesn't?
  status: steady
  fix: Comment the why, or delete.
  confidence: low
  sources: [folk]

- id: defensive-swallow
  name: Blanket try/except and silent fallbacks
  domain: code
  group: errors
  kind: structural
  severity: 2
  what: Broad exception handlers that log and carry on, or fallbacks that hide bugs.
  detect: {method: regex, flags: "g", pattern: 'except(?: Exception)?(?: as \w+)?:\s*\n?\s*(?:pass|return None|continue)\b|catch\s*\(\s*\w*\s*\)\s*\{\s*\}|catch\s*\{\s*\}'}
  status: steady
  fix: Let it raise, or catch the specific error you can handle.
  confidence: low
  sources: [folk]

- id: emoji-logs
  name: Emoji in logs, CLI output and README headers
  domain: code
  group: output
  kind: visual
  severity: 1
  what: 'Lines like "✅ Done!" or "🚀 Getting Started".'
  detect: {method: regex, flags: "gu", pattern: '[\u{1F300}-\u{1FAFF}✅✨❌⚠⭐]'}
  status: steady
  fix: Plain text. Use exit codes and log levels.
  confidence: medium
  sources: [folk]

- id: speculative-abstraction
  name: Scaffolding for needs that don't exist
  domain: code
  group: structure
  kind: structural
  severity: 1
  what: Factories, config flags, back-compat shims and interfaces with one caller.
  detect: {method: judge, judge: "Does this layer have more than one real caller or variant?"}
  status: steady
  fix: Inline it until a second case shows up.
  confidence: low
  sources: [folk]

# ═════════════ ui ═════════════

- id: purple-gradient
  name: Purple-to-blue gradient, indigo accent
  domain: ui
  group: color
  kind: visual
  severity: 3
  what: Two-stop indigo or violet to blue or pink hero gradients. Tailwind indigo-500/600 as the brand color.
  detect: {method: regex, pattern: '\b(?:from|via|to|bg|text)-(?:indigo|violet|purple|fuchsia)-[4-7]00\b|linear-gradient\([^)]*(?:#6366f1|#8b5cf6|#7c3aed|#4f46e5|#a855f7|#9333ea)'}
  era: {first_seen: 2023, peak: 2025}
  status: fading
  substitutes: [tasteful-default]
  fix: Derive the palette from the subject or brand.
  confidence: high
  sources: [avoid-ai-design, devdigest-design, no-slop-ui]

- id: tasteful-default
  name: Cream and terracotta, or mono everything
  domain: ui
  group: color
  kind: visual
  severity: 2
  what: The "tasteful" fallback once purple is banned. Warm off-white, rust accent, serif headline, or all-monospace.
  detect: {method: regex, pattern: '#(?:f5f0e8|faf7f2|fdf6ec|f7f3ee|fbf8f3)\b|#(?:c2410c|b45309|d97757|c96442|cc785c)\b|font-family:\s*["'']?(?:JetBrains Mono|IBM Plex Mono|ui-monospace)'}
  era: {first_seen: 2025, peak: unknown}
  status: rising
  fix: Same as purple. Derive from the subject.
  confidence: medium
  sources: [avoid-ai-design]

- id: inter-everywhere
  name: Inter for everything
  domain: ui
  group: typography
  kind: visual
  severity: 2
  what: One sans at every size, no type contrast.
  detect: {method: regex, pattern: 'font-family:\s*["'']?Inter\b|fonts\.googleapis\.com/css2?\?family=Inter\b'}
  status: steady
  fix: Pair a display face with a text face, or commit to one with real weight contrast.
  confidence: high
  sources: [devdigest-design, no-slop-ui]

- id: hero-pill-badge
  name: Centered hero with pill badge
  domain: ui
  group: layout
  kind: visual
  severity: 2
  what: '"✨ Now with AI" pill above a centered H1, subhead, two buttons.'
  detect: {method: judge, judge: "Is the hero a centered pill, headline, subhead and two buttons?"}
  era: {first_seen: 2023, peak: 2025}
  status: peaking
  fix: Lead with the product itself (a screenshot, a demo, a real sentence).
  confidence: high
  sources: [devdigest-design]

- id: three-feature-cards
  name: Three identical feature cards
  domain: ui
  group: layout
  kind: visual
  severity: 2
  what: A row of three cards, icon on top, title, two lines of copy.
  detect: {method: judge, judge: "Is there a 3-column grid of same-shaped icon, title and blurb cards?"}
  status: peaking
  substitutes: ['"bento grid"', '"four cards"']
  fix: Show fewer features with more depth, or vary the layout per feature.
  confidence: high
  sources: [devdigest-design, no-slop-ui]

- id: glassmorphism
  name: Glass cards, glow blobs, sparkles
  domain: ui
  group: components
  kind: visual
  severity: 2
  what: Blurred cards over blurred color blobs. ✨ as the AI icon.
  detect: {method: regex, pattern: 'backdrop-filter:\s*blur|\bbackdrop-blur(?:-\w+)?\b|\bblur-3xl\b'}
  status: steady
  fix: Flat surfaces. Spend contrast on content.
  confidence: medium
  sources: [no-slop-ui]

- id: title-case-headings
  name: Title Case Every Heading
  domain: prose
  group: formatting
  kind: lexical
  severity: 1
  what: Headings in Title Case where sentence case fits.
  detect: {method: regex, flags: "gm", pattern: '^#{1,4} (?:[A-Z][a-z]+ ){3,}[A-Z][a-z]+\s*$'}
  status: steady
  fix: Sentence case.
  examples: {bad: "## How To Set Up Your Development Environment", good: "## How to set up your machine"}
  false_positives: House styles that require title case.
  confidence: low
  sources: [folk]

- id: dot-separator-meta
  name: Middot-separated meta rows
  domain: ui
  group: typography
  kind: visual
  severity: 1
  what: '"5 min read · Design · 2026" strips under every title and card.'
  detect: {method: regex, flags: "g", pattern: '[^\s·]+ · [^\s·]+ · [^\s·]+'}
  status: rising
  fix: Show only the meta a reader uses.
  confidence: low
  sources: [folk]

- id: gradient-text
  name: Gradient-filled headline text
  domain: ui
  group: typography
  kind: visual
  severity: 2
  what: Headline words painted with a gradient via background-clip.
  detect: {method: regex, pattern: '(?:-webkit-)?background-clip:\s*text|\bbg-clip-text\b'}
  status: steady
  fix: Solid text. Use weight or size for emphasis.
  confidence: medium
  sources: [devdigest-design, no-slop-ui]

- id: emoji-bullets
  name: Emoji as bullets and section icons
  domain: prose
  group: formatting
  kind: visual
  severity: 1
  what: Lists and headings led by 🚀, ✅, 💡, 🔥.
  detect: {method: regex, flags: "gmu", pattern: '^\s*(?:[-*]\s+|#{1,4}\s+)?[\u{1F300}-\u{1FAFF}✅✨⚡]'}
  status: steady
  fix: Drop them.
  examples: {bad: "🚀 Fast builds\n✅ Easy setup\n💡 Smart hints", good: "- Builds in 4 seconds\n- One command to install"}
  confidence: medium
  sources: [wikipedia-signs]
