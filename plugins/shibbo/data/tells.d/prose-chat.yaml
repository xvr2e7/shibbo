- id: honest-label
  name: '"One honest caveat", "the honest answer"'
  domain: chat
  group: vocabulary
  kind: lexical
  severity: 2
  what: Tags one remark as honest, which implies the rest was not. Claude Opus 5 writes "the honest" 56 times as often as people.
  detect: {method: regex, pattern: '\b(?:one|an|the|my|some) honest (?:note|caveat|answer|take|assessment|read|truth|version|reason|question|limitation)\b'}
  measure: {graphite: [the honest]}
  era: {first_seen: 2026, peak: 2026}
  models: [claude]
  status: rising
  fix: Drop "honest" and give the caveat.
  examples: {bad: "One honest caveat: I haven't tested this on Windows.", good: "I haven't tested this on Windows."}
  confidence: high
  sources: [graphite-2026, gh-cc-74414, promptplay-slop-bible]

