# Prose and chat tells, 2025-2026 additions. Same schema as data/tells.yaml plus `group`.
# Patterns are JavaScript regex source. Default flags: "i" (the checker adds "g").
# measure.graphite terms are exact n-grams or frames from data/raw/graphite/tells_vs_human.csv.gz.

# ═════════════ vocabulary ═════════════

- id: quietly
  name: '"quietly", "a quiet"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 2
  what: An adverb that hints at hidden power. Claude Opus 5 uses "quietly" 33 times as often as people, and Wikipedia lists it as a GPT-6 word.
  detect: {method: regex, pattern: '\bquiet(?:ly)?\b', density: {count: 2, per: 500}}
  measure: {graphite: [quietly, a quiet]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude, gpt]
  status: rising
  fix: Cut it, or say what happened out of sight and who missed it.
  examples: {bad: "The cache quietly became the most important part of the stack.", good: "The cache now serves 80% of reads."}
  false_positives: Literal quiet (noise, sound, calm scenes).
  confidence: high
  sources: [graphite-2026, wikipedia-signs, tropes-fyi, avoid-ai-writing]

- id: load-bearing
  name: '"load-bearing" as a metaphor'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 2
  what: Building jargon for any idea that matters. A Claude Code user on Opus 4.7 saw it "every 10 paragraphs", in chat, docs and commits.
  detect: {method: regex, pattern: '\bload-bearing\b(?!\s+(?:walls?|beams?|columns?|capacity|pillars?|posts?|joists?|studs?|masonry|members?|partitions?)\b)'}
  era: {first_seen: 2026, peak: 2026}
  models: [claude]
  status: peaking
  fix: Say what breaks if you take the thing away.
  examples: {bad: "That assumption is load-bearing.", good: "If that assumption fails, the cache serves stale prices."}
  false_positives: Real walls and beams.
  confidence: high
  sources: [gh-cc-53454, explainx-claudisms-2026, avoid-ai-writing, promptplay-slop-bible]

- id: dependable-clearer
  name: '"dependable", "clearer", "manageable"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Plain-sounding words GPT-5.6 and GPT-6 lean on. "dependable" runs about 60 times the human rate.
  detect: {method: regex, pattern: '\b(?:dependab(?:le|ly|ility)|clearer|manageable|recognizable|coordinated)\b', density: {count: 2, per: 400}}
  measure: {graphite: [dependable, clearer, a clearer, manageable, recognizable, coordinated]}
  era: {first_seen: 2025, peak: 2026}
  models: [gpt]
  status: rising
  fix: Name the property, such as uptime, error rate or steps saved.
  examples: {bad: "a more dependable, manageable process", good: "a process that fails once a month instead of once a week"}
  confidence: high
  sources: [graphite-2026, wikipedia-signs]

- id: practical-useful-broader
  name: '"a practical", "a useful", "a broader"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: GPT-6 frames each point as practical, useful or broad. "a practical" runs 64 times the human rate in GPT-6 Astra.
  detect: {method: regex, pattern: '\b(?:a|the|more) (?:practical|useful|broader)\b', density: {count: 3, per: 500}}
  measure: {graphite: [a practical, a useful, a broader, the broader, more useful, the practical]}
  era: {first_seen: 2025, peak: 2026}
  models: [gpt, claude]
  status: rising
  fix: Say what the reader can do with it.
  examples: {bad: "This gives teams a practical, useful starting point and a broader view.", good: "This gives teams a checklist for their first deploy."}
  confidence: high
  sources: [graphite-2026]

- id: is-straightforward
  name: '"is straightforward"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 2
  what: Calls a task simple and skips the steps. Claude Opus 5 writes "is straightforward" 136 times as often as people; GPT-6 Astra 102 times.
  detect: {method: regex, pattern: '\b(?:is|are|was|were|it[''’]s|seems?|looks?|feels?) (?:fairly |pretty |relatively |quite |reasonably )?straightforward\b'}
  measure: {graphite: [is straightforward, a straightforward]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude, gpt]
  status: rising
  fix: Show the steps and let readers judge the effort.
  examples: {bad: "The setup is straightforward.", good: "Setup takes two commands: npm i, then npm start."}
  confidence: high
  sources: [graphite-2026]

- id: degree-adverbs
  name: '"enormously", "meaningfully", "noticeably", "remarkably"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Adverbs that size a change with no number. Claude Opus 5 uses "enormously" 87 times as often as people.
  detect: {method: regex, pattern: '\b(?:enormously|meaningfully|noticeably|considerably|precisely|remarkably)\b', density: {count: 2, per: 400}}
  measure: {graphite: [enormously, meaningfully, noticeably, considerably, precisely, is precisely, remarkably]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude, gemini]
  status: rising
  fix: Give the number, or drop the adverb.
  examples: {bad: "Load times improved noticeably and the API is meaningfully faster.", good: "Load time fell from 3 s to 1 s."}
  confidence: high
  sources: [graphite-2026, avoid-ai-writing]

- id: deliberate-intentional
  name: '"deliberate", "deliberately", "intentional"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Credits a choice with intent and names no chooser. Claude Opus 5 uses "deliberately" 30 times as often as people.
  detect: {method: regex, pattern: '\b(?:deliberate(?:ly)?|intentional(?:ly)?)\b', density: {count: 2, per: 500}}
  measure: {graphite: [deliberately, deliberate, intentional]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude]
  status: rising
  fix: Say who chose it and why.
  examples: {bad: "The layout is deliberate and intentional.", good: "We put search first because 70% of visits start there."}
  confidence: high
  sources: [graphite-2026]

- id: modest-measurable
  name: '"a modest", "small but real"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Hedged size words that promise a result and give no figure. Claude Opus 5 uses "modest" 20 times as often as people.
  detect: {method: regex, pattern: '\bmodest(?:ly)?\b|\bmeasurabl[ey]\b|\b(?:small|modest) but (?:real|measurable|meaningful)\b', density: {count: 2, per: 500}}
  measure: {graphite: [modest, a modest, measurable]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude, gpt]
  status: rising
  fix: State the size.
  examples: {bad: "a modest but measurable gain", good: "a 3% gain"}
  confidence: high
  sources: [graphite-2026]

- id: gemini-intensifiers
  name: '"highly", "deeply", "heavily", "fundamentally"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Gemini 3.1 Pro's stock of intensifiers. "a deeply" runs 42 times the human rate and "fundamentally" 28 times.
  detect: {method: regex, pattern: '\b(?:highly|deeply|heavily|fundamentally|immense(?:ly)?)\b', density: {count: 3, per: 500}}
  measure: {graphite: [highly, a highly, deeply, a deeply, heavily on, fundamentally, immense]}
  era: {first_seen: 2025, peak: 2026}
  models: [gemini]
  status: rising
  fix: Cut the adverb, or replace it with the measure it implies.
  examples: {bad: "a highly effective, deeply integrated tool that relies heavily on caching", good: "a tool that answers 90% of requests from cache"}
  confidence: high
  sources: [graphite-2026, tropes-fyi]

- id: ensures-that
  name: '"ensures that", "ensuring"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Claims a guarantee the text never backs, often as a trailing clause. Gemini 3.1 writes "ensures that" 22 times as often as people.
  detect: {method: regex, pattern: '\bensur(?:es|ing) that\b|,\s+ensuring\b', density: {count: 2, per: 500}}
  measure: {graphite: [ensures that, ensures that the, ensuring]}
  era: {first_seen: 2025, peak: 2025}
  models: [gemini, gpt, claude]
  status: steady
  fix: Say how it is enforced, or say "helps".
  examples: {bad: "Tests run on each commit, ensuring that quality stays high.", good: "Tests run on each commit and block the merge if any fail."}
  confidence: high
  sources: [graphite-2026, wikipedia-signs]

- id: copula-avoidance
  name: '"serves as", "acts as", "boasts"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 2
  what: Swaps "is" or "has" for a grander verb. Wikipedia cites a drop of over 10% in "is" and "are" in academic prose in 2023.
  detect: {method: regex, pattern: '\b(?:serv(?:es|ed|ing)|act(?:s|ed|ing)|function(?:s|ed|ing)|operat(?:es|ed|ing)) as (?:a|an|the)\b|\bboasts? (?:a|an|the)\b|\bholds the distinction of\b', density: {count: 2, per: 400}}
  measure: {graphite: [acts as, acts as a]}
  era: {first_seen: 2023, peak: 2025}
  models: [gpt, gemini]
  status: steady
  fix: Use "is" or "has".
  examples: {bad: "The gallery serves as an exhibition space for LAAA and boasts four rooms.", good: "The gallery is LAAA's exhibition space. It has four rooms."}
  false_positives: Real roles ("she served as chair").
  confidence: high
  sources: [wikipedia-signs, avoid-ai-writing, tropes-fyi, graphite-2026]

- id: gemini-hype
  name: '"the secret to", "top tier", "the sheer"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Hype phrases Gemini overuses. Gemini 3.1 writes "the secret to" 22 times and "highly anticipated" 34 times as often as people.
  detect: {method: regex, pattern: '\bthe secret to\b|\btop[- ]tier\b|\bthe sheer\b|\bthe absolute (?:best|key|most|bare)\b|\ba fascinating\b|\bhighly anticipated\b'}
  measure: {graphite: [the secret to, top tier, the sheer, the absolute, a fascinating]}
  era: {first_seen: 2025, peak: 2026}
  models: [gemini]
  status: steady
  fix: Drop the hype and give the fact.
  examples: {bad: "The secret to great bread is the sheer power of time.", good: "Let the dough rise for 12 hours."}
  confidence: high
  sources: [graphite-2026]

- id: proving-that
  name: '"proving that", "proves that"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Treats one case as proof of a rule. Gemini 3.1 writes "proving that" 39 times as often as people.
  detect: {method: regex, pattern: '\bprov(?:ing|es) that\b'}
  measure: {graphite: [proving that, proves that]}
  era: {first_seen: 2025, peak: 2026}
  models: [gemini, claude]
  status: steady
  fix: Say "suggests", or show the evidence that would prove it.
  examples: {bad: "The team won the cup, proving that grit beats talent.", good: "The team won the cup with the league's lowest payroll."}
  confidence: high
  sources: [graphite-2026]

- id: standout
  name: '"standout", "the standout"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Review-speak for "best". Claude Opus 4.6 writes "the standout" 88 times as often as people.
  detect: {method: regex, pattern: '\bstand-?outs?\b(?!\s+(?:from|against|among|in)\b)'}
  measure: {graphite: [standout, the standout]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude, gemini, gpt]
  status: steady
  fix: Say what makes it better than the rest.
  examples: {bad: "The standout feature is search.", good: "Search finds a file in under 50 ms."}
  confidence: high
  sources: [graphite-2026]

- id: a-willingness-to
  name: '"a willingness to"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: A trait noun in place of a deed. It runs 7 to 38 times the human rate in all three families.
  detect: {method: regex, pattern: '\ba (?:genuine |real )?willingness to\b'}
  measure: {graphite: [a willingness to, and a willingness]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude, gpt, gemini]
