- id: fake-casual
  name: '"*chef''s kiss*", "(yes, really)", "hot take:"'
  domain: prose
  group: tone
  kind: lexical
  severity: 1
  what: 'Props from a canned casual voice: stage directions, winks and label openers.'
  detect: {method: regex, flags: "gim", pattern: '\*(?:chef[''’]s kiss|checks notes|mic drop|sips (?:coffee|tea))\*|\((?:yes|no),? (?:really|seriously)\)|(?:^|[.!?]\s+)(?:hot take|unpopular opinion|plot twist)\s*:|\bbecause of course it does\b|\bhits different\b|\bchef[''’]s kiss\b'}
  era: {first_seen: 2024, peak: 2026}
  models: [gpt, claude]
  status: rising
  fix: Cut the prop and keep the observation.
  examples: {bad: "The new API? *chef's kiss*", good: "The new API needs one call where the old one needed four."}
  confidence: medium
  sources: [avoid-ai-writing, promptplay-slop-bible]

# ═════════════ fiction ═════════════

- id: stock-character-names
  name: 'Stock names and settings: Elara, Kael, Elias the lighthouse keeper'
  domain: prose
  group: fiction
  kind: lexical
  severity: 2
  what: The names, jobs and places models reach for. Elias, Mara, Elara, lighthouse and clockmaker are among 11 words found in 88% of 20,000 sampled stories.
  detect: {method: regex, flags: "g", pattern: '\b(?:Elara|Elyra|Aelara|Kael(?:en|an|in)?|Lyra|Seraphina|Zephyr|Aldric|Alaric)\b|\b(?:Elias|Elara|Kael|Lyra|Silas|Mara) (?:Thorne|Voss|Vance)\b|\b(?:[Ll]ighthouse keeper|[Cc]lockmaker|keeper of the lighthouse)\b'}
  era: {first_seen: 2023, peak: 2026}
  models: [gpt, claude, gemini]
  status: steady
  fix: Pick names that fit the setting, era and family.
  examples: {bad: "Elara Voss stepped into the lighthouse.", good: "Dot Halloran stepped into the bait shop."}
