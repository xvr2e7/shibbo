# ═════════════ phrasing ═════════════

- id: the-goal-is
  name: '"The goal is (not)"'
  domain: prose
  group: phrasing
  kind: lexical
  severity: 1
  what: A setup line that states the aim before the point. "goal is not" runs 230 to 320 times the human rate in GPT-5.6 and GPT-6.
  detect: {method: regex, pattern: '\bthe goal (?:here )?is(?: not)?\b'}
  measure: {graphite: [the goal is, goal is not]}
  era: {first_seen: 2025, peak: 2026}
  models: [gpt, claude, gemini]
  status: rising
  fix: Skip the setup and say what the thing does.
  examples: {bad: "The goal is not perfection. The goal is progress.", good: "Ship weekly, even with known bugs."}
  confidence: high
  sources: [graphite-2026]

- id: the-result-is
  name: '"The result is a"'
  domain: prose
  group: phrasing
  kind: lexical
  severity: 1
  what: A drumroll before the outcome. 6 to 30 times the human rate across GPT and Claude.
  detect: {method: regex, pattern: '\bthe (?:end )?result is(?: an?| that)?\b'}
  measure: {graphite: [the result is, result is a, the result is a _ that]}
  era: {first_seen: 2025, peak: 2026}
  models: [gpt, claude]
  status: rising
  fix: Join the outcome to its cause in one sentence.
  examples: {bad: "We cached the query. The result is a page that loads fast.", good: "Caching the query cut load time to 200 ms."}
  confidence: high
  sources: [graphite-2026]

- id: helps-explain-why
  name: '"helps explain why"'
  domain: prose
  group: phrasing
  kind: lexical
  severity: 2
  what: Hedged causation that never commits. GPT-6 Astra writes "helps explain why" 370 times as often as people.
  detect: {method: regex, pattern: '\bhelps? (?:to )?explain why\b'}
  measure: {graphite: [helps explain why, helps explain]}
  era: {first_seen: 2026, peak: 2026}
  models: [gpt]
  status: rising
  fix: Say "explains", or state how much it explains.
  examples: {bad: "Cost helps explain why few teams adopt it.", good: "At $40 a seat, most teams pass."}
  confidence: high
  sources: [graphite-2026]

- id: useful-when
  name: '"is most useful when", "especially valuable", "becomes more X when"'
  domain: prose
  group: phrasing
