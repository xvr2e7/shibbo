- id: far-beyond
  name: '"far beyond", "well beyond", "far more than"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Scope inflation with no edge. Up to 34 times the human rate in Claude and Gemini.
  detect: {method: regex, pattern: '\b(?:far|well) beyond\b|\bfar more than\b'}
  measure: {graphite: [far beyond, well beyond, far more than]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude, gemini]
