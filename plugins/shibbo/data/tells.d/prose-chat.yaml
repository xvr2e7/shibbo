  severity: 1
  what: Stresses how a database or profile describes the subject. Wikipedia calls this common from 2026.
  detect: {method: regex, pattern: '\b(?:website|profile|records?|database|listing|filings?|registry|directory|bio(?:graphy)?) (?:identif(?:y|ies)|lists?|describes?) (?:him|her|them|it) as\b'}
  era: {first_seen: 2026, peak: 2026}
  status: rising
  fix: State the fact and cite the source.
  examples: {bad: "His personal website identifies him as a retired officer.", good: "He is a retired officer."}
  confidence: medium
  sources: [wikipedia-signs]

- id: media-coverage-claims
  name: '"featured in ... and other media outlets"'
  domain: prose
  group: phrasing
  kind: lexical
  severity: 2
  what: Proves notability by listing outlets and source types. Wikipedia says this grew with 2025 models.
  detect: {method: regex, pattern: '\b(?:featured|profiled|covered|cited) in\b[^.\n]{0,80}\bother (?:prominent |major |leading )?(?:media )?(?:outlets|publications)\b|\bindependent coverage\b|\b(?:maintains|has) an? (?:active|strong) (?:social media|digital|online) presence\b'}
  era: {first_seen: 2025, peak: 2026}
  status: rising
  fix: Cite one source for one fact.
  examples: {bad: "She has been featured in Wired, Vogue and other prominent media outlets.", good: "Wired profiled her in 2024."}
  confidence: high
  sources: [wikipedia-signs]

- id: speculative-gap-filling
  name: '"is believed to have", "likely began his career"'
  domain: prose
  group: phrasing
  kind: lexical
  severity: 2
  what: Guesses dressed as background when a fact is missing.
  detect: {method: regex, pattern: '\b(?:is|was) believed to have\b|\blikely (?:began|started|studied|grew up|attended)\b|\bmaintains? a (?:relatively )?low (?:public )?profile\b|\bappears to have (?:studied|worked|begun)\b'}
  era: {first_seen: 2024, peak: 2025}
  status: steady
  fix: Cut the guess, or mark it as unknown.
  examples: {bad: "He likely began his career in Lagos.", good: "His early career is not on record."}
  confidence: medium
  sources: [avoid-ai-writing, wikipedia-signs]

- id: think-of-it-as
  name: '"Think of it as..."'
  domain: prose
  group: phrasing
  kind: lexical
  severity: 1
  what: A teacher-mode analogy that is often less clear than the thing itself.
  detect: {method: regex, pattern: '\bthink of (?:it|this|that|them) (?:as|like) (?:a|an|the)\b'}
  measure: {graphite: [think of it]}
  era: {first_seen: 2025, peak: 2025}
  models: [gemini, claude]
  status: steady
  fix: Explain the thing directly.
  examples: {bad: "Think of it as a Swiss Army knife for your data.", good: "It reads CSV, JSON and Parquet, and writes all three."}
  confidence: medium
  sources: [tropes-fyi, graphite-2026]

- id: imagine-a-world
  name: '"Imagine a world where..."'
  domain: prose
  group: openers
  kind: lexical
  severity: 2
  what: Opens with a wished-for scene instead of a claim.
  detect: {method: regex, pattern: '\bimagine a (?:world|future|day) (?:where|in which)\b|\bpicture a (?:world|future) (?:where|in which)\b|\benvision a (?:world|future)\b'}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: State the claim.
  examples: {bad: "Imagine a world where every deploy is instant.", good: "Deploys take 40 seconds."}
  false_positives: Fiction and teaching ("imagine you have a sorted array").
  confidence: medium
  sources: [tropes-fyi, avoid-ai-writing]

- id: parenthetical-hedge
  name: '"(and, increasingly, Z)"'
  domain: prose
  group: punctuation
  kind: lexical
  severity: 1
  what: Asides that add nuance without a claim.
  detect: {method: regex, pattern: '\((?:and|or),? (?:increasingly|perhaps more importantly|more importantly|more precisely|crucially|arguably)\b'}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  fix: Give the aside its own sentence, or cut it.
  examples: {bad: "Teams use it for logs (and, increasingly, metrics).", good: "Teams use it for logs. A third now send metrics too."}
  confidence: low
  sources: [avoid-ai-writing]

- id: n-key-takeaways
  name: '"Three key takeaways", "5 lessons I learned"'
  domain: prose
  group: structure
  kind: structural
  severity: 1
  what: A numbered frame chosen before the content.
  detect: {method: regex, pattern: '\b(?:three|four|five|seven|ten|\d{1,2}) (?:key |big |main |critical )?(?:takeaways|lessons(?: I learned)?|things (?:to know|I learned|you need to know))\b'}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Use a list only when there are that many separate points.
  examples: {bad: "Here are five key takeaways from the launch.", good: "The launch taught us one thing: test the payment flow."}
  confidence: medium
  sources: [avoid-ai-writing, vega-linkedin-500]

- id: filler-transitions
  name: '"That said,", "When it comes to", "At the end of the day"'
  domain: prose
  group: phrasing
  kind: lexical
  severity: 1
  what: Spoken-style links that carry no logic.
  detect: {method: regex, pattern: '\bthat (?:being )?said,|\bwhen it comes to\b|\bat the end of the day\b', density: {count: 2, per: 400}}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Use "but" or cut the link.
  examples: {bad: "That said, when it comes to cost, it wins.", good: "But it costs less."}
  confidence: low
  sources: [avoid-ai-writing]

- id: worth-a-look
  name: '"worth a look", "worth your time"'
  domain: prose
  group: phrasing
  kind: lexical
  severity: 1
  what: A thumbs-up with no reason. Claude Opus 5 writes "is worth" 8.5 times as often as people.
  detect: {method: regex, pattern: '\bworth (?:a (?:look|read|listen)|your time|reading|exploring|checking out|paying attention to)\b'}
  measure: {graphite: [is worth]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude]
  status: steady
  fix: Say what the reader will get.
  examples: {bad: "The paper is worth a read.", good: "The paper shows how they cut cost by 40%."}
  confidence: medium
  sources: [avoid-ai-writing, graphite-2026]

- id: doing-a-lot-of-work
  name: '"doing a lot of work", "carries the argument"'
  domain: prose
  group: phrasing
  kind: lexical
  severity: 1
  what: Claude's other structural metaphor for a part that matters.
  detect: {method: regex, pattern: '\b(?:is |are )?doing (?:a lot of|most of the|all the) (?:heavy lifting|quiet work|work)\b|\bcarr(?:y|ies) the (?:argument|weight)\b'}
  era: {first_seen: 2025, peak: 2026}
  models: [claude]
  status: rising
  substitutes: [load-bearing]
  fix: Say what that part does.
  examples: {bad: "The word 'usually' is doing a lot of work here.", good: "'Usually' hides a 20% failure rate."}
  confidence: low
  sources: [promptplay-slop-bible]

- id: moral-adjectives
  name: '"an honest number", "a faithful baseline"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Moral words glued to things that cannot be moral.
  detect: {method: regex, pattern: '\b(?:honest|faithful|truthful) (?:number|shape|curve|metric|estimate|signal|baseline|benchmark|measure|representation|output|chart|default)s?\b|\b(?:flagged|described|labeled|labelled|reported) honestly\b'}
  era: {first_seen: 2025, peak: 2026}
  status: rising
  fix: Name the real property ("unbiased", "measured on held-out data").
  examples: {bad: "That gives us an honest baseline.", good: "That baseline uses data the model never saw."}
  confidence: low
  sources: [avoid-ai-writing]

- id: dev-blog-boilerplate
  name: '"It just works", "zero config"'
  domain: prose
  group: phrasing
  kind: lexical
  severity: 1
  what: Developer slogans in place of a property you could show.
  detect: {method: regex, pattern: '\bit just works\b|\bzero[- ]config(?:uration)?\b|\bsane defaults\b|\bfits? in your head\b'}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  fix: Show the property ("installs with no config file").
  examples: {bad: "Zero config. It just works.", good: "Run npx tool init; it writes no files."}
  confidence: medium
  sources: [avoid-ai-writing, willison-cliche]

- id: crowd-contrast
  name: '"while everyone else was still debating"'
  domain: prose
  group: phrasing
  kind: structural
  severity: 1
  what: Props up a claim on an invented, lagging crowd.
  detect: {method: regex, pattern: '\bwhile (?:everyone|everybody|the rest of (?:us|the industry)|others|the industry|competitors) (?:else )?(?:was|were|is|are) still [\w-]+ing\b'}
  era: {first_seen: 2025, peak: 2026}
  status: rising
  fix: State what you did. Name a rival only if you can cite them.
  examples: {bad: "We shipped it in 2022, while everyone else was still debating.", good: "We shipped it in March 2022."}
  confidence: low
  sources: [avoid-ai-writing]

- id: rhetorical-transition
  name: '"So what does this mean for you?"'
  domain: prose
  group: phrasing
  kind: structural
  severity: 1
  what: A question that stalls before the next section.
  detect: {method: regex, pattern: '\b(?:so|but),? what does (?:this|that|it all) (?:mean|look like) (?:for|in)\b|\bso why should you care\?|\bwhy does this matter\?'}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Give the answer as the opening line.
  examples: {bad: "So what does this mean for developers?", good: "Developers must update by May 1."}
  confidence: low
  sources: [avoid-ai-writing]

# ═════════════ structure ═════════════

- id: not-about-split
  name: '"This isn''t about X. It''s about Y."'
  domain: prose
  group: structure
  kind: structural
  severity: 2
  what: The about-form of contrastive negation, often split across two sentences. "is not about" runs up to 40 times the human rate.
  detect: {method: regex, pattern: '\b(?:this|that|it)(?:[''’]s| is)(?: not|n[''’]t) (?:really |just |only )?about\b[^.!?\n]{1,80}[.!?;,—–]\s*(?:it|this|that)(?:[''’]s| is) (?:really )?about\b'}
  measure: {graphite: [is not about, it is about]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude, gemini, gpt]
  status: steady
  substitutes: [contrastive-negation]
  fix: Say what it is about.
  examples: {bad: "This isn't about speed. It's about trust.", good: "Users stay when the numbers match their bank."}
  confidence: high
  sources: [graphite-2026, vega-linkedin-500, avoid-ai-writing]

- id: not-because
  name: '"Not because X. Because Y."'
  domain: prose
  group: structure
  kind: structural
  severity: 2
  what: Contrastive negation applied to causes. Claude Opus 5 writes "not because" 5 times as often as people.
  detect: {method: regex, pattern: '\bnot because\b[^.!?\n]{2,80}[.!?;,—–]\s*(?:but |it[''’]s |it is )?because\b'}
  measure: {graphite: [not because]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude]
  status: rising
  substitutes: [contrastive-negation]
  fix: Give the real cause alone.
  examples: {bad: "It failed. Not because the code was bad. Because nobody used it.", good: "It failed because nobody used it."}
  confidence: medium
  sources: [graphite-2026, avoid-ai-writing]

- id: countdown-negation
  name: '"Not X. Not Y. Just Z."'
  domain: prose
  group: structure
  kind: structural
  severity: 2
  what: Negates two options in fragments before the reveal.
  detect: {method: regex, flags: "gm", pattern: '(?:^|[.!?]\s+)Not [^.!?\n]{1,40}[.!?]\s+Not [^.!?\n]{1,40}[.!?]'}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  substitutes: [contrastive-negation]
  fix: State what it is.
  examples: {bad: "Not a bug. Not a feature. A design flaw.", good: "The design caused the crash."}
  confidence: high
  sources: [tropes-fyi, wikipedia-signs]

- id: negation-chain
  name: '"No fluff, no filler, no jargon."'
  domain: prose
  group: structure
  kind: structural
  severity: 1
  what: Stacked "no" items that perform decisiveness. Claude Opus 5 writes "no _ and no" 10 times as often as people.
  detect: {method: regex, pattern: '\bno [\w-]+(?: [\w-]+)?, no [\w-]+(?: [\w-]+)?(?:,? (?:and )?no [\w-]+)?\b|\bno [\w-]+ and no [\w-]+\b'}
  measure: {graphite: [no _ and no]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude]
  status: steady
  fix: Say what the thing is.
  examples: {bad: "No setup, no config, no headaches.", good: "It runs from one binary."}
  false_positives: Literal inventories ("no arguments, no headers").
  confidence: medium
  sources: [willison-cliche, avoid-ai-writing, wikipedia-signs, graphite-2026]

- id: staccato-fragments
  name: 'Runs of punchy fragments ("Openly. In a book.")'
  domain: prose
  group: structure
  kind: structural
  severity: 0
  advisory: On Graphite's held-out articles (2026-11-07) it fired on people about as often as on models, or more (lift 0.23), so it reports but never scores.
  what: Three or more clipped fragments in a row, each posing as a reveal.
  detect:
    method: regex
    flags: "gm"
    pattern: '(?<=^|[.!?]\s)(?:(?!(?:Mr|Mrs|Ms|Dr|St|Jr|Sr)\.)[A-Z][\w''’-]*(?: [\w''’-]+){0,2}(?<!\b(?:Mr|Mrs|Ms|Dr|St|Jr|Sr))[.!?]\s+){3,}'
    judge: Do three or more short fragments in a row stand in for one plain sentence?
  era: {first_seen: 2024, peak: 2026}
  models: [claude]
  status: peaking
  fix: Fold the fragments into one sentence.
  examples: {bad: "He published it. Openly. In a book. As a priest.", good: "He published it openly, in a book, while serving as a priest."}
  false_positives: Dialogue and terse fiction.
  confidence: medium
  sources: [tropes-fyi, avoid-ai-writing, explainx-claudisms-2026]

- id: same-opener-run
  name: Three sentences with the same opener
  domain: prose
  group: structure
  kind: structural
  severity: 0
  advisory: 'People use it more than models. avoid-ai-writing''s own HAP-E counts give GPT-4o and GPT-4o-mini 17.3 to 21.3 hits per million words against 151.5 for the matched human text (Llama 3 Instruct 187 to 250), and on Graphite''s held-out articles it fired on people about as often as on models (lift 1.07). It reports but never scores.'
  what: Anaphora by reflex ("Maybe X. Maybe Y. Maybe Z.").
  detect: {method: regex, pattern: '(?:^|[.!?]\s+)(?!(?:he|she|i|we|they|it|the|this|you|a|an)\b)([a-z]+)\b[^.!?\n]{3,120}[.!?]\s+\1\b[^.!?\n]{3,120}[.!?]\s+\1\b'}
  status: retired
  fix: Keep one and merge the rest.
  examples: {bad: "Maybe nobody needed it. Maybe it was early. Maybe the price was wrong.", good: "It was early and overpriced."}
  false_positives: Speeches and deliberate rhetoric.
  confidence: low
  sources: [willison-cliche, tropes-fyi, avoid-ai-writing]

- id: stranded-auxiliary
  name: '"The tool died; the data didn''t."'
  domain: prose
  group: structure
  kind: structural
  severity: 0
  advisory: 'People use it more than the models measured so far. avoid-ai-writing''s HAP-E counts give GPT-4o, GPT-4o-mini and Llama 3 Instruct 0.3 to 1.1 hits per million words against 9.1 for the matched human text. Newer models are unmeasured, so it reports but never scores.'
  what: A clipped reversal that lands on a bare auxiliary, used as a rhythm.
  detect:
    method: regex
    pattern: '[.;]\s+(?:the |its |their |our )?[\w-]+(?: [\w-]+)? (?:didn[''’]t|doesn[''’]t|wasn[''’]t|isn[''’]t|won[''’]t|can[''’]t|hasn[''’]t|haven[''’]t|weren[''’]t|aren[''’]t)\.'
    density: {count: 2, per: 500}
    judge: Does the text land more than one contrast on a bare "didn't" or "wasn't"?
  status: steady
  fix: Write the next contrast out in full.
  examples: {bad: "Reading passed. Writing didn't.", good: "Reads passed; writes failed on files over 2 GB."}
  confidence: low
  sources: [willison-cliche, avoid-ai-writing]

- id: false-range
  name: '"From X to Y" with no scale between'
  domain: prose
  group: structure
  kind: structural
  severity: 0
  advisory: On Graphite's held-out articles (2026-11-07) it fired on people about as often as on models, or more (lift 0.85), so it reports but never scores.
  what: Pairs far-apart things to fake breadth.
  detect:
    method: regex
    pattern: '\bfrom (?:the )?[\w-]+(?: [\w-]+){0,3} to (?:the )?[\w-]+(?: [\w-]+){0,3},? (?:and )?(?:from|to) (?:the )?[\w-]+'
    judge: Does a "from X to Y" phrase join things with no real scale between them?
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: List the real items, or pick the one that matters.
  examples: {bad: "From the Big Bang to dark matter to everyday life, physics shapes us.", good: "This book covers orbital mechanics."}
  false_positives: Real ranges (dates, prices, routes).
  confidence: medium
  sources: [tropes-fyi, avoid-ai-writing]

- id: listicle-trench-coat
  name: '"The first is... The second is..."'
  domain: prose
  group: structure
  kind: structural
  severity: 1
  what: A list dressed as paragraphs. Claude Opus 5 writes "the first is" 12 times and "three things" 7 times as often as people.
  detect: {method: regex, pattern: '\bthe (?:first|second|third|fourth) (?:is|one is|reason is|lesson is|takeaway is|problem is)\b', density: {count: 2, per: 400}}
  measure: {graphite: [the first is, the second is, three things, two things]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude]
  status: rising
  substitutes: [header-bullet-everything]
  fix: Use a real list, or write a paragraph that links the points.
  examples: {bad: "Two things stand out. The first is cost. The second is speed.", good: "It costs less and runs faster."}
  confidence: high
  sources: [graphite-2026, tropes-fyi]

- id: one-line-paragraphs
  name: One sentence per paragraph ("broetry")
  domain: prose
  group: formatting
  kind: visual
  severity: 2
  what: Each sentence on its own line with a blank line after it. An informal count found it in 91% of 500 AI LinkedIn posts.
  detect:
    method: regex
    flags: "gm"
    pattern: '(?:^[^\n]{1,140}[.!?:]\n\n){3,}^[^\n]{1,140}[.!?:]$'
    judge: Is nearly every paragraph a single short sentence?
  era: {first_seen: 2023, peak: 2026}
  status: peaking
  fix: Group related sentences into paragraphs.
  examples: {bad: "I got fired.\n\nIt hurt.\n\nBut it taught me something.\n\nHere's what.", good: "I got fired in May. It hurt, and it taught me to save six months of rent."}
  false_positives: Poetry, scripts, chat logs, novels with short dialogue lines.
  confidence: medium
  sources: [vega-linkedin-500, tropes-fyi]

- id: elegant-variation
  name: Synonym cycling for one thing
  domain: prose
  group: structure
  kind: structural
  severity: 1
  what: Calls one thing by three names to avoid repeats, a trace of repetition penalties in older models.
  detect: {method: judge, judge: "Does the text rotate several names for the same referent where one term would be clearer?"}
  era: {first_seen: 2023, peak: 2024}
  status: fading
  fix: Pick one term and repeat it.
  examples: {bad: "The developers... these engineers... such practitioners...", good: "The developers... the developers..."}
  confidence: medium
  sources: [wikipedia-signs, avoid-ai-writing]

- id: fractal-summary
  name: Every section summarizes itself
  domain: prose
  group: structure
  kind: structural
  severity: 1
  what: Previews and recaps at each level, from paragraph up to document.
  detect: {method: judge, judge: "Do most sections open with a preview or close with a recap of themselves?"}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  substitutes: [formulaic-close]
  fix: Cut the previews and recaps. Keep one summary at the top if any.
  examples: {bad: "In this section we'll cover X... As we've seen in this section, X.", good: "X works like this."}
  confidence: low
  sources: [tropes-fyi]

# ═════════════ disclaimers ═════════════

- id: treated-as-rather-than
  name: '"should be treated as X rather than Y"'
  domain: prose
  group: disclaimers
  kind: lexical
  severity: 2
  what: A mid-2026 framing that warns how to read a source. Wikipedia ties it to the July 2026 GPT-5.6 release; GPT-5.6 writes "treated as" 28 times as often as people.
  detect: {method: regex, pattern: '\bshould be (?:treated|read|understood|presented|viewed|regarded) as\b[^.!?\n]{1,80}\brather than\b'}
  measure: {graphite: [treated as]}
  era: {first_seen: 2026, peak: 2026}
  models: [gpt]
  status: rising
  substitutes: [corrective-rather-than]
  fix: Report what the source says and who says it.
  examples: {bad: "Claims of the suspension should be treated as tradition rather than archaeology.", good: "Local tradition holds that the stone floats; no survey has tested it."}
  confidence: high
  sources: [wikipedia-signs, graphite-2026]

- id: does-not-establish
  name: '"does not by itself establish"'
  domain: prose
  group: disclaimers
  kind: lexical
  severity: 2
  what: Warns that a source fails to prove a claim no one made. Wikipedia dates it to mid-2026.
  detect: {method: regex, pattern: '\bdoes(?: not|n[''’]t)(?: by itself| on its own| alone)? (?:establish|prove|confirm|demonstrate)\b'}
  era: {first_seen: 2026, peak: 2026}
  models: [gpt]
  status: rising
  substitutes: [soft-hedging]
  fix: Say what the source shows, and stop.
  examples: {bad: "The guide explains soil risks. It does not establish that the park has a problem.", good: "The guide explains soil risks in city parks."}
  confidence: medium
  sources: [wikipedia-signs]

- id: not-widely-documented
  name: '"not widely documented", "based on available information"'
  domain: prose
  group: disclaimers
  kind: lexical
  severity: 2
  what: A search-tool chatbot reports a gap, then guesses what fills it.
  detect: {method: regex, pattern: '(?:\bnot|n[''’]t) (?:widely|extensively|well|publicly) (?:documented|available|reported|disclosed|transcribed)\b|\b(?:limited|scarce|sparse) in (?:the )?(?:provided|available) (?:sources|search results)\b|\bbased on (?:the )?available information\b'}
  era: {first_seen: 2024, peak: 2025}
  status: fading
  substitutes: [does-not-establish, treated-as-rather-than]
  fix: Leave the gap out, or say once that the fact is unknown.
  examples: {bad: "While details aren't widely documented, the mountain likely supports diverse fauna.", good: "No survey of the mountain's fauna exists."}
  confidence: high
  sources: [wikipedia-signs, avoid-ai-writing]

- id: cutoff-disclaimer
  name: '"As of my last update"'
  domain: chat
  group: disclaimers
  kind: behavioral
  severity: 3
  what: The model's training cutoff leaks into the text.
  detect: {method: regex, pattern: '\bas of my (?:last|latest) (?:knowledge |training )?(?:update|cutoff)\b|\bup to my last training\b|\bI (?:do not|don[''’]t) have (?:access to )?real-time\b|\bI (?:cannot|can[''’]t) browse the internet\b'}
  era: {first_seen: 2022, peak: 2023}
  status: fading
  fix: Delete it. Check the fact or drop it.
  examples: {bad: "As of my last update, the CEO is Jane Doe.", good: "Jane Doe became CEO in 2023."}
  confidence: high
  sources: [wikipedia-signs, willison-cliche, avoid-ai-writing]

- id: pasted-refusal
  name: '"I''m sorry, but I can''t"'
  domain: chat
  group: disclaimers
  kind: behavioral
  severity: 3
  what: A refusal pasted into a document as if it were content.
  detect: {method: regex, pattern: '\bI(?:[''’]m| am) sorry,? but (?:I|as an AI)\b[^.\n]{0,20}\b(?:can(?:not|[''’]t)|unable|won[''’]t)\b|\bI (?:cannot|can[''’]t) (?:assist|help) with (?:that|this) request\b'}
  era: {first_seen: 2022, peak: 2023}
  status: fading
  fix: Remove it.
  examples: {bad: "I'm sorry, but I can't provide medical advice.", good: "See a doctor if the rash spreads."}
  confidence: high
  sources: [wikipedia-signs]

# ═════════════ formatting ═════════════

- id: bold-in-prose
  name: Bold phrases mid-sentence
  domain: prose
  group: formatting
  kind: visual
  severity: 1
  what: Bolds key phrases inside running text. Chatbot Arena found bold, lists and headers each nudge votes, which rewards the habit.
  detect: {method: regex, pattern: '(?<=[a-z,;] )\*\*[^*\n]{2,60}\*\*', density: {count: 3, per: 300}}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  substitutes: [header-bullet-everything]
  fix: Remove the bold. Put the key point first.
  examples: {bad: "This **adds confusion** and **erases identity**.", good: "This confuses readers."}
  confidence: medium
  sources: [wikipedia-signs-style, avoid-ai-writing, lmsys-style-control]

- id: markdown-leak
  name: Raw Markdown where it won't render
  domain: prose
  group: formatting
  kind: visual
  severity: 2
  what: Asterisks, pound signs and pipes pasted into email, forms or wikis that show them as text.
  detect: {method: judge, judge: "Does raw Markdown (**bold**, ## headings, | tables) appear in a medium that shows it as plain text?"}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Convert to the target format or plain text.
  examples: {bad: "Hi Sam, **Next steps:** ## Timeline", good: "Hi Sam, next steps and timeline below."}
  confidence: high
  sources: [wikipedia-signs-style, wikipedia-signs]

- id: curly-straight-mix
  name: Curly and straight quotes in one text
  domain: prose
  group: punctuation
  kind: visual
  severity: 0
  advisory: On Graphite's held-out articles (2026-11-07) it fired on people about as often as on models, or more (lift 0.3), so it reports but never scores.
  what: Curly quotes from model output mixed with straight quotes typed by hand.
  detect: {method: regex, flags: "g", pattern: '"[^"\n]{1,80}"(?=[\s\S]{0,4000}?[“”])'}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Pick one style and convert the rest.
  examples: {bad: 'He said “yes” and then "no".', good: 'He said "yes" and then "no".'}
  false_positives: Word, Google Docs and phones curl quotes on their own; pasted quotes mix styles.
  confidence: low
  sources: [wikipedia-signs-style, tropes-fyi, avoid-ai-writing]

- id: unicode-arrows
  name: Arrows in prose ("A → B")
  domain: prose
  group: punctuation
  kind: visual
  severity: 1
  what: Typeset arrows people rarely type by hand. Claude in particular uses them.
  detect: {method: regex, pattern: '\s(?:→|⇒|⟶)\s', density: {count: 2, per: 300}}
  era: {first_seen: 2024, peak: 2026}
  models: [claude]
  status: steady
  fix: Write "leads to", or use a real list.
  examples: {bad: "Input → parse → store", good: "We parse the input, then store it."}
  false_positives: Diagrams, math, UI paths.
  confidence: low
  sources: [tropes-fyi]

- id: bottom-line-label
  name: '"Bottom line:", "TL;DR:", "Short answer:"'
  domain: chat
  group: formatting
  kind: visual
  severity: 1
  what: A label line that frames the answer. GPT-5 writes "the bottom line" 17 times as often as people; Claude Opus 5 14 times.
  detect: {method: regex, flags: "gim", pattern: '^[ \t]*(?:\*\*|__)?(?:the )?(?:bottom line|tl;?dr|short answer|long answer|quick answer|the short version|in short)(?:\*\*|__)?\s*[:—–-]'}
  measure: {graphite: [bottom line, the bottom line, in short]}
  era: {first_seen: 2025, peak: 2026}
  models: [gpt, claude]
  status: rising
  fix: Drop the label and give the answer.
  examples: {bad: "**Short answer:** yes.", good: "Yes."}
  confidence: medium
  sources: [graphite-2026]

- id: challenges-heading
  name: '"Challenges and future directions", "Awards and recognition" headings'
  domain: prose
  group: formatting
  kind: structural
  severity: 1
  what: Stock "X and Y" section headings, common in AI-made articles.
  detect: {method: regex, flags: "gim", pattern: '^#{1,4}\s*(?:challenges and (?:future (?:directions|prospects|outlook)|legacy|opportunities)|awards and recognition|future outlook|legacy and impact)\s*$'}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Name sections after their content.
  examples: {bad: "## Challenges and Future Directions", good: "## Funding ends in 2027"}
  confidence: medium
  sources: [wikipedia-signs]

- id: hashtag-stuffing
  name: A block of six or more hashtags
  domain: prose
  group: formatting
  kind: visual
  severity: 1
  what: Broad tags trailed after a short post.
  detect: {method: regex, flags: "g", pattern: '(?:#[A-Za-z]\w+\s*){6,}'}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Keep two or three specific tags, or none.
  examples: {bad: "#AI #Tech #Innovation #Future #Growth #Leadership", good: "#rustlang"}
  confidence: low
  sources: [avoid-ai-writing]

- id: citation-markup-leak
  name: 'Chatbot citation tokens ("oaicite", "turn0search0", "[cite: 3]")'
  domain: prose
  group: formatting
  kind: visual
  severity: 3
  what: Internal citation markup from ChatGPT, Gemini or DeepSeek, pasted unedited.
  detect: {method: regex, flags: "g", pattern: 'contentReference\[oaicite:\d+\]|\boaicite\b|\bturn\d+(?:search|news|view|image)\d+\b|\bciteturn\d|【\d+†[^】\n]{0,40}】|\[cite:\s*\d+(?:,\s*\d+)*\]|\[attached_file:\d+\]|\bgrok_card\b'}
  era: {first_seen: 2024, peak: 2026}
  models: [gpt, gemini, deepseek, grok]
  status: steady
  fix: Strip the tokens and add real citations.
  examples: {bad: "Sales rose 4% [cite: 3, 12].", good: "Sales rose 4% (Q3 report, p. 2)."}
  confidence: high
  sources: [avoid-ai-writing, willison-cliche, promptplay-slop-bible]

- id: ai-utm-source
  name: '"utm_source=chatgpt.com" in links'
  domain: prose
  group: formatting
  kind: visual
  severity: 3
  what: Tracking tags that AI tools add to links they cite.
  detect: {method: regex, pattern: '\butm_source=(?:chatgpt\.com|openai|copilot\.com|claude\.ai|perplexity(?:\.ai)?)\b|\breferrer=grok\.com\b'}
  era: {first_seen: 2024, peak: 2026}
  models: [gpt]
  status: steady
  fix: Strip the tracking parameter.
  examples: {bad: "https://example.com/report?utm_source=chatgpt.com", good: "https://example.com/report"}
  confidence: high
  sources: [wikipedia-signs, avoid-ai-writing]

- id: unfilled-placeholder
  name: '"[Your Name]", "[Insert source]"'
  domain: prose
  group: formatting
  kind: visual
  severity: 3
  what: Template slots the user forgot to fill.
  detect: {method: regex, pattern: '\[(?:your|insert|add|enter|describe|specify|choose|recipient)\b[^\]\n]{0,80}\]|\b\d{4}-XX-XX\b'}
  era: {first_seen: 2023, peak: 2024}
  status: steady
  fix: Fill the slot or cut the sentence.
  examples: {bad: "Best regards, [Your Name]", good: "Best regards, Priya"}
  false_positives: Real templates.
  confidence: high
  sources: [wikipedia-signs, avoid-ai-writing]

- id: pasted-preamble
  name: '"Here''s a polished version", "Here''s the clean version"'
  domain: chat
  group: openers
  kind: behavioral
  severity: 2
  what: The chatbot's hand-off line, pasted along with the text.
  detect: {method: regex, pattern: '\bhere(?:[''’]s| is) (?:a|an|the|your) (?:revised|rewritten|polished|clean(?:ed-up)?|cleaner|updated|improved|refined|tightened|final|wikipedia-style|more (?:concise|formal|polished)) (?:version|draft|copy|article|paragraph|text|email|template)\b'}
  era: {first_seen: 2023, peak: 2026}
  status: steady
  fix: Delete the hand-off line.
  examples: {bad: "Here's a polished version of your bio: Jane is a designer...", good: "Jane is a designer..."}
  confidence: high
  sources: [wikipedia-signs]

- id: canned-edit-summary
  name: '"Improved clarity and flow"'
  domain: prose
  group: phrasing
  kind: lexical
  severity: 2
  what: Edit, commit or PR summaries that claim style gains and rule compliance.
  detect: {method: regex, pattern: '\b(?:improved|enhanced|refined|tightened) (?:clarity|flow|readability)(?:,? (?:and )?(?:clarity|flow|readability|tone|structure))*\b|\bensur(?:ed|ing|es) (?:adherence|compliance) (?:to|with)\b|\bneutral,? encyclopedic tone\b|\bpreserv(?:ed|ing) (?:all )?(?:the )?(?:original|key) (?:meaning|information|content)\b'}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  fix: Say what changed ("split the intro; fixed two dates").
  examples: {bad: "Refined wording, improved clarity and flow, ensured adherence to guidelines.", good: "Fixed the birth year and cut two promo lines."}
  confidence: high
  sources: [wikipedia-signs]

# ═════════════ chat · openers and closers ═════════════

- id: if-you-want-teaser
  name: '"If you want, I can...", "Want me to...?"'
  domain: chat
  group: closers
  kind: behavioral
  severity: 2
  what: 'GPT-5-era teaser offers at the end of each reply. In March 2026 OpenAI said a GPT-5.3 Instant update "reduces teaser-style phrasing".'
  detect: {method: regex, flags: "gim", pattern: '\bif you(?:[''’]d)? (?:want|like),? I(?:[''’]ll| can| could| will)\b|(?:^|[.!?]\s+)want me to\b|\byou(?:[''’]ll| will) never believe\b'}
  era: {first_seen: 2025, peak: 2026}
  models: [gpt]
  status: fading
  substitutes: ['"If you like, I can"']
  fix: End when the answer ends.
  examples: {bad: "If you want, I can also turn this into a checklist.", good: "(End of reply.)"}
  confidence: high
  sources: [pcworld-teasers-2026, slop-guard, promptplay-slop-bible, openai-release-notes]

- id: self-scheduled-next
  name: '"I''ll do X next unless you say otherwise"'
  domain: chat
  group: closers
  kind: behavioral
  severity: 1
  what: An agent names its own next task and makes the user opt out.
  detect: {method: regex, pattern: '\bnext unless you (?:say|tell me) otherwise\b|\bunless you(?:[''’]d)? (?:prefer|rather|object),? I(?:[''’]ll| will)\b'}
  era: {first_seen: 2026, peak: 2026}
  models: [claude]
  status: rising
  substitutes: [offer-closer]
  fix: Report the open item as a fact and stop.
  examples: {bad: "I'll re-review PR 12 next unless you say otherwise.", good: "PR 12 still has no review."}
  confidence: low
  sources: [gh-cc-107524]

- id: performative-honesty
  name: '"I''ll be honest", "Honestly?", "Look,"'
  domain: chat
  group: tone
  kind: behavioral
  severity: 0
  advisory: On Graphite's held-out articles (2026-11-07) it fired on people about as often as on models, or more (lift 0.35), so it reports but never scores.
  what: Sincerity announced instead of shown. Users filed Claude Code issues against "I want to be honest" in 2026.
  detect: {method: regex, flags: "gim", pattern: '\bI(?:[''’]ll| will| want to) be (?:honest|direct|blunt|upfront|straight)(?: with you)?\b|\blet[''’]s be (?:honest|real)\b|\bto be (?:fully |completely )?(?:honest|transparent|frank)\b|(?:^|[.!?]\s+)(?:and )?(?:honestly|frankly)\?|(?:^|[.!?]\s+)(?:look|real talk),'}
  era: {first_seen: 2024, peak: 2026}
  models: [claude, gpt]
  status: rising
  substitutes: [honest-label]
  fix: Delete the announcement and say the thing.
  examples: {bad: "I'll be honest with you: the plan won't work.", good: "The plan won't work: it needs twice the budget."}
  false_positives: Mid-sentence "honestly" in casual speech.
  confidence: high
  sources: [willison-cliche, gh-cc-64840, avoid-ai-writing, promptplay-slop-bible]

- id: narrated-candor
  name: '"Two caveats I''d rather flag than let you discover"'
  domain: chat
  group: tone
  kind: behavioral
  severity: 1
  what: A clause that advertises a coming disclosure.
  detect: {method: judge, judge: "Does a clause announce that the writer is being forthcoming, separate from the disclosure itself?"}
  era: {first_seen: 2025, peak: 2026}
  status: rising
  fix: Cut the frame and keep the disclosure.
  examples: {bad: "Two caveats I'd rather flag now than let you discover later: ...", good: "Two caveats: ..."}
  confidence: low
  sources: [avoid-ai-writing]

- id: what-stands-out
  name: '"A few things stand out", "What struck me"'
  domain: chat
  group: openers
  kind: lexical
  severity: 1
  what: A stock reaction frame before the list.
  detect: {method: regex, pattern: '\b(?:a few|two|three|several) things stand out\b|\bwhat stands out (?:most )?(?:is|here)\b|\bwhat struck me (?:most )?(?:was|is)\b|\bwhat surprised me most\b'}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  fix: Start with the first point.
  examples: {bad: "A few things stand out. First, the tests are flaky.", good: "The tests are flaky."}
  confidence: low
  sources: [avoid-ai-writing]

- id: lets-break-it-down
  name: '"Let''s break this down", "Let''s unpack this"'
  domain: chat
  group: openers
  kind: lexical
  severity: 1
  what: A teacher-voice opener that delays the point.
  detect: {method: regex, pattern: '\blet(?:[''’]s| us) (?:break (?:this|it|that) down|unpack (?:this|that|it)|walk through (?:this|it))\b'}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  substitutes: [guide-signpost]
  fix: Start with the first step.
  examples: {bad: "Let's break this down step by step.", good: "First, the request hits the load balancer."}
  confidence: medium
  sources: [tropes-fyi, avoid-ai-writing]

- id: acknowledgment-loop
  name: '"You''re asking about...", "To answer your question"'
  domain: chat
  group: openers
  kind: behavioral
  severity: 1
  what: Restates the prompt before answering.
  detect:
    method: regex
    flags: "gim"
    pattern: '^[ \t]*(?:you(?:[''’]re| are) asking (?:about|whether|how)|to answer your question|so,? you(?:[''’]re| are) (?:asking|wondering))\b'
    judge: Does the reply restate the question before any new information?
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Start with the answer.
  examples: {bad: "You're asking about retries. Retries are how the client handles failure.", good: "The client retries five times."}
  confidence: low
  sources: [avoid-ai-writing]

- id: reasoning-leak
  name: '"Let me think step by step"'
  domain: chat
  group: openers
  kind: behavioral
  severity: 2
  what: Chain-of-thought scaffolding left in a final answer.
  detect: {method: regex, pattern: '\blet me think (?:this through|step by step|about this)\b|\bhere(?:[''’]s| is) my thought process\b|\bto approach this systematically\b|\bworking through this logically\b'}
  era: {first_seen: 2024, peak: 2025}
  status: steady
  fix: Keep the conclusion and the evidence. Cut the narration.
  examples: {bad: "Let me think step by step. First, consider the input...", good: "The input is unsorted, so binary search fails."}
  confidence: low
  sources: [avoid-ai-writing]

- id: agent-narration
  name: '"Now I have the complete picture"'
  domain: chat
  group: phrasing
  kind: behavioral
  severity: 1
  what: An agent reports on its own state between tool calls.
  detect: {method: regex, pattern: '\bnow I (?:have|understand) the (?:full|complete|whole) picture\b|\bI now have (?:a )?(?:full|complete|clear) (?:picture|understanding)\b'}
  era: {first_seen: 2025, peak: 2026}
  models: [claude]
  status: steady
  fix: Report the findings and drop the status line.
  examples: {bad: "Now I have the complete picture. The bug is in auth.", good: "The bug is in auth.ts line 40."}
  confidence: low
  sources: [promptplay-slop-bible]

- id: performed-insight
  name: '"Sit with that", "That''s not nothing"'
  domain: chat
  group: tone
  kind: lexical
  severity: 2
  what: Essayist tics that announce depth instead of giving it.
  detect: {method: regex, flags: "gim", pattern: '\bsit with (?:that|this|it)(?: for a moment)?\b|\bthat(?:[''’]s| is) not nothing\b|\byou already know (?:the answer|this)\b|\bdon[''’]t take my word for it\b|(?:^|[.!?]\s+)turns out,? '}
  era: {first_seen: 2025, peak: 2026}
  models: [claude]
  status: rising
  fix: State the claim and its size.
  examples: {bad: "You cut costs by 10%. That's not nothing.", good: "You cut costs by 10%, about $40k a year."}
  confidence: medium
  sources: [willison-cliche, avoid-ai-writing, promptplay-slop-bible]

- id: rare-insight-flattery
  name: '"You''re picking up on something few people notice"'
  domain: chat
  group: tone
  kind: behavioral
  severity: 2
  what: Tells the user their question shows rare insight. Successor to "Great question!".
  detect: {method: regex, pattern: '\b(?:very )?few people (?:ever )?(?:notice|see|ask|realize|catch)\b|\bthat(?:[''’]s| is) (?:rare|a rare (?:insight|level of))\b|\byou(?:[''’]re| are) (?:cutting|getting) (?:right )?to the (?:core|heart)\b|\bnow you(?:[''’]re| are) thinking like\b|\byou(?:[''’]re| are) not broken\b'}
  models: [gpt]
  status: steady
  substitutes: [sycophantic-opener]
  fix: Answer the question.
  examples: {bad: "You're picking up on a pattern very few people notice.", good: "Yes, the two graphs share an axis error."}
  confidence: low
  sources: [promptplay-slop-bible]

- id: own-the-mistake
  name: '"You''re right to call me out", "I own that"'
  domain: chat
  group: tone
  kind: behavioral
  severity: 1
  what: Ritual contrition before the fix.
  detect: {method: regex, pattern: '\byou(?:[''’]re| are) right to (?:call (?:me|that) out|push back|flag (?:this|that))\b|\bI own that\b|\bthat(?:[''’]s| is) on me\b'}
  era: {first_seen: 2025, peak: 2026}
  models: [gpt]
  status: rising
  substitutes: [sycophantic-opener]
  fix: Fix the error and say what changed.
  examples: {bad: "You're right to call me out on that. I own that.", good: "Corrected: the limit is 100, not 1,000."}
  confidence: low
  sources: [promptplay-slop-bible]

# ═════════════ email, social, launch copy ═════════════

- id: contrarian-hook
  name: '"Most people think X. They''re wrong."'
  domain: prose
  group: openers
  kind: structural
  severity: 2
  what: The top LinkedIn opener in an informal count of 500 AI posts (38%).
  detect: {method: regex, pattern: '\bmost people (?:think|believe|assume)\b[^.!?\n]{1,80}[.!?]\s+(?:they(?:[''’]re| are) wrong|wrong)\b|\blet me explain\.'}
  era: {first_seen: 2023, peak: 2026}
  status: steady
  fix: State your claim and your evidence.
  examples: {bad: "Most people think cold email is dead. They're wrong.", good: "Our cold emails got a 9% reply rate last quarter."}
  confidence: low
  sources: [vega-linkedin-500]

- id: nobody-tells-you
  name: '"What nobody tells you about X"'
  domain: prose
  group: phrasing
  kind: lexical
  severity: 2
  what: Claims secret knowledge where none exists.
  detect: {method: regex, pattern: '\b(?:what|the (?:part|thing)) (?:nobody|no one) (?:tells you|talks about|mentions)\b|\bnobody(?:[''’]s| is) (?:talking about|naming)\b|\bhere(?:[''’]s| is) what (?:nobody|no one|most people)\b'}
  era: {first_seen: 2023, peak: 2026}
  status: steady
  fix: Give the fact and drop the scarcity claim.
  examples: {bad: "Here's what nobody tells you about hiring.", good: "Half our hires came from referrals."}
