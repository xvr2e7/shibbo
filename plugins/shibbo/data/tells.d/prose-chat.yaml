- id: another-layer-this-shift
  name: '"another layer of", "this shift"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Vague nouns for change and complexity. "this shift" runs 21 to 46 times the human rate; "another layer" up to 40 times.
  detect: {method: regex, pattern: '\banother layer of\b|\bthis shift\b'}
  measure: {graphite: [another layer, this shift]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude, gpt, gemini]
  status: steady
  fix: Name the change, from what to what.
  examples: {bad: "This shift adds another layer of complexity.", good: "Moving to two regions doubles the configs we maintain."}
  confidence: high
  sources: [graphite-2026]

- id: no-single
  name: '"no single", "any single"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Says no one factor explains it, a point rarely in doubt. 21 to 62 times the human rate in Claude and GPT.
  detect: {method: regex, pattern: '\b(?:no|any) single\b'}
  measure: {graphite: [no single, any single]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude, gpt]
  status: rising
  fix: Name the factors and how much each counts.
  examples: {bad: "No single change explains the drop.", good: "Two thirds of the drop came from the price rise; the rest from the outage."}
