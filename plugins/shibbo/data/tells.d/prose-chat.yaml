  sources: [wikipedia-signs, graphite-2026, willison-cliche]

- id: gpt5-era-vocab
  name: '"emphasizing", "highlighting", "enhance", "align with"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: The GPT-4o and GPT-5 word set, mid-2024 to mid-2026 by Wikipedia's dating. GPT-5 writes "aligns" 17 times as often as people.
  detect: {method: regex, pattern: '\b(?:emphasiz(?:e|es|ed|ing)|highlight(?:s|ed|ing)|enhanc(?:e|es|ed|ing)|align(?:s|ed|ing)? with)\b', density: {count: 3, per: 500}}
