- id: that-gap
  name: '"that gap", "the gap between"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Frames any difference as a gap to close. Claude Opus 5 writes "that gap" 85 times as often as people.
  detect: {method: regex, pattern: '\b(?:that|this) gap\b|\bthe gap between\b|\b(?:close|closes|closing|bridge|bridges|bridging) the gap\b'}
  measure: {graphite: [that gap, the gap between]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude, gemini]
  status: rising
  fix: State both sides of the difference with numbers.
  examples: {bad: "That gap is where most teams fail.", good: "Teams plan for 2 weeks and take 6."}
  confidence: high
  sources: [graphite-2026]

- id: a-reminder-that
  name: '"a reminder that"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Turns a fact into a lesson. 20 to 25 times the human rate in Claude Opus 4.6.
  detect: {method: regex, pattern: '\ba (?:powerful |stark |timely |sobering |useful )?reminder that\b'}
  measure: {graphite: [a reminder that, reminder that]}
  era: {first_seen: 2025, peak: 2026}
  models: [claude, gpt]
  status: steady
  fix: State the fact and let readers draw the lesson.
  examples: {bad: "The outage is a reminder that backups matter.", good: "The outage lost two days of orders. We had no backup."}
  confidence: high
  sources: [graphite-2026]

- id: gpt4-era-vocab
  name: '"vibrant", "enduring", "garner", "bolster"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: The 2023 to mid-2024 word set from GPT-4, still common in older and cheaper models.
  detect: {method: regex, pattern: '\b(?:vibrant|enduring|embrac(?:e|es|ed|ing)|garner(?:s|ed|ing)?|bolster(?:s|ed|ing)?|interplay|invaluable)\b', density: {count: 2, per: 400}}
  measure: {graphite: [vibrant, enduring, embracing, embrace, invaluable]}
  era: {first_seen: 2023, peak: 2024}
  models: [gpt, gemini, claude]
