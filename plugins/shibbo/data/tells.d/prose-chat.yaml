  sources: [graphite-2026]

- id: rooted-in
  name: '"rooted in", "deeply rooted"'
  domain: prose
  group: vocabulary
  kind: lexical
  severity: 1
  what: Gives a thing roots instead of a cause. Claude Opus 4.6 writes "rooted in" 18 times as often as people.
