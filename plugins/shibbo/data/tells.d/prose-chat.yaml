- id: social-endorsement
  name: '"This one is worth your time:"'
  domain: prose
  group: closers
  kind: lexical
  severity: 1
  what: A generic sign-off that vouches for a link with no reason.
  detect: {method: regex, pattern: '\bthis one(?:[''’]s| is) (?:worth your time|a must-read)\b|\bdo yourself a favou?r and\b|\b(?:save|bookmark) this (?:for later|post)\b|\bthank me later\b|\bdon[''’]t sleep on this\b'}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  fix: Say what the link shows, or post it bare.
  examples: {bad: "This one is worth your time:", good: "How Figma cut build times by 60%:"}
  confidence: low
  sources: [avoid-ai-writing]

- id: lingering-attention
  name: '"The line I keep coming back to"'
  domain: prose
  group: openers
  kind: lexical
  severity: 1
  what: Claims a quote has held the writer's mind before showing why.
  detect: {method: regex, pattern: '\bI keep coming back to\b|\bI can[''’]t stop thinking about\b|\bstill thinking about this\b|\brattling around (?:in )?my head\b'}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  fix: Quote the line and say what it explains.
  examples: {bad: "The line I keep coming back to: agents are teenagers.", good: "Agents act like teenagers: they ignore rules they weren't shown."}
