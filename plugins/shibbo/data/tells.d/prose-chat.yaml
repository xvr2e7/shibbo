  name: '"Meet X, your new favorite...", "Enter X."'
  domain: prose
  group: openers
  kind: structural
  severity: 2
  what: Introduces a product like a game-show contestant.
  detect: {method: regex, flags: "gm", pattern: '(?:^|[.!?]\s+)Meet [A-Z][\w-]{1,29}, (?:your new (?:favou?rite|go-to)|the new (?:home|way|standard) (?:of|to|for|in))\b|(?:^|[.!?]\s+)Think [A-Z][\w-]{1,29} meets [A-Z]|(?:^|[.!?]\s+)Enter [A-Z][\w-]{1,29}\.'}
  era: {first_seen: 2023, peak: 2026}
  status: steady
  fix: Say what the product is.
  examples: {bad: "Meet Flowdesk, your new favorite treasury dashboard.", good: "Flowdesk is a treasury dashboard."}
  confidence: low
