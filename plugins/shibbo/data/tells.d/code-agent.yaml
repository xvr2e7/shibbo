- id: tautological-tests
  name: Tests that check the test's own setup
  domain: code
  group: tests
  kind: structural
  severity: 2
  what: The expected value comes from the mock or from a copy of the logic inside the test, so the test can't fail.
  detect: {method: judge, judge: "Would this test still pass if the function under test returned a wrong answer?"}
  era: {first_seen: 2024, peak: 2026}
  status: rising
  fix: Assert against a value worked out by hand from the spec.
  specimen:
    lang: python
    code:
      - "def test_get_price(mocker):"
      - "    mocker.patch(\"shop.get_price\", return_value=42)"
      - "    assert shop.get_price(\"sku-1\") == 42"
