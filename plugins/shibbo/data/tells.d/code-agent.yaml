- id: stock-apology
  name: '"I apologize for the confusion"'
  domain: agent
  group: tone
  kind: lexical
  severity: 1
  what: 'A stock apology such as "I apologize for the confusion" before the next try.'
  detect: {method: regex, flags: "gi", pattern: '\bi apologi[sz]e for (?:the|any|my) (?:confusion|oversight|error|mistake)\b|\bsorry for the (?:confusion|oversight)\b'}
  era: {first_seen: 2025, peak: unknown}
