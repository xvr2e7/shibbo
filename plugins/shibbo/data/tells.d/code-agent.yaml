  name: '"Let me..." narration of every step'
  domain: agent
  group: tone
  kind: lexical
  severity: 1
  what: '"Let me check...", "Now let me...", "Now I''ll..." before each tool call.'
  detect: {method: regex, flags: "gim", pattern: '^\s*(?:now )?(?:let me|i(?:''|’)ll now|now i(?:''|’)ll)\s+(?:check|look|read|run|examine|update|create|fix|verify|search|start|try)\b', density: {count: 3, per: 300}}
  era: {first_seen: 2025, peak: 2025}
  status: steady
  fix: Act, then report the result.
  specimen:
    chat:
      - {role: user, text: "Why is the cache stale?"}
      - {role: assistant, text: "Let me check the cache config.\nNow let me look at the TTL.\nLet me read the invalidation code."}
  confidence: medium
  sources: [cc-system-prompts]

- id: closing-recap
