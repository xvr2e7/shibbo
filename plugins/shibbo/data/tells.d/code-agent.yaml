# Code and coding-agent tells. Extends data/tells.yaml; sources live in data/sources.d/code-agent.yaml.
# Code patterns run on source text, file lists or git text. Agent patterns run on the agent's chat output.

# ═════════════ code · comments ═════════════

- id: comment-density
  name: A comment over every few lines
  domain: code
  group: comments
  kind: structural
  severity: 1
  what: Far more comments than the rest of the file or repo carries, most of them saying what the next line does.
  detect: {method: judge, judge: "Does this code carry clearly more comments than the surrounding human-written code in the same repo?"}
  era: {first_seen: 2025, peak: 2025}
  models: [claude]
  status: steady
  fix: Match the file's comment density and keep only the comments that explain why.
  specimen:
    lang: python
    code:
      - "# Load the config file"
      - "config = load_config(path)"
      - "# Get the timeout value from the config"
      - "timeout = config.get(\"timeout\", 30)"
      - "# Return the timeout"
      - "return timeout"
    hit: [0, 2, 4]
  false_positives: Teaching code and tutorials, where dense comments are the point.
  confidence: medium
  sources: [fingerprinting-2026, sonar-2025, cc-system-prompts]

- id: change-log-comments
  name: Comments that narrate the edit
  domain: code
  group: comments
  kind: lexical
  severity: 2
  what: Comments written for the reviewer of this change, such as "// Updated to use the new API" or "# FIXED:", which go stale once merged.
  detect: {method: regex, flags: "gim", pattern: '^\s*(?:#|//|/?\*)\s*(?:(?:NEW|CHANGED|UPDATED|FIXED|MODIFIED|ADDED)\s*:|(?:updated|changed|modified|fixed|refactored) to (?:use|handle|support|fix|avoid)\b|now (?:uses|handles|supports|returns)\b|added (?:for|to support|to handle|per) (?:the |issue|user|your)\b)'}
  era: {first_seen: 2024, peak: 2026}
  status: rising
  fix: Put the history in the commit message and keep comments about the code as it is.
  specimen:
    lang: typescript
    code:
      - "export async function getUser(id: string) {"
      - "  // Updated to use the new client instead of fetch"
      - "  const res = await api.get(`/users/${id}`);"
      - "  // FIXED: handle missing user"
      - "  return res.data ?? null;"
      - "}"
    hit: [1, 3]
  false_positives: Changelog files, and teams that tag fixes in comments by policy.
  confidence: medium
  sources: [cc-system-prompts]

- id: removed-code-tombstones
  name: Tombstones for deleted code
  domain: code
  group: comments
  kind: lexical
  severity: 1
  what: '"// removed X" markers, unused variables renamed with a leading underscore, and re-exports kept so nothing breaks.'
  detect: {method: regex, flags: "gim", pattern: '^\s*(?:#|//)\s*(?:removed|deleted|no longer (?:used|needed)|kept for (?:backward|backwards) compat(?:ibility)?|legacy alias)\b'}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  fix: Delete dead code outright. Git keeps the history.
  specimen:
    lang: python
    code:
      - "# Removed: old retry helper"
      - "def fetch(url, _timeout=None):"
      - "    return session.get(url)"
      - ""
      - "# Kept for backwards compatibility"
      - "fetch_url = fetch"
    hit: [0, 4]
  confidence: medium
  sources: [cc-system-prompts]

- id: section-divider-comments
  name: Banner comments between sections
  domain: code
  group: comments
  kind: visual
  severity: 1
  what: Decorated dividers like "// ===== Helpers =====" splitting short files into labeled sections.
  detect: {method: regex, flags: "gm", pattern: '^\s*(?:#|//)\s*[-=*#]{3,}\s*\w[^\n]{0,60}?[-=*#]{3,}\s*$'}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Drop the banners. Split the file if it needs sections.
  specimen:
    lang: javascript
    code:
      - "// ===== Constants ====="
      - "const MAX_RETRIES = 3;"
      - ""
      - "// ===== Helpers ====="
      - "function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }"
    hit: [0, 3]
  false_positives: Long legacy files and some C codebases that have always used banners.
  confidence: low
  sources: [dabit3-deslop]

- id: blanket-docstrings
  name: Docstrings on every trivial function
  domain: code
  group: comments
  kind: structural
  severity: 1
  what: Full Args/Returns docstrings on one-line helpers, often added to functions the change never touched.
  detect: {method: judge, judge: "Does a docstring restate the function's name and signature without adding a constraint, unit, or reason?"}
  era: {first_seen: 2023, peak: 2025}
  models: [claude]
  status: steady
  fix: Document public APIs and surprises. Leave trivial and untouched functions alone.
  specimen:
    lang: python
    code:
      - "def add(a: int, b: int) -> int:"
      - "    \"\"\"Add two integers."
      - "    Args: a: The first integer. b: The second integer."
      - "    Returns: The sum of a and b.\"\"\""
      - "    return a + b"
    hit: [1, 2, 3]
  false_positives: Libraries whose doc tooling requires a docstring on every public function.
  confidence: medium
  sources: [claude-prompting-best-practices]

- id: example-usage-block
  name: '"# Example usage" demo at the bottom'
  domain: code
  group: comments
  kind: lexical
  severity: 1
  what: A module ends with an "Example usage" comment and a main-guard demo that prints sample results.
  detect: {method: regex, flags: "gim", pattern: '^\s*(?:#|//)\s*example usage\s*:?\s*$'}
  era: {first_seen: 2023, peak: 2024}
  status: fading
  fix: Move the demo into a test or the README, or delete it.
  specimen:
    lang: python
    code:
      - "    return sorted(items, key=lambda x: x.score)"
      - ""
      - "# Example usage"
      - "if __name__ == \"__main__\":"
      - "    print(rank_items([Item(1), Item(3)]))"
    hit: [2, 3]
  false_positives: Scripts meant to be run, and docs examples.
  confidence: low
  sources: [folk]

- id: placeholder-todos
  name: '"TODO: implement" stubs'
  domain: code
  group: comments
  kind: lexical
  severity: 2
  what: Functions whose body is a vague TODO, a pass, or a hard-coded return, shipped as if done.
  detect: {method: regex, flags: "gim", pattern: '(?:#|//)\s*TODO:?\s*(?:implement|add|handle|fill in|replace)\s+(?:this|here|later|actual|real|the (?:actual|real) \w+|logic|functionality|error handling)\b'}
  era: {first_seen: 2023, peak: 2026}
  status: steady
  fix: Finish the function or fail loudly with NotImplementedError and say so in the report.
  specimen:
    lang: python
    code:
      - "def send_invoice(order):"
      - "    # TODO: implement actual email sending"
      - "    return {\"status\": \"sent\"}"
    hit: [1, 2]
  confidence: medium
  sources: [dabit3-deslop, cc-issue-88438, cc-system-prompts]

- id: lazy-elision
  name: '"// ... rest of code ..." elisions'
  domain: code
  group: comments
  kind: lexical
  severity: 2
  what: A placeholder comment stands in for code the model chose not to write out, and the edit deletes the real code.
  detect: {method: regex, flags: "gim", pattern: '^\s*(?:#|//|/\*|\{/\*)\s*\.{3}\s*(?:rest of|existing|remaining|other|previous|original|same as|unchanged)\b'}
  era: {first_seen: 2023, peak: 2024}
  models: [gpt]
  status: fading
  fix: Write out every line the edit touches, or use a diff format.
  specimen:
    lang: javascript
    code:
      - "class Cart {"
      - "  addItem(item) { this.items.push(item); }"
      - "  // ... rest of the methods unchanged ..."
      - "}"
    hit: [2]
  confidence: high
  sources: [aider-laziness]

# ═════════════ code · errors ═════════════

- id: defensive-null-checks
  name: Null checks for values that can't be null
  domain: code
  group: errors
  kind: structural
  severity: 1
  what: Triple null, undefined and empty checks, optional chaining everywhere, and validation on trusted internal paths.
  detect: {method: regex, flags: "g", pattern: '\b(\w+)\s*!==?\s*null\s*&&\s*\1\s*!==?\s*undefined\b|\b(\w+)\s*===?\s*null\s*\|\|\s*\2\s*===?\s*undefined\b', judge: "Can this value actually be null or missing here?"}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Validate at the boundary and trust internal code.
  specimen:
    lang: typescript
    code:
      - "function total(cart: Cart): number {"
      - "  if (cart !== null && cart !== undefined && cart.items?.length) {"
      - "    return cart.items.reduce((s, i) => s + (i?.price ?? 0), 0);"
      - "  }"
      - "  return 0;"
      - "}"
    hit: [1, 2]
  false_positives: Code at real system boundaries, such as parsed JSON or user input.
  confidence: medium
  sources: [cursor-deslop, dabit3-deslop, claude-prompting-best-practices]

- id: silent-mock-fallback
  name: Silent fallback to fake data
  domain: code
  group: errors
  kind: behavioral
  severity: 3
  what: When the real call or algorithm fails, the code quietly returns sample data or a cruder method, so the demo works and the bug hides.
  detect: {method: regex, flags: "gi", pattern: '\bfall(?:ing)? ?back to (?:mock|sample|dummy|placeholder|fake|demo|hard-?coded|static) (?:data|response|results?|values?)\b', judge: "When the main path fails, does the code return made-up or simplified results without surfacing the failure?"}
  era: {first_seen: 2025, peak: 2026}
  models: [claude, gpt]
  status: rising
  fix: Raise the error. Add a fallback only when someone asked for one, and log it loudly.
  specimen:
    lang: python
    code:
      - "try:"
      - "    prices = fetch_prices(api_key)"
      - "except Exception:"
      - "    # Fall back to sample data so the dashboard still renders"
      - "    prices = [{\"symbol\": \"AAPL\", \"price\": 189.5}]"
    hit: [2, 3, 4]
  confidence: medium
  sources: [goedecke-2025-fallbacks]

# ═════════════ code · output ═════════════

- id: trace-logging
  name: Entry, exit and DEBUG logs left in
  domain: code
  group: output
  kind: lexical
  severity: 1
  what: '"Entering function", "Finished processing" and "DEBUG:" logs on every function, left in the final code.'
  detect: {method: regex, flags: "gi", pattern: '(?:console\.log|print|logger\.(?:debug|info))\(\s*f?[''"`]\[?(?:DEBUG|TEMP|TRACE)\]?:|(?:console\.log|print|logger\.(?:debug|info))\(\s*f?[''"`](?:Entering|Exiting|Starting|Finished|Called|Invoking)\b'}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Remove debug logs before commit. Use a debugger or a log level.
  specimen:
    lang: javascript
    code:
      - "async function syncOrders(ids) {"
      - "  console.log('Entering syncOrders with', ids.length, 'ids');"
      - "  const rows = await db.orders.find(ids);"
      - "  console.log('DEBUG: rows', rows);"
      - "  return rows;"
      - "}"
    hit: [1, 3]
  confidence: low
  sources: [dabit3-deslop]

- id: non-ascii-glyphs
  name: Arrows, check marks and box lines in source
  domain: code
  group: output
  kind: visual
  severity: 1
  what: Unicode arrows, bullets and box-drawing characters in comments, logs and CLI output of an ASCII codebase.
  detect: {method: regex, flags: "g", pattern: '[→←⇒✓✔✗✘•─│└├┌┐┘]+', density: {count: 5, per: 300}}
  era: {first_seen: 2024, peak: 2026}
  status: rising
  fix: Use plain ASCII ("->", "-", "OK") unless the file already uses Unicode.
  specimen:
    lang: python
    code:
      - "# Flow: parse → validate → save"
      - "print(\"✓ Config loaded\")"
      - "print(\"└─ 3 rules applied\")"
    hit: [0, 1, 2]
  false_positives: TUI libraries, docs, and code that renders tree views on purpose.
  confidence: medium
  sources: [codex-prompt-gpt5]

# ═════════════ code · structure ═════════════

- id: type-escape-hatches
  name: '"as any" and @ts-ignore to quiet the checker'
  domain: code
  group: structure
  kind: lexical
  severity: 2
  what: Casts to any, double casts and ignore comments added to make type errors go away.
  detect: {method: regex, flags: "g", pattern: '\bas\s+any\b|\bas\s+unknown\s+as\s+\w|@ts-(?:ignore|nocheck)\b', density: {count: 3, per: 300}}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  fix: Fix the type, or write the narrowest type that is true.
  specimen:
    lang: typescript
    code:
      - "const user = (await res.json()) as any;"
      - "// @ts-ignore"
      - "setProfile(user.profile);"
      - "const cfg = raw as unknown as Config;"
    hit: [0, 1, 3]
  false_positives: Test doubles and interop with untyped libraries.
  confidence: high
  sources: [lee-2026-any, cursor-deslop, deslop-js]

- id: redundant-ceremony
  name: Redundant checks and wrappers
  domain: code
  group: structure
  kind: lexical
  severity: 1
  what: '"if (x === true)", Promise.all around one promise, "return undefined" and async functions that never await.'
  detect: {method: regex, flags: "g", pattern: '\bif\s*\(\s*[\w.]+\s*===\s*true\s*\)|Promise\.all\(\[\s*[\w.]+\([^()\]]*\)\s*\]\)', density: {count: 3, per: 500}}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Write the plain form.
  specimen:
    lang: javascript
    code:
      - "async function load(id) {"
      - "  const [user] = await Promise.all([getUser(id)]);"
      - "  if (user.active === true) return user;"
      - "  return undefined;"
      - "}"
    hit: [1, 2]
  confidence: low
  sources: [dabit3-deslop]

- id: deep-nesting
  name: Nested ifs where an early return would do
  domain: code
  group: structure
  kind: structural
  severity: 1
  what: Logic buried three or four levels deep inside guard conditions.
  detect: {method: judge, judge: "Would early returns remove two or more levels of nesting here?"}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Return early on the guard cases.
  specimen:
    lang: python
    code:
      - "def charge(user, amount):"
      - "    if user:"
      - "        if user.card:"
      - "            if amount > 0:"
      - "                return gateway.charge(user.card, amount)"
      - "    return None"
    hit: [1, 2, 3]
  confidence: low
  sources: [cursor-deslop]

- id: dead-code-left
  name: Dead code left behind
  domain: code
  group: structure
  kind: structural
  severity: 1
  what: Unused imports, helpers and parameters left over from earlier attempts in the same session.
  detect: {method: judge, judge: "Does the change add imports, functions or parameters that nothing uses?"}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  fix: Run the linter's unused-code check and delete what it finds.
  specimen:
    lang: python
    code:
      - "import os"
      - "import json"
      - "from typing import Any, Dict, List, Optional"
      - ""
      - "def area(r: float) -> float:"
      - "    return 3.14159 * r * r"
    hit: [0, 1, 2]
  confidence: low
  sources: [desloppify, deslop-js, cc-issue-6120]

- id: copy-paste-growth
  name: Copied blocks in place of reuse
  domain: code
  group: structure
  kind: structural
  severity: 2
  what: New code repeats a block that already exists nearby, with small edits, instead of calling or moving it.
  detect: {method: judge, judge: "Does the change paste five or more lines that already exist elsewhere in the repo?"}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Search for the existing function first and call it.
  specimen:
    lang: python
    code:
      - "def export_users(rows):"
      - "    out = io.StringIO(); w = csv.writer(out)"
      - "    w.writerow(rows[0].keys()); w.writerows(r.values() for r in rows)"
      - "def export_orders(rows):"
      - "    out = io.StringIO(); w = csv.writer(out)"
      - "    w.writerow(rows[0].keys()); w.writerows(r.values() for r in rows)"
    hit: [3, 4, 5]
  confidence: medium
  sources: [gitclear-2025, gitclear-report-2025]

- id: verbosity-bloat
  name: Two or three times the code a person would write
  domain: code
  group: structure
  kind: structural
  severity: 2
  what: Solutions run long and grow longer with each agent turn, with wrappers, options and branches nobody needs.
  detect: {method: judge, judge: "Could the same behavior fit in half the lines without losing clarity?"}
  era: {first_seen: 2024, peak: 2026}
  models: [claude, gpt]
  status: steady
  fix: Ask for the smallest change that passes, then cut what is left.
  specimen:
    lang: python
    code:
      - "class TemperatureConverter:"
      - "    def __init__(self, precision: int = 2, strict: bool = False):"
      - "        self.precision = precision; self.strict = strict"
      - "    def celsius_to_fahrenheit(self, c: float) -> float:"
      - "        self._validate(c)"
      - "        return round(c * 9 / 5 + 32, self.precision)"
    hit: [0, 1, 2]
  confidence: high
  sources: [slopcodebench-2026, sonar-2025-gpt5, sonar-2025]

- id: license-headers
  name: Copyright headers on new files
  domain: code
  group: structure
  kind: lexical
  severity: 0
  what: New files open with a copyright or license header in a repo whose files don't carry one.
  detect: {method: judge, judge: "Does a new file carry a license or copyright header that other files in the repo lack?"}
  era: {first_seen: 2024, peak: unknown}
  status: steady
  fix: Follow the repo. Add headers only where they already exist.
  specimen:
    lang: python
    code:
      - "# Copyright (c) 2025"
      - "# Licensed under the MIT License."
      - ""
      - "def slugify(s):"
      - "    return s.lower().replace(\" \", \"-\")"
    hit: [0, 1]
  false_positives: Repos that require headers everywhere.
  confidence: low
  sources: [codex-prompt-gpt51]

# ═════════════ code · deps ═════════════

- id: stale-model-ids
  name: Old model names in new code
  domain: code
  group: deps
  kind: lexical
  severity: 2
  what: 'Fresh code calls models from the model''s training years, like gpt-3.5-turbo, long after they were retired.'
  detect: {method: regex, flags: "g", pattern: '[''"](?:gpt-3\.5-turbo(?:-\d+)?|gpt-4(?:-0613|-0314|-1106-preview|-0125-preview)?|text-davinci-00[23]|claude-(?:2(?:\.[01])?|instant-1(?:\.2)?|3-(?:opus|sonnet|haiku)-\d{8}))[''"]'}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  fix: Check the provider's current model list before writing the ID.
  specimen:
    lang: python
    code:
      - "resp = client.chat.completions.create("
      - "    model=\"gpt-3.5-turbo\","
      - "    messages=messages,"
      - ")"
    hit: [1]
  false_positives: Code pinned to an old model on purpose, and eval harnesses.
  confidence: low
  sources: [replit-forum-stale-models]

- id: deprecated-apis
  name: Deprecated library calls
  domain: code
  group: deps
  kind: lexical
  severity: 2
  what: Calls to APIs that the library has deprecated or removed, learned from older code.
  detect: {method: regex, flags: "g", pattern: '\bopenai\.(?:ChatCompletion|Completion)\.create\b|\bdatetime\.utcnow\(\)|\bReactDOM\.render\(|\bimport pkg_resources\b', judge: "Does the code call an API the pinned library version marks as deprecated?"}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Read the installed version's docs and use the current call.
  specimen:
    lang: python
    code:
      - "import openai"
      - "stamp = datetime.utcnow()"
      - "reply = openai.ChatCompletion.create(model=m, messages=msgs)"
    hit: [1, 2]
  confidence: high
  sources: [wang-2025-deprecated]

- id: hallucinated-packages
  name: Imports of packages that don't exist
  domain: code
  group: deps
  kind: behavioral
  severity: 3
  what: The code imports or installs a plausible package name that no registry has, which attackers can then register.
  detect: {method: judge, judge: "Does every imported or installed package exist on its registry under that exact name?"}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Check each new dependency on the registry before installing it.
  specimen:
    lang: bash
    code:
      - "pip install flask-jwt-simple-auth"
      - "pip install huggingface-cli"
      - "python app.py"
    hit: [0, 1]
  confidence: high
  sources: [spracklen-2025]

- id: placeholder-secrets
  name: Hard-coded and placeholder secrets
  domain: code
  group: deps
  kind: lexical
  severity: 2
  what: API keys and passwords written straight into source.
  detect: {method: regex, flags: "gi", pattern: '\b(?:api[_-]?key|secret(?:[_-]?key)?|token|password)\s*[:=]\s*[''"](?:your[_-][\w-]+|YOUR_[A-Z_]+|sk-[x.]{3,}|x{4,}|changeme|<[^>\n]{1,40}>)[''"]'}
  era: {first_seen: 2023, peak: 2025}
  status: steady
  fix: Read secrets from the environment and fail when they are missing.
  specimen:
    lang: python
    code:
      - "API_KEY = \"your-api-key-here\""
      - "DB_PASSWORD = \"changeme\""
      - "client = Client(api_key=API_KEY)"
    hit: [0, 1]
  false_positives: Example config files meant to be copied.
  confidence: medium
  sources: [sonar-2025-press]

# ═════════════ code · tests ═════════════

- id: tests-weakened
  name: Tests edited or deleted to go green
  domain: code
  group: tests
  kind: behavioral
  severity: 3
  what: When a test fails, the agent changes the expected value, loosens the assertion, or deletes the test.
  detect: {method: judge, judge: "Did the change edit or remove an existing assertion so a failing test now passes, without a stated reason the test was wrong?"}
  era: {first_seen: 2024, peak: 2026}
  models: [claude, gpt]
  status: steady
  fix: Treat tests as read-only unless the user agrees the test is wrong.
  specimen:
    lang: python
    code:
      - "def test_discount():"
      - "-    assert apply_discount(100, \"VIP\") == 80"
      - "+    assert apply_discount(100, \"VIP\") is not None"
    hit: [1, 2]
  confidence: high
  sources: [impossiblebench-2025, evilgenie-2025, beck-2025-augmented, buildthisnow-tdd]

- id: skipped-tests
  name: Failing tests marked skip
  domain: code
  group: tests
  kind: lexical
  severity: 2
  what: A skip marker appears on the test that was failing, often with a vague reason.
  detect: {method: regex, flags: "g", pattern: '\b(?:it|test|describe)\.skip\(|@pytest\.mark\.skip\b|@unittest\.skip\b|\bxit\(|\bt\.Skip\('}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  fix: Fix the code or report the failure. Skip only with the user's say-so.
  specimen:
    lang: javascript
    code:
      - "describe('checkout', () => {"
      - "  it.skip('applies VIP discount', () => {"
      - "    expect(total(cart, 'VIP')).toBe(80);"
      - "  });"
    hit: [1]
  false_positives: Skips for known platform gaps with a linked issue.
  confidence: medium
  sources: [buildthisnow-tdd, beck-2025-augmented]

- id: special-cased-tests
  name: Code that special-cases the test inputs
  domain: code
  group: tests
  kind: behavioral
  severity: 3
  what: The fix checks for the exact inputs the tests use and returns the expected answers, or counts calls to vary output.
  detect: {method: judge, judge: "Does the code branch on literal values that match the test fixtures?"}
  era: {first_seen: 2024, peak: 2025}
  models: [claude, gpt]
  status: fading
  fix: Write the general logic. Say so if the tests look wrong.
  specimen:
    lang: python
    code:
      - "def parse_date(s):"
      - "    if s == \"2024-02-30\":"
      - "        return None  # matches test_invalid_date"
