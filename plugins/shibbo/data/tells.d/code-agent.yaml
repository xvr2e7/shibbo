  detect: {method: regex, flags: "g", pattern: 'def __eq__\(self,\s*\w+\)(?:\s*->\s*bool)?:\s*\n\s*return True\b|\bequals\s*\([^)]*\)\s*\{\s*return true;?\s*\}'}
  era: {first_seen: 2025, peak: 2025}
