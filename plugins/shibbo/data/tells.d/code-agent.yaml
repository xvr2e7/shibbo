  confidence: low
  sources: [bromley-2026-ai-tests]

- id: mock-only-tests
  name: Tests that only check mocks were called
  domain: code
  group: tests
  kind: structural
  severity: 2
  what: 'Tests mock every dependency and assert only that the mocks got called. Coding agents add mocks in 36% of their commits, against 26% for other authors.'
  detect: {method: judge, judge: "Are all assertions about mock calls, with none about returned values or state?"}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  fix: Mock only external services and assert on results.
  specimen:
    lang: python
    code:
      - "def test_create_order(mock_db, mock_mailer, mock_logger):"
      - "    create_order(user, cart)"
      - "    mock_db.insert.assert_called_once()"
      - "    mock_mailer.send.assert_called_once()"
      - "    mock_logger.info.assert_called()"
    hit: [2, 3, 4]
  confidence: medium
  sources: [hora-robbes-2026]

- id: weak-assertions
  name: Assertions that accept almost anything
  domain: code
  group: tests
  kind: lexical
  severity: 2
  what: '"assert True", "toBeDefined()" or "> 0" where the spec gives an exact answer.'
  detect: {method: regex, flags: "gm", pattern: '\bassert\s+True\b|expect\(\s*true\s*\)\.toBe\(\s*true\s*\)|\.toBeDefined\(\)|\.toBeTruthy\(\)'}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  fix: Assert the exact expected value.
  specimen:
    lang: javascript
    code:
      - "test('computes tax', () => {"
      - "  const tax = computeTax(100, 'CA');"
      - "  expect(tax).toBeDefined();"
      - "  expect(true).toBe(true);"
      - "});"
    hit: [2, 3]
  false_positives: Smoke tests whose only claim is that nothing throws.
  confidence: medium
  sources: [bromley-2026-ai-tests, buildthisnow-tdd]

- id: conditional-tests
  name: Tests that branch on the result
  domain: code
  group: tests
  kind: structural
  severity: 2
  what: An if inside the test picks which assertion to run, so the test passes whatever the code returns.
  detect: {method: judge, judge: "Does the test choose its assertion based on the value it is testing?"}
  era: {first_seen: 2024, peak: 2026}
  status: steady
  fix: One input, one expected output, no branches.
  specimen:
    lang: python
    code:
      - "def test_parse():"
      - "    result = parse(\"12kg\")"
      - "    if result is None:"
      - "        assert result is None"
      - "    else:"
      - "        assert result.unit == \"kg\""
    hit: [2, 3, 4]
  confidence: low
  sources: [bromley-2026-ai-tests]

