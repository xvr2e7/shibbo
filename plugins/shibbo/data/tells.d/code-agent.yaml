  era: {first_seen: 2025, peak: 2026}
  models: [claude]
  status: steady
  fix: Re-read the rules file before reporting done.
  specimen:
    chat:
      - {role: user, text: "CLAUDE.md says never say 'You're absolutely right'. Why is the build red?"}
