# Interface and typography tells. Specimens reproduce the slop on purpose.
# <!-- shibbo-ignore -->
- id: serif-italic-accent-word
  name: One italic serif word in the headline
  domain: ui
  group: typography
  kind: visual
  severity: 3
  what: A headline with one word swapped into an italic serif, often Instrument Serif. The newest default once purple gradients got mocked.
  detect:
    method: regex
    pattern: <h[1-3]\b[^>]*>[^<]{0,120}<(?:em|i)\b|<span[^>]{0,80}\bclass(?:Name)?=["'][^"']{0,80}\bitalic\b[^"']{0,80}\bfont-serif\b|<span[^>]{0,80}\bclass(?:Name)?=["'][^"']{0,80}\bfont-serif\b[^"']{0,80}\bitalic\b
  era:
    first_seen: 2025
    peak: 2026
  models:
    - claude
  status: peaking
  fix: Set the headline in one style. Get emphasis from the sentence itself.
  specimen:
    html: <div style="width:100%;height:100%;box-sizing:border-box;padding:14px 16px;border-radius:6px;background:#fff;display:flex;flex-direction:column;justify-content:center;font-family:Inter,sans-serif;"><div style="font-family:Inter,sans-serif;font-weight:600;font-size:23px;line-height:1.1;letter-spacing:-0.02em;color:#111">Ship work that feels <span style="font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:27px">crafted</span></div><div style="font-size:10px;color:#71717a;margin-top:8px">The calm workspace for focused teams.</div></div>
  false_positives: Editorial brands with a real italic house style.
  confidence: high
  sources:
    - krebs-2026
    - anthropic-fe-skill-2026
    - avoid-ai-design-catalog
    - reddit-claude-look
    - hallmark-repo
