  era:
    first_seen: 2025
    peak: 2026
  models:
    - claude
  status: peaking
  fix: Pick a display face for this brand, or let the body face carry the headline.
  specimen:
    html: <div style="width:100%;height:100%;box-sizing:border-box;padding:14px 16px;border-radius:6px;background:#fbfaf7;display:flex;flex-direction:column;justify-content:center;font-family:Inter,sans-serif;"><div style="font-family:'Instrument Serif',serif;font-size:34px;line-height:1;color:#1c1917;letter-spacing:-0.01em">Notes, quietly<br>organized.</div><div style="font-family:Inter,sans-serif;font-size:10px;color:#78716c;margin-top:10px">Instrument Serif over Inter, the 2026 pairing.</div></div>
