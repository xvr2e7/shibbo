  name: Huge display type with crushed tracking
  domain: ui
  group: typography
  kind: visual
  severity: 2
  what: A hero headline at 72px or more with letter-spacing pulled to -0.04em or tighter, so letters touch.
  detect:
    method: regex
    pattern: \btracking-(?:tighter|\[-0?\.0[4-9]em\]|\[-0?\.[1-9]em\])|letter-spacing:\s*-0?\.(?:0[4-9]|[1-9])\d*em
  era:
    first_seen: 2024
    peak: 2026
  status: steady
  fix: Track display type by eye. Large sizes need only a little negative tracking.
  specimen:
    html: <div style="width:100%;height:100%;box-sizing:border-box;padding:14px 16px;border-radius:6px;background:#fff;display:flex;flex-direction:column;justify-content:center;font-family:Inter,sans-serif;"><div style="font-family:Inter,sans-serif;font-weight:800;font-size:46px;line-height:0.9;letter-spacing:-0.075em;color:#09090b">Ship it.<br>Today.</div></div>
