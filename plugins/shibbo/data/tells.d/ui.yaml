- id: flat-type-scale
  name: One family at one or two weights
  domain: ui
  group: typography
  kind: visual
  severity: 2
  what: Headings barely step up from body text and every block uses the same weight, so nothing leads the eye.
  detect:
    method: judge
    judge: Do headings and body differ by less than one clear step in size and weight?
  status: steady
  fix: Set a real scale with at least three clear steps and a heavier display weight.
  specimen:
    html: <div style="width:100%;height:100%;box-sizing:border-box;padding:14px 16px;border-radius:6px;background:#fff;display:flex;flex-direction:column;justify-content:center;font-family:Inter,sans-serif;"><div style="font-size:14px;font-weight:500;color:#18181b">Analytics overview</div><div style="font-size:12px;font-weight:500;color:#18181b;margin-top:6px">Revenue this month</div><div style="font-size:12px;font-weight:500;color:#3f3f46;margin-top:6px">Your revenue grew compared to last month across all regions.</div><div style="font-size:12px;font-weight:500;color:#18181b;margin-top:6px">Top customers</div></div>
