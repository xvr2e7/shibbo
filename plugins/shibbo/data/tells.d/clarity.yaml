# Clarity: faults a reader has to decode. No pattern finds these, so each carries a question to judge by reading.
# They sit under surface tells: text can avoid every stock phrase and still hide its point.

- id: hidden-actor
  name: The action hides in a noun and nobody does it
  domain: prose
  group: clarity
  kind: structural
  severity: 2
  what: The sentence turns its verb into a noun and drops the actor, so the reader must work out who did what.
  detect: {method: judge, judge: "In each sentence, is the one who acts the subject and the action the verb?"}
  status: steady
  fix: Make the actor the subject and the action the verb.
  examples: {bad: "Upon arrival at the counter, a request for a refund was made.", good: "She walked up to the counter and asked for a refund."}
  false_positives: A writer may move the actor on purpose, to keep a topic in front or to leave out an actor nobody knows.
  confidence: medium
  sources: [zonder-slop-2026, williams-style]

- id: unnatural-wording
  name: Words no person would use for the thing
  domain: prose
  group: clarity
  kind: lexical
  severity: 2
  what: An odd pairing of words, a stack of nouns or a made-up term stands where a common name exists.
  detect: {method: judge, judge: "Would a person describing this out loud use these words for it?"}
  status: steady
  fix: Use the name people use. Unpack a stack of nouns into a clause.
  examples: {bad: "The kids opened a beverage retailer on the corner.", good: "The kids opened a lemonade stand on the corner."}
  false_positives: Terms of art the reader knows.
  confidence: medium
  sources: [zonder-slop-2026, williams-style]

- id: buried-point
  name: The point comes last, or never
  domain: prose
  group: clarity
  kind: structural
  severity: 2
  what: Every word is plain, yet the reader finishes the paragraph without the answer, or finds it in the last line after sentences that carry no fact.
  detect: {method: judge, judge: "Does the first sentence give the point, and does each later sentence add a fact the reader needs?"}
  status: steady
  fix: Put the point first. Cut each sentence that adds no fact.
  examples: {bad: "There are several factors worth weighing here, and the picture is nuanced. Ultimately the cache is the cause.", good: "The cache is the cause."}
  false_positives: Stories and jokes, which hold the point back on purpose.
  confidence: medium
  sources: [zonder-slop-2026, williams-style]

- id: report-buries-result
  name: A report that retells the work before the result
  domain: agent
  group: clarity
  kind: behavioral
  severity: 2
  what: The agent's final message walks through what it did, step by step, and the reader must dig for whether the task worked.
  detect: {method: judge, judge: "Does the first sentence of the final message say what happened and whether it worked?"}
  status: steady
  fix: Lead with the result. Then say what you checked, what you left undone, and what you need from the reader.
  specimen:
    chat:
      - {role: user, text: "Did the import fix work?"}
      - {role: assistant, text: "I started by reading the loader, then traced the call into the parser, where I noticed the split used the wrong character. After updating that, I reviewed the tests and adjusted two fixtures. The import now runs."}
  confidence: medium
  sources: [zonder-slop-2026]

- id: private-labels
  name: Names the reader never saw
  domain: agent
  group: clarity
  kind: lexical
  severity: 2
  what: The agent coins labels while it works and then uses them in its report as if the reader shared them.
  detect: {method: judge, judge: "Would a reader who saw none of the work know what each name in this message refers to?"}
  status: steady
  fix: Say the longer thing the label stands for, or define it once where it first appears.
  specimen:
    chat:
      - {role: user, text: "Where are we?"}
      - {role: assistant, text: "Phase 2 is done and the B-path fallback is wired in. The shim still needs the v2 guard."}
  confidence: medium
  sources: [zonder-slop-2026]
